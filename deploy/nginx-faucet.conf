# faucet.kourt.xyz — CLAIMED AND ANSWERED, not proxied, because the faucet is not
# running. kourtfaucet.service is installed on the box but has never been started:
# it needs an hCaptcha secret at /var/lib/kourt/secret/captcha.secret, which is
# not in this repo and should not be.
#
# WHY THIS FILE IS NOT SIMPLY DELETED, measured rather than assumed. Removing the
# vhost does NOT make the subdomain stop answering: nginx has no default_server
# on this box, so with no server_name match it falls through to the FIRST 443
# block in load order — debunk-remote-viewing, an unrelated site — and that
# 502'd for faucet.kourt.xyz exactly as the proxy had. The name has to be
# claimed to be silenced.
#
# 410 Gone, and not the alternatives: 404 invites a retry, 444 closes the
# connection and reads as a network fault, 502 reads as an outage of something
# that exists. 410 says the endpoint is deliberately absent.
#
# TO TURN THE FAUCET ON: put the captcha secret in place, `systemctl enable --now
# kourtfaucet`, then install deploy/nginx-faucet-proxy.conf under this name
# instead — it is the proxying vhost this file replaced, kept intact beside it.
#
# THIS ONE CARRIES ITS OWN :443 BLOCK, breaking the port-80-only convention the
# other vhosts follow, and on purpose. That convention exists because certbot
# rewrites the TLS half of a proxying vhost; there is nothing to proxy here, so
# there is no TLS half for it to own — and chain.sh's drift check compares
# DIRECTIVES, which means a repo copy missing the second block would report this
# file as drifted on every deploy forever. Verified against that check's own
# strip() logic, not assumed.

server {
    listen 80;
    listen [::]:80;
    server_name faucet.kourt.xyz;
    access_log off;
    return 410 "faucet.kourt.xyz is not in service\n";
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name faucet.kourt.xyz;
    ssl_certificate /etc/letsencrypt/live/faucet.kourt.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faucet.kourt.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    default_type text/plain;
    return 410 "faucet.kourt.xyz is not in service\n";
}
