# One file per NAME, and that is not tidiness. certbot --nginx rewrites the file
# containing a server block to add its :443 listener, so a single combined file
# means chain.sh can never install a NEW vhost again without reverting TLS on the
# others — which is exactly how gnoweb.kourt.xyz ended up with a certificate that
# certbot could not install: "Could not automatically find a matching server block".
# Separate files let each name be added, and edited by certbot, independently.
#
# Port 80 only; certbot owns the TLS half (deploy/nginx.conf says why at length).

server {
    listen 80;
    listen [::]:80;
    server_name faucet.kourt.xyz;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        if ($request_method = OPTIONS) { return 204; }
        # A grant is 100 GNOT and gnofaucet's own throttle is per-IP; this is the
        # cheap outer bound so a flood never reaches the signing path at all.
        limit_req zone=kourtfaucet burst=3 nodelay;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # gnofaucet runs -trusted-proxy-count 1 and reads the LAST entry of this
        # header. Setting it to $proxy_add_x_forwarded_for keeps the real client
        # at the end; passing $remote_addr alone would make every request look
        # like it came from nginx and collapse the per-IP throttle to one bucket.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
}
