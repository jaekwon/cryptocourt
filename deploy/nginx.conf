# Kourt, served from one box: a static file and a loopback service.
#
# PORT 80 ONLY, DELIBERATELY. certbot --nginx owns the TLS half: it rewrites
# this block, adds the :443 server, fills in the certificate paths and installs
# the redirect. A hand-written `listen 443 ssl` with the cert lines commented
# out does not merely fail to help — `nginx -t` REFUSES a listener declared ssl
# with no certificate, so nginx would not start at all and certbot could never
# reach port 80 to prove the domain. HTTP first, TLS by certbot, in that order.
#
# deploy/setup.sh installs this and runs certbot. deploy.sh never touches it.

server {
    listen 80;
    listen [::]:80;
    server_name kourt.xyz;

    root /var/www/kourt;
    index index.html;

    # The three security headers live in ONE file, because nginx drops every
    # inherited add_header from a level that declares one of its own — so they
    # must be DECLARED again in each such location, and a repeated policy
    # string is one that drifts and one that stops being checked. See that
    # file for what each directive is for and for the measurement that found
    # this. deploy/setup.sh installs it at the path below.
    include /etc/nginx/kourt-security-headers.conf;

    # A single mutable file with no build hash to bust a cache with. Long
    # caching would serve a stale overlay against a chain that has moved on.
    location = /index.html {
        # DECLARED HERE TOO, NOT INHERITED: this block sets a Cache-Control,
        # which drops every inherited add_header. It used to repeat two of the
        # three and miss the CSP, so this document — the only one that executes
        # script — was served with no policy at all.
        include /etc/nginx/kourt-security-headers.conf;
        # AND HERE TOO, because try_files above lands the SPA fallback in THIS
        # location and a per-location rule applies to whichever location finally
        # handles the request — setting it only in `location /` did nothing for
        # `/`, which is how this was mis-fixed once.
        modsecurity_rules 'SecResponseBodyAccess Off';
        add_header Cache-Control "no-cache" always;
    }

    # THE OVERLAY IS THREE MUTABLE FILES, NOT ONE. index.html got no-cache for
    # the reason stated above it; chat.js and media.js are just as mutable, carry
    # no build hash either, and fell through to `location /` with NO
    # Cache-Control at all — so a browser applies heuristic freshness and serves
    # whatever it fetched last.
    # THIS COST A WHOLE DEBUGGING SESSION. Three fixes to a chat button were
    # deployed and verified in the served bytes; the reporter's browser kept
    # running a chat.js from before any of them and reported no change each time,
    # which is exactly what a stale asset looks like from the outside. The bytes
    # on the wire were right and the bytes in the browser were old.
    location ~ ^/(chat|media)\.js$ {
        # Same reason as /index.html: a Cache-Control here drops the inherited set.
        include /etc/nginx/kourt-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # CERTIFIED COPIES, SERVED AS FILES. #/embed/<slug>/<id> is a hash route
    # into the whole application, so an impression costs a 600KB index.html and
    # — measured on kourt.xyz — 34 chain reads. An embed renders once for every
    # VISITOR of whoever pasted it, so that read count is the number that
    # multiplies if anything is ever shared widely, and the per-IP rate limit
    # in front of the node does nothing about many distinct IPs.
    # scripts/make-copies.js pre-renders those cards to web/embed/<slug>/<id>.html
    # — no script, no chain read, the claim page's own chart inlined as SVG.
    # $uri.html BEFORE THE SPA FALLBACK, and the fallback stays: only some
    # claims are pre-rendered, and every other one must still work. A copy that
    # exists is served as a file; anything else lands in the application exactly
    # as it does today.
    # FIVE MINUTES, WITH stale-while-revalidate. The copy names the block it was
    # taken at, so a reader is never misled about its age, and a CDN may keep
    # serving one while it fetches the next.
    # NOT THE APPLICATION. try_files in `location /` answers anything with no
    # file behind it using index.html, which for /favicon.ico means 637KB of
    # markup delivered as an image — measured, on any client that asks. The page
    # declares an inline data: URI icon so it never asks; a bare request, a
    # crawler or an embed that forgets is what this is for.
    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
    }

    location /embed/ {
        try_files $uri $uri.html /index.html;
        # ALL THREE, and this block had NONE of them: it declared Cache-Control
        # only, which dropped the whole inherited set. An embed is the one route
        # built to be rendered inside somebody else's page, so it is the route
        # where nosniff and a referrer policy matter most, and it was the only
        # route on the host served without either.
        # ALL THREE, and this block had none of them: it declared Cache-Control
        # alone, which dropped the whole inherited set. An embed is the one
        # route built to be rendered inside somebody else's page, so it is
        # where nosniff and a referrer policy matter most, and it was the only
        # route on the host served without either.
        include /etc/nginx/kourt-security-headers.conf;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=600" always;
    }

    location / {
        # OUTBOUND INSPECTION OFF FOR THE OVERLAY, and it is not optional on a
        # host with ModSecurity in front. SecResponseBodyAccess defaults On with
        # a 512 KiB SecResponseBodyLimit; this page passed that size, an outbound
        # CRS rule scored the buffered half at the blocking threshold, and nginx
        # denied a response whose headers were already sent — cutting the stream
        # at exactly 524288 bytes. The page arrived truncated mid-statement and
        # every route rendered blank, while the file on disk was perfect.
        # There is no backend here to leak anything: this is a file we wrote and
        # shipped, so the scan can only break it as it grows. INBOUND rules are
        # untouched. Harmless where ModSecurity is not installed.
        modsecurity_rules 'SecResponseBodyAccess Off';
        try_files $uri $uri/ /index.html;
    }

    # THE MEDIA ARCHIVE. kourt.xyz's own copy of the images filed with a claim,
    # addressed by sha256 — the address gnoweb's markdown points every reader at,
    # so if this location is missing every exhibit on every claim page is broken.
    #
    # Same proxy headers as the chat below and for the same reason: the archive
    # meters uploads per client, and without X-Forwarded-For every client looks
    # like 127.0.0.1 and that meter becomes one bucket for the whole internet.
    # `location /m` IS A PREFIX AND WOULD SWALLOW /media.js. nginx matches a
    # prefix location against any URI that starts with it, and the overlay ships
    # media.js beside index.html — so this block, written as `/m`, proxied the
    # page's own script to the archive, which does not serve it. MEASURED: the
    # map came up with no media at all and one aborted request. An exact match
    # for the upload, a prefix for everything under it.
    location = /m {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 512k;
    }

    location /m/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # An upload is bounded at 256 KiB by the archive itself; nginx refusing
        # first turns a clear 413 from the service into a generic one from the
        # proxy, so leave a little room and let the service explain.
        client_max_body_size 512k;
    }

    location /api/chat/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;

        # A SQL-INJECTION HEURISTIC WAS EATING A CHAT COMMAND, and the report
        # was "when i typed '/delete' it didn't delete my line above but said
        # 403 could not send".
        # MEASURED, because the app looked guilty and was not: the same POST
        # answered 200 against 127.0.0.1:8788 and 403 with an HTML body through
        # here, and the audit log names CRS 942360 — "concatenated basic SQL
        # injection and SQLLFI attempts" — scoring 5 and tripping the anomaly
        # threshold at 949110. That rule fires on a body that opens with a
        # non-word character followed by a SQL keyword, which is exactly what
        # `/delete` is: a slash and the word delete. Any message opening that
        # way was refused, silently, with the panel left to say "could not send
        # (403)" because a WAF's HTML is not the JSON error the client reads.
        # ONE RULE, ONE LOCATION, and that is the whole change: 942360 only,
        # for /api/chat/ only. Every other CRS rule still applies here and
        # 942360 still applies everywhere else on this host.
        # WHY IT IS SAFE HERE SPECIFICALLY. This endpoint takes free prose from
        # the public and stores it through parameterized statements — there is
        # no query built from this text for an injection heuristic to protect,
        # so the rule can only ever be a false positive on a message somebody
        # typed. The guards that DO matter for this endpoint are the app's own:
        # the JSON content-type and Sec-Fetch-Site/Origin check, the per-address
        # throttle, the duplicate window and the abuse ladder. None of them is
        # touched.
        modsecurity_rules 'SecRuleRemoveById 942360';

        # kourtchat runs --behind-proxy --trusted-proxy 127.0.0.1/32,::1/128, so
        # it takes the client address from X-Forwarded-For and ONLY from this
        # proxy. Without these headers every client looks like 127.0.0.1 and the
        # per-address throttle collapses into one global bucket; without the
        # narrow --trusted-proxy, any client could forge its own address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Long-poll: the chat holds a request open waiting for the next message,
        # so the default 60s read timeout would cut every idle client off.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # certbot's HTTP-01 challenge is served from the webroot above; nothing
    # special is needed for it, but the SPA fallback must not swallow it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kourt;
        try_files $uri =404;
    }
}
