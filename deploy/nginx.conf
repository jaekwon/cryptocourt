# Kourt, served from one box: a static file and a loopback service.
#
# PORT 80 ONLY, DELIBERATELY. certbot --nginx owns the TLS half: it rewrites
# this block, adds the :443 server, fills in the certificate paths and installs
# the redirect. A hand-written `listen 443 ssl` with the cert lines commented
# out does not merely fail to help — `nginx -t` REFUSES a listener declared ssl
# with no certificate, so nginx would not start at all and certbot could never
# reach port 80 to prove the domain. HTTP first, TLS by certbot, in that order.
#
# deploy/setup.sh installs this and runs certbot. deploy.sh never touches it.

server {
    listen 80;
    listen [::]:80;
    server_name kourt.xyz;

    root /var/www/kourt;
    index index.html;

    # THE OVERLAY IS ONE FILE and it is self-contained: no CDN, no font host, no
    # analytics. Saying so here means a future edit that reaches for an external
    # script fails visibly in production instead of quietly working in
    # development. 'unsafe-inline' is required because the whole page IS an
    # inline <script> and an inline <style> — the deliberate design, not an
    # oversight. connect-src stays open because the reader points the page at
    # whichever gno RPC node they choose; pin it to your own node if you serve a
    # fixed chain.
    #
    # connect-src IS SET EXPLICITLY, and it did not used to be. The comment above
    # said it stayed open while the header never mentioned it, so it fell back to
    # default-src 'self' — and the node this page reads lives at rpc.kourt.xyz,
    # a different origin. Every chain read the overlay makes was refused by its
    # own policy. https: rather than * because a reader may point the page at any
    # node they trust, but never at a plaintext one from a secure page.
    #
    # media-src carries the same hosts as img-src, because a video exhibit is
    # validated against the SAME allowlist in the realm — a URL the chain will
    # store must be one the browser will play, or the exhibit is filed and
    # unwatchable. Every <video> here is preload=none, so nothing is fetched
    # from these hosts until a reader presses play: the disclosure is the same
    # as following a link, and it happens only when somebody asks for it.
    #
    # img-src carries the hosts a claim's evidence may live on, and it has to
    # match the realm's allowlist in media.gno: the realm refuses to STORE a
    # mirror the browser would refuse to LOAD, and this is the other half of
    # that agreement. 'self' covers the archive at /m/<sha256>, which is where
    # gnoweb's markdown points and where the overlay looks first.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://gnolang.github.io https://assets.gnoteam.com https://sa.gno.services https://imgur.com https://*.imgur.com https://*.github.io https://github.com https://*.githubusercontent.com https://imgflip.com https://*.imgflip.com https://ipfs.io https://cloudflare-ipfs.com; connect-src 'self' https:; media-src 'self' https://gnolang.github.io https://assets.gnoteam.com https://sa.gno.services https://imgur.com https://*.imgur.com https://*.github.io https://github.com https://*.githubusercontent.com https://imgflip.com https://*.imgflip.com https://ipfs.io https://cloudflare-ipfs.com; font-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'none'" always;

    # frame-ancestors is OPEN above and X-Frame-Options is absent, both on
    # purpose: #/embed/<court>/<id> exists to be put in an iframe on somebody
    # else's article. SAMEORIGIN would break the one feature built to travel.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # A single mutable file with no build hash to bust a cache with. Long
    # caching would serve a stale overlay against a chain that has moved on.
    location = /index.html {
        # AND HERE TOO, because try_files above lands the SPA fallback in THIS
        # location and a per-location rule applies to whichever location finally
        # handles the request — setting it only in `location /` did nothing for
        # `/`, which is how this was mis-fixed once.
        modsecurity_rules 'SecResponseBodyAccess Off';
        add_header Cache-Control "no-cache" always;
    }

    location / {
        # OUTBOUND INSPECTION OFF FOR THE OVERLAY, and it is not optional on a
        # host with ModSecurity in front. SecResponseBodyAccess defaults On with
        # a 512 KiB SecResponseBodyLimit; this page passed that size, an outbound
        # CRS rule scored the buffered half at the blocking threshold, and nginx
        # denied a response whose headers were already sent — cutting the stream
        # at exactly 524288 bytes. The page arrived truncated mid-statement and
        # every route rendered blank, while the file on disk was perfect.
        # There is no backend here to leak anything: this is a file we wrote and
        # shipped, so the scan can only break it as it grows. INBOUND rules are
        # untouched. Harmless where ModSecurity is not installed.
        modsecurity_rules 'SecResponseBodyAccess Off';
        try_files $uri $uri/ /index.html;
    }

    # THE MEDIA ARCHIVE. kourt.xyz's own copy of the images filed with a claim,
    # addressed by sha256 — the address gnoweb's markdown points every reader at,
    # so if this location is missing every exhibit on every claim page is broken.
    #
    # Same proxy headers as the chat below and for the same reason: the archive
    # meters uploads per client, and without X-Forwarded-For every client looks
    # like 127.0.0.1 and that meter becomes one bucket for the whole internet.
    # `location /m` IS A PREFIX AND WOULD SWALLOW /media.js. nginx matches a
    # prefix location against any URI that starts with it, and the overlay ships
    # media.js beside index.html — so this block, written as `/m`, proxied the
    # page's own script to the archive, which does not serve it. MEASURED: the
    # map came up with no media at all and one aborted request. An exact match
    # for the upload, a prefix for everything under it.
    location = /m {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 512k;
    }

    location /m/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # An upload is bounded at 256 KiB by the archive itself; nginx refusing
        # first turns a clear 413 from the service into a generic one from the
        # proxy, so leave a little room and let the service explain.
        client_max_body_size 512k;
    }

    location /api/chat/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;

        # kourtchat runs --behind-proxy --trusted-proxy 127.0.0.1/32,::1/128, so
        # it takes the client address from X-Forwarded-For and ONLY from this
        # proxy. Without these headers every client looks like 127.0.0.1 and the
        # per-address throttle collapses into one global bucket; without the
        # narrow --trusted-proxy, any client could forge its own address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Long-poll: the chat holds a request open waiting for the next message,
        # so the default 60s read timeout would cut every idle client off.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # certbot's HTTP-01 challenge is served from the webroot above; nothing
    # special is needed for it, but the SPA fallback must not swallow it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kourt;
        try_files $uri =404;
    }
}
