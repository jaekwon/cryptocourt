# Kourt, served from one box: a static file and a loopback service.
#
# Install once, by hand — deploy.sh never touches this, TLS, or the firewall.
# A deploy script that rewrites the web server's config is a deploy script that
# can take the site down without shipping anything.
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/kourt
#   ln -s /etc/nginx/sites-available/kourt /etc/nginx/sites-enabled/kourt
#   certbot --nginx -d kourt.example      # writes the TLS lines below
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name kourt.example;
    # certbot rewrites this block to redirect; until it does, serving plain HTTP
    # is a real problem for the overlay and not only for eavesdroppers: the
    # Clipboard API needs a SECURE CONTEXT, so on http:// the share panel's copy
    # buttons cannot copy at all. They degrade honestly (select the text and say
    # "press Ctrl/⌘-C"), but that is a downgrade nobody should be running.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kourt.example;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/kourt.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kourt.example/privkey.pem;

    root /var/www/kourt;
    index index.html;

    # THE OVERLAY IS ONE FILE and it is self-contained: no CDN, no font host, no
    # analytics. This CSP says so out loud, which means a future edit that
    # reaches for an external script fails visibly here instead of quietly
    # working in development and being blocked for readers.
    # 'unsafe-inline' is required because the whole page IS an inline <script>
    # and an inline <style>; that is the deliberate design, not an oversight.
    # connect-src stays open because the reader points the page at whichever gno
    # RPC node they choose — pin it to your own node if you serve a fixed chain.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'none'" always;

    # frame-ancestors is DELIBERATELY open above, and X-Frame-Options is
    # deliberately absent: #/embed/<court>/<id> exists to be put in an iframe on
    # somebody else's article. Setting either to SAMEORIGIN would break the one
    # feature that is supposed to travel.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The page is a single mutable file. Long caching would serve a stale
    # overlay against a chain that has moved on, and there is no build hash to
    # bust it with — it is index.html or nothing.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/chat/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;

        # kourtchat runs with --behind-proxy --trusted-proxy 127.0.0.1/32,::1/128,
        # so it takes the client address from X-Forwarded-For and ONLY from this
        # proxy. Without these headers every client would look like 127.0.0.1
        # and the per-address throttle would collapse into one global bucket.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Long-poll: the chat holds a request open waiting for the next message,
        # so the default 60s read timeout would cut every idle client off.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # /api/chat/health is the deploy's own check and is reached over loopback.
    # It is not secret, but --health-detail serves backlog and scanner timing,
    # which helps someone time an attack; leave that flag off in the unit, or
    # close this off if you turn it on.
    location = /api/chat/health {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }
}
