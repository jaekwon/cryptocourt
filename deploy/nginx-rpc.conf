# One file per NAME, and that is not tidiness. certbot --nginx rewrites the file
# containing a server block to add its :443 listener, so a single combined file
# means chain.sh can never install a NEW vhost again without reverting TLS on the
# others — which is exactly how gnoweb.kourt.xyz ended up with a certificate that
# certbot could not install: "Could not automatically find a matching server block".
# Separate files let each name be added, and edited by certbot, independently.
#
# Port 80 only; certbot owns the TLS half (deploy/nginx.conf says why at length).

server {
    listen 80;
    listen [::]:80;
    server_name rpc.kourt.xyz;

    # THE OVERLAY READS THIS FROM A BROWSER, from kourt.xyz and from file:// and
    # from anywhere else somebody opens the page — so CORS has to be open, the
    # way gnodev answers with Access-Control-Allow-Origin: * locally. This is a
    # public read interface to a public chain; there is nothing here to protect
    # by origin, and closing it only breaks the page.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        if ($request_method = OPTIONS) { return 204; }
        limit_req zone=kourtrpc burst=20 nodelay;
        # THE NODE SENDS ITS OWN CORS HEADERS, AND TWO IS WORSE THAN NONE.
        #
        # gno's RPC answers Access-Control-Allow-Origin: * itself, so a proxied
        # response carried that header TWICE — once from the node and once from
        # the add_header block above. The CORS spec allows exactly one value, and
        # a browser rejects the pair outright: "contains multiple values '*, *',
        # but only one is allowed". Every read from the overlay failed with
        # "Failed to fetch" while curl reported a healthy 200, because curl does
        # not enforce CORS. The preflight was unaffected — nginx returns 204 for
        # OPTIONS above without proxying, so only ONE set of headers exists there,
        # which is why the fault looked like the node being unreachable.
        #
        # nginx's copies are kept rather than the node's, because the OPTIONS
        # branch never reaches the node and would otherwise answer without any.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_pass http://127.0.0.1:26657;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # gnoweb's /_events and any RPC websocket subscription need the upgrade
        # dance; without these two headers the connection fails and the only
        # symptom is a console error with no server-side trace.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 600s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
}
