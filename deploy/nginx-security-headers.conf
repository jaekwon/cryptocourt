# The security headers, in ONE file, included wherever they have to be declared.
#
# WHY A FILE AND NOT THREE LINES IN THE SERVER BLOCK. nginx's add_header
# inherits from the enclosing level ONLY while the current level declares none
# of its own. Any location that sets its own Cache-Control therefore drops every
# inherited security header — silently, with no complaint from `nginx -t`, and
# visibly only by asking the running host what it sent.
#
# MEASURED ON kourt.xyz, which is how this was found. The server block set all
# three; three locations set a Cache-Control of their own; and so:
#
#   /index.html      kept nosniff and referrer-policy, LOST the CSP
#   /chat.js         kept nosniff and referrer-policy, LOST the CSP
#   /embed/covid/1   declared Cache-Control alone, LOST ALL THREE
#   /favicon.ico     kept all three — it declares no add_header
#   /api/chat/diag   kept all three — it declares no add_header
#
# The two responses on the whole host still carrying a Content-Security-Policy
# were an icon and a JSON body. The document that executes every line of script
# and renders public prose had none, and the embed route — the one built to be
# rendered inside somebody else's page — had no nosniff either.
#
# The earlier fix repeated nosniff and Referrer-Policy into those blocks and did
# not repeat the CSP. Repetition is what failed, so this is not repeated: it is
# included, once per level that needs it, from one file. Four copies of a policy
# string also break two things that depend on it being unique — selftest's
# control arms plant into it and require a single match, and check-media-hosts
# validates the FIRST copy it finds — so a duplicated policy is a policy that
# quietly stops being checked.
#
# deploy/setup.sh installs this at /etc/nginx/kourt-security-headers.conf, which
# is the path nginx.conf includes. A missing file is a hard `nginx -t` failure
# and setup.sh runs under `bash -seu`, so it aborts before any reload: this
# cannot half-apply.

# THE OVERLAY IS ONE FILE and it is self-contained: no CDN, no font host, no
# analytics. Saying so here means a future edit that reaches for an external
# script fails visibly in production instead of quietly working in development.
# 'unsafe-inline' is required because the whole page IS an inline <script> and an
# inline <style> — the deliberate design, not an oversight.
#
# connect-src IS SET EXPLICITLY, and it did not used to be. The comment that
# stood here said it stayed open while the header never mentioned it, so it fell
# back to default-src 'self' — and the node this page reads lives at
# rpc.kourt.xyz, a different origin. Every chain read the overlay makes was
# refused by its own policy. https: rather than * because a reader may point the
# page at any node they trust, but never at a plaintext one from a secure page.
#
# img-src carries the hosts a claim's evidence may live on, and it has to match
# the realm's allowlist in media.gno: the realm refuses to STORE a mirror the
# browser would refuse to LOAD, and this is the other half of that agreement.
# 'self' covers the archive at /m/<sha256>, which is where gnoweb's markdown
# points and where the overlay looks first. check-media-hosts compares the two.
#
# media-src carries the same hosts as img-src, because a video exhibit is
# validated against the SAME allowlist in the realm — a URL the chain will store
# must be one the browser will play, or the exhibit is filed and unwatchable.
# Every <video> is preload=none, so nothing is fetched from these hosts until a
# reader presses play: the disclosure is the same as following a link, and it
# happens only when somebody asks for it.
#
# frame-ancestors is OPEN and X-Frame-Options is absent, both on purpose:
# #/embed/<court>/<id> exists to be put in an iframe on somebody else's article.
# SAMEORIGIN would break the one feature built to travel.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://gnolang.github.io https://assets.gnoteam.com https://sa.gno.services https://imgur.com https://*.imgur.com https://*.github.io https://github.com https://*.githubusercontent.com https://imgflip.com https://*.imgflip.com https://ipfs.io https://cloudflare-ipfs.com; connect-src 'self' https:; media-src 'self' https://gnolang.github.io https://assets.gnoteam.com https://sa.gno.services https://imgur.com https://*.imgur.com https://*.github.io https://github.com https://*.githubusercontent.com https://imgflip.com https://*.imgflip.com https://ipfs.io https://cloudflare-ipfs.com; font-src 'self'; frame-ancestors *; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
