# Shared rate-limit zones, installed to conf.d so they sit in the http context
# once. Defining the same zone in two site files is a duplicate-zone error and
# nginx refuses to start, so they cannot live beside the server blocks that use
# them now that those are separate files.
# 10r/s WAS BELOW WHAT ONE PAGE LOAD COSTS. The overlay opens a claim by firing
# its reads in parallel — Promise.all batches, ~40 queries for a claim page and
# more for a court — so a single visitor tripped the limiter and nginx answered
# 503, which the page reported as "node HTTP 503 / check the node is reachable".
# The node was fine; we were refusing our own reader. Measured: 97 "limiting
# requests" entries in the error log against one browser and one seeding run.
#
# 50r/s with a burst of 100 covers a page load with headroom and still bounds a
# scraper. These are read-only queries against a public chain, so the thing being
# protected is the node's CPU, not any secret — and a limit that blocks the app it
# exists to serve protects nothing.
limit_req_zone $binary_remote_addr zone=kourtrpc:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=kourtfaucet:10m rate=1r/m;

# ---------------------------------------------------------- the read cache
# A CLAIM PAGE ASKS THIS NODE ~47 QUESTIONS, and every one of them reloads the
# realm in the VM: measured against this box, a qeval costs ~60-90ms of node CPU
# whether it is the first time it has been asked or the fortieth. Twenty-three of
# them fired at once took 800ms to come back, which is the node's CPU and not the
# network — six round trips of latency were already gone by then.
#
# The answers are immutable for the block they were read at, so a few seconds of
# cache is not a compromise: it is the truth of a chain that produces a block
# every five seconds. What it buys is every reload and every second reader —
# exactly the case the overlay's own 30-second cache cannot help, because a
# reload throws that cache away with the page.
#
# ONLY READS. abci_query is a question; broadcast_tx_commit is a transaction, and
# caching one of those would be a catastrophe rather than a bug. The body is the
# only place the method appears, so it is matched there, and anything that is not
# recognisably a query is passed through uncached.
map $request_body $kourt_rpc_nocache {
    default                            1;
    "~\"method\"\s*:\s*\"abci_query\""  0;
}
proxy_cache_path /var/cache/nginx/kourtrpc levels=1:2 keys_zone=kourtrpc_cache:16m
                 max_size=256m inactive=120s use_temp_path=off;
