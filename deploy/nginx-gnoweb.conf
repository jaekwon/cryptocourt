# One file per NAME, and that is not tidiness. certbot --nginx rewrites the file
# containing a server block to add its :443 listener, so a single combined file
# means chain.sh can never install a NEW vhost again without reverting TLS on the
# others — which is exactly how gnoweb.kourt.xyz ended up with a certificate that
# certbot could not install: "Could not automatically find a matching server block".
# Separate files let each name be added, and edited by certbot, independently.
#
# Port 80 only; certbot owns the TLS half (deploy/nginx.conf says why at length).

server {
    listen 80;
    listen [::]:80;
    server_name gnoweb.kourt.xyz;

    # NO CSP HERE, unlike the apex. kourt.xyz pins a strict policy because the
    # overlay is one self-contained file with a known shape; gnoweb ships its own
    # scripts and styles and is a different application. Borrowing the overlay's
    # policy would break it, and loosening the overlay's to fit would give away
    # the guarantee that makes it auditable. Separate names, separate rules.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=kourtrpc burst=20 nodelay;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # gnoweb builds absolute URLs from this; without it every link it writes
        # comes out http:// and a browser on the https page refuses them.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
}
