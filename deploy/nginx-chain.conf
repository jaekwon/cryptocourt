# The chain's two public faces: the RPC the overlay reads, and the faucet.
#
# PORT 80 ONLY, for the reason nginx.conf gives at length: certbot --nginx owns
# the TLS half, and `nginx -t` refuses an `ssl` listener with no certificate, so
# a hand-written :443 block stops nginx from starting at all and certbot can then
# never reach :80 to prove the domain. HTTP first, TLS by certbot, in that order.
#
# Two server blocks, not one, because they are different trust surfaces: the RPC
# is a read/write interface to the chain and the faucet spends real balance. A
# separate name lets you rate-limit, log and later firewall them apart.

# One shared limit zone for both. 10m of state holds ~160k addresses.
limit_req_zone $binary_remote_addr zone=kourtrpc:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=kourtfaucet:10m rate=1r/m;

server {
    listen 80;
    listen [::]:80;
    server_name rpc.kourt.xyz;

    # THE OVERLAY READS THIS FROM A BROWSER, from kourt.xyz and from file:// and
    # from anywhere else somebody opens the page — so CORS has to be open, the
    # way gnodev answers with Access-Control-Allow-Origin: * locally. This is a
    # public read interface to a public chain; there is nothing here to protect
    # by origin, and closing it only breaks the page.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        if ($request_method = OPTIONS) { return 204; }
        limit_req zone=kourtrpc burst=20 nodelay;
        proxy_pass http://127.0.0.1:26657;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # gnoweb's /_events and any RPC websocket subscription need the upgrade
        # dance; without these two headers the connection fails and the only
        # symptom is a console error with no server-side trace.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 600s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name faucet.kourt.xyz;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        if ($request_method = OPTIONS) { return 204; }
        # A grant is 100 GNOT and gnofaucet's own throttle is per-IP; this is the
        # cheap outer bound so a flood never reaches the signing path at all.
        limit_req zone=kourtfaucet burst=3 nodelay;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # gnofaucet runs -trusted-proxy-count 1 and reads the LAST entry of this
        # header. Setting it to $proxy_add_x_forwarded_for keeps the real client
        # at the end; passing $remote_addr alone would make every request look
        # like it came from nginx and collapse the per-IP throttle to one bucket.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
}
