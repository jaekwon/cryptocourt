<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryptoCourt — the ledger of record</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================================
   CryptoCourt overlay — a presentation layer over the r/cryptocourt/courtv2 realm.
   The chain carries all the information (every screen here can be served by the
   realm's own Render); this overlay only makes it prettier, and every button is
   a signable gnoweb transaction link, never a private API. Self-contained: no
   external fonts, scripts, or styles — it runs from a file:// or any static host.
   ========================================================================== */

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul[role=list]{list-style:none;padding:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
img,svg{display:block;max-width:100%}

:root{
  --paper:#f4f0e7; --surface:#fdfbf6; --surface-2:#efe9dc; --inset:#e9e2d3;
  --ink:#1b1b21; --ink-2:#56524a; --muted:#8b877d;
  --line:#e2dccd; --line-2:#d1c9b7;
  --accent:#9c6f2a; --accent-2:#7f5a20; --accent-wash:#f0e6d2;
  --yes:#2e6ea6; --yes-wash:#dceaf4; --no:#c0562a; --no-wash:#f6e2d5;
  --escrow:#a9791c; --escrow-wash:#f2e7cd; --void:#8b877d; --void-wash:#e9e5db;
  --good:#2f7d54;
  --shadow-sm:0 1px 2px rgba(27,27,33,.05);
  --shadow:0 1px 2px rgba(27,27,33,.05), 0 10px 30px -16px rgba(27,27,33,.22);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#131318; --surface:#1c1c23; --surface-2:#23232c; --inset:#15151b;
    --ink:#ece7dc; --ink-2:#a9a498; --muted:#726e65;
    --line:#2c2c36; --line-2:#3a3a46;
    --accent:#cb9c53; --accent-2:#deb877; --accent-wash:#2a2314;
    --yes:#5b9bce; --yes-wash:#182634; --no:#d7824f; --no-wash:#31211a;
    --escrow:#cea343; --escrow-wash:#2a2412; --void:#8b877d; --void-wash:#22222a;
    --good:#57ad7f;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme=light]{
  --paper:#f4f0e7; --surface:#fdfbf6; --surface-2:#efe9dc; --inset:#e9e2d3;
  --ink:#1b1b21; --ink-2:#56524a; --muted:#8b877d; --line:#e2dccd; --line-2:#d1c9b7;
  --accent:#9c6f2a; --accent-2:#7f5a20; --accent-wash:#f0e6d2;
  --yes:#2e6ea6; --yes-wash:#dceaf4; --no:#c0562a; --no-wash:#f6e2d5;
  --escrow:#a9791c; --escrow-wash:#f2e7cd; --void:#8b877d; --void-wash:#e9e5db; --good:#2f7d54;
  --shadow-sm:0 1px 2px rgba(27,27,33,.05); --shadow:0 1px 2px rgba(27,27,33,.05), 0 10px 30px -16px rgba(27,27,33,.22);
}
:root[data-theme=dark]{
  --paper:#131318; --surface:#1c1c23; --surface-2:#23232c; --inset:#15151b;
  --ink:#ece7dc; --ink-2:#a9a498; --muted:#726e65; --line:#2c2c36; --line-2:#3a3a46;
  --accent:#cb9c53; --accent-2:#deb877; --accent-wash:#2a2314;
  --yes:#5b9bce; --yes-wash:#182634; --no:#d7824f; --no-wash:#31211a;
  --escrow:#cea343; --escrow-wash:#2a2412; --void:#8b877d; --void-wash:#22222a; --good:#57ad7f;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.7);
}

body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  display:grid; grid-template-columns:clamp(230px,22vw,290px) 1fr; min-height:100vh;
}
.tnum{font-variant-numeric:tabular-nums}
code,.mono{font-family:var(--mono)}

/* ---- left rail ---------------------------------------------------------- */
.rail{
  grid-row:1; border-right:1px solid var(--line); background:var(--surface);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:auto;
}
.brand{padding:22px 22px 16px; border-bottom:1px solid var(--line)}
.brand .mark{display:flex; align-items:center; gap:10px; text-decoration:none}
.brand .scale{font-size:26px; filter:grayscale(.2)}
.brand h1{font-family:var(--serif); font-size:22px; font-weight:600; letter-spacing:-.01em; line-height:1.05}
.brand .tag{color:var(--muted); font-size:12.5px; margin-top:6px; letter-spacing:.02em}
.nav{padding:14px 12px; display:flex; flex-direction:column; gap:2px}
.nav a{
  display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:var(--r-sm);
  text-decoration:none; color:var(--ink-2); font-size:14px; font-weight:500;
}
.nav a .g{width:18px; text-align:center; opacity:.8}
.nav a:hover{background:var(--surface-2); color:var(--ink)}
.nav a.on{background:var(--accent-wash); color:var(--accent-2); font-weight:600}
.nav .sec{padding:14px 12px 5px; font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.rail .foot{margin-top:auto; padding:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px}

/* ---- node + theme controls --------------------------------------------- */
.node{font-size:12px}
.node .row{display:flex; align-items:center; gap:7px; margin-bottom:7px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--void); flex:none}
.dot.live{background:var(--good)} .dot.demo{background:var(--escrow)}
.node select,.node input{
  width:100%; font:inherit; font-size:12px; color:var(--ink); background:var(--inset);
  border:1px solid var(--line-2); border-radius:6px; padding:6px 8px;
}
.node input.mono{font-family:var(--mono); font-size:11px}
.node label{color:var(--muted); display:block; margin:6px 0 3px}
.themebtn{display:flex; align-items:center; gap:8px; color:var(--ink-2); font-size:12.5px; padding:2px}
.themebtn:hover{color:var(--ink)}

/* ---- main --------------------------------------------------------------- */
.main{grid-row:1; min-width:0; padding:34px clamp(20px,4vw,56px) 90px; max-width:1080px}
.crumbs{font-size:13px; color:var(--muted); margin-bottom:18px; display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.crumbs a{text-decoration:none; color:var(--ink-2)} .crumbs a:hover{color:var(--accent-2)}
.crumbs .sep{opacity:.5}

.page-h{font-family:var(--serif); font-size:clamp(26px,3.4vw,36px); font-weight:600; letter-spacing:-.015em; line-height:1.08; text-wrap:balance}
.page-sub{color:var(--ink-2); margin-top:8px; max-width:66ch}
.lead-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap}

section{margin-top:34px}
.sec-h{font-family:var(--serif); font-size:19px; font-weight:600; margin-bottom:14px; display:flex; align-items:baseline; gap:10px}
.sec-h .count{font-family:var(--sans); font-size:12.5px; color:var(--muted); font-weight:500}

/* cards + grids */
.grid{display:grid; gap:14px}
.grid.courts{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px; box-shadow:var(--shadow-sm); text-decoration:none; color:inherit; display:block;
}
a.card{transition:border-color .12s, box-shadow .12s, transform .12s}
a.card:hover{border-color:var(--line-2); box-shadow:var(--shadow); transform:translateY(-1px)}
.card .ct-name{font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:-.01em}
.card .ct-meta{color:var(--muted); font-size:13px; margin-top:4px}
.card .ct-price{display:flex; gap:16px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
.kv .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.kv .v{font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px}
.kv .v small{font-weight:500; color:var(--ink-2); font-size:12px}

.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px}
.stat .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.stat .v{font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:5px; letter-spacing:-.01em}
.stat .v small,.stat .sub{font-size:12px; color:var(--ink-2); font-weight:500}
.stat .sub{margin-top:3px}

/* pills / status */
.pill{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
  padding:3px 10px; border-radius:100px; background:var(--void-wash); color:var(--ink-2);
  border:1px solid transparent; white-space:nowrap;
}
.pill .g{font-size:10px}
.pill.yes{background:var(--yes-wash); color:var(--yes)} .pill.no{background:var(--no-wash); color:var(--no)}
.pill.escrow{background:var(--escrow-wash); color:var(--escrow)} .pill.void{background:var(--void-wash); color:var(--void)}
.pill.open{background:var(--accent-wash); color:var(--accent-2)}
.pill.good{background:var(--yes-wash); color:var(--good)}

/* docket list */
.docket{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.docket a{display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; padding:14px 18px; text-decoration:none; border-top:1px solid var(--line)}
.docket a:first-child{border-top:none}
.docket a:hover{background:var(--surface-2)}
.docket .t{font-weight:560; color:var(--ink); line-height:1.35}
.docket .m{font-size:12.5px; color:var(--muted); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap}
.docket .rt{display:flex; align-items:center; gap:10px}

/* buttons / txlinks */
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px}
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:var(--r-sm);
  background:var(--surface); border:1px solid var(--line-2); color:var(--ink); font-weight:560; font-size:14px;
  text-decoration:none; transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--accent); background:var(--accent-wash)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.yes{border-color:var(--yes); color:var(--yes)} .btn.yes:hover{background:var(--yes-wash)}
.btn.no{border-color:var(--no); color:var(--no)} .btn.no:hover{background:var(--no-wash)}
.btn .g{font-size:13px; opacity:.85}
.btn small{font-weight:500; color:var(--muted); font-size:11.5px}

/* the four-things primer */
.primer{background:linear-gradient(180deg,var(--surface),var(--surface)); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:var(--r); padding:16px 20px}
.primer h3{font-family:var(--serif); font-size:15px; margin-bottom:10px; color:var(--accent-2)}
.primer ol{margin:0; padding-left:20px; display:grid; gap:7px}
.primer li{font-size:13.5px; color:var(--ink-2)} .primer li b{color:var(--ink); font-weight:600}

/* stake panel + ratio series */
.stakewrap{display:grid; grid-template-columns:1.3fr 1fr; gap:16px}
@media(max-width:760px){.stakewrap{grid-template-columns:1fr}}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.ratio{display:grid; gap:13px; margin-top:4px}
.ratio .row{display:grid; grid-template-columns:132px 1fr; gap:12px; align-items:center}
.ratio .lab{font-size:12.5px; color:var(--ink-2)}
.ratio .lab small{display:block; color:var(--muted); font-size:11px}
.ratio .track{position:relative; height:16px; border-radius:100px; background:var(--no); overflow:hidden}
.ratio .track .y{position:absolute; left:0; top:0; bottom:0; background:var(--yes); border-right:2px solid var(--surface)}
.ratio .nums{display:flex; justify-content:space-between; font-size:11.5px; margin-top:3px; font-variant-numeric:tabular-nums}
.ratio .nums .yv{color:var(--yes); font-weight:600} .ratio .nums .nv{color:var(--no); font-weight:600}
.ratio .none{color:var(--muted); font-size:12.5px}
.poolrow{display:flex; gap:18px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}

/* stake ticket */
.ticket{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.ticket h3{font-family:var(--serif); font-size:17px; margin-bottom:4px}
.ticket .hint{font-size:12.5px; color:var(--muted); margin-bottom:14px}
.ticket .line{display:flex; justify-content:space-between; padding:9px 0; border-top:1px dashed var(--line); font-size:14px}
.ticket .line:first-of-type{border-top:none}
.ticket .line .l{color:var(--ink-2)} .ticket .line .r{font-weight:600; font-variant-numeric:tabular-nums}
.ticket .never{margin-top:12px; background:var(--inset); border-radius:var(--r-sm); padding:11px 13px; font-size:12.5px; color:var(--ink-2)}
.ticket .never b{color:var(--ink)}

/* body / untrusted text frame */
.foreign{background:var(--inset); border:1px solid var(--line); border-radius:var(--r); padding:16px 20px; position:relative}
.foreign::before{content:"the claim, verbatim"; position:absolute; top:-9px; left:14px; background:var(--paper); padding:0 8px; font-size:11px; color:var(--muted); letter-spacing:.02em}
.foreign p{margin:0 0 10px} .foreign p:last-child{margin:0}
.foreign a{color:var(--accent-2)}

/* generic prose + tables */
.prose{max-width:70ch} .prose p{margin:0 0 12px} .prose h2{font-family:var(--serif); font-size:20px; margin:22px 0 10px}
.prose ul{padding-left:22px; margin:0 0 12px}
table.data{width:100%; border-collapse:collapse; font-size:13.5px}
table.data th,table.data td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line)}
table.data th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600}
table.data td.num{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:12.5px}
.scroll-x{overflow-x:auto}

.rawblock{background:var(--inset); border:1px solid var(--line); border-radius:var(--r); padding:18px; font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; line-height:1.5; color:var(--ink-2); overflow-x:auto}

.notice{border-radius:var(--r); padding:13px 16px; font-size:13.5px; display:flex; gap:10px; align-items:flex-start}
.notice.warn{background:var(--escrow-wash); color:var(--ink)}
.notice.refuse{background:var(--no-wash); border:1px solid var(--no); color:var(--ink)}
.notice.good{background:var(--yes-wash); color:var(--ink)}
.notice .g{flex:none}
.empty{text-align:center; color:var(--muted); padding:50px 20px}
.empty .g{font-size:34px; opacity:.5}

.addrbar{display:flex; gap:9px; margin:8px 0 20px; flex-wrap:wrap}
.addrbar input{font-family:var(--mono); font-size:13px; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm); padding:9px 12px; color:var(--ink); min-width:min(360px,80vw)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.hr{height:1px; background:var(--line); margin:26px 0}
.tagrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px}

/* mobile */
@media(max-width:820px){
  body{grid-template-columns:1fr}
  .rail{position:static; height:auto; flex-direction:column}
  .nav{flex-direction:row; flex-wrap:wrap; gap:4px} .nav .sec{width:100%}
  .rail .foot{border-top:1px solid var(--line)}
  .main{padding:24px 18px 80px}
  .stakewrap{grid-template-columns:1fr}
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<aside class="rail">
  <div class="brand">
    <a class="mark" href="#/">
      <span class="scale">⚖️</span>
      <span><h1>CryptoCourt</h1></span>
    </a>
    <div class="tag">Stake on claims of fact. Your principal always returns 1×.</div>
  </div>
  <nav class="nav" id="nav">
    <a href="#/" data-k="dir"><span class="g">▤</span> Directory</a>
    <div class="sec">You</div>
    <a href="#/me" data-k="me"><span class="g">◈</span> Your positions</a>
    <a href="#/needs" data-k="needs"><span class="g">!</span> What needs you</a>
    <div class="sec">Reference</div>
    <a href="#/about" data-k="about"><span class="g">?</span> How it works</a>
  </nav>
  <div class="foot">
    <div class="node">
      <div class="row"><span class="dot" id="dot"></span> <b id="nodelab">Demo data</b></div>
      <label for="modesel">Source</label>
      <select id="modesel">
        <option value="demo">Demo (offline sample)</option>
        <option value="live">Live node (RPC)</option>
      </select>
      <div id="rpcwrap" hidden>
        <label for="rpc">RPC endpoint</label>
        <input id="rpc" class="mono" placeholder="http://127.0.0.1:26657" spellcheck="false">
        <label for="gnoweb">gnoweb (for tx links)</label>
        <input id="gnoweb" class="mono" placeholder="https://gno.land" spellcheck="false">
      </div>
    </div>
    <button class="themebtn" id="themebtn"><span class="g">◐</span> <span id="themelab">Theme</span></button>
  </div>
</aside>

<main class="main" id="main" aria-live="polite"></main>

<script>
"use strict";
/* ============================ configuration ============================== */
const PKG = "gno.land/r/cryptocourt/courtv2";
const CFG = Object.assign(
  {mode:"demo", rpc:"http://127.0.0.1:26657", gnoweb:"https://gno.land"},
  JSON.parse(localStorage.getItem("cc.cfg")||"{}")
);
const saveCfg = () => localStorage.setItem("cc.cfg", JSON.stringify(CFG));

const CC_DEC = 6;          // court coin decimals; economic figures are raw base units
const BLOCK_SECS = 5;      // gno.land block time — how block heights become wall-clock
const WEEK = 120960;       // one emission period, in blocks (trailing-ratio window)

/* ============================ gno RPC client ============================= */
/* abci_query(vm/qeval|vm/qrender) over JSON-RPC. data is amino base64; the reply
   carries the string result in response.Data (sometimes nested in ResponseBase). */
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function unb64(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(_){ return atob(s); } }

async function abci(path, data){
  const body = {jsonrpc:"2.0", id:"cc", method:"abci_query",
    params:{path, data:b64(data), height:"0", prove:false}};
  const res = await fetch(CFG.rpc, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!res.ok) throw new Error("node HTTP "+res.status);
  const j = await res.json();
  if(j.error) throw new Error(j.error.message||"rpc error");
  const r = (j.result&&j.result.response) || {};
  const err = r.Error || (r.ResponseBase&&r.ResponseBase.Error);
  if(err) throw new Error((r.Log||(r.ResponseBase&&r.ResponseBase.Log)||"query failed"));
  const d = r.Data!=null ? r.Data : (r.ResponseBase&&r.ResponseBase.Data);
  return d ? unb64(d) : "";
}
const qeval  = expr => abci("vm/qeval",  PKG+"."+expr);
const qrender = pth => abci("vm/qrender", PKG+":"+pth);

/* qeval returns typed lines like `(123 int64)` or `("orem" string)`, one per
   returned value. Parse tolerantly into JS values. A read that panics becomes a
   query error (caught by the caller), never a silent false — so gate panic-y
   reads (AnswerVerdict, Verdict) behind HasAnswer/Settled first. */
function parseTyped(out){
  const lines = out.trim().split("\n").filter(Boolean);
  return lines.map(line=>{
    const m = line.match(/^\((.*)\s+([A-Za-z0-9_./\[\]]+)\)$/s);
    const raw = m ? m[1] : line;
    if(/^".*"$/s.test(raw)) return raw.slice(1,-1);
    if(raw==="true") return true; if(raw==="false") return false;
    if(/^-?\d+$/.test(raw)) return parseInt(raw,10);
    return raw;
  });
}
const one = async expr => parseTyped(await qeval(expr))[0];
const tup = async expr => parseTyped(await qeval(expr));
const gstr = s => JSON.stringify(String(s));   // gno string literal

/* ============================ demo dataset ============================== */
/* A faithful sample so every screen and state renders offline, in the realm's
   own units (CC base units, 6 decimals) — stakes and conviction, not shares. */
const NOW = 4_800_000; // pretend current block height
const DEMO = {
  courts:{

/* ======================= data access (demo | live) ====================== */
/* Both branches return the SAME shapes, so views never know which is live. The
   directory/docket come from Render() — the chain's own list — and the scalars
   from qeval of the realm's public reads, exactly the "chain carries it" contract. */
const isLive = () => CFG.mode==="live";

async function listCourts(){
  if(!isLive())
    return Object.entries(DEMO.courts).map(([slug,c])=>({slug, name:c.name, tier:c.tier, claims:c.claims.length}));
  const md = await qrender("");
  const out=[]; let tier=1;
  for(const line of md.split("\n")){
    if(/^##\s+Featured/i.test(line)) tier=2;
    else if(/^##\s+Courts/i.test(line)) tier=1;
    const m = line.match(/^\-\s*\[(.+?)\]\(\/r\/cryptocourt\/courtv2:([a-z0-9-]+)\)\s*—\s*(\d+)/);
    if(m) out.push({slug:m[2], name:unesc(m[1]), tier, claims:parseInt(m[3],10)});
  }
  return out;
}
async function courtStats(slug){
  if(!isLive()){ const c=DEMO.courts[slug]; if(!c) return null;
    return {name:c.name, tier:c.tier, price:c.price, supply:c.supply, emitted:c.emitted, reservoir:c.reservoir, seniorOwed:c.seniorOwed, claims:c.claims.length}; }
  const s=gstr(slug);
  const [name,tier,price,supply,emitted,reservoir,seniorOwed,claims] = await Promise.all([
    one(`CourtName(${s})`), one(`CourtTier(${s})`), one(`CoinPrice(${s})`), one(`CoinSupply(${s})`),
    one(`EmittedTotal(${s})`), one(`Reservoir(${s})`), one(`SeniorOwed(${s})`), one(`ClaimCount(${s})`)]);
  return {name,tier,price,supply,emitted,reservoir,seniorOwed,claims};
}
async function listClaims(slug){
  if(!isLive()){ const c=DEMO.courts[slug]; if(!c) return [];
    return c.claims.map(id=>({id, title:DEMO.claims[slug+"/"+id].title, statusText:statusText(DEMO.claims[slug+"/"+id])})); }
  const md = await qrender(slug);
  const out=[];
  const re = new RegExp("^\\-\\s*\\[(.+?)\\]\\(\\/r\\/cryptocourt\\/courtv2:"+slug+"\\/(\\d+)\\)\\s*—\\s*(.*)$");
  for(const line of md.split("\n")){ const m=line.match(re); if(m) out.push({id:parseInt(m[2],10), title:unesc(m[1]), statusText:m[3].trim()}); }
  return out;
}
async function claimDetail(slug,id){
  if(!isLive()){ const d=DEMO.claims[slug+"/"+id]; if(!d) return null; return {id, ...d}; }
  const s=gstr(slug), i=id;
  const [title,status,pools,pconv,toi,tyes,answered,disputeOpen,settled,provClose,provisional] = await Promise.all([
    one(`ClaimTitle(${s},${i})`), one(`ClaimStatus(${s},${i})`), tup(`StakePools(${s},${i})`),
    tup(`PoolConviction(${s},${i})`), tup(`TrailingOI(${s},${i},${WEEK})`), tup(`TrailingYes(${s},${i},${WEEK})`),
    one(`HasAnswer(${s},${i})`), one(`DisputeOpen(${s},${i})`), one(`Settled(${s},${i})`),
    one(`ProvClose(${s},${i})`), one(`Provisional(${s},${i})`)]);
  const d = {id, title, statusText:status, yesStake:pools[0], noStake:pools[1],
    convYes:pconv[0], convNo:pconv[1], trailOImature:toi[1], trailOI:toi[0], trailYesMature:tyes[1], trailYesAvg:tyes[0],
    answered, disputeOpen, settled, provClose, provisional};
  if(answered){
    const answerer = await one(`Answerer(${s},${i})`);
    const [ans,bond,rec,settleAt,tierT,flagState,flagBond] = await Promise.all([
      one(`AnswerVerdict(${s},${i})`), one(`AnswerBond(${s},${i})`), one(`AnswerRecord(${s},${gstr(answerer)})`).catch(()=>0),
      one(`SettleDeadline(${s},${i})`), tup(`QualityTier(${s},${i})`), one(`FlagState(${s},${i})`),
      one(`FlagBondNext(${s},${i})`).catch(()=>0)]);
    Object.assign(d,{answer:ans, answerer, answerBond:bond, record:rec, settleAt, tier:tierT[0], tierFinal:tierT[1], flagState, flagBondNext:flagBond});
    d.flagOpen = flagState==="voting";
    d.counterOpen = flagState==="counter-window";
  }
  if(disputeOpen || (!settled && provisional>=0)){
    d.round = await one(`FailedRounds(${s},${i})`).catch(()=>0);
    d.disputeBondNext = await one(`DisputeBondNext(${s},${i})`).catch(()=>0);
    d.escrowUntil = await one(`EscrowUntil(${s},${i})`).catch(()=>0);
  }
  if(settled && !provClose){ d.verdict = await one(`Verdict(${s},${i})`).catch(()=>-1); d.route = await one(`VerdictRoute(${s},${i})`).catch(()=>""); }
  if(await one(`Crystallized(${s},${i})`).catch(()=>false)){
    const ds = await tup(`DrawSlices(${s},${i})`); d.crystallized=true; d.draw={w:ds[0],a:ds[1],ans:ds[2],carrot:ds[3]};
  }
  // phase for the demo-shaped views
  d.phase = d.provClose?"provClose": d.settled?"settled": d.disputeOpen?"disputed": (d.provisional>=0?"provisional": d.answered?"answered":"open");
  return d;
}

/* statusText mirrors the realm's claimStatus precedence for the demo; live mode
   reads ClaimStatus directly (one qeval, no md-scrape). */
function statusText(d){
  if(d.phase==="provClose") return "closed without a decision — everyone withdraws 1×, deposit and fee refunded";
  if(d.phase==="settled") return "settled — every stake withdraws 1×";
  if(d.phase==="disputed") return "disputed — a sealed vote is deciding; principal is never withheld";
  if(d.phase==="provisional") return "provisional verdict — reopenable by a new dispute; the losing side may withdraw 1× now";
  if(d.phase==="answered") return "answered — staking frozen; disputable, then it settles undisputed";
  return "open — stake YES or NO; unstake freely until an answer posts";
}

/* ============================ formatting ================================ */
const sideName = o => o===0?"YES":o===1?"NO":"—";
function fmtN(n){ return (n==null?0:Math.round(n)).toLocaleString("en-US"); }
function cc(n){ const v=(n||0)/1e6; return (v>=1000? fmtN(v): v.toFixed(v<10?2:1))+" CC"; }
function ugnot(n){ return fmtN(n)+" µGNOT"; }
function shortAddr(a){ a=String(a||""); return a.length>12? a.slice(0,7)+"…"+a.slice(-4): a; }
function wall(nowH, targetH){
  const secs=(targetH-nowH)*BLOCK_SECS, past=secs<0, s=Math.abs(secs);
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  let t = d? d+(d===1?" day":" days") : h? h+(h===1?" hour":" hours") : Math.max(1,m)+" min";
  return past? t+" ago" : "about "+t;
}
function pctYes(y,n){ const t=(y||0)+(n||0); return t>0? Math.round(1000*y/t)/10 : null; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* undo the realm's markdown inline-escaping (\[ \] \( …) when we lift a title
   out of a Render link back into our own escaped DOM text. */
function unesc(s){ return String(s).replace(/\\([\\`*_\[\]()~>\-+.!#<&])/g, "$1"); }

/* Untrusted text (titles, bodies by strangers): HTML-escaped, links de-fanged.
   The realm sanitizes for its markdown; the overlay must not re-introduce a hole. */
function safeInline(s){ return esc(s); }
function safeBlock(s){ return esc(s).split(/\n{2,}/).map(p=>"<p>"+p.replace(/\n/g,"<br>")+"</p>").join(""); }

/* ============================ tx links ================================== */
/* Every action is a gnoweb $help link with arguments pre-filled — the overlay is
   optional: the transaction is the realm's, signed in the user's own wallet.
   The realm's funcs are crossing (func F(cur realm, …)); gnoweb injects `cur`, so
   the links carry only the ordinary arguments. */
function tx(func, args){
  const q = Object.entries(args||{}).map(([k,v])=>"&"+k+"="+encodeURIComponent(v)).join("");
  return CFG.gnoweb.replace(/\/$/,"")+"/r/cryptocourt/courtv2$help&func="+func+q;
}
function btn(label, func, args, cls, sub){
  return `<a class="btn ${cls||""}" target="_blank" rel="noopener" href="${tx(func,args)}">`+
    `<span class="g">↗</span> ${esc(label)}${sub?` <small>${esc(sub)}</small>`:""}</a>`;
}

/* Three ratio series (§3.9): instantaneous stake, trailing week, and the
   lifetime conviction ratio — the one a manipulator can only move by paying
   real capital-time. */
function ratioBlock(d){
  const inst = pctYes(d.yesStake,d.noStake);
  const life = pctYes(d.convYes,d.convNo);
  const trail = (d.trailYes!=null)? d.trailYes : (d.trailYesMature && d.trailOI>0 ? Math.round(1000*d.trailYesAvg/d.trailOI)/10 : null);
  const bar = (label,sub,p)=> p==null
    ? `<div class="row"><div class="lab">${label}<small>${sub}</small></div><div class="none">— not enough history —</div></div>`
    : `<div class="row"><div class="lab">${label}<small>${sub}</small></div>
        <div><div class="track"><div class="y" style="width:${p}%"></div></div>
        <div class="nums"><span class="yv">${p}% YES</span><span class="nv">${Math.round((100-p)*10)/10}% NO</span></div></div></div>`;
  return `<div class="ratio">
    ${bar("Now","every staked coin, this instant",inst)}
    ${bar("Trailing week","flash-resistant average",trail)}
    ${bar("Lifetime conviction","stake × time — the reward weight",life)}
  </div>`;
}

/* The stake ticket — replaces the V1 order ticket. Principal is never at risk;
   the reward is conviction (stake × time held until the answer). */
function stakeTicket(slug,id,d){
  if(d.phase!=="open"){
    return `<div class="ticket"><h3>Staking is frozen</h3>
      <div class="hint">An answer has been posted, so stakes are locked until the verdict is final. Principal is never withheld — both sides withdraw 1× at settlement.</div>
      <div class="line"><span class="l">Your principal</span><span class="r">returns 1×, always</span></div>
      <div class="line"><span class="l">Winning side</span><span class="r">1× + accuracy reward</span></div>
      <div class="line"><span class="l">Losing side</span><span class="r">1×, loses nothing</span></div></div>`;
  }
  return `<div class="ticket"><h3>Stake the claim</h3>
    <div class="hint">Back the side you believe. Free to unstake until an answer posts — then it locks and your <b>conviction</b> (stake × time held) becomes your reward weight.</div>
    <div class="line"><span class="l">Your principal</span><span class="r">returns 1×, either way</span></div>
    <div class="line"><span class="l">If your side wins</span><span class="r">1× + accuracy reward</span></div>
    <div class="line"><span class="l">If your side loses</span><span class="r">1×, nothing lost</span></div>
    <div class="never"><b>Reward = conviction, not stake.</b> Staking early and holding earns more than a last-second flood; the number that pays is stake × time, and it survives an honest unstake. Principal is not a wager — it always comes home.</div>
    <div class="actions" style="margin-top:14px">
      ${btn("Stake YES","Stake",{courtSlug:slug,claimID:id,side:0,amount:1000000},"yes","1 CC")}
      ${btn("Stake NO","Stake",{courtSlug:slug,claimID:id,side:1,amount:1000000},"no","1 CC")}
      ${btn("Unstake","Unstake",{courtSlug:slug,claimID:id,side:0,amount:1000000})}
    </div></div>`;
}

function verdictBanner(d){
  if(d.phase==="provClose") return `<span class="pill void">closed · no decision</span>`;
  if(d.phase==="settled"){ const v=(d.verdict!=null?d.verdict:d.answer); return `<span class="pill good">✓ settled ${sideName(v)}${d.route?" · "+esc(d.route):""}</span>`; }
  if(d.phase==="disputed") return `<span class="pill escrow">⚖ dispute under way · tally sealed</span>`;
  if(d.phase==="provisional") return `<span class="pill escrow">provisional ${sideName(d.provisional)} · reopenable</span>`;
  if(d.phase==="answered") return `<span class="pill open">answered ${sideName(d.answer)}</span>`;
  return `<span class="pill void">open · no answer yet</span>`;
}

/* Resolution: answer / dispute / settlement, showing the verdict's ROUTE and
   wall-clock timing, and NEVER the live tally while a vote is open. */
function resolutionSection(slug,id,d){
  let inner="";
  if(d.phase==="provClose"){
    inner = `<div class="notice void"><span class="g">◌</span><div><b>Closed without a decision.</b>
      Three dispute rounds failed to reach quorum, so nobody's answer stands. Everyone withdraws their principal 1×; the deposit and fee refund. No reward is drawn.
      <div class="actions" style="margin-top:10px">${btn("Withdraw your stake","WithdrawStake",{courtSlug:slug,claimID:id,side:0})}</div></div></div>`;
  } else if(d.phase==="settled"){
    const v=(d.verdict!=null?d.verdict:d.answer);
    inner = `<div class="notice good"><span class="g">✓</span><div><b>Settled ${sideName(v)}</b>${d.route?" — "+esc(d.route)+"":""}.
      Both sides withdraw principal 1×; the winning side also draws its accuracy reward once the claim crystallizes.
      <div class="actions" style="margin-top:10px">
        ${btn("Withdraw principal","WithdrawStake",{courtSlug:slug,claimID:id,side:v},"yes")}
        ${d.crystallized?btn("Pull accuracy reward","WithdrawBonus",{courtSlug:slug,claimID:id,side:v}):btn("Crystallize the draw","Crystallize",{courtSlug:slug,claimID:id})}</div></div></div>`;
  } else if(d.phase==="disputed"){
    inner = `<div class="notice warn"><span class="g">⚖</span><div><b>A dispute is under way</b> (round ${d.round||1}).
      The ballot asks <i>“overturn the answer?”</i> — the tally stays <b>sealed until the vote closes</b>, so no one piles onto a leader. Forfeited bonds are burned, never paid to the other side.
      <div class="actions" style="margin-top:10px">
        ${btn("Vote to overturn","VoteDispute",{courtSlug:slug,claimID:id,choice:"yes"},"no")}
        ${btn("Vote to uphold","VoteDispute",{courtSlug:slug,claimID:id,choice:"no"},"yes")}
        ${btn("Resolve (after close)","ResolveDispute",{courtSlug:slug,claimID:id})}</div></div></div>`;
  } else if(d.phase==="provisional"){
    const cost = d.disputeBondNext? " The next dispute bond is "+cc(d.disputeBondNext)+" (it doubles each failed round).":"";
    const when = d.escrowUntil? " Reopenable until block "+fmtN(d.escrowUntil)+" ("+wall(NOW,d.escrowUntil)+").":"";
    inner = `<div class="notice warn"><span class="g">⏳</span><div><b>Provisional ${sideName(d.provisional)}, in escrow.</b>
      A new dispute can still reopen it before it locks.${when}${cost} The side it runs against may withdraw 1× now — their outcome can't improve.
      <div class="actions" style="margin-top:10px">
        ${btn("Reopen (dispute again)","OpenDispute",{courtSlug:slug,claimID:id},"no")}
        ${btn("Finalize","Finalize",{courtSlug:slug,claimID:id})}
        ${btn("Withdraw (losing side)","WithdrawStake",{courtSlug:slug,claimID:id,side:1-d.provisional})}</div></div></div>`;
  } else if(d.phase==="answered"){
    const bondt = d.answerBond!=null? " backed by a bond of "+cc(d.answerBond)+" that burns if the answer is overturned":"";
    const rec = d.record? " The answerer's contested-and-upheld record here is "+d.record+".":"";
    const when = d.settleAt? " It settles undisputed "+wall(NOW,d.settleAt)+" if nobody disputes it.":"";
    const cost = d.disputeBondNext? " Disputing now costs "+cc(d.disputeBondNext)+".":"";
    inner = `<div class="notice warn"><span class="g">◷</span><div><b>Answered ${sideName(d.answer)}</b> by ${shortAddr(d.answerer)}${bondt}.${when}${cost}${rec}
      <div class="actions" style="margin-top:10px">
        ${btn("Dispute this answer","OpenDispute",{courtSlug:slug,claimID:id},"no")}
        ${btn("Settle (if aged & undisputed)","SettleUndisputed",{courtSlug:slug,claimID:id})}</div></div></div>`;
  } else {
    inner = `<div class="notice warn"><span class="g">◔</span><div><b>No answer yet.</b> Once the trailing total stake clears the answerability floor, anyone may post an answer with a bond sized so lying does not pay. Posting freezes staking; an undisputed answer settles 72 hours later.
      <div class="actions" style="margin-top:10px">
        ${btn("Answer YES","PostAnswer",{courtSlug:slug,claimID:id,side:0},"yes")}
        ${btn("Answer NO","PostAnswer",{courtSlug:slug,claimID:id,side:1},"no")}</div></div></div>`;
  }
  return `<section><div class="sec-h">Resolution</div>${inner}</section>`;
}

/* Quality lane — the tier and the flag slot, always sealed while a vote runs. */
function qualitySection(slug,id,d){
  if(d.phase==="open"||d.phase==="provClose") return "";
  const tierName = t=> t===0?"low":t===2?"high":"mid";
  let line, act="";
  if(d.flagOpen){ line = "A quality flag vote is open — was this claim low-information? The tally is <b>sealed</b> until it closes."; act = btn("Resolve flag (after close)","ResolveFlag",{courtSlug:slug,claimID:id}); }
  else if(d.counterOpen){ line = "A slash is in its counter-flag window — the answerer may force one re-vote."; act = btn("Counter-flag (answerer)","CounterFlag",{courtSlug:slug,claimID:id})+btn("Resolve counter","ResolveCounter",{courtSlug:slug,claimID:id}); }
  else {
    const tn = d.tier!=null? tierName(d.tier):"mid";
    line = `Quality tier: <b>${tn}</b>${d.tierFinal?" (final)":" (default — the flag lane may re-vote it)"}. A flag questions whether a claim carries information; a wrong flag burns its bond, a right one is paid.`;
    if(!d.tierFinal && !d.crystallized) act = btn("Flag as low-information","OpenFlag",{courtSlug:slug,claimID:id}, "", d.flagBondNext?cc(d.flagBondNext)+" bond":"");
  }
  const draw = d.crystallized&&d.draw? `<div class="line"><span class="l">Reward pools (CC units)</span><span class="r">accuracy ${fmtN(d.draw.w)} · author ${fmtN(d.draw.a)} · answerer ${fmtN(d.draw.ans)}</span></div>`:"";
  return `<section><div class="sec-h">Quality &amp; rewards</div>
    <div class="panel"><p class="small" style="margin:0 0 6px">${line}</p>${draw?`<div style="margin-top:8px">${draw}</div>`:""}
    ${act?`<div class="actions" style="margin-top:12px">${act}</div>`:""}</div></section>`;
}

/* The four things every participant must understand — nothing hidden here changes
   a decision; the floors, bond slices and step-down schedule stay out of the way. */
function fourThings(){
  return `<section><div class="primer"><h3>Four things, before any button</h3><ol>
    <li>Buying the coin is <b>permanent</b> — GNOT flows one way and is burned; there is no sell-back.</li>
    <li>Staking is <b>no-loss</b>: your principal always returns 1×, win or lose. Only the <b>reward</b> is at stake.</li>
    <li>The reward is <b>conviction</b> — stake × time on the winning side — drawn from newly-minted coin, capped so it can never be farmed.</li>
    <li>Anyone may <b>answer</b> (with a bond) and anyone may <b>dispute</b> or <b>flag</b> it; every button spends real money and is final.</li>
  </ol></div></section>`;
}

/* --- your positions --- */
on(/^\/me$/, async ()=>{ meView(DEMO_ME); });
async function meView(addr){
  loading();
  const courts = await listCourts();
  main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:"Your positions"}])
    + `<h1 class="page-h">Your positions</h1>
       <p class="page-sub">Render has no idea who is asking, so a court reads holdings by address. Paste yours to see stakes, accrued conviction, and what's withdrawable.</p>
       <div class="addrbar"><input id="addr" class="mono" value="${esc(addr)}" spellcheck="false" aria-label="your address">
         <button class="btn" id="addrgo">Read positions</button></div>
       <div id="holdings"></div>`;
  const go = ()=>{ const a=document.getElementById("addr").value.trim(); if(a) meHoldings(a,courts); };
  document.getElementById("addrgo").onclick = go;
  document.getElementById("addr").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  meHoldings(addr,courts);
}
async function meHoldings(addr,courts){
  const box=document.getElementById("holdings"); box.innerHTML=`<div class="empty"><div class="g">⚖︎</div><p>Reading your positions…</p></div>`;
  const blocks=[];
  for(const c of courts){
    const bal = await balanceOf(c.slug,addr).catch(()=>0);
    const claims = await listClaims(c.slug).catch(()=>[]);
    const rows=[];
    for(const cl of claims){
      const p = await positionOf(c.slug,cl.id,addr).catch(()=>({yes:0,no:0,cy:0,cn:0}));
      if(p.yes||p.no||p.cy||p.cn) rows.push({cl,p});
    }
    if(!bal && !rows.length) continue;
    blocks.push(`<section><div class="sec-h">${safeInline(c.name)} <span class="count">${cc(bal)} coin balance</span></div>`
      + (rows.length? `<div class="scroll-x"><table class="data"><thead><tr><th>Claim</th><th>YES stake</th><th>NO stake</th><th>conviction</th><th></th></tr></thead><tbody>`
          + rows.map(({cl,p})=>`<tr><td><a href="#/c/${esc(c.slug)}/${cl.id}" style="color:var(--accent-2);text-decoration:none">${safeInline(cl.title)}</a></td>
              <td class="num">${cc(p.yes)}</td><td class="num">${cc(p.no)}</td><td class="num">${cc((p.cy||0)+(p.cn||0))}</td>
              <td class="num"><a class="small" style="color:var(--accent-2)" target="_blank" rel="noopener" href="${tx("WithdrawStake",{courtSlug:c.slug,claimID:cl.id,side:p.yes>=p.no?0:1})}">withdraw ↗</a></td></tr>`).join("")
          + `</tbody></table></div>`
        : `<p class="small muted">Coin only — no open positions in this court.</p>`)
      + `</section>`);
  }
  box.innerHTML = blocks.length? blocks.join("")
    : `<div class="empty"><div class="g">◌</div><p>No coin and no positions found for <span class="mono">${shortAddr(addr)}</span>.</p><p class="small">Buy a court's coin and stake a claim to begin.</p></div>`;
}

/* --- what needs you: live answers on claims YOU staked, flagged if against your
   side. The people whose reward a false answer would deny are the ones told. --- */
on(/^\/needs$/, async ()=> needsView(DEMO_ME));
async function needsView(addr){
  loading();
  const courts = await listCourts();
  main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:"What needs you"}])
    + `<h1 class="page-h">What needs you</h1>
       <p class="page-sub">Answers posted on claims you've staked — flagged when the answer runs <b>against your side</b>. Nobody is more motivated to contest a false answer than the stakers whose reward it would deny. It's a notification, not a role.</p>
       <div class="addrbar"><input id="naddr" class="mono" value="${esc(addr)}" spellcheck="false" aria-label="your address">
         <button class="btn" id="ngo">Check</button></div><div id="needs"></div>`;
  const go=()=>{ const a=document.getElementById("naddr").value.trim(); if(a) needsList(a,courts); };
  document.getElementById("ngo").onclick=go;
  needsList(addr,courts);
}
async function needsList(addr,courts){
  const box=document.getElementById("needs"); box.innerHTML=`<div class="empty"><div class="g">⚖︎</div><p>Checking your claims…</p></div>`;
  const items=[];
  for(const c of courts){
    const claims=await listClaims(c.slug).catch(()=>[]);
    for(const cl of claims){
      const d=await claimDetail(c.slug,cl.id).catch(()=>null);
      if(!d||!d.answered||d.settled||d.provClose) continue;
      const p=await positionOf(c.slug,cl.id,addr).catch(()=>({yes:0,no:0}));
      if(!p.yes && !p.no) continue;
      const yourSide = p.yes>=p.no?0:1;
      const against = d.answer!==yourSide;
      items.push({c,cl,d,against});
    }
  }
  if(!items.length){ box.innerHTML=`<div class="empty"><div class="g">✓</div><p>Nothing needs you right now — no live answers on claims you've staked.</p></div>`; return; }
  items.sort((a,b)=>(b.against?1:0)-(a.against?1:0));
  box.innerHTML = `<div class="docket">`+items.map(({c,cl,d,against})=>
    `<a href="#/c/${esc(c.slug)}/${cl.id}">
      <div><div class="t">${safeInline(cl.title)}</div>
        <div class="m"><span>${safeInline(c.name)}</span><span>answered ${sideName(d.answer)}</span></div></div>
      <div class="rt">${against?`<span class="pill no">⚑ against your side</span>`:`<span class="pill good">matches you</span>`}</div></a>`
  ).join("")+`</div>`;
}

/* --- the chain render: the same page as the realm alone serves it. --- */
on(/^\/raw\/([a-z0-9-]+)(?:\/(\d+))?$/, async (slug,id)=>{
  loading();
  const path = id!=null? slug+"/"+id : slug;
  const md = await rawRender(path);
  main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:slug,href:"#/c/"+slug},{label:"Chain render"}])
    + `<h1 class="page-h">As the chain serves it</h1>
       <p class="page-sub">Exactly what <code>Render(${esc(gstr(path))})</code> returns — plain markdown, no overlay. Everything you need to act is here; the pretty version only rearranges it.</p>
       <div class="rawblock">${esc(md||"(empty)")}</div>`;
});

/* --- how it works --- */
on(/^\/about$/, async ()=>{
  setNav("/about");
  main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:"How it works"}])
    + `<h1 class="page-h">How a court works</h1>
    <div class="prose" style="margin-top:16px">
      <p>A <b>court</b> is a self-contained venue for claims of fact. It mints its own coin on a one-way bonding curve — you buy in with GNOT, and the GNOT is <b>burned</b>. There is no treasury and no sell-back; the coin's worth is what it can stake and earn.</p>
      <h2>Claims, and staking</h2>
      <p>Anyone opens a <b>claim</b> — an immutable statement of fact — for a small refundable deposit. Then anyone <b>stakes</b> coin on YES or NO. Staking is <b>no-loss</b>: your principal always returns 1×, whichever way the claim resolves. What you earn is a reward proportional to your <b>conviction</b> — stake × time held on the winning side — drawn from newly-minted coin under a hard per-claim cap, so it rewards early, accurate belief and can't be farmed. Unstaking is free until an answer posts; the reward weight you've already earned is kept.</p>
      <h2>Answers, disputes, and flags</h2>
      <p>Once a claim has enough sustained interest, anyone may <b>post an answer</b> with a bond. Posting freezes staking. Left alone, the answer settles 72 hours later. To contest it, open a <b>dispute</b>: a token vote on <i>“overturn the answer?”</i>, sealed until it closes. A forfeited bond is <b>burned</b>, never paid to the other side, and the winner is compensated from fresh issuance — so no money ever moves between adversaries. Separately, a <b>flag</b> asks whether a claim carried real information; a wrong flag burns its bond and a right one is paid. A verdict always shows its route — <i>undisputed</i> or <i>by vote</i>.</p>
      <h2>The overlay is optional</h2>
      <p>Everything here is read from the realm's own <code>Render</code> and its public reads, and every button is a normal gnoweb transaction signed in your wallet. Switch the Source to a live node in the left rail to read a deployed court; the sample data lets you explore every state offline.</p>
    </div>`;
});

/* ===================== demo Render() (chain-render sample) ============== */
function demoRender(path){
  const parts = path.split("/");
  if(path===""||path==="/"){
    let o="# CryptoCourt V2\n\nStake on claims of fact. Your principal always returns 1×.\n\n## Featured\n\n";
    for(const [slug,c] of Object.entries(DEMO.courts)) if(c.tier===2) o+=`- [${c.name}](/r/cryptocourt/courtv2:${slug}) — ${c.claims.length} claims\n`;
    o+="\n## Courts\n\n";
    for(const [slug,c] of Object.entries(DEMO.courts)) if(c.tier!==2) o+=`- [${c.name}](/r/cryptocourt/courtv2:${slug}) — ${c.claims.length} claims\n`;
    return o;
  }
  const c=DEMO.courts[parts[0]]; if(!c) return "## Not found\nNo court by that slug.";
  if(parts.length===1){
    let o=`# ${c.name}\n\n- coin price: ${c.price} ugnot per CC unit (one-way; the GNOT is burned)\n- supply: ${c.supply} · emitted: ${c.emitted}\n- reward reservoir: ${c.reservoir} · senior queue owed: ${c.seniorOwed}\n\n## Claims\n\n`;
    for(const id of c.claims){ const d=DEMO.claims[parts[0]+"/"+id]; o+=`- [${d.title}](/r/cryptocourt/courtv2:${parts[0]}/${id}) — ${statusText(d)}\n`; }
    return o;
  }
  const d=DEMO.claims[parts[0]+"/"+parts[1]]; if(!d) return "## Not found\nNo claim by that id.";
  const inst=pctYes(d.yesStake,d.noStake);
  let o=`# ${d.title}\n\n## Signal\n\n- staked now: ${d.yesStake+d.noStake} (YES ${d.yesStake} / NO ${d.noStake})\n`;
  if(inst!=null) o+=`- instantaneous: ${inst}% YES\n`;
  o+=`\n## Status\n\n${statusText(d)}\n`;
  return o;
}

/* ============================ boot ==================================== */
function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme");
  const dark = t? t==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  document.getElementById("themelab").textContent = dark? "Light mode":"Dark mode";
}
function initControls(){
  const modesel=document.getElementById("modesel"), rpcwrap=document.getElementById("rpcwrap"),
        dot=document.getElementById("dot"), lab=document.getElementById("nodelab"),
        rpc=document.getElementById("rpc"), gnoweb=document.getElementById("gnoweb");
  rpc.value=CFG.rpc; gnoweb.value=CFG.gnoweb; modesel.value=CFG.mode;
  const reflect=()=>{ const live=CFG.mode==="live"; rpcwrap.hidden=!live;
    dot.className="dot "+(live?"live":"demo"); lab.textContent= live?"Live node":"Demo data"; };
  modesel.onchange=()=>{ CFG.mode=modesel.value; saveCfg(); reflect(); render(); };
  rpc.onchange=()=>{ CFG.rpc=rpc.value.trim(); saveCfg(); if(CFG.mode==="live") render(); };
  gnoweb.onchange=()=>{ CFG.gnoweb=gnoweb.value.trim()||"https://gno.land"; saveCfg(); if(CFG.mode==="live") render(); };
  reflect();
  const themebtn=document.getElementById("themebtn");
  themebtn.onclick=()=>{ const cur=document.documentElement.getAttribute("data-theme");
    const dark = cur? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    CFG.theme = dark? "light":"dark"; saveCfg(); applyTheme(CFG.theme); };
}
applyTheme(CFG.theme);
initControls();
render();
</script>
