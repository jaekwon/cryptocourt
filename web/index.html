/* ---------------- the associations (related claims) ----------------
   Overlay-level curation, labeled sample; the chain stores no relations, so
   live mode renders nothing here. Three relation types (matching the repo's
   own future design in docs/COURTS_STRUCTURE.md §5): part-of (one parent),
   bears-on (supports|contradicts), supersedes (a re-filing after a
   no-decision). Rows carry title + relation chip + status pill ONLY — a
   yes-share next to a stance chip would read as a trading hint (§7.4). */
function assocRow(slug, rid, chip, lookup){
  const d = lookup? lookup(rid) : null;
  // an id the current chain page doesn't carry renders bare — never invented
  return `<a class="crow assocrow" href="#/c/${esc(slug)}/${rid}">
    <span class="id">#${rid}</span>
    <span><span class="t">${d? safeInline(d.title) : `<span class="muted">claim #${rid} — not in the rendered docket window</span>`}</span></span>
    <span class="rt"><span class="pill ${/contradict/.test(chip)?"contra":"void"}">${esc(chip)}</span>
    ${d? statusPill(d.statusText) : ""}</span></a>`;
}
function associationSection(slug, id, lookup, chainRows){
  const cur = curationFor(slug);
  const chain = Array.isArray(chainRows)? chainRows : [];
  if((!cur || !cur.relations.length) && !chain.length) return "";
  const rels = cur? cur.relations : [];
  const mine = rels.filter(r=>r.from===id || r.to===id);
  if(!mine.length && !chain.length) return "";
  const dOf = i => lookup? lookup(i) : null;
  const parent = mine.find(r=>r.type==="part" && r.from===id);
  const children = mine.filter(r=>r.type==="part" && r.to===id).map(r=>r.from);
  // THE CHAIN OWNS `bears` AND `supersedes` NOW. Curation keeps only containment,
  // which §5 says may hang off a section and §6 defers — so a curation edge of
  // either owned kind is dropped rather than shown beside a chain row saying the
  // same thing differently. Nothing merges silently: a row is either the chain's
  // record or somebody's file.
  const rel = [];
  const seen = new Set();
  chain.forEach(([other, chip]) => { rel.push([other, chip]); seen.add(other + "|" + chip); });
  mine.forEach(r=>{
    if((r.type==="bears" || r.type==="supersedes") && chain.length) return; // the chain answered these
    if(r.type==="bears" && r.to===id) rel.push([r.from, r.stance==="supports"? "supports":"contradicts"]);
    else if(r.type==="bears" && r.from===id) rel.push([r.to, r.stance==="supports"? "supported by this":"contradicted by this"]);
    else if(r.type==="supersedes" && r.to===id) rel.push([r.from, "supersedes"]);
    else if(r.type==="supersedes" && r.from===id) rel.push([r.to, "superseded by this"]);
  });
  const settledN = children.filter(i=>{ const d=dOf(i); return d && phaseClass(d.statusText).short==="settled"; }).length;
  const undecided = children.length - settledN;
  // NOT "The argument". COURTS_STRUCTURE.md §5 names two kinds of edge and says
  // they must not be merged: containment (a tree, at most one parent, no stance)
  // and argument (a graph on top of it, any number, supports/counters). This
  // section renders BOTH, so heading it with the name of one axis labelled half
  // its own contents — and a reader asked what it meant, which is the evidence.
  // THE CAPTION HAD TO CHANGE, because it asserted something that stopped being
  // true: "the chain stores no relations". It stores associations now. What it
  // still does not store is containment and supersedes, so the caption names the
  // source that actually applies rather than one blanket disclaimer.
  /* IT SITS IN THE SLOT A COUNT NORMALLY SITS IN, so it has to read as a caption
     and not as a definition of the heading. "Where this claim sits · the chain's
     own record" was two noun phrases with nothing joining them, and the owner
     read it as confusing. Every branch now names the thing being sourced. */
  const srcNote = chain.length
    ? (mine.some(r=>r.type!=="bears")
        ? "relations read from the chain; containment and supersedes are curation"
        : "relations read from the chain")
    : (cur && cur.source==="local"? CUR_LABEL : "sample curation — the chain stores no relations");
  let g = `<section style="margin-top:22px"><div class="sec-h">Where this claim sits <span class="count">${esc(srcNote)}</span></div>`;
  // The parent is CONTAINMENT, the same axis as "Rests on" and pointing the
  // other way, so it belongs beside it rather than under "Related" — that group
  // is the association graph, and filing a containment edge in it is exactly the
  // merge §5 forbids. It also used to be the only relation in the section
  // rendered as a bare line of prose: no relation chip, and no status pill, so
  // the one thing you most want to know about the whole you are a part of —
  // whether it is already settled — was the one thing not shown.
  // The chip reads as a predicate with the ROW as its subject and the claim you
  // are on as the implied object — "#6 supports [this]", "#3 one part [of this]",
  // "#5 superseded by this". So the parent's is "contains this".
  //
  // It said "the whole", which asserts the row is the top of the tree. Wrong in
  // general: containment is a tree and §5's own worked example runs three levels,
  // so a parent routinely has a parent and is a part as much as a whole. The
  // sample docket has exactly one level — 3, 4 and 7 are parts of 9 and 9 has no
  // parent — so the only parent it can render genuinely IS the top, and the label
  // looked right for the one case the fixture is able to show.
  if(parent){
    g += `<div class="sec-h" style="margin-top:6px">Part of</div>`
      + `<div class="docket">${assocRow(slug, parent.to, "contains this", lookup)}</div>`;
  }
  if(children.length){
    g += `<div class="sec-h" style="margin-top:${parent?14:6}px">Rests on <span class="count">${settledN} of ${children.length} part${children.length===1?"":"s"} settled</span></div>`
      + (undecided? `<p class="small muted" style="margin:0 0 8px">${undecided} of ${children.length} parts are still undecided — any verdict here is reached without them.</p>`:"")
      + `<div class="docket">${children.map(i=>assocRow(slug,i,"one part",lookup)).join("")}</div>`;
  }
  if(rel.length){
    g += `<div class="sec-h" style="margin-top:${children.length||parent?14:6}px">Related</div>`
      + `<div class="docket">${rel.map(([i,c])=>assocRow(slug,i,c,lookup)).join("")}</div>`;
  }
  g += `<p class="small muted" style="margin:10px 0 0">Curation, not mechanics: relations move no stake, no bond, no bar, no verdict — each claim is decided alone. They are here so you need not leave the page you vote on to find the argument.</p></section>`;
  return g;
}
/* ======================= local curation (C2) =========================
   What the chain cannot hold yet — a court description, nested folders,
   relations — lives in a JSON file the curator keeps: exported, edited,
   imported, held in THIS BROWSER's storage and written to no chain. Every
   surface that renders it says so. cleanCuration follows cleanCfg's
   fail-hard philosophy: reject with precise errors, never partial-apply. */
const CURATION_V = 1;
function curKey(slug){ return "cc.cur."+(CFG.mode==="demo"?"demo":(CFG.chainid||"dev"))+"."+slug; }
function cleanCuration(raw, slug, validIds){
  const errs=[], warn=[], out={kourtCuration:CURATION_V, court:slug, chain:(CFG.mode==="demo"?"demo":(CFG.chainid||"dev")), note:"local curation — held in a browser, recorded on no chain", desc:"", folders:[], relations:[]};
  if(typeof raw!=="object"||raw===null||Array.isArray(raw)){ return {errs:["not a JSON object"], warn, cur:null}; }
  if(raw.kourtCuration!==CURATION_V) errs.push("kourtCuration must be "+CURATION_V);
  if(raw.court!==slug) errs.push(`court must be "${slug}" (got ${JSON.stringify(raw.court)})`);
  if(raw.chain!=null && raw.chain!==out.chain) warn.push(`this file was made on chain "${raw.chain}", you are on "${out.chain}" — the claim numbers may point at different claims`);
  if(raw.desc!=null){
    if(typeof raw.desc!=="string") errs.push("desc must be a string");
    else if(raw.desc.length>240) errs.push("desc over 240 chars");
    else if(/\n/.test(raw.desc)) errs.push("desc must be a single paragraph");
    else out.desc=raw.desc;
  }
  const known=new Set(["kourtCuration","court","chain","note","desc","folders","relations"]);
  const stripped=Object.keys(raw).filter(k=>!known.has(k));
  if(stripped.length) warn.push("unknown keys stripped: "+stripped.join(", "));
  if(raw.folders!=null && !Array.isArray(raw.folders)) errs.push("folders must be an array");
  if(raw.relations!=null && !Array.isArray(raw.relations)) errs.push("relations must be an array");
  const seenClaim=new Set(); let folderN=0;
  function cleanFolder(f, depth, path){
    if(depth>4){ errs.push(path+": folders nested deeper than 4"); return null; }
    if(typeof f!=="object"||f===null){ errs.push(path+": folder must be an object"); return null; }
    if(typeof f.name!=="string"||!f.name.trim()||f.name.length>60){ errs.push(path+": folder name must be 1–60 chars"); return null; }
    if(++folderN>100){ errs.push("more than 100 folders"); return null; }
    const cf={name:f.name.trim(), claims:[], folders:[]};
    for(const id of (Array.isArray(f.claims)?f.claims:[])){
      if(!Number.isInteger(id)||id<1||id>1e12){ errs.push(path+": claim id "+JSON.stringify(id)+" is not a sane positive integer"); continue; }
      if(cf.claims.includes(id)){ errs.push(path+": claim #"+id+" listed twice in this folder"); continue; }
      if(seenClaim.has(id)){ errs.push("claim #"+id+" is in more than one folder"); continue; }
      seenClaim.add(id); cf.claims.push(id);
    }
    (Array.isArray(f.folders)?f.folders:[]).forEach((sub,i)=>{
      const c=cleanFolder(sub, depth+1, path+"."+i); if(c) cf.folders.push(c);
    });
    return cf;
  }
  (Array.isArray(raw.folders)?raw.folders:[]).forEach((f,i)=>{
    const c=cleanFolder(f,1,"folders["+i+"]"); if(c) out.folders.push(c);
  });
  const seenRel=new Set(); const parentOf={};
  (Array.isArray(raw.relations)?raw.relations:[]).forEach((r,i)=>{
    const pfx="relations["+i+"]";
    if(typeof r!=="object"||r===null){ errs.push(pfx+": not an object"); return; }
    if(!Number.isInteger(r.from)||!Number.isInteger(r.to)||r.from<1||r.to<1||r.from>1e12||r.to>1e12){ errs.push(pfx+": from/to must be sane positive integers"); return; }
    if(r.from===r.to){ errs.push(pfx+": from equals to"); return; }
    if(!["part","bears","supersedes"].includes(r.type)){ errs.push(pfx+": type must be part|bears|supersedes"); return; }
    if(r.type==="bears" && !["supports","contradicts"].includes(r.stance)){ errs.push(pfx+": bears needs stance supports|contradicts"); return; }
    if(r.type!=="bears" && r.stance!=null){ errs.push(pfx+": stance only belongs on bears"); return; }
    const key=r.type+":"+r.from+":"+r.to+":"+(r.stance||"");
    if(seenRel.has(key)){ errs.push(pfx+": duplicate relation"); return; }
    seenRel.add(key);
    if(r.type==="part"){
      if(parentOf[r.from]!=null){ errs.push(pfx+": claim #"+r.from+" already has a part-parent"); return; }
      parentOf[r.from]=r.to;
    }
    if(out.relations.length>=300){ errs.push("more than 300 relations"); return; }
    out.relations.push(r.type==="bears"? {from:r.from,to:r.to,type:"bears",stance:r.stance} : {from:r.from,to:r.to,type:r.type});
  });
  // part cycles
  const inCycle=new Set();
  for(const start of Object.keys(parentOf).map(Number)){
    let cur=start; const seen=new Set();
    while(parentOf[cur]!=null){
      if(seen.has(cur)){ if(!inCycle.has(cur)) errs.push("part-of cycle through #"+cur); seen.forEach(n=>inCycle.add(n)); break; }
      seen.add(cur); cur=parentOf[cur];
    }
  }
  if(validIds){
    const bad=[];
    out.folders.forEach(function chk(f){ f.claims=f.claims.filter(id=>{ const okId=validIds.has(id); if(!okId) bad.push(id); return true; }); (f.folders||[]).forEach(chk); });
    out.relations.forEach(r=>{ if(!validIds.has(r.from)) bad.push(r.from); if(!validIds.has(r.to)) bad.push(r.to); });
    const uniq=[...new Set(bad)];
    if(uniq.length) warn.push(uniq.length+" claim id"+(uniq.length>1?"s are":" is")+" not on this chain — held, not rendered until the docket reaches them");
  }
  if(JSON.stringify(out).length>65536) errs.push("curation over 64KB");
  return {errs, warn, cur: errs.length? null : out};
}
/* precedence: local (this browser) ?? demo sample ?? none */
/* THE CHAIN'S OWN ARGUMENT EDGES. ClaimAssociations answers
   "out:<to>:<s|c>,...;in:<from>:<s|c>,..." — bounded by the realm's own caps, so
   this parse can never be handed more rows than a page can draw.

   Only the ARGUMENT edge lives on chain, which is not a shortcoming to route
   around: COURTS_STRUCTURE.md §5's containment guard is "only sections may be
   containment parents", so claim→claim part-of is the shape the spec forbids,
   `supersedes` is on chain too, by its own entrypoint rather than a second bears
   edge — it is a checkable fact about the docket, not an opinion, so the realm
   verifies the predicate instead of storing an assertion. Containment stays
   curation, labelled
   as curation, which is why this returns only the bears rows and the caller
   merges rather than replaces. */
/* Every relation the CHAIN holds about one claim: associations and re-filings,
   in one round trip each, merged into the [id, chip] rows the render wants.
   Either read may be absent on an older realm and the other still counts — a
   realm that predates supersede.gno answers nothing for it, which is not a
   reason to drop its associations. */
async function chainAssociations(slug, id){
  if(!isLive()) return null;
  const [raw, sup] = await Promise.all([
    one(`ClaimAssociations(${gstr(slug)},${id})`).then(unesc).catch(()=>null),
    one(`ClaimSupersedes(${gstr(slug)},${id})`).then(unesc).catch(()=>null),
  ]);
  const rows = [];
  if(typeof sup === "string" && sup.indexOf("of:") === 0){
    const sh = sup.split(";by:");
    // `of:X` — this claim re-files X, so X is the one superseded BY THIS.
    const of = parseInt(sh[0].slice(3), 10);
    if(Number.isInteger(of) && of > 0) rows.push([of, "superseded by this"]);
    // `by:Y,Z` — Y and Z re-file this one.
    for(const part of String(sh[1]||"").split(",")){
      const y = parseInt(part, 10);
      if(Number.isInteger(y) && y > 0) rows.push([y, "supersedes"]);
    }
  }
  if(typeof raw !== "string" || raw.indexOf("out:") !== 0) return rows.length? rows : null;
  const half = raw.split(";in:");
  const eat = (blob, inbound) => {
    for(const part of String(blob||"").split(",")){
      const bits = part.split(":");
      if(bits.length !== 2) continue;
      const other = parseInt(bits[0], 10);
      if(!Number.isInteger(other) || other < 1) continue;
      const contests = bits[1] === "c";
      rows.push([other, inbound
        ? (contests ? "contradicts" : "supports")
        : (contests ? "contradicted by this" : "supported by this")]);
    }
  };
  eat(half[0].slice(4), false);
  eat(half[1], true);
  return rows;
}

/* THE SAME EDGES, COURT-WIDE AND MAP-SHAPED.
   chainAssociations above answers for ONE claim and labels each row by
   direction, because a claim page says "contradicted by this" in prose. A map
   wants the opposite: one canonical row per edge in the {from,to,type,stance}
   shape curation already uses, so mapLayout never has to care which side of the
   overlay a relation came from.

   WHAT THIS COSTS, because it is a new cost CLASS and not a doubling. In live
   mode the map is three queries whatever the docket's size — courtStats, one
   qrender for the whole docket, one FolderTree walk. There is no court-wide
   association read in the realm (ClaimAssociations takes a claimID), so this
   pays TWO queries per drawn claim: 2N, or about a hundred on a fifty-claim
   window. Chunked eight at a time through inChunks, the shape the holdings views
   already use. If that turns out to be felt, the fix is a court-wide read with
   its own row cap, not a bigger chunk size.

   ONLY THE OUT HALF IS KEPT, and that is what makes the result a set rather than
   a doubled list: the realm returns every edge twice, once as `out` on its
   from-claim and once as `in` on its to-claim. Reading both halves of every
   claim would draw every line on top of itself. `of:` versus `by:` on
   ClaimSupersedes is the same argument — `by:` is the reverse view of an edge
   some other claim's `of:` already reported. */
async function chainMapRelations(slug, ids){
  if(!isLive() || !ids || !ids.length) return [];
  const per = await inChunks(ids, 8, async id => {
    const [raw, sup] = await Promise.all([
      one(`ClaimAssociations(${gstr(slug)},${id})`).then(unesc).catch(()=>null),
      one(`ClaimSupersedes(${gstr(slug)},${id})`).then(unesc).catch(()=>null),
    ]);
    const out = [];
    if(typeof raw === "string" && raw.indexOf("out:") === 0){
      for(const part of raw.split(";in:")[0].slice(4).split(",")){
        const bits = part.split(":");
        if(bits.length !== 2) continue;
        const to = parseInt(bits[0], 10);
        if(!Number.isInteger(to) || to < 1) continue;
        out.push({from:id, to, type:"bears",
                  stance: bits[1] === "c" ? "contradicts" : "supports", chain:true});
      }
    }
    if(typeof sup === "string" && sup.indexOf("of:") === 0){
      const of = parseInt(sup.split(";by:")[0].slice(3), 10);
      if(Number.isInteger(of) && of > 0) out.push({from:id, to:of, type:"supersedes", chain:true});
    }
    return out;
  });
  return per.flat();
}

/* One row per (from, to, type), CHAIN FIRST. The chain wins a tie because it is
   the record: a curation file that still carries an edge the moderators have
   since filed should not draw a second line beside the real one. Curation keeps
   everything the chain cannot hold — claim-to-claim containment above all. */
function mergeRelations(chainRels, curRels){
  const seen = new Set(), out = [];
  for(const r of (chainRels||[]).concat(curRels||[])){
    const k = r.from+">"+r.to+":"+r.type;
    if(seen.has(k)) continue;
    seen.add(k);
    out.push(r);
  }
  return out;
}

function curationFor(slug){
  const rawS = store.get(curKey(slug));
  if(rawS){
    try{
      const {cur} = cleanCuration(JSON.parse(rawS), slug, null);
      if(cur) return {desc:cur.desc, folders:cur.folders, relations:cur.relations, source:"local"};
    }catch(_){}
  }
  if(CFG.mode==="demo"){
    const c=demoCourt(slug);
    if(c) return {desc:c.desc||"", folders:c.folders||[], relations:(DEMO.relations&&DEMO.relations[slug])||[], source:"sample"};
  }
  return null;
}
const CUR_LABEL = "your local curation — held in this browser, not on any chain";
/* ids the current chain/dataset cannot hold are held out of every rendered
   folder (counts included) — the import warned about them already */
function curFilterFolders(folders, validSet){
  return (folders||[]).map(f=>({name:f.name,
    // img travels: this rebuild is a claim-id filter, and a folder's picture is
    // not a claim id. Leaving it off was how the map kept the sample's folder
    // covers and the folder PAGE lost them — the two surfaces read the same
    // tree through different filters.
    img:f.img,
    claims:(f.claims||[]).filter(id=>validSet.has(id)),
    folders:curFilterFolders(f.folders, validSet)}));
}
function curValidSet(slug, count){
  if(!isLive()){ const c=demoCourt(slug); return new Set(c? c.claims:[]); }
  const n=count||0, set=new Set(); for(let i=1;i<=n;i++) set.add(i); return set;
}

/* ---------------- live on-chain folders (D1) ----------------
   The realm stores folders (moderator curation, zero economic weight) and
   exposes FolderCount/FolderName/FolderItems. Live courts read them here —
   the flat chain shape enters the SAME folders array every surface already
   renders. Folder ids are contiguous 1..Count (the realm has no delete op —
   load-bearing, documented in the realm wishlist). FolderName returns a
   "[purged:CODE]" tombstone for purged folders: rendered escaped verbatim,
   never styled from the prefix (user text could spoof it). No desc read
   exists (stored but unreadable — wishlisted). */
const CHAIN_FOLDER_CAP = 100;
async function chainFolders(slug){
  const s2=gstr(slug);
  /* THE COUNT AND THE SHAPE TOGETHER. FolderTree does not need the count — it
     answers for the whole court either way — so asking for one and then the
     other put two round trips in a row before a single folder name was even
     requested. Measured on kourt.xyz: FolderCount left at 960ms, FolderTree at
     1020ms, the names at 1140ms, and the page painted at 1484ms.
     The count still decides whether there is anything to draw; it just no longer
     decides WHEN the tree is asked for. */
  const [n, treeRaw] = await Promise.all([
    one(`FolderCount(${s2})`).catch(()=>null),
    one(`FolderTree(${s2})`).then(unesc).catch(()=>null),
  ]);
  if(n==null) return null;                 // the read itself failed
  if(n<1) return {folders:[], count:0, capped:false};
  const F = Math.min(n, CHAIN_FOLDER_CAP);
  // THE SHAPE IN ONE READ. FolderTree answers "id:parent:flags" per folder, so
  // the parent, the retired bit and the purged bit cost one round trip for the
  // whole court instead of three per folder — 300 at the cap. Names and items
  // still come per folder, because those are user text and only the folders
  // actually drawn need them.
  //
  // Falls back to a flat list when the read is absent: a realm deployed before
  // FolderTree existed answers nothing, and a flat tree is what the overlay drew
  // for that realm anyway. The feature degrades to the old behaviour rather than
  // to an error.
  const shape = new Map();
  if(typeof treeRaw === "string" && treeRaw){
    for(const row of treeRaw.split(",")){
      const bits = row.split(":");
      if(bits.length !== 3) continue;
      const id = parseInt(bits[0],10), parent = parseInt(bits[1],10);
      if(!Number.isInteger(id) || !Number.isInteger(parent)) continue;
      shape.set(id, {parent, retired: bits[2].includes("r"), purged: bits[2].includes("p"),
                     hasImage: bits[2].includes("i")});
    }
  }
  // ROW ORDER IS THE CURATOR'S ORDER. FolderTree emits siblings in the order
  // OrderFolders placed them, and a Map keeps insertion order — so walking
  // 1..F here would parse that order out of the read and then throw it away,
  // redrawing every court in id order. The realm can express a sequence now;
  // this is the half that shows it.
  const fids=[];
  const take = i => {
    const sh = shape.get(i);
    // A RETIRED FOLDER IS SKIPPED, NOT DRAWN GREY. The realm keeps the row so
    // ids stay contiguous for exactly this walk; it is struck from the tree, so
    // the tree does not show it.
    if(sh && sh.retired) return;
    fids.push(i);
  };
  if(shape.size){
    for(const id of shape.keys()) if(id>=1 && id<=F) take(id);
    // Anything the tree did not name — a row that failed to parse, or a realm
    // whose count and tree disagree — is still drawn, after the ordered ones.
    // Dropping it would make a malformed row invisible rather than merely last.
    for(let i=1;i<=F;i++) if(!shape.has(i)) take(i);
  } else {
    // No tree read at all: a realm deployed before FolderTree. Same walk as ever.
    for(let i=1;i<=F;i++) take(i);
  }
  const folders = await inChunks(fids, 6, async fid=>{
    try{
      const sh0 = shape.get(fid);
      // A FOLDER'S ONE PICTURE, read only where the tree says there is one. The
      // "i" flag exists so this is not a third round trip per folder — a hundred
      // at the cap for a field most folders never set. The read failing takes
      // the picture and not the folder: the name and the claims are the page.
      const [name, itemsRaw, imgRaw] = await Promise.all([
        one(`FolderName(${s2},${fid})`),
        tup(`FolderItems(${s2},${fid})`).then(t=>t[0]),
        sh0 && sh0.hasImage ? one(`FolderImage(${s2},${fid})`).then(unesc).catch(()=>null) : null]);
      // ids: prefer per-element "(N uint64)" tokens (their 64s must not leak);
      // fall back to bare digits with any type token stripped first
      const rawS = String(itemsRaw);
      const el = [...rawS.matchAll(/\((\d+)\s+uint64\)/g)].map(m2=>Number(m2[1]));
      const ids = el.length? el : ((rawS.replace(/\[\]uint64|uint64/g,"").match(/\d+/g)||[]).map(Number));
      const sh = shape.get(fid);
      // ARCHIVE-ONLY, like a claim node's thumbnail and for the same reason
      // (media.js mediaSrc): a map draw is fifty boxes at once, and a
      // filer-chosen mirror would send every reader's address wherever the
      // filer liked. mediaNodeThumb is what enforces that, so it is called here
      // rather than the src being assembled by hand.
      const img = (imgRaw && typeof mediaNodeThumb === "function")
        ? mediaNodeThumb(mediaParse(imgRaw), siteHost()) : "";
      return {name:String(name), claims:ids, folders:[], fid, img,
              parent: sh? sh.parent : 0, path:String(fid), chain:true};
    }catch(_){ return {name:"read failed — reload to retry", claims:[], folders:[], fid, path:String(fid), chain:true, failed:true}; }
  });
  return {folders: nestChainFolders(folders), count:n, capped:n>CHAIN_FOLDER_CAP};
}

/* Hang each folder under its parent. The realm caps depth at 4 and refuses
   cycles, but this walk does not trust that — a client that hangs on malformed
   state is a client that a bad read can wedge, and the cost of not trusting it
   is one Set. A folder whose parent was skipped (retired) or never read (past
   CHAIN_FOLDER_CAP) stays at the root rather than disappearing. */
function nestChainFolders(flat){
  const byId = new Map(flat.map(f=>[f.fid, f]));
  const roots = [];
  for(const f of flat){
    const p = f.parent && byId.get(f.parent);
    if(!p || p === f){ roots.push(f); continue; }
    // refuse to descend into a loop: walk up, and root the folder if we meet it
    let up = p, hops = 0, loop = false;
    while(up && hops++ < 8){ if(up === f){ loop = true; break; } up = byId.get(up.parent); }
    if(loop){ roots.push(f); continue; }
    p.folders.push(f);
  }
  return roots;
}
/* one source, labeled: local curation ?? chain (live) ?? sample (demo) ?? none.
   Never merged — local enforces one-folder-per-claim, the chain allows a claim
   to sit in several folders; a merged tree has no honest caption. (This used to
   say the chain "is flat" as the second reason. It nests now — parent ids, four
   deep, read in one call by FolderTree — so that half of the sentence had become
   untrue while the conclusion it supported stayed right.) */
function foldersFor(slug, chainF){
  const cur = curationFor(slug);
  if(cur && cur.source==="local") return cur;
  if(isLive() && chainF && chainF.folders.length)
    return {desc:"", folders:chainF.folders, relations:[], source:"chain", capped:chainF.capped, count:chainF.count};
  return cur; // demo sample, or null
}

/* ============================ the map ================================
   RADIAL, and the previous layout is why. That one drew folders as nested BOXES
   with claims as rows inside them, which is an org chart: it reads as a
   hierarchy of rectangles, the court itself appears nowhere, and every relation
   is routed through channel lanes and a horizontal bus so no line ever crosses
   anything. Legible, and wrong about the subject — a docket is a court with
   structure hanging off it, not a table of contents.

   So: the COURT is one node at the centre, folders sit around it, a folder's
   claims sit around the folder, and an association is a direct chord between two
   claims rather than a detour around the furniture.

   OVERLAP-FREE BY CONSTRUCTION, still, which is the whole reason the angles are
   solved rather than eyeballed:

     * every node is CENTRED in an angular wedge, and wedges are disjoint —
       siblings partition their parent's, and a parent's is at least the sum of
       its children's;
     * a wedge of angle a at radius r spans a chord of 2r·sin(a/2), and each node
       asks for the angle that makes that chord cover its own DIAGONAL. The
       diagonal is the conservative bound: an axis-aligned rect's tangential
       extent is w|sin θ| + h|cos θ|, never more than √(w²+h²);
     * rings are spaced by the two rings' widest node plus a clearance, so nodes
       at adjacent depths cannot meet either;
     * a containment spoke joins ADJACENT rings only, so it passes through no
       ring that could hold a third node.

   The one thing NOT guaranteed is a chord missing every node it does not end on.
   A direct line between two claims cannot promise that, and pretending
   otherwise is what produced the bus in the first place. Chords are drawn UNDER
   the nodes so a crossing reads as passing behind. map_test.js verifies
   everything above geometrically and exempts exactly that.

   Deterministic: pure arithmetic and a two-pass solve, same input same bytes. No
   stake sizing, no amounts anywhere — a node is an id, a phase, and the verbatim
   sentence (§7.4). */
const MAPK = {
  // Three sizes, because this map is about structure: a folder needs its name, a
  // claim needs a gist, the court needs to read as the thing the rest hangs off.
  // The claim box is narrower than the old grid's 240 — at map zoom a title is a
  // gist, and the claim page holds the sentence.
  // A claim box is as tall as its own sentence needs. It was a fixed 176x52 for
  // every claim, which cut every title at two short lines and spent the same
  // space on "Another" as on a forty-word finding — the boxes were sized to the
  // grid the layout used to be.
  // WIDTH AND THE LINE CAP ARE ONE KNOB, and measuring width alone found the
  // wrong answer. This note used to say 230 was the knee of the curve, from a
  // sweep of width at a fixed four-line cap: 206 cut 12 of 19 titles, 230 cut 5,
  // 250 cut 4 for another eight per cent of drawing. Every number was right and
  // the conclusion was still wrong, because a NARROWER box allowed another line
  // fits more of the title in LESS circumference. A node costs its ring
  // w|sin t| + h|cos t|, so trading 24px of width for 28px of height is nearly
  // free there, while the width it gives back comes off every ring.
  // The covid docket's titles run 70 to 139 characters, median 107. Rendered and
  // counted over the pair rather than over width alone:
  //
  //     w=230 cap=4    5 of 19 cut, 102 chars, graph 1842x1844, mean r 776
  //     w=182 cap=6    3 of 19 cut, 104 chars, graph 1588x1623, mean r 690
  //     w=194 cap=6    2 of 19 cut, 105 chars, graph 1652x1666, mean r 713
  //     w=206 cap=6    0 of 19 cut, 107 chars, graph 1728x1737, mean r 743  <--
  //     w=218 cap=5    1 of 19 cut, 106 chars, graph 1786x1793, mean r 759
  //
  // 206x6 is not a compromise between the owner's two complaints — it beats the
  // old setting on both. Every title on this docket shows whole where five were
  // cut, and the drawing is six per cent smaller with every claim 33px nearer
  // the court. Below 206 the graph keeps shrinking and titles start being cut
  // again, which is the trade the old note described; it just begins further in
  // than a four-line box could ever reach.
  // WIDENED TO 230 BY THE OWNER, which the sweep above already priced: at cap 6
  // it cuts no more titles than 206 does, and the cost is paid in ring
  // circumference rather than in words. It is also what the tile strip is
  // measured from — see mapTileSize.
  node:  { titles:{w:230,h:52}, ids:{w:64,h:28} },  // w, and h as a floor
  head:22, lineH:14,   // the id line, and each title line under it
  /* THE EXHIBITS A CLAIM CARRIES, UNDER ITS TITLE. They used to be one badge in
     the top-right corner, which said "there is evidence here" and nothing about
     what or how much. A strip under the title says both, and sits where a
     reader is already looking after they have read the sentence.
     Bounded at four — the same four the claim page's grid stops at, and the
     same four mediaNodeTiles resolves — so a node's height is set by its
     sentence, not by how many pictures somebody filed.
     THE SIZE IS NOT A CONSTANT: mapTileSize divides the node's own text width by
     that four, so a full strip spans the box edge to edge and a tile is as big
     as the node can make it. A fixed 28 left 93 of 214 unused and read as a row
     of stamps under the sentence rather than as the evidence. */
  tile: {gap:3, pad:6, max:4},
  fnode: { titles:{w:164,h:44}, ids:{w:112,h:28} }, // a folder; w is a fallback
  // The range mapFolderSize searches, in 12px steps. The floor is a box that
  // still reads as a container next to a 206 claim; the ceiling stays under the
  // court's 260 so the court is still the widest node on the map.
  fnodeW: [116, 236],
  // THE COURT IS THE BIGGEST THING ON THE MAP, which it was not: at 190x54 it
  // was smaller than the 206x86 claim boxes around it, so the node the whole
  // drawing is built around read as one more box that happened to be blue. It is
  // one node and it can afford the room.
  cnode: { titles:{w:260,h:76}, ids:{w:150,h:46} }, // the court, at the centre
  sep:22,          // clearance every pair of nodes keeps, tangentially and radially
  seedR:120,       // the innermost ring's floor, before the fit solve
  margin:36, tpad:8,
  base:-Math.PI/2, // the first wedge opens at twelve o'clock
  // How far a node may sit off its wedge's centre line. WITHOUT THIS a folder
  // with one child draws that child on its own ray, and a chain of them —
  // Origins → Natural spillover → The market cluster → #5, which this docket has
  // six of — renders as a straight thread out from the middle. That is the
  // starburst look, and it is what "not exactly radially" was asking to avoid.
  // Kept inside the wedge's own SLACK so the disjointness proof is untouched: a
  // node that cannot move without leaving its wedge does not move.
  // AND THE SLACK IS MEASURED AT THE WRONG RADIUS, which is worth writing down
  // even though nothing yet goes visibly wrong. `sweep` computes each node's
  // angular width from its need at the radius the FIT solved, and allows a twist
  // of half whatever is left over. The compaction then pulls that radius IN,
  // which widens the node's angular footprint and eats the slack the twist was
  // already spending — so a node on the end of a ring can finish a fraction of a
  // degree outside its own wedge. Measured at 2.5% of the radius on a 50-claim
  // folder. It does not overlap anything on any fixture, because the neighbour it
  // leans toward is not at the boundary either, and the harness's gap checks
  // would say so if it were. Recording it because it is the reason the two-arc
  // pack holds a group's END kids to tan/span rather than to their true
  // off-centre position: applying the honest bound there and nowhere else would
  // have priced that arc out to pay for a hole it did not dig.
  twist:0.11,
  // maxTitleLines is a CAP, not a height: a box is as tall as its own title
  // needs and no taller, so raising this costs a short claim nothing. It is the
  // other half of the width measurement above — six lines of a 206 box holds 162
  // characters, which covers this docket's longest title at 139.
  // A LITTLE BIGGER, ASKED FOR BY THE OWNER, AND PAID FOR RATHER THAN BORROWED.
  // Raising a size shrinks the wrap budget — floor(inner/(fs*charW)) — and the
  // covid docket had no slack to give: measured live, five of eleven nodes sat
  // on the six-line cap and the longest line was 31 characters, which IS
  // floor(214/(11*0.62)). A bump alone would have dropped that to 28 and cut
  // the titles the sweep in this comment was written to stop cutting.
  // charW paid for it. It used to do two jobs — the fit budget AND the rendered
  // width — and the second is measured now, so it is free to be what its name
  // says: a conservative upper bound on the advance of the faces actually drawn.
  // Measured over the live docket those are 0.531em for a serif title and
  // 0.549 for a sans header, so 0.62 was carrying about 12% of dead margin.
  // At 0.56 the budget is 31 chars/line and 186 over six lines — bit-identical
  // to before the bump, which is the whole point.
  // OVERFLOW IS NOT THE RISK HERE. textLength is Math.min(est, room), so a line
  // can never be drawn wider than its box; an underestimate crowds the letters,
  // it does not spill them.
  fs:{header:13, id:13, title:12, court:16}, charW:0.56, maxTitleLines:6,
  // THE SMALLEST A TITLE IS ALLOWED TO LAND, in CSS pixels, after the viewBox
  // scale. Three separate zoom decisions aim at it — the opening view, centring
  // on a node, and fitting a folder — and all three used to spell it as a bare
  // 9 at their own call site. Nine is not a reading size: it is a little above
  // the 7px line where lod() gives up and hides the titles outright, so the
  // opening view of a large court was legally-readable text nobody could read.
  // Raised to 13 by the owner, reported as "larger nodes too, i can't read".
  // It is a floor and not a target: Math.max keeps a reader's own zoom when
  // they are already closer in.
  readPx:13,
  /* HOW FAST THE WHEEL ZOOMS, as a per-delta-unit multiplier. Named because the
     number is meaningless on its own: what a reader feels is the ratio over one
     wheel NOTCH, which browsers report as deltaY 100.
         1.0015  one notch = 1.16x   <- was this, and asked to be more
         1.0030  one notch = 1.35x   <- is this
     The old rate put a notch at well under one press of the +/- buttons, which
     step 1.25 — so spinning the wheel felt like it was doing less than clicking,
     and the natural response is to spin it harder. A notch is now a little more
     than a press.
     It stays EXPONENTIAL in deltaY, which is what makes a trackpad's stream of
     small deltas compose into the same total as one mouse notch of the same
     distance: pow(r,a)*pow(r,b) == pow(r,a+b). A linear rate would make the two
     input devices disagree. */
  wheelRate:1.003,
  // AND A BIGGER ONE FOR THE NODE YOU JUST PICKED. readPx above is the floor for
  // a view you did not ask for — the map opening, a folder being fitted — where
  // 13px is a size you can scan. Clicking a node is a request to READ it, and
  // that is a different number: reported as "spring bigger. still can[']t read"
  // while the selected title measured 19px, because a transform on the box can
  // only ever multiply a 12-unit font by 1.35 and the shortfall is in the CAMERA.
  // So selection zooms until the title is this tall, and the spring is then a
  // multiplier on top of an already-readable size rather than a substitute for
  // one. Measured on the live covid docket, that lands the picked title near
  // 30px against 19 before.
  readSelPx:22,
  // HOW FAR IN THE ZOOM GOES. Doubled from 8 on the owner's ask for "2x more".
  // The slider is log2 of this, so its max attribute is derived rather than
  // written down twice — a slider that stops at 3 while the clamp allows 4 is a
  // control that lies about its own range, and there is no way to notice by
  // looking at either number alone.
  zMax:16,
};
/* maxLines is a PARAMETER because the box that holds the text decides it. In ids
   mode a folder node is 26px tall and two lines of 12px text do not fit — the
   second one lands outside its own box, which is the one thing check B exists to
   catch, and it caught it. */
function mapWrapTitle(title, innerW, fs, maxLines){
  const size = fs||MAPK.fs.title, cap = Math.max(1, maxLines||MAPK.maxTitleLines);
  const budget = Math.floor(innerW/(size*MAPK.charW));
  const words = String(title).split(/\s+/); const lines=[]; let cur="";
  for(const w of words){
    const t = cur? cur+" "+w : w;
    if(t.length<=budget){ cur=t; continue; }
    if(cur) lines.push(cur);
    // BREAK WHEN THE CAP IS FULL, not when its last line is STARTED. The old
    // test was `lines.length+1>=cap`, which fired the moment the final line
    // began — so that line kept exactly the one word that overflowed the line
    // before it, and the ellipsis rule below then chopped it. Every two-line
    // label in this map read like "Public health and / its…" or "SARS-CoV-2
    // entered the / human…": one word and a stub, on both the folder boxes and
    // every claim title. It has been that way since the layout was first
    // written, and nothing pinned it, because the wrap has no owner among the
    // harnesses — geometry checks ask where the text sits, never what it says.
    if(lines.length>=cap){ cur=""; break; }
    cur=w.slice(0,budget);
  }
  if(cur && lines.length<cap) lines.push(cur);
  if(lines.join(" ").length < String(title).length && lines.length)
    lines[lines.length-1] = lines[lines.length-1].slice(0, Math.max(1,budget-1))+"…";
  return lines;
}
/* The box a node needs. Claims carry their own, measured from their title when
   the tree is built; folders and the court keep a fixed one, because a folder
   name is short and the court appears once. */
/* THE SIZE THE NODE WAS BUILT WITH, and that is now the whole of it. mapTree
   gives every node its own — a claim from its title, a folder from its label,
   the court from its name — so this is a lookup.
   It used to end with a fallback naming MAPK.node/fnode/cnode directly, which
   was unreachable across every shape tried (six dockets, both modes, including
   empty courts and empty folders) and, worse, WRONG if it had ever run: those
   are the BASE sizes, so a claim would have come back at the 52px floor rather
   than the height its sentence needs, and a folder at a fixed 164 rather than
   the width its label needs. A second statement of a rule, kept for safety,
   that had quietly stopped agreeing with the first. Nothing here needs it: if a
   node ever reaches this without a size the drawing fails loudly on the spot,
   which is the honest outcome and how it would be found. */
function mapSize(n){ return n.size; }
/* A FOLDER IS AS WIDE AS ITS OWN LABEL, which is the other half of "nodes are
   not sized to their text". Claims got this and folders did not: every one was
   164 wide whether it said "Fauci · 9" or "Gain-of-function funding · 3". Too
   wide is not free — a folder's width is what its ring has to make room for, and
   it is charged to the whole ring — and too narrow costs the label its count,
   which is the one number a folder box is carrying.
   Two lines, and the width is the smallest that holds the label whole at that
   cap. Capped below the court's own width, because the court reads as the anchor
   by being the widest thing on the map and a long folder name is not a reason to
   take that away from it. */
/* DID THE WRAP ACTUALLY HOLD THE TEXT, and "is it still as long" cannot answer
   that. mapWrapTitle appends an ellipsis when it truncates, and that character
   puts back very nearly the length it just removed — so the obvious test,
   `lines.join(" ").length >= text.length`, reports a cut label as a whole one.
   It read true for "Gain-of-functio funding · 3…" against "Gain-of-function
   funding · 3", both 28 characters. Latent for as long as folder boxes were a
   fixed 164 and every label happened to fit; it surfaced the moment boxes were
   allowed to be narrower, which is the usual way a constant stops covering. */
function mapWrapHolds(lines, text){
  const t = lines.join(" ");
  return t.indexOf("…") < 0 && t.length >= String(text).length;
}
/* HOW MANY LINES A BOX HOLDS, AND THE HEIGHT THAT HOLDS N — one pair, so the
   thing that SIZES a box and the thing that DRAWS in it cannot disagree. They
   were three separate statements of the same rule: mapSvg derived the cap from
   the box, mapFolderSize hardcoded 2 because that is what a 44px folder box
   happens to allow, and mapCourtSize wrote the inverse out longhand. All three
   agreed, by coincidence rather than construction. Raise fnode's height to 60 and
   the renderer draws three lines while the sizer still sizes for two — measured,
   it widens "Gain-of-function funding · 3" from 116 to 140 for nothing, and every
   ring pays for it. The two are inverses: mapFitLines(mapFitHeight(n)) === n. */
// Declarations, not const arrows: the harnesses eval slices of this file, and a
// const does not escape an eval's scope while a function declaration does. It is
// why every other map function is written this way and why the tests rewrite
// `const MAPK` to `var MAPK` on the way in.
function mapFitLines(box, fs){ return Math.max(1, Math.floor((box.h - 6)/(fs + 2))); }
function mapFitHeight(lines, fs){ return lines*(fs + 2) + 6; }
/* THE COURT'S NAME FITS BY GROWING DOWNWARD, AND THE RINGS DO NOT PAY FOR IT.
   The court sits at the origin, so what ring 1 has to clear is max(w, h) — its
   longer side, because a child may lie in any direction. While the height stays
   under the width, growing it moves nothing: ring 1 is where it was.
   Which makes the ids-mode truncation free to fix. "COVID-19 Origins & Response
   Court" is 32 characters and a 150-wide court box holds about 15 to a line over
   two lines, so the zoomed-out map called it "COVID-19 Origins &..." — the one
   node the whole drawing hangs off, cut off. Three lines hold it, and 150x54 has
   the same longest side as 150x46. Titles mode was never affected: 260 wide takes
   the name in two lines inside the 76 it already had. */
function mapCourtSize(name, mode){
  const base = MAPK.cnode[mode], fs = MAPK.fs.court;
  const lines = mapWrapTitle(String(name || ""), base.w - 2*MAPK.tpad, fs, 4);
  // wrapMid derives its own cap from the box height, so the height IS the cap.
  return {w: base.w, h: Math.max(base.h, Math.min(base.w, mapFitHeight(lines.length, fs)))};
}
function mapFolderSize(name, count, mode){
  const base = MAPK.fnode[mode];
  if(mode !== "titles") return base;
  const label = count != null ? `${name} · ${count}` : String(name || "");
  const holds = w => {
    const lines = mapWrapTitle(label, w - 2*MAPK.tpad, MAPK.fs.header,
                                mapFitLines(base, MAPK.fs.header));
    // The same two failures wrapFit weighs at draw time: an ellipsis, or a last
    // line carrying the "· 3" and no word — which reads as a broken label.
    return mapWrapHolds(lines, label)
        && !(lines.length > 1 && !/[A-Za-z]/.test(lines[lines.length-1]));
  };
  for(let w = MAPK.fnodeW[0]; w <= MAPK.fnodeW[1]; w += 12)
    if(holds(w)) return {w, h: base.h};
  return {w: MAPK.fnodeW[1], h: base.h};   // nothing holds it; wrapFit will trim
}
/* THE TILES A NODE WILL DRAW, asked the same way by the two places that have to
   agree about them: mapClaimSize reserves the row, mapSvg draws into it. Two
   implementations of "which exhibits does this node show" is how a box comes out
   one row shorter than what is inside it — and the layout would still report the
   map collision-free, because it measured the box it decided on.
   Archive-only, because mediaNodeTiles is what decides: a map draw is fifty
   boxes at once, and a filer-chosen mirror would send every reader's address
   wherever the filer liked. */
function mapNodeTiles(claim){
  if(typeof mediaNodeTiles !== "function" || !claim || !claim.media) return [];
  return mediaNodeTiles(claim.media, siteHost());
}
/* A TILE IS AS BIG AS THE NODE CAN MAKE IT: the text width, less the gaps,
   divided by the cap. A full strip therefore spans the box edge to edge, and a
   claim with one exhibit shows that one exhibit at the same size — the strip is
   left-aligned, not stretched, because a lone tile grown to fill 214px would be
   a picture pretending to be four.
   Derived rather than pinned so it stays right if the node width moves again;
   the last two times it moved, a constant here would have quietly stopped

function mapTileSize(w){
  const n = MAPK.tile.max;

}
function mapClaimSize(title, mode, tiles){
  const base = MAPK.node[mode];
  if(mode!=="titles") return base;
  const lines = mapWrapTitle(String(title||""), base.w-2*MAPK.tpad, MAPK.fs.title, MAPK.maxTitleLines);
  // The strip is one row whatever it holds — mediaNodeTiles caps it — so a claim
  // with four exhibits is no taller than a claim with one.
  const strip = tiles? mapTileSize(base.w) + MAPK.tile.pad : 0;
  return {w:base.w, h:Math.max(base.h, MAPK.head + lines.length*MAPK.lineH + MAPK.tpad + strip)};

/* Where the centre-to-centre line leaves a's box: half-extent in each axis,
   whichever side it reaches first. Written out because a chord that starts at a
   centre is drawn under its own node and appears to start nowhere. */

   cross-cutting folder — one whose claims all live elsewhere by evidence type —
   would otherwise render as an empty box. `alsoIn` collects those memberships so
   the layout can draw the lighter "also filed here" line to the node's single
   drawing. Claims this dataset does not carry are dropped rather than drawn as a
   hole. */

    // curation folder, which has no description to ask for.

  const maxX=Math.max(...all.map(b=>b.x+b.w)), maxY=Math.max(...all.map(b=>b.y+b.h));
  const ox=Math.round(K.margin-minX), oy=Math.round(K.margin-minY);
  const mv=b=>Object.assign({}, b, {x:Math.round((b.x+ox)*10)/10, y:Math.round((b.y+oy)*10)/10,

    folders: folders.map(mv),
    nodes: nodes.map(mv),
    spokes: spokes.map(s=>({kind:s.kind, a:s.from._key, b:s.to._key,

      .map(([x,y])=>[Math.round((x+ox)*10)/10, Math.round((y+oy)*10)/10])})),

    // fact: the FARTHEST group at each depth. Depth 1 is still exact — every
    // depth-1 node is a child of the court, which is one group.
    rings:depths.map(g=>Math.round(Math.max(...g.map(n=>n._r)))),

}

    const tag=`<rect class="mfold${f.pseudo?" pseudo":""}" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="4" data-fid="${i}"/>`
      + face + wrapFit(f.name, f.count, f, K.fs.header, "mhdr-t", "h"+i);
    if(!f.pseudo && f.path!=null && data.linkFolders)
      out.push(`<a class="mfold-a" data-fid="${i}" href="#/c/${esc(slug)}/f/${f.path}">${tag}${tip}</a>`);
    /* Not a link, so it needs a group of its own — an SVG <title> describes the
       element it is a child of, and loose in the root it would describe the map.
       IT CARRIES .mfold-a ANYWAY, because that class is what the click handler
       selects on, and having a page to link to is not the same question as being
       able to click a box. The map's own bucket is drawn whenever some claims are
       filed and some are not, mapFolderCard has a branch written for it — "the
       map's own bucket — the court has filed no folder for these" — and that
       branch could never run, because the only folder the handler could see was

    const cl=data.claims[n.id]; if(!cl) continue;

       row's position depends on how many lines the title took.
       It replaced a single thumbnail in the top-right corner. The badge said
       "there is evidence here" and nothing else — not what, not how many — and
       it said it in the one corner a reader is not looking at, since the eye
       goes to the title first. Under the sentence is where a reader arrives
       next, and a strip answers both questions at once.

       photograph and make the one thing every node must say unreadable. */

         the dot already carries — while the title started underneath it. The id

         actually decided.

         `.mapsvg.far .mtitle{display:none}` hides titles when the map is zoomed
         out. Folded into the title it would vanish with them and a far view would
         be unlabelled boxes; kept apart it survives, and so does the verdict —
         which is a better zoomed-out reading than "#8 · settled" ever was.
         It is still WRAPPED as one string, so the break points account for the id
         and no word is lost between the two elements. */
      const idTxt=`#${n.id}`;
      const lines=mapWrapTitle(`${idTxt} ${cl.title}`, n.w-2*K.tpad, K.fs.title, K.maxTitleLines);
      const rest=(lines[0]||idTxt).slice(idTxt.length).replace(/^ /,"");
      out.push(label(idTxt, n, K.fs.title, n.y+16, "mid", "c"+n.id));
      if(rest) out.push(label(rest, n, K.fs.title, n.y+16, "mtitle", "c"+n.id,
                              est(idTxt+" ", K.fs.title)));
      lines.slice(1).forEach((ln,i)=>
        out.push(label(ln, n, K.fs.title, n.y+16+(i+1)*K.lineH, "mtitle", "c"+n.id)));
      /* The strip, between the last line of the title and the verdict row. Its
         top is measured from the LAST BASELINE rather than from the bottom of
         the box, because mapClaimSize built the box by adding a row to the title
         — measuring from the other end would drift by whatever the box's floor
         height contributed on a short title. */
      let vy=n.y+16+lines.length*K.lineH;
      if(tiles.length){
        const ts=mapTileSize(n.w), tg=K.tile.gap;
        const ty=n.y+16+(lines.length-1)*K.lineH+K.tile.pad;
        tiles.forEach((src,ti)=>{
          const tx=n.x+K.tpad+ti*(ts+tg);
          out.push(`<clipPath id="mth${n.id}_${ti}"><rect x="${tx}" y="${ty}" width="${ts}" height="${ts}" rx="2"/></clipPath>`);
          out.push(`<image class="mthumb" href="${esc(src)}" x="${tx}" y="${ty}" width="${ts}" height="${ts}"`
            + ` clip-path="url(#mth${n.id}_${ti})" preserveAspectRatio="xMidYMid slice"`
            // Decoration over a link: it must never eat the click that opens the
            // claim, and it must not be announced to a screen reader that
            // already has the node's title — the exhibits are on the claim page,
            // with the captions that say what they are.
            + ` pointer-events="none" aria-hidden="true" referrerpolicy="no-referrer"/>`);
        });
        vy = ty + ts + K.lineH;
      }
      /* The dot rides the verdict row rather than the top-right corner: it is the
         verdict's colour now, so it belongs beside the verdict, and moving it
         hands the whole first line back to the title instead of reserving 14px of
         it for a mark that sat on a different subject. */
      out.push(dot(n.x+K.tpad+4, vy-4));
      out.push(rlabel(pc.side? pc.short+": "+pc.side : pc.short,
                      n, K.fs.id, vy, "mverdict", "c"+n.id));
    } else {
      /* IN IDS MODE THE ID IS THE WHOLE LABEL, and asking for the phase as well
         bought an ellipsis and nothing else. An ids box is 64 wide, less 14 for
         the dot and 16 for padding — about six characters — and "#8 · settled" is
         twelve, so every claim on the zoomed-out map read "#8 …". The phase it
         stood for is on the node as the dot's colour, and in full in the tooltip. */
      out.push(dot(n.x+n.w-12, n.y+14));
      out.push(label(`#${n.id}`, {x:n.x, w:n.w-14}, K.fs.id, n.y+16, "", "c"+n.id));
    }
    /* THE TOOLTIP CARRIES THE SIDE TOO, and in ids mode it is the only thing that
       does. An ids box fits four characters — the id and nothing else — and the
       dot encodes phase, never the decision, so a settled-NO node and a
       settled-YES node are identical there until you hover. */
    out.push(`<title>#${n.id} · ${esc(pc.short)}${pc.side? " "+esc(pc.side):""} — ${esc(cl.title)}</title></a>`);
  }
  out.push(`</svg>`);
  return out.join("\n");
}

/* The join panel is a receipt printed before purchase: what you send, what the

function joinPanel(slug, s){

        <div class="actions" style="margin-top:10px" id="buyactions">${buyActionsHtml(slug,null)}</div>`;

    BUYCTX = {slug, minted, supply:s.supply, price:s.price};

    const amtVal = form.amt !== "" ? form.amt : "100";
    const amtMicro = parseGnot(amtVal);
    const q = BUYQ = curveQuote(minted, s.supply, amtMicro==null? 100000000n : amtMicro);
    body = `<div class="ticket buyrcpt compact">
          <!-- "You burn", not "You send". Nothing is sent: the curve is one way,
               the GNOT is destroyed, and no address ends up holding it. "Send"
               implies a recipient and a possible way back, and this panel's own
               acknowledgement one line down says the opposite. -->
          <div class="line"><span class="l"><label for="buyamt">You burn</label></span>
            <span class="r tnum"><input id="buyamt" type="text" inputmode="decimal" value="${esc(amtVal)}" autocomplete="off" aria-describedby="buynote"> GNOT
              <small id="buyugnot">${amtMicro==null? "= not a GNOT amount" : "= "+fmtN(Number(amtMicro))+" µGNOT"}</small></span></div>
          <div id="buyrows" aria-live="polite">${buyRowsHtml(q, s.price, slug)}</div>
        </div>
        <label class="ack small"><input type="checkbox" id="buyack"${ackAttr}> I understand ${sym} cannot be sold back to the court.</label>
        <div class="actions" style="margin-top:10px" id="buyactions">${buyActionsHtml(slug,q)}</div>
        <div class="ticket buyrcpt" style="margin-top:10px" id="buyrows2" aria-live="polite">${buyRowsHtml(q, s.price, slug, true)}</div>
        <p id="buynote" class="small muted" style="margin:10px 0 0">${isLive()
          ? "Quoted from the chain just now — if someone buys first you'll receive fewer units than shown, never more; the transaction's own result is final."
          : "Sample data — computed from the demo court, no chain involved."}</p>`;
  }

     permanence, then the receipt, then a note on quoting, then the tick, and the
     Buy button came fourth — far enough down that a reader arriving at ?at=join
     had to scroll to find the thing they came for. The tick immediately above
     the button carries the one fact that must be read before pressing; the rest
     is true and belongs under it. */

     there's no indication ultimately". The panel updated every CHAIN figure --
     supply, price, the voice share a further buy would get -- and said nothing
     about the reader's own position, so the one question they had after pressing
     the button ("did it work, what do I own?") was answered nowhere on the page

     require knowing to look.

  return `<div class="panel" id="join" tabindex="-1"><h4>Join this court</h4>
        <div class="kv" id="joinheld" hidden><div class="k">You hold</div><div class="v tnum" id="joinheldv"></div></div>
        ${body}
        <p class="small muted" style="margin:10px 0 0">The only way out is a private buyer, and there may not be one. Treat this as GNOT spent for a voice, not GNOT moved.</p>
       </div>`;

/* THE FIGURES SIT IN THE LEFT COLUMN, not above both. Full width they pushed the
   whole two-column body — and the Join panel heading the right column — 200px
   down the page, so a reader who came to buy met four reference numbers first
   and had to scroll for the button. In the column they are 2x2 and level with
   the docket. */
/* A ZERO REWARD ROW IS NOISE, not information, and the rule is already stated at
   voteLockFigures: a figure that says nothing should print nothing. On a young
   court the reservoir and the senior queue are both 0.00, so two of the four
   tiles were a zero under a sentence of explanation the reader has no use for
   yet. They appear the moment they carry a number. Price and supply always show
   — those are the two a buyer came for. */
/* "width,now,more;epoch:value,..." — the grammar SupplySeries and BurnSeries
   share. Returns null on anything it does not recognise: a court that cannot
   answer draws no chart, the same posture as the per-claim spark. */
function parseSeries(s){
  if(!s) return null;
  const [head, body=""] = String(s).split(";");
  const h = head.split(",");
  if(h.length !== 3) return null;
  const width = +h[0], now = +h[1];
  if(!Number.isFinite(width) || !Number.isFinite(now)) return null;
  const pts = [];
  for(const rec of body.split(",")){
    if(!rec) continue;
    const [e, v] = rec.split(":");
    if(Number.isFinite(+e) && Number.isFinite(+v)) pts.push({e:+e, v:+v});
  }
  return {width, now, more:h[2]==="1", pts};
}
/* A STEP-AFTER path. Both series hold flat between events and jump at one, so
   joining the change points directly would draw a gradual slope that never
   happened. The last segment runs flat to `now`: the absence of a later point
   IS the statement that nothing has changed since. */
function stepPath(ser, X, Y){
  const p = ser.pts;
  let d = `M${X(p[0].e)},${Y(p[0].v)}`;
  for(let i=1;i<p.length;i++) d += ` L${X(p[i].e)},${Y(p[i-1].v)} L${X(p[i].e)},${Y(p[i].v)}`;
  return d + ` L${X(lastEpoch(ser))},${Y(p[p.length-1].v)}`;

function lastEpoch(ser){ return Math.max(ser.now, ser.pts[ser.pts.length-1].e); }

   units differ (ugnot, CC base units, ugnot-per-unit) and one shared scale
   would flatten whichever is smaller into the axis. */
function seriesScales(ser, W, H, P){
  const e0 = ser.pts[0].e;
  // At least one epoch wide, so a lone change point draws a span with two ends
  // instead of collapsing both onto the left edge.
  const eN = Math.max(lastEpoch(ser), e0 + 1);
  const span = eN - e0;
  const max = Math.max(...ser.pts.map(p=>p.v), 1);

/* The cell's own history, drawn as large as the cell already allows.

   the graph still says the same thing without it. */

  const d = new Date((nowUnix - back) * 1000);

  // there, even when it is the current one: a date that sometimes carries one

    courtStats(slug).catch(()=>null),

/* Map interactions: viewBox pan/zoom (one coordinate system), explicit text
   toggle (relayout, center preserved), CSS-only label LOD, hover/focus
   highlighting. Listeners live on the container, surviving innerHTML swaps. */
/* One ClaimMediaPage read per 64 claims, attaching each claim's exhibits to the
   node data the map already has. Sparse ids are fine: the page answers for a RUN
   and a claim that does not exist comes back as an empty entry, so position i
   always means fromID+i and a thumbnail can never land on the wrong node. */
async function fillMapMedia(slug, parsed, claims){
  const ids = parsed.map(c=>c.id).filter(n=>Number.isFinite(n));
  if(!ids.length) return false;
  const lo = Math.min(...ids), hi = Math.max(...ids);
  const PAGE = 64;
  let found = false;
  for(let from=lo; from<=hi; from+=PAGE){
    const n = Math.min(PAGE, hi-from+1);
    const raw = await one(`ClaimMediaPage(${gstr(slug)},${from},${n})`).then(unesc)
      // A realm deployed before media existed has no ClaimMediaPage, and a map
      // that fails whole over an optional field would be the worse bug.
      .catch(()=>null);
    if(raw===null) return found;
    let page; try{ page = JSON.parse(raw); }catch(_){ return found; }
    if(!Array.isArray(page)) return found;
    page.forEach((items, i) => {
      const c = claims[from+i];
      if(c && Array.isArray(items) && items.length){ c.media = items; found = true; }
    });
  }
  return found;
}

function mountMap(slug, data, focusId, focusPath){
  const box = document.getElementById("mapbox"); if(!box) return;
  let mode="titles", L=mapLayout(data,mode);
  /* THE KEY FOLLOWS THE DRAWING. A claim filed in two folders is drawn once and
     gets a muted dashed spoke to the other, which looks like a relation and is
     not one — so it needs a key. It needs it only when there IS one, though: a
     legend entry for a line nobody drew is the same lie in the other direction.
     Asked of the layout rather than recomputed from the data, so it cannot
     disagree with what was drawn; the mode toggle cannot change the answer,
     because membership is not a function of how the labels are rendered. */
  {
    const key = document.getElementById("mlg-also");
    if(key) key.hidden = !L.spokes.some(s => s.kind === "also");
  }
  let fit={w:L.viewBox[2], h:L.viewBox[3]};
  let z=1, cx=fit.w/2, cy=fit.h/2, raf=0, tween=0, tweenFrames=0;
  const svgEl=()=>box.querySelector("svg");
  let far=false;
  function lod(){
    const el=svgEl(); if(!el) return;
    const px = MAPK.fs.title * el.clientWidth/(fit.w/z);
    // hysteresis: enter below 7px, leave above 8.5px — no flicker at the line
    if(far && px>8.5) far=false; else if(!far && px<7) far=true;
    el.classList.toggle("far", far);
  }
  function apply(){
    const el=svgEl(); if(!el) return;
    const w=fit.w/z, h=fit.h/z;
    el.setAttribute("viewBox", `${cx-w/2} ${cy-h/2} ${w} ${h}`);
    const sl=document.getElementById("mz-slider"); if(sl) sl.value=Math.log2(z);
    lod();
  }
  /* EVERY USER-DRIVEN VIEW CHANGE CANCELS A GLIDE, and this is the one place it
     can be done once: drag, wheel, the arrow keys, fit and the zoom buttons all
     land here. A reader who grabs the map mid-flight is overruling it, and a
     glide that kept running would drag the view out from under them. */
  const schedule=()=>{ stopTween(); if(!raf) raf=requestAnimationFrame(()=>{ raf=0; apply(); }); };
  function stopTween(){ if(tween) cancelAnimationFrame(tween); tween=0; }
  /* A GLIDE, NOT A JUMP. centreOn used to assign cx/cy/z and paint the next
     frame, so selecting a node in the outer ring teleported the whole graph and
     the reader lost track of where they had been — the motion IS the explanation
     of what just happened.
     THE ZOOM INTERPOLATES GEOMETRICALLY. Scale reads logarithmically, so a linear
     ramp from 1 to 4 spends most of its time already zoomed in and lands with a
     lurch; z0*(tz/z0)^e keeps the apparent rate even.
     THE FRAME CAP IS NOT DECORATION. A host that runs requestAnimationFrame
     synchronously — the map's own test harness does — would otherwise recurse
     once per iteration until the wall clock ran out, thousands deep. Capped, that
     host completes the glide in 120 nested calls and lands exactly on target; a
     real browser needs about 13 frames and never reaches it. */

      cx=x0+(tx-x0)*e; cy=y0+(ty-y0)*e; z=z0*Math.pow(tz/z0, e);

  function setZ(nz, anchor){
    const el=svgEl(); if(!el) return;
    nz=Math.min(MAPK.zMax, Math.max(0.5, nz));

  };

    ev.preventDefault();

       * a folder lit the claims filed in it and dimmed EVERY edge, so the folder

    if(a){ ev.preventDefault(); select({kind:"claim", id:parseInt(a.dataset.id,10)}); }
    else if(fa){ ev.preventDefault(); select({kind:"folder", fid:parseInt(fa.dataset.fid,10)}); }
    else if(ca){ ev.preventDefault(); select({kind:"court"}); }
    else if(!ev.target.closest(".mapsel")) select(null);
  });
  /* hover: transient, and it must not fight a selection that is already held.
     ALL THREE KINDS, because hover is a preview of what a click will do and a
     preview that covers one of the three teaches the wrong lesson about the
     other two. */
  const hoverKey = t => {
    const a=t.closest(".mnode-a"); if(a) return "c"+a.dataset.id;
    const fa=t.closest(".mfold-a"); if(fa) return "f"+fa.dataset.fid;
    return t.closest(".mcourt-a")? "court" : null;
  };
  box.addEventListener("mouseover", ev=>{ if(sel) return; const k=hoverKey(ev.target); if(k) dimTo(k); });
  box.addEventListener("mouseout", ev=>{ if(sel) return; if(hoverKey(ev.target)) undim(); });
  box.addEventListener("focusin", ev=>{ if(sel) return; const k=hoverKey(ev.target); if(k) dimTo(k); });
  box.addEventListener("focusout", ()=>{ if(!sel) undim(); });
  box.addEventListener("keydown", ev=>{
    const w=fit.w/z, h=fit.h/z;
    if(ev.key==="ArrowLeft"){ cx-=w*0.1; schedule(); ev.preventDefault(); }
    else if(ev.key==="ArrowRight"){ cx+=w*0.1; schedule(); ev.preventDefault(); }
    else if(ev.key==="ArrowUp"){ cy-=h*0.1; schedule(); ev.preventDefault(); }
    else if(ev.key==="ArrowDown"){ cy+=h*0.1; schedule(); ev.preventDefault(); }
    else if(ev.key==="+"||ev.key==="="){ setZ(z*1.25); ev.preventDefault(); }
    else if(ev.key==="-"){ setZ(z/1.25); ev.preventDefault(); }
    else if(ev.key==="0"){ z=1; cx=fit.w/2; cy=fit.h/2; schedule(); ev.preventDefault(); }
    else if(ev.key==="Escape" && sel){ select(null); ev.preventDefault(); }
  });
  const bind=(id,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener("click",fn); };
  bind("mz-in", ()=>setZ(z*1.25));
  bind("mz-out", ()=>setZ(z/1.25));
  bind("mz-fit", ()=>{ z=1; cx=fit.w/2; cy=fit.h/2; schedule(); });
  const slider=document.getElementById("mz-slider");
  if(slider) slider.addEventListener("input", ()=>setZ(Math.pow(2, parseFloat(slider.value))));
  function setMode(m){
    if(m===mode) return;
    const rx=cx/fit.w, ry=cy/fit.h;
    mode=m; L=mapLayout(data,mode); fit={w:L.viewBox[2], h:L.viewBox[3]};
    cx=rx*fit.w; cy=ry*fit.h;   // hold the reader's position across the relayout
    document.getElementById("mt-titles").setAttribute("aria-pressed", String(m==="titles"));
    document.getElementById("mt-ids").setAttribute("aria-pressed", String(m==="ids"));
    put();
  }
  bind("mt-titles", ()=>setMode("titles"));
  bind("mt-ids", ()=>setMode("ids"));
  put();
  paint();   // the empty card, so the column is never a bare box
  /* LAND ON THE COURT, NOT ON EVERYTHING. The map opened at fit — the whole
     graph in a 640px box — which on a real docket makes every node a few pixels
     tall, drops the titles below the LOD line, and presents the reader with a
     diagram of a diagram. The first ring is what the map is ABOUT: the court and
     what hangs directly off it. So open framed on that, and leave the outer
     rings as something to pan to. `fit` is still one button away and still means
     everything. */
  function frameCore(){
    // RING 1, and two rings was tried and rejected: on a nested docket ring 2
    // holds every claim of every flat folder, so framing it came out at 1.24x —
    // the fitted view with a border, which is the thing this replaces. One ring
    // is the court and what hangs directly off it; ring 2 shows at the edges and
    // is what you pan to.
    const core = [L.court].concat(L.folders.filter(f=>f.depth<=1), L.nodes.filter(n=>n.depth<=1));
    if(!core.length) return;
    // CENTRED ON THE COURT, not on the bounding box of the first ring. Those are
    // different points whenever the ring is uneven — three folders at 120° apart
    // put their box's centre off the court by most of a folder's width, and the
    // node the map is built around then sits off to one side of the opening view.
    const pad = 48;
    cx = L.court.cx; cy = L.court.cy;
    const reach = core.reduce((m,b)=>Math.max(m,
      Math.abs(b.x-cx), Math.abs(b.x+b.w-cx)), 0) + pad;
    const reachY = core.reduce((m,b)=>Math.max(m,
      Math.abs(b.y-cy), Math.abs(b.y+b.h-cy)), 0) + pad;
    const x0=cx-reach, x1=cx+reach, y0=cy-reachY, y1=cy+reachY;
    /* z is how many times INTO the fitted view we are, so showing a width w means
       fit.w/z = w. It may go BELOW 1 — below the fitted view — and that floor
       was wrong once the size band below existed: a small docket on a wide screen
       fits at z=1 with its nodes rendered enormous, and the only way down is out
       past fit. Floored at setZ's own 0.5 instead, which is margin around a small
       map rather than a magnified one.
       THEN CLAMPED AGAINST THE ACTUAL VIEWPORT, because "frame the first ring" is
       a rule about the DRAWING and says nothing about how big that comes out on
       screen. It was tuned when the map lived in a 640px box; going full screen
       widened the element to about 1400 and the same z rendered a claim box 441px
       across in 21px type — one and a half nodes to a screen. The band is a
       rendered SIZE: no wider than ~300px so several nodes are in view, and never
       so small that the titles fall below the level-of-detail line, which is the
       whole reason to be zoomed in at all. */
    let zf = Math.min(fit.w/(x1-x0), fit.h/(y1-y0));
    const el = svgEl(), px = el && el.clientWidth;
    if(px){
      const zForNodeWidth = w => w*fit.w/(MAPK.node[mode].w*px);
      zf = Math.max(MAPK.readPx*fit.w/(MAPK.fs.title*px), Math.min(zf, zForNodeWidth(300)));
    }
    z = Math.min(MAPK.zMax, Math.max(0.5, zf));
  }
  /* A FOLDER ARRIVES SELECTED, not just centred. Coming from the folder page the
     reader has already chosen a folder; showing its box in the middle with no
     card would drop the thing they navigated for. select() paints the card,
     dims the rest and glides — the same path a click takes.
     Matched on PATH, which is what the folder URL carries (#/c/<slug>/f/2), not
     on the drawing index that data-fid uses: the index is an artefact of layout
     order and would point at a different folder as soon as the tree changed. */
  if(focusPath!=null){
    const fi = L.folders.findIndex(f => String(f.path) === String(focusPath));
    if(fi >= 0){ select({kind:"folder", fid:fi}); return; }
  }
  if(focusId!=null){ const n = L.nodes.find(x=>x.id===focusId);
    if(n){ cx=n.x+n.w/2; cy=n.y+n.h/2;
      // land zoomed so titles clear the LOD line (enter<7px, leave>8.5px)
      const el=svgEl();
      z=Math.min(MAPK.zMax, Math.max(1, MAPK.readPx*fit.w/(MAPK.fs.title*((el&&el.clientWidth)||960))));
      apply();
      const a=box.querySelector(`.mnode-a[data-id="${focusId}"]`); if(a) a.focus({preventScroll:true});
    } }
  else { frameCore(); apply(); }
}

  const claims = await listClaims(slug);
  const byId = Object.fromEntries(claims.map(cl=>[cl.id,cl]));
  // A CHAIN SUBFOLDER LINKS BY ITS OWN ID. The index path is a curation idea:
  // curation folders have no ids, so position is all there is. A chain folder
  // has a stable fid, and an index path would ALSO be unstable — retiring one
  // folder shifts every later sibling's index, silently repointing bookmarks at

  const subs = (f.folders||[]).map((sf,i)=>

  // page over the folder's ids in CURATED order first (the realm orders its
  // items; a re-sort would betray the "curated order" caption), then resolve
  // only THIS PAGE's out-of-window ids — bounded at 25×3 reads per page
  const fpage = pageOf();
  const idWin = pageSlice(f.claims||[], fpage);
  let omitted = 0;
  const resolved = [];
  for(const id of idWin){
    if(byId[id]){ resolved.push(byId[id]); continue; }
    if(curF.source!=="chain"){ omitted++; continue; }
    resolved.push({id, pending:true});
  }
  if(curF.source==="chain"){
    const s2=gstr(slug);

      try{
        const hidden = await one(`HiddenFromListing(${s2},${m.id})`).catch(()=>true); // fail closed
        if(hidden){ m.drop=true; return; }
        const [t,st] = await Promise.all([one(`ClaimTitle(${s2},${m.id})`).then(unesc), one(`ClaimStatus(${s2},${m.id})`)]);
        m.title=t; m.statusText=st; delete m.pending;
      }catch(_){ m.drop=true; }
    });
  }
  // THE FOLDER'S OWN DESCRIPTION, one read on the one page that shows it. Not
  // fetched for the folder LIST: that would be a read per row for text the list
  // does not draw, which is the cost FolderTree exists to avoid — the same rule,
  // applied to the same data, in the other direction.
  //
  // Chain courts only. A curation folder's description already travelled with
  // the file it came from, and asking the chain about a folder it does not have
  // would be a read that can only fail.
  const fdesc = (curF.source==="chain" && f.fid)
    ? await one(`FolderDesc(${gstr(slug)},${f.fid})`).then(unesc).catch(()=>"")
    : (f.desc || "");
  const fwin = resolved.filter(m=>!m.drop && !m.pending);
  omitted += resolved.filter(m=>m.drop).length;

  main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:slug,href:"#/c/"+slug},...trail])
    /* THE JUMP RIDES THE HEADING. It was a paragraph of its own underneath, which

    + `<h1 class="page-h">${ICN_FOLDER} ${safeInline(f.name)} <span class="seal">${esc(slug)}</span> `

    /* THE FOLDER'S ONE PICTURE, at a size worth looking at. On the map it is a
       tint under a label, which is right there and not enough anywhere else:
       this is the page a reader lands on when they follow the folder, and the
       only surface where the picture is the thing rather than the texture.
       alt is empty on purpose — the heading above already names the folder, and
       a heading asserts nothing, so there is no content here for alt to carry
       that the page does not already say in words. */
    + (f.img? `<img class="folderface" src="${esc(f.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : "")
    + (fdesc? `<p class="sub">${esc(fdesc)}</p>` : "")
    + `<p class="page-sub">A folder is moderator curation with zero economic weight — the claims below are ordinary claims of this court. ${curF.source==="chain"? "Read live from the chain." : curF.source==="local"? CUR_LABEL+"." : "Read from the sample data."}${omitted? ` ${omitted} hidden or unreadable row${omitted===1?" is":"s are"} omitted.`:""}</p>`
    + (subs? `<section><div class="sec-h">Subfolders</div><div class="docket">${subs}</div></section>` : "")
    + `<section${subs?' style="margin-top:22px"':""}><div class="sec-h">Claims <span class="count">${(f.claims||[]).length}</span></div>`
    + fpager
