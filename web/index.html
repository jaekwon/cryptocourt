/* --- how it works --- */
/* ================================= share ================================ */
/* Polymarket puts a `< >` on every market: pick light or dark, copy an iframe,
   paste it into a CMS, and it keeps updating in the article, which is what makes
   it travel. Two things are copied here and one is not. Their word for the
   number is "odds"; ours is the stake split, and the difference is not cosmetic
   — see web/README.md's interface contract and REGULATIONS.md.

   THE IFRAME is the same idea and needs no second host — see the embed routes
   below. The snippet is absolute so it survives being pasted somewhere else,
   and it is built from THIS page's own location, so a court served from a LAN
   box or a file:// copy produces a snippet that points at the same source the
   reader is actually looking at rather than at a canonical host that may not
   be serving this chain.

   THE CLIP is a PNG drawn in the browser. A prediction site generates share
   images server-side, per market, on demand; this page has no server and never
   will, so it draws the card on a canvas and hands it over. It downloads and,
   where the browser allows it, goes straight to the clipboard.

   WHAT IS NOT COPIED: a per-claim link preview. Those are og:image and
   og:title, read by a crawler that does not run JavaScript, from a URL whose
   #fragment is never sent to a server. A hash-routed single file cannot have
   them for the same reason it needs no host. Stated here rather than
   half-built, with what it would take written down in web/README.md. */

function shareDialog(slug, id, d, courtName){
  const link = shareURLBase() + "#/c/" + slug + (id == null ? "" : "/" + id);
  return `<dialog class="helper" id="share-dlg" aria-labelledby="share-h">
    <div class="hd"><h3 id="share-h">Share this ${id == null ? "court" : "claim"}</h3>
      <button type="button" class="pill void" data-close>close</button></div>
    <div class="bd">
      ${shareIsPublic() ? "" : `<p class="small" style="margin:0 0 8px; color:var(--escrow)">This page is
        open from a local file, so the link and the embed below only work on this machine, and the image
        leaves its address off. Host <code>index.html</code> somewhere first if you mean to share it.</p>`}
      <h4>Link</h4>
      <pre class="cliblock mono" data-copytext id="share-link">${esc(link)}</pre>
      <button type="button" class="copybtn" data-copyfor="share-link" aria-live="polite">Copy</button>
      <h4>Embed</h4>
      <p class="small muted" style="margin:0 0 6px">The stake split stays current, updating in place. Pick the
        theme to match the page you are pasting into — an iframe cannot see it.</p>
      <div class="actions" style="margin:0 0 8px">
        <button type="button" class="copybtn" data-embtheme="" aria-pressed="true">reader's theme</button>
        <button type="button" class="copybtn" data-embtheme="light" aria-pressed="false">light</button>
        <button type="button" class="copybtn" data-embtheme="dark" aria-pressed="false">dark</button>
      </div>
      <pre class="cliblock mono" id="emb-snip" data-copytext>${esc(embedSnippet(slug, id, {}))}</pre>
      <button type="button" class="copybtn" data-copyfor="emb-snip" aria-live="polite">Copy</button>
      <h4>Image</h4>
      <p class="small muted" style="margin:0 0 8px">A 1200×630 PNG — the size link previews are cropped to.
        Your browser draws it, so you attach it yourself: an <em>automatic</em> preview would have to be
        built by a server when a crawler asks, and this page has no server.</p>
      <div class="clipprev"><img id="clip-prev" alt="the image this claim will share as"></div>
      <div class="actions">
        <button type="button" class="copybtn" data-clip="download">Download PNG</button>
        <button type="button" class="copybtn" data-clip="copy">Copy image</button>
        <span class="small muted" id="clip-say" aria-live="polite"></span>
      </div>
    </div></dialog>`;
}

function shareURLBase(){
  // Absolute, and derived from where this page actually is.
  return location.href.replace(/#.*$/, "").replace(/\?.*$/, "");
}
/* Is this copy of the page at an address anyone else could open?
   web/README.md invites running from file://, and there shareURLBase() is a path
   inside somebody's home directory. That is not merely useless to a reader — the
   clip DRAWS its address, so a card shared from a local file published the
   sharer's username and directory layout in a PNG. A PNG cannot be recalled.
   Nothing outside http(s) gets an address. */
function shareIsPublic(){ return /^https?:$/.test(location.protocol); }
function embedSnippet(slug, id, opts){
  const o = opts || {};
  const q = o.theme ? "?theme=" + o.theme : "";
  const path = (id == null) ? ("/embed/" + slug) : ("/embed/" + slug + "/" + id);
  const src = shareURLBase() + "#" + path + q;
  // MEASURED, not copied, and measured WITH the disclosure line showing. The
  // first version of these numbers came from demo mode with nothing to disclose
  // and no test-clock banner — which is exactly the state that cannot overflow,
  // so they were 40px short of every card a reader would actually see. Now:
  // every card in the sample, at 320px wide (the narrowest column an article
  // gives a max-width:100% iframe), carrying .esrc, the recorded-path spark AND
  // the two stake actions and the dated event trail — tallest claim 479px,
  // tallest court 197px. The title
  // is line-clamped, the chart is a fixed 56px plus one line of dates, and the
  // actions are one row that never wraps, so every growing term is bounded;
  // ../tests/browser/embed_layout.js pins both worst cases.
  //
  // A live chain with an honest clock has nothing to disclose and so runs ~40px
  // short of these. That is the price of a fixed box: size for the card that
  // says the most, not the least.
  const w = o.w || 400, h = o.h || (id == null ? 210 : 500);
  return `<iframe src="${src}" width="${w}" height="${h}" frameborder="0" `
       + `title="Kourt — ${id == null ? slug : slug + " #" + id}" `
       + `style="border:1px solid #ddd;border-radius:6px;max-width:100%"></iframe>`;
}

/* The clip. 1200x630 is the size every link unfurler crops to, so a reader who
   drops the PNG into a post gets the same framing they would have got from a
   generated preview — the one thing a serverless page cannot mint for itself. */
function drawClip(slug, id, d, courtName, theme, note, url, ser, tl){
  const W = 1200, H = 630, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  const dark = theme === "dark";
  const ink = dark ? "#e8eaf0" : "#14171f", mut = dark ? "#8a90a0" : "#6b7280";
  const yes = dark ? "#6fc0a5" : "#1c6551", no = dark ? "#e08b7c" : "#93362b";
  const warn = dark ? "#d7b264" : "#7d5c0f";
  x.fillStyle = dark ? "#12151b" : "#ffffff"; x.fillRect(0, 0, W, H);
  x.fillStyle = dark ? "#1b1f27" : "#f7f8fa"; x.fillRect(0, 0, W, 96);
  x.fillStyle = mut; x.font = "500 26px ui-monospace,Menlo,monospace";
  /* A COURT NAME IS CHOSEN BY WHOEVER CREATED THE COURT, so it is as unbounded
     as the claim title and needs the same treatment — which the first version of
     this function gave the title only. Measured, a 68-character name ran the
     identity line to 1606px on a 1200px canvas: 400px drawn off the edge, with
     nothing to show it had happened.
     The NAME is shaved rather than the whole line, because the coin symbol and
     the claim number are the two things a reader needs to find the claim again.
     A pathological SLUG can still outgrow the line on its own, so the composed
     string gets a last-resort pass too. */
  const idPart = (id == null ? "" : "   ·   #" + id);
  const headOf = n => ccSym(slug) + "   ·   " + n + idPart;
  let nm = String(courtName || slug);
  if(x.measureText(headOf(nm)).width > W - 112){
    while(nm.length > 4 && x.measureText(headOf(nm + "…")).width > W - 112) nm = nm.slice(0, -1);
    nm += "…";
  }
  let head = headOf(nm);
  while(head.length > 8 && x.measureText(head).width > W - 112) head = head.slice(0, -1);
  x.fillText(head, 56, 60);
  /* THE DISCLOSURE GETS ITS OWN BAND, directly under the identity line. A PNG
     leaves with no banner, no rail and no URL bar, so a card drawn from the
     offline sample or a hand-set clock has to say so on its own face — and at
     the bottom in grey it is one crop away from gone.
     It is a full-width strip rather than a right-aligned corner because the
     corner does not fit: the identity line runs to ~710px with a long court
     name, leaving under 400px, and a 43-character note needs ~570px. The first
     version shaved the note down to "sample data — these", which discloses
     nothing. A strip cannot collide with anything. */
  if(note){
    x.fillStyle = dark ? "#2e2512" : "#f0e6cd"; x.fillRect(0, 96, W, 48);
    x.fillStyle = warn; x.font = "500 24px ui-monospace,Menlo,monospace";
    let nt = note;
    while(nt.length > 8 && x.measureText(nt).width > W - 112) nt = nt.replace(/\s*\S+$/, "");
    x.fillText(nt, 56, 128);
  }

  // Title, wrapped by measurement rather than by a guessed character count.
  // THE ELLIPSIS IS NOT COSMETIC. A claim is a sentence, and a sentence cut
  // silently at the third line can assert something its author did not: drop
  // ", according to a preliminary count" and what is left reads as flat fact.
  // Three lines is what fits above the bar, so a longer title is MARKED as cut
  // and the reader is sent to the claim for the rest.
  x.fillStyle = ink; x.font = "600 52px ui-serif,Georgia,serif";
  const fits = t => x.measureText(t).width <= W - 112;
  // Shorten by CHARACTERS. A word-boundary shave cannot help a line that has no
  // word boundary left, and a title may legitimately carry one: a docket number,
  // a hash, a URL.
  const shave = t => { let v = t; while(v.length > 1 && !fits(v + "…")) v = v.slice(0, -1); return v + "…"; };
  const words = String(d && d.title || courtName || slug).split(/\s+/);
  const lines = [];
  let line = "";
  for(const w of words){
    const t = line ? line + " " + w : w;
    if(!fits(t) && line){ lines.push(line); line = w; }
    else line = t;
  }
  if(line) lines.push(line);
  const MAXL = 3;
  const cut = lines.length > MAXL;
  let shown = lines.slice(0, MAXL);
  // A single token wider than the card cannot be WRAPPED, only shortened — the
  // loop above puts it on a line of its own and moves on. Without this a
  // 120-character token is drawn straight off the edge of the PNG, and it is
  // not the `cut` path that saves it: three lines is not "cut" at all.
  shown = shown.map(l => fits(l) ? l : shave(l));
  // And if the title ran past the lines available, mark the last one, dropping
  // whole words first so the mark reads as a cut sentence rather than a cut word.
  if(cut && !/…$/.test(shown[MAXL-1])){
    let l = shown[MAXL-1];
    while(/\s/.test(l) && !fits(l + "…")) l = l.replace(/\s*\S+$/, "");
    shown[MAXL-1] = fits(l + "…") ? l + "…" : shave(l);
  }
  /* One vertical rhythm for the whole card, declared once. Everything below is
     positioned from these rather than from H, because the chart moves the bar
     and the first version left the YES/NO labels sitting ON the bar and the
     caption on the title's descenders. */
  const titleY = note ? 200 : 176, LINE = 62;
  shown.forEach((l, i)=> x.fillText(l, 56, titleY + i * LINE));
  const titleBottom = titleY + (shown.length - 1) * LINE + 16;
  const hasSer = !!(ser && ser.pts && ser.pts.length > 1
                    && ser.pts.filter(q => q[1] != null).length > 1);
  const BAR_Y = hasSer ? 496 : 430;
  const LABEL_Y = BAR_Y + 46;   // clear of the bar's 26px, and of the trail below
  const TRAIL_Y = 556, STATUS_Y = 586, URL_Y = 616;

  /* THE RECORDED PATH. A bar says where the stake stands; the whole argument of
     this court is that it MOVED, and a card that shows only the final ratio
     throws away the part a reader would argue with. This is the same series the
     claim page draws, drawn the same way:
     STEP-AFTER, NOT INTERPOLATED. The chain stores change-only samples, so a
     straight line between two points would draw motion that never happened. A
     value holds until the next recorded change, including out to the right edge
     — which is what "nothing has changed since" looks like. */
  if(hasSer){
    /* Room is taken from the top, not the bottom: the dates need a line of
       their own and a three-line title can leave only ~54px of plot, so every
       anchor below is derived rather than guessed at. */
    const cap = titleBottom + 38, top = cap + 14;
    const dateY = BAR_Y - 26, bot = dateY - 22;
    const pts = ser.pts.filter(q => q[1] != null);
    if(bot - top >= 44){
      // PR, not R: the scale labels live in the last 52px, and mapping the
      // domain to the full width drew the line and its end dot straight through
      // them.
      const L = 56, R = W - 56, PR = R - 62;
      const nowH = tl && tl.now ? tl.now.h : null;
      const at = tl && tl.answered ? tl.answered.h : null;
      // THE DOMAIN RUNS TO NOW, not to the last change. Change-only samples mean
      // the last row can be days old while the value still holds; ending the
      // axis there labelled the right edge with the last CHANGE and drew the
      // line to it anyway, so the flat "nothing since" stretch was invisible and
      // the date under it was wrong.
      const x0 = pts[0][0];
      let x1 = pts[pts.length - 1][0];
      if(nowH != null && nowH > x1) x1 = nowH;
      if(at != null && at > x1) x1 = at;
      x1 = Math.max(x1, x0 + 1);
      const px = h => L + (PR - L) * ((h - x0) / (x1 - x0));
      const py = p => bot - (bot - top) * (p / 100);
      // A SCALE, not just a shape. One dashed line at 50 said "which side is
      // ahead" and nothing about by how much; 25 and 75 make the distance
      // readable, and the numbers say what the gridlines are.
      x.lineWidth = 2; x.font = "500 19px ui-sans-serif,system-ui,sans-serif";
      for(const g of [25, 50, 75]){
        x.strokeStyle = dark ? "#242a34" : "#eceef2";
        if(g === 50) x.strokeStyle = dark ? "#2f3641" : "#e0e3e9";
        x.setLineDash(g === 50 ? [6, 6] : [3, 7]);
        x.beginPath(); x.moveTo(L, py(g)); x.lineTo(PR, py(g)); x.stroke();
        x.setLineDash([]);
        x.fillStyle = mut; x.fillText(g + "%", PR + 12, py(g) + 6);
      }
      const step = [];
      for(let i = 0; i < pts.length; i++){
        step.push([px(pts[i][0]), py(pts[i][1])]);
        const nx = (i + 1 < pts.length) ? px(pts[i+1][0]) : PR;
        step.push([nx, py(pts[i][1])]);
      }
      x.fillStyle = dark ? "rgba(111,192,165,.16)" : "rgba(28,101,81,.10)";
      x.beginPath(); x.moveTo(step[0][0], bot);
      for(const [sx, sy] of step) x.lineTo(sx, sy);
      x.lineTo(step[step.length-1][0], bot); x.closePath(); x.fill();
      x.strokeStyle = yes; x.lineWidth = 4; x.lineJoin = "round";
      x.beginPath(); x.moveTo(step[0][0], step[0][1]);
      for(const [sx, sy] of step) x.lineTo(sx, sy);
      x.stroke();
      // WHERE THE RECORD STOPS. Staking freezes when an answer posts, so a flat
      // tail after that height is the realm refusing writes, not a market gone
      // quiet. Unmarked, the two look identical.
      if(at != null && at > x0 && at <= x1){
        x.strokeStyle = mut; x.lineWidth = 2; x.setLineDash([4, 5]);
        x.beginPath(); x.moveTo(px(at), top); x.lineTo(px(at), bot); x.stroke();
        x.setLineDash([]);
        // Along the floor, not at the top: the line lives up near its own value
        // and the label was drawn straight through it.
        x.font = "500 18px ui-sans-serif,system-ui,sans-serif"; x.fillStyle = mut;
        const lab = "answered — staking frozen";
        const lx = Math.min(px(at) + 8, PR - x.measureText(lab).width);
        x.fillText(lab, Math.max(L, lx), bot - 8);
      }
      const last = pts[pts.length - 1][1];
      x.fillStyle = yes;
      x.beginPath(); x.arc(step[step.length-1][0], py(last), 7, 0, Math.PI*2); x.fill();
      // the caption carries the units so the axis does not have to
      x.font = "500 21px ui-sans-serif,system-ui,sans-serif";
      x.fillStyle = mut;
      x.fillText("share of stake on YES, as the chain recorded it", L, cap);
      // THE DATES. Without them the shape had no when: a reader could not tell a
      // week from a season. Drawn from the timeline's own now:<unix>:<height>.
      const dt = heightDater(tl);
      x.font = "400 19px ui-monospace,Menlo,monospace"; x.fillStyle = mut;
      if(dt){
        const a = stampDate(dt(x0)), b2 = stampDate(dt(x1));
        x.fillText(a, L, dateY);
        x.fillText(b2, PR - x.measureText(b2).width, dateY);
      } else {
        // no anchor: say what the axis IS rather than dating it wrongly
        const a = "block " + fmtN(x0), b2 = "block " + fmtN(x1);
        x.fillText(a, L, dateY);
        x.fillText(b2, PR - x.measureText(b2).width, dateY);
      }
    }
  }
  if(!hasSer && d){
    // Not every claim has one: an older deployment has no ClaimSeries at all,
    // and a claim nobody has staked twice has nothing to plot. Saying so beats
    // a silent gap where a chart obviously belongs.
    x.font = "400 21px ui-sans-serif,system-ui,sans-serif"; x.fillStyle = mut;
    x.fillText("no recorded path for this claim yet", 56, titleBottom + 44);
  }
  if(d && (d.yesStake || d.noStake)){
    const tot = Math.max(1, (d.yesStake || 0) + (d.noStake || 0));
    const py = (d.yesStake || 0) / tot, barH = 26;
    x.fillStyle = yes; x.fillRect(56, BAR_Y, (W - 112) * py, barH);
    x.fillStyle = no;  x.fillRect(56 + (W - 112) * py, BAR_Y, (W - 112) * (1 - py), barH);
    x.font = "600 30px ui-sans-serif,system-ui,sans-serif";
    x.fillStyle = yes; x.fillText("YES " + (py * 100).toFixed(1) + "%", 56, LABEL_Y);
    const nt = "NO " + ((1 - py) * 100).toFixed(1) + "%";
    x.fillStyle = no;  x.fillText(nt, W - 56 - x.measureText(nt).width, LABEL_Y);
  }
  x.fillStyle = mut; x.font = "400 24px ui-sans-serif,system-ui,sans-serif";
  // The claim's own events, dated — the same trail the card carries, on the one
  // line there is room for. ABOVE the status, because the status is the
  // conclusion and this is how it got there.
  const trail = eventTrail(tl);
  if(trail.length){
    const nowT = tl && tl.now ? tl.now.t : null;
    x.font = "400 21px ui-sans-serif,system-ui,sans-serif"; x.fillStyle = mut;
    let line = trail.map(e => e.label + " " + stampShort(e.t, nowT)).join("   ·   ");
    // drop whole events off the end rather than cutting a date in half
    while(/·/.test(line) && x.measureText(line).width > W - 112)
      line = line.replace(/\s*·\s*[^·]*$/, " …");
    x.fillText(line, 56, TRAIL_Y);
  }
  const status = (d && d.statusText) ? d.statusText : "a court of claims of fact";
  const hasURL = url && /^https?:\/\//.test(String(url));
  x.fillStyle = mut; x.font = "400 24px ui-sans-serif,system-ui,sans-serif";
  x.fillText(status.length > 78 ? status.slice(0, 77) + "…" : status, 56, STATUS_Y);
  // Where to check it. A card with no address is an assertion; a card with one
  // is a citation, and it is the only thing on the PNG a reader can follow.
  // Guarded here as well as at the call site. The leak is one-way: once the card
  // is posted the path is public, so this is worth checking twice.
  if(url && /^https?:\/\//.test(String(url))){
    x.font = "400 21px ui-monospace,Menlo,monospace";
    let u = String(url).replace(/^https?:\/\//, "");
    while(u.length > 12 && x.measureText(u).width > W - 112) u = u.slice(0, -2);
    x.fillStyle = mut;
    x.fillText(u, 56, URL_Y);
  }
  return cv;
}
/* ================================ embeds ================================ */
/* An embed is the same page answering a narrower question. It reads the chain
   in live mode and the sample offline, exactly as every other route does, so a
   court's stake split in someone else's article is as current as the court's own page.

   THE THEME IS A PARAMETER, not inherited: an iframe cannot see the host page's
   colours, so a dark article embedding a light card looks broken through no
   fault of either. Polymarket's generator has the same switch for the same
   reason. Absent, the reader's own preference stands.

   NO CHAT POLLER and no wallet here. An embed is a quotation, not a console. */
function embedTheme(){
  const t = (QP.theme || "").toLowerCase();
  return (t === "dark" || t === "light") ? t : null;
}
/* WHY THIS IS DRIVEN BY THE ROUTE AND NOT BY embedOpen().
   embedOpen() used to only ADD the mark, and nothing ever took it off. An embed
   URL is reachable in a top-level tab — "Open frame in new tab" is in the
   default right-click menu of every iframe — and from there "Open on Kourt →"
   navigates the SAME tab with target=_top. The reader then had the whole app
   with no rail, no nav, and #tcbanner display:none: a navigation dead end and,
   worse, a permanently suppressed test-clock disclosure. `?theme=` was sticky
   the same way, pinning the app to the sharer's palette.
   So the mark is recomputed from the hash on every render. */
function embedMark(hash){
  const on = /^\/embed\//.test(hash);
  document.documentElement.classList.toggle("embed", on);
  if(!on){ if(document.documentElement.dataset.embedTheme){
      delete document.documentElement.dataset.embedTheme;
      // Back to the READER's own choice, not to nothing: CFG.theme is what the
      // rail's toggle writes, and clearing the attribute outright would drop it.
      applyTheme(CFG.theme); }
    return; }
  const t = embedTheme();
  if(t){ document.documentElement.dataset.embedTheme = "1";
         document.documentElement.setAttribute("data-theme", t); }
}
function embedOpen(){ /* the views call this; the mark is set by the router */ }
/* The link back carries where it came from, like Polymarket's
   utm_medium=embed — an embed that cannot be told apart from direct traffic
   tells the court nothing about who is quoting it.

   TARGET=_BLANK, NOT _TOP, and this was a correction. _top REPLACES the article
   the reader is in: they clicked a card inside somebody's piece and the piece
   vanished. A new tab answers the same need — an embed must not open the whole
   app inside a 400px box — without taking the page away from them. Checked
   against a live embed.polymarket.com card, which uses _blank on all six of its
   links back; every one of ours does the same.

   AND THERE IS MORE THAN ONE OF THEM. That card links back from its logo, its
   title, its chart and each outcome. Ours had exactly one, in the footer, so a
   reader who wanted the claim had to find the small print. The court, the title
   and the footer now all lead somewhere, each to the thing it names. */
function embedBackHref(path){ return "#" + path + "?from=embed"; }
function embedLink(path, inner, cls){
  return `<a class="${cls || "elink"}" href="${embedBackHref(path)}" target="_blank" rel="noopener">${inner}</a>`;
}

const esrc = note => note ? `<div class="esrc">${esc(note)}</div>` : "";

/* The recorded path, small. An embed that shows only the final ratio throws
   away the thing worth quoting — that the stake MOVED — and it is the reason
   Polymarket's card is square: theirs holds a chart. Same series and the same
   step-after rendering as the claim page: the chain stores change-only samples,
   so a sloped line between two of them would draw motion that never happened.
   Its own viewBox scales to whatever column the iframe was given. */
/* THE ACTION. Polymarket's card ends in two outcome buttons and ours ended in
   nothing — a reader could look at the claim and had nowhere to go but the small
   print in the corner.

   NOT THEIR LANGUAGE, THOUGH. Theirs are priced outcomes you buy; a claim here
   is not bought and not sold, principal always returns 1x, and the number under
   each side is the SHARE OF STAKE on it, not a price and not odds. So: "Stake
   YES" and "Stake NO", the two verbs this realm actually has.

   THEY NAVIGATE, THEY DO NOT SIGN. Polymarket's outcome buttons deep-link to
   the market with tid=0/tid=1 rather than trading inside the frame, and that is
   the right shape for a different reason here: a signing link is a wallet
   interaction, and an iframe on somebody else's page is the last place to put
   one. These carry ?side= to the claim, which lands on the stake panel with
   that side marked.

   ONLY WHILE THE CLAIM IS OPEN. Staking freezes the moment an answer posts, so
   on any later phase these would send a reader to a transaction the realm would
   refuse. A card for a settled claim offers reading it, which is what its
   footer link already does. */
function embedActions(d, slug, id){
  if(!d || d.phase !== "open") return "";
  const py = pctYes(d.yesStake || 0, d.noStake || 0);
  const pc = v => (v == null) ? "" : `<span class="epc">${v.toFixed(1)}%</span>`;
  const one = (side, label, v, cls) =>
    `<a class="eact ${cls}" href="${embedBackHref("/c/" + slug + "/" + id)}&side=${side}"
        target="_blank" rel="noopener"><b>${label}</b>${pc(v)}</a>`;
  return `<div class="eacts">${one("yes", "Stake YES", py, "y")}`
       + `${one("no", "Stake NO", py == null ? null : 100 - py, "n")}</div>`;
}
function embedTrail(tl){
  const ev = eventTrail(tl);
  if(!ev.length) return "";
  const nowT = tl && tl.now ? tl.now.t : null;
  return `<div class="etrail">` + ev.map(e =>
    `<span class="${e.future ? "fut" : ""}"><b>${esc(e.label)}</b> ${esc(stampShort(e.t, nowT))}</span>`
  ).join("") + `</div>`;
}
/* THE CARD'S CHART IS THE CLAIM PAGE'S CHART, SMALLER.
   It used to be a different instrument wearing the same data: three identical
   dashed rules where the page has a solid axis at 0, a dashed mid at 50 and a
   grid line at 100; no scale numbers; no lifetime reference; no event marks; no
   end-value callout. Counted against signalChart: 5 kinds of mark and no text,
   against 19 and ten labels. A reader who followed the card to the page did not
   arrive at a bigger version of what they had been looking at.

   It emits signalChart's OWN CLASS NAMES inside a .bigchart, so the two are
   styled by one set of rules and cannot drift again. That is the actual fix; the
   colours were only the symptom.

   WHY THE LABELS FIT, having been told once that they would not. Text in an SVG
   scales with the viewBox, and this one is 300 units rendered into ~370px — a
   ratio of 1.23, so a 10-unit label lands at ~12px. The claim page's own chart
   runs the other way (640 units into ~460px, ratio 0.72), which is why ITS
   labels are the small ones. The earlier reasoning had the direction backwards.

   Two things still do not come across, on width alone: the block-number captions
   ("block 4,596,480 · ≈11.8d ago · sample" needs ~230 units of a 262-unit plot)
   and the event labels. The dates are in the HTML row below at real pixel size,
   which is better than shrinking them into the drawing. */
function embedSpark(ser, tl, d){
  // Say so, the way the clip does. An older deployment has no ClaimSeries at
  // all and a claim staked once has nothing to plot; silently dropping the
  // chart left the two cases looking like a rendering fault.
  const none = `<div class="enopath">no recorded path for this claim yet</div>`;
  if(!ser || !ser.pts) return none;
  const pts = ser.pts.filter(q => q[1] != null);
  if(pts.length < 2) return none;
  // Same anatomy as signalChart, a quarter of the size: plot box, right margin
  // for the scale, and the same 100/50/0 rows.
  const W = 300, H = 76, PL = 5, PR = 272, Y100 = 7, Y0 = 66;
  const y = p => +(Y0 - (p / 100) * (Y0 - Y100)).toFixed(1);
  const nowH = tl && tl.now ? tl.now.h : null;
  const at = tl && tl.answered ? tl.answered.h : null;
  // Same domain rule as the clip: to NOW, not to the last change, or the flat
  // "nothing since" stretch is invisible and the date under it is wrong.
  const x0 = pts[0][0];
  let x1 = pts[pts.length - 1][0];
  if(nowH != null && nowH > x1) x1 = nowH;
  if(at != null && at > x1) x1 = at;
  x1 = Math.max(x1, x0 + 1);
  // The same 4% breathing room signalChart gives its domain. Without it the
  // first event mark lands ON the left frame instead of inside the plot, which
  // is precisely the padding difference between the two charts.
  const pad = (x1 - x0) * .04 || 1, d0 = x0 - pad, d1 = x1 + pad;
  const px = h => +(PL + ((h - d0) / (d1 - d0)) * (PR - PL)).toFixed(1);
  // STEP-AFTER, like the page: ClaimSeries records only changes, so a sloped
  // join would draw a drift the chain never recorded.
  let dd = "", ar = "";
  for(let i = 0; i < pts.length; i++){
    const X = px(pts[i][0]), Y = y(pts[i][1]);
    const nx = (i + 1 < pts.length) ? px(pts[i+1][0]) : px(x1);
    dd += (i ? ` V ${Y}` : `M ${X} ${Y}`) + ` H ${nx}`;
    ar += (i ? ` V ${Y}` : `M ${X} ${Y}`) + ` H ${nx}`;
  }
  const last = pts[pts.length - 1][1];
  const r = d ? ratios(d) : null;
  const endShare = r && Number.isFinite(r.inst) ? r.inst : last;
  const endY = y(endShare);
  let g = `<line class="grid" x1="${PL}" y1="${y(100)}" x2="${PR}" y2="${y(100)}"></line>
<line class="mid" x1="${PL}" y1="${y(50)}" x2="${PR}" y2="${y(50)}"></line>
<line class="axis" x1="${PL}" y1="${Y0}" x2="${PR}" y2="${Y0}"></line>`;
  // The scale, suppressed where the end-value callout would sit on it — the same
  // 11-unit rule signalChart uses, scaled to this box.
  [[100, y(100)], [50, y(50)], [0, Y0]].forEach(([t, ty]) => {
    if(Math.abs(ty - endY) >= 8) g += `<text class="tickL" x="${PR + 4}" y="${ty + 3}">${t}</text>`;
  });
  g += `<path class="ar" d="${ar} V ${Y0} H ${px(x0)} Z"></path><path class="ln" d="${dd}" fill="none"></path>`;
  // The lifetime reference: the one line that says whether now is above or below
  // where this claim has spent its life. Free at any size, and the page has it.
  if(r && Number.isFinite(r.life))
    g += `<line class="ref" x1="${PL}" y1="${y(r.life)}" x2="${PR}" y2="${y(r.life)}"></line>`;
  if(at != null && at > x0 && at <= x1)
    g += `<line class="seam" x1="${px(at)}" y1="${Y100}" x2="${px(at)}" y2="${Y0}"></line>`;
  // Event ticks with no labels: the marks locate "records begin" and "now" on
  // the axis, and the dates for both are in the row below.
  [x0, x1].forEach(h => {
    g += `<line class="evt" x1="${px(h)}" y1="${Y100}" x2="${px(h)}" y2="${Y0}"></line>`
      + `<circle class="evtDot" cx="${px(h)}" cy="${Y0}" r="2"></circle>`;
  });
  g += `<circle class="end" cx="${px(x1)}" cy="${endY}" r="4"></circle>
<text class="endL" x="${PR + 4}" y="${endY + 4}">${endShare}%</text>`;
  const dt = heightDater(tl);
  // THE DATES. Without them the shape had no when — a reader could not tell a
  // week from a season. From the timeline's own now:<unix>:<height>, or the
  // block numbers when there is no anchor, which is honest rather than wrong.
  // A DATE AND A DISTANCE, never a block number where a date is knowable. A
  // reader can place "6 Aug 2026" in the year but not against now, and "block
  // 4,596,480" places it nowhere at all — the height is the chain's index, not a
  // fact about when. Blocks stay as the fallback for a timeline with no anchor,
  // which is honest rather than wrong.
  const dayGap = h => Math.round(Math.abs(dt ? (dt(x1) - dt(h)) / 86400
                                             : (x1 - h) * BLOCK_SECS / 86400) * 10) / 10;
  const lo = dt ? `${stampDate(dt(x0))} · ${dayGap(x0)}d ago` : "block " + fmtN(x0);
  const hi = dt ? `${stampDate(dt(x1))} · now` : "block " + fmtN(x1);
  const froze = at != null && at > x0 && at <= x1;
  return `<div class="esparkwrap"><figure class="bigchart espark">
      <svg viewBox="0 0 ${W} ${H}" role="img"
        aria-label="share of stake on YES from ${esc(lo)} to ${esc(hi)}, ${endShare}% now, as the chain recorded it">${g}</svg>
      </figure>
      <div class="espan"><span>${esc(lo)}</span>${froze ? `<span class="efrozelab">answered — staking frozen</span>` : ""}<span>${esc(hi)}</span></div>
    </div>`;
}

async function embedClaimView(slug, idS){
  embedOpen();
  const id = parseInt(idS, 10);
  const [cs, d, note] = await Promise.all([courtStats(slug).catch(()=>null),
                                           claimDetail(slug, id), sourceNote()]);
  // claimDetail carries the timeline only in demo mode, so this used to be
  // parseTimeline(d.timeline) — which meant a LIVE embed had no dates at all,
  // neither on the chart nor on "filed". One helper, both modes.
  const [ser, tl] = d ? await Promise.all([claimStakeSeries(slug, id, d).catch(()=>null),
                                           claimTimeline(slug, id, d).catch(()=>null)])
                      : [null, null];
  if(!d){
    main.innerHTML = `<div class="emb"><p class="estat">No claim ${esc(slug)}/${esc(idS)} on this source.</p>
      ${esrc(note)}
      <div class="efoot"><span></span><a href="${embedBackHref("/")}" target="_blank" rel="noopener">Kourt →</a></div></div>`;
    return;
  }
  const when = tl && tl.opened ? stampDate(tl.opened.t) : null;
  main.innerHTML = `<div class="emb">
      <div class="ehead">${embedLink("/c/" + slug, esc(ccSym(slug)))}<span>·</span>
        ${embedLink("/c/" + slug, esc(cs ? cs.name : slug), "elink ename")}<span>·</span><span>#${id}</span></div>
      <h3 class="etitle">${embedLink("/c/" + slug + "/" + id, safeInline(d.title))}</h3>
      ${embedSpark(ser, tl, d)}
      ${stakeBar(d, slug)}
      <div class="estat">${esc(d.statusText || "")}</div>
      ${embedTrail(tl)}
      ${esrc(note)}
      ${embedActions(d, slug, id)}
      <div class="efoot">
        <span class="ewhen">${when && !eventTrail(tl).length ? "filed " + esc(when) : ""}</span>
        <a href="${embedBackHref("/c/" + slug + "/" + id)}" target="_blank" rel="noopener">Open on Kourt →</a>
      </div>
    </div>`;
}

on(/^\/embed\/([a-z0-9-]+)\/(\d+)$/, async (slug, id)=> embedClaimView(slug, id));
on(/^\/embed\/([a-z0-9-]+)$/, async (slug)=> embedCourtView(slug));

on(/^\/about$/, async ()=>{
  main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:"How it works"}])
    + `<h1 class="page-h">How a court works</h1>
    <div class="prose" style="margin-top:16px">
      <p>A <b>court</b> is a self-contained venue for claims of fact. It mints its own coin on a one-way bonding curve — you buy in with GNOT, and the GNOT is <b>burned</b>. There is no treasury and no sell-back; the coin's worth is what it can stake and earn.</p>
      <h2>Claims, and staking</h2>
      <p>Anyone opens a <b>claim</b> — an immutable statement of fact — for a small deposit plus a fee. Both return when the claim runs its course; a claim voted junk burns both, and one that dies unanswered burns the fee (the spam price). Then anyone <b>stakes</b> coin on YES or NO. Staking is <b>no-loss</b>: your principal always returns 1×, whichever way the claim resolves. What you earn is a reward proportional to your <b>conviction</b> — stake × time held on the winning side — drawn from newly-minted coin under a hard per-claim cap, so it rewards early, accurate belief and can't be farmed. Unstaking is free until an answer posts; the reward weight you've already earned is kept.</p>
      <h2>Answers, disputes, and flags</h2>
      <p>Once a claim has enough sustained interest, an <b>answer</b> may be posted with a bond (in seasoned courts, qualified answerers hold the first day). Posting freezes staking. Left alone, the answer settles 72 hours later. To contest it, open a <b>dispute</b>: a token vote on <i>“overturn the answer?”</i>, sealed until it closes. Voting weight comes from the hourly snapshot taken before the vote opened — voice bought mid-vote counts for nothing. A forfeited bond is <b>burned</b>, never paid to the other side, and the winner is compensated from fresh issuance — so nothing ever moves between adversaries. Separately, a <b>flag</b> asks whether a claim carried real information; a wrong flag burns its bond, a right one is paid, and a vote that fails to settle can burn half. A verdict always shows its route — <i>undisputed</i> or <i>by vote</i>.</p>
      <h2>The overlay is optional</h2>
      <p>Everything here is read from the realm's own <code>Render</code> and its public reads, and every button is a normal gnoweb transaction signed in your wallet. Switch the Source to a live node in the left rail to read a deployed court; the sample data lets you explore every state offline.</p>
      ${aboutTour()}
    </div>`;
});

/* ===================== demo Render() (chain-render sample) ============== */
function demoRender(path){
  const parts = path.split("/");
  if(path===""||path==="/"){
    let o="# Kourt\n\nStake on claims of fact. Your principal always returns 1×.\n\n## Featured\n\n";
    for(const [slug,c] of Object.entries(DEMO.courts)) if(c.tier===2) o+=`- [${c.name}](/r/kourt/kourtv2:${slug}) · ${slug.toUpperCase()} — ${c.claims.length} claims\n`;
    o+="\n## Courts\n\n";
    for(const [slug,c] of Object.entries(DEMO.courts)) if(c.tier===1) o+=`- [${c.name}](/r/kourt/kourtv2:${slug}) · ${slug.toUpperCase()} — ${c.claims.length} claims\n`;
    return o;
  }
  const c=demoCourt(parts[0]); if(!c) return "## Not found\nNo court by that slug.";
  if(parts.length===1){
    let o=`# ${c.name}\n\n- coin: ${parts[0].toUpperCase()} — this court's own coin, not interchangeable with any other court's\n- coin price: ${c.price} ugnot per unit (one-way; the GNOT is burned)\n- supply: ${c.supply} · emitted: ${c.emitted}\n- reward reservoir: ${c.reservoir} · senior queue owed: ${c.seniorOwed}\n\n## Claims\n\n`;
    // mirror the realm's render: newest 50 by descending id, then the footer
    const ids=[...c.claims].sort((a,b)=>b-a).filter(id=>!(DEMO.claims[parts[0]+"/"+id]||{}).hidden);
    for(const id of ids.slice(0,50)){ const d=DEMO.claims[parts[0]+"/"+id]; o+=`- [${d.title}](/r/kourt/kourtv2:${parts[0]}/${id}) — ${statusText(d)}\n`; }
    if(ids.length>50) o+=`\n…and ${ids.length-50} older; open any by id\n`;
    const dsp = demoStrips(parts[0]);
    if(dsp.strip.length){
      o+=`\n## Needs review\n\nClaims that are answered and not yet settled — nearest deadline first. This list ignores moderation: a claim hidden from the lists above still appears here while it can still be flagged.\n\n`;
      for(const r of dsp.strip) o+=`- [${r.title}](/r/kourt/kourtv2:${parts[0]}/${r.id})${r.deadline!=null?` — settles at height ${r.deadline}`:""}\n`;
    }
    if(dsp.pending.length){
      o+=`\n## Awaiting an answer\n\nSeeded and appeal claims that no one has answered yet.\n\n`;
      for(const r of dsp.pending) o+=`- [${r.title}](/r/kourt/kourtv2:${parts[0]}/${r.id}) — seeded by a moderator\n`;
    }
    o+=`\n[Moderation log](/r/kourt/kourtv2:${parts[0]}/mod)\n`;
    return o;
  }
  if(parts[1]==="mod"){
    // byte-shaped like renderModLog: header, the charter sentence, the m-of-n
    // line (never a member list), Awaiting approval (backticked action key +
    // count + expiry; reasons withheld until an act carries), then Acts rows
    // "row N · height H · code · by actor — reason". Seeding is never logged —
    // the realm has no seed act code. Each court tells its own story.
    let o = `# Moderation log — ${c.name}\n\nEvery moderation act on this court is recorded here: who acted, what they did, and when. Moderation controls what is listed; it never moves a coin or changes a verdict.\n\n`;
    if(parts[0]==="annex"){
      o += "## Moderators\n\n- 2 of 3 must agree for a moderation act\n\n";
      o += "## Acts\n\n";
      o += "- row 1 · height 4799600 · hide · by g1modalpha000000000000000000000000000000 — answered while under review; the strip keeps it policeable\n";
      o += "- row 1 · height 4799200 · global-hide:code-2026-041 · by g1metareview0000000000000000000000000000\n";
      o += "- row 1 · height 4798800 · hide · by g1modalpha000000000000000000000000000000 — duplicate of the reopening filing\n";
    } else if(parts[0]==="orem"){
      o += "## Moderators\n\n- 2 of 3 must agree for a moderation act\n\n";
      o += "## Awaiting approval\n\nProposals this set has started and not yet carried. An approval expires if the set does not reach its threshold in time; the reason is withheld until the act carries.\n\n";
      o += "- `hide:9` — 1 of 2 approved, expires at height 4915960\n\n";
      o += "## Acts\n\n";
      o += "- row 2 · height 4798000 · unhide · by g1modbeta0000000000000000000000000000000 — timeout ran its course; the record stands\n";
      o += "- row 1 · height 4797400 · hide · by g1modalpha000000000000000000000000000000 — duplicate of #6 pending its flag vote\n";
    } else {
      o += "## Moderators\n\n1-of-1 — g1ledgerfounder0000000000000000000000000 (the court's creator, until an election or an appointment changes it)\n\n_No moderation acts yet._\n";
    }
    return o;
  }
  const d=DEMO.claims[parts[0]+"/"+parts[1]]; if(!d) return "## Not found\nNo claim by that id.";
  let modq="";
  if(d.purged) modq="\n> **Removed on legal grounds** (tombstone). The claim's lifecycle is unaffected: stakes, verdict and refunds proceed.\n";
  else if(d.redacted) modq="\n> **Text withheld pending review.** IDs, state, deadlines and balances still render, so you can always act on a position.\n";
  else if(d.hidden) modq="\n> **Hidden by this court's moderators.** Listed nowhere, reachable here; the lifecycle is unaffected.\n";
  if(d.seeded) modq+="\n_Seeded by a moderator to start this court; the author earns nothing from it._\n";
  const inst=pctYes(d.yesStake,d.noStake);
  let o=`# ${d.title}\n${modq}\n## Signal\n\n- staked now: ${d.yesStake+d.noStake} (YES ${d.yesStake} / NO ${d.noStake})\n`;
  if(inst!=null) o+=`- instantaneous: ${inst}% YES\n`;
  o+=`\n## Status\n\n${statusText(d)}\n`;
  return o;
}

/* ============================ boot ==================================== */
function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme");
  const dark = t? t==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  document.getElementById("themelab").textContent = dark? "Light mode":"Dark mode";
}
function initControls(){
  const modesel=document.getElementById("modesel"), rpcwrap=document.getElementById("rpcwrap"),
        dot=document.getElementById("dot"), lab=document.getElementById("nodelab"),
        rpc=document.getElementById("rpc"), gnoweb=document.getElementById("gnoweb");
  rpc.value=CFG.rpc; gnoweb.value=CFG.gnoweb; modesel.value=CFG.mode;
  const preset=document.getElementById("preset");
  const PRESETS={gnodev:{rpc:"http://127.0.0.1:26657",gnoweb:"http://127.0.0.1:8888",chainid:"dev"},
                 sapphire:{rpc:"https://rpc.sapphire.testnets.gno.land:443",gnoweb:"https://sapphire.testnets.gno.land",chainid:"sapphire-1"}};
  const chainid=document.getElementById("chainid");
  chainid.value=CFG.chainid;
  chainid.onchange=()=>{ CFG.chainid=chainid.value.trim()||"dev"; saveCfg(); chainid.value=CFG.chainid; };
  // Blank clears it, which is how chat is turned off. re-render so the panel
  // appears or disappears without a reload.
  const chatin=document.getElementById("chat");
  if(chatin){
    // Leave it empty and unsaved and the served origin is used; the placeholder
    // says so, so the field is not a blank nobody knows how to fill.
    const dflt = defaultChatBase();
    chatin.placeholder = dflt ? dflt + "  (this site)" : "http://127.0.0.1:8791";
    chatin.value = (CFG.chat === undefined) ? "" : CFG.chat;
    chatin.onchange=()=>{ const v=chatin.value.trim();
      // Blank is a DECISION now, not an absence: it turns chat off and stays
      // off. Deleting the key would have handed it straight back to the
      // default on the next render.
      CFG.chat = v || "";
      saveCfg(); chatin.value=CFG.chat; render(); }; }
  preset.onchange=()=>{ const pz=PRESETS[preset.value]; if(!pz) return;
    CFG.rpc=pz.rpc; CFG.gnoweb=pz.gnoweb; CFG.chainid=pz.chainid;
    rpc.value=pz.rpc; gnoweb.value=pz.gnoweb; chainid.value=pz.chainid;
    saveCfg(); if(CFG.mode==="live") render(); };
  const reflect=()=>{ const live=CFG.mode==="live"; rpcwrap.hidden=!live;
    dot.className="dot "+(live?"live":"demo"); lab.textContent= live?"Live node":"Demo data";
    const gw=document.getElementById("gwrealm");
    if(gw){ gw.style.display = live? "inline-block":"none";
      gw.href = String(CFG.gnoweb||"").replace(/\/$/,"") + "/r/kourt/kourtv2"; } };
  modesel.onchange=()=>{ CFG.mode=modesel.value; saveCfg(); reflect(); render(); };
  rpc.onchange=()=>{ CFG.rpc=rpc.value.trim(); saveCfg(); rpc.value=CFG.rpc; if(CFG.mode==="live") render(); };
  gnoweb.onchange=()=>{ CFG.gnoweb=gnoweb.value.trim()||"https://gno.land"; saveCfg(); gnoweb.value=CFG.gnoweb; if(CFG.mode==="live") render(); };
  reflect();
  const walletbtn=document.getElementById("walletbtn");
  walletbtn.onclick=()=>{ CFG.addr? adenaDisconnect() : adenaConnect(); };
  reflectWallet();
  const themebtn=document.getElementById("themebtn");
  themebtn.onclick=()=>{ const cur=document.documentElement.getAttribute("data-theme");
    const dark = cur? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    CFG.theme = dark? "light":"dark"; saveCfg(); applyTheme(CFG.theme); };
}
applyTheme(CFG.theme);
initControls();
render().then(()=>{ const t=atTarget(); if(t){ t.focus({preventScroll:true}); t.scrollIntoView(); } });
</script>
