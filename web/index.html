        : `<div class="empty"><div class="g">◌</div><p>No claims filed directly in this folder.</p></div>`)
    + `</section>`;
});
/* one classifier for every status surface — pills, docket rows, map dots agree */
function phaseClass(statusText){
  // SIDE IS SEPARATE FROM SHORT, and must stay separate: mapDotClass switches on
  // short with an exact `===`, so folding "YES" into it silently drops a settled
  // claim to the open colour. The realm writes the side as sideName() — uppercase
  // YES or NO — so it is read off the ORIGINAL text, not the lowercased copy.
  // AND IT MUST FOLLOW THE WORD THAT DECIDES. `\b(YES|NO)\b` anywhere in the text
  // also matched the OPEN status — "open — stake YES or NO; unstake freely" — so
  // every open claim on the map and in the docket grew a side nobody had given it,
  // in demo mode as well, where that sentence is identical. The two forms that
  // carry a decision are the realm's "settled X" and "provisional verdict X"; the
  // match is anchored to them, and anything else has no side.
  const side=(/(?:settled|verdict|answered)\s+(YES|NO)\b/.exec(statusText||"")||[])[1]||"";
  const st=(statusText||"").toLowerCase(); let cls="void", short="open";
  if(/^closed|provclose/.test(st)){cls="void";short=/never answered/.test(st)?"never answered":"no decision";}
  else if(/settled/.test(st)){
    /* THE SETTLED COLOUR IS THE VERDICT'S, not a verdict-free "good". --good and
       --yes are the SAME green (#1c6551), and .pill.good is drawn with --yes-wash
       and the YES glow — so every settled claim was painted in the palette of the
       side that wins, including the ones that decided NO. The interface was
       announcing a NO verdict in the colour of YES.
       An unknown side gets neither: the claim is decided and which way is not
       known here, so it says that rather than guessing green. */
    cls = side==="YES" ? "good" : side==="NO" ? "verdict-no" : "decided";
    short="settled";
  }
  else if(/provisional/.test(st)){cls="escrow";short="provisional";}
  else if(/answered/.test(st)){cls="open";short="proposed";}
  else if(/disput/.test(st)){cls="escrow";short="in dispute";}
  return {cls, short, side};
}
function statusPill(statusText){
  const p = phaseClass(statusText);
  return `<span class="pill ${p.cls}">${esc(p.short)}${p.side? " "+esc(p.side):""}</span>`;
}
function docketRow(slug,c,meta){
  // A claim with no series is not always a claim awaiting a live fill: in demo
  // mode the row is final, and it used to render an empty cell for good.
  const px = (c.series || Number.isFinite(c.inst))
    ? `<span class="px">${docketSignal(c.series, c.inst)}</span>`
    : `<span class="px" id="spk-${esc(slug)}-${c.id}"></span>`;
  const sortKey = c.series ? c.series[2] : (Number.isFinite(c.inst) ? c.inst : null);
  return `<a class="crow${c.offp?" offp":""}" data-id="${c.id}"${sortKey!=null?` data-yes="${sortKey}"`:""} data-q="${esc("#"+c.id+" "+c.title)}" href="#/c/${esc(slug)}/${c.id}">
    <span class="id">#${c.id}</span>
    <span><span class="t">${safeInline(c.title)}</span>${meta?`<span class="m" style="display:block">${safeInline(meta.label)}</span>`:""}<span class="m" style="display:block" id="clk-${esc(slug)}-${c.id}">${(()=>{ const t=clockLine(isLive()? null:NOW, phaseClass(c.statusText).short, c.settleAt, c.escrowUntil); return t? esc(t):""; })()}</span></span>
    ${px}
    ${statusPill(c.statusText)}</a>`;
}

/* --- a claim: the stake panel + the three ratio series + resolution --- */
on(/^\/c\/([a-z0-9-]+)\/(\d+)$/, async (slug,idS)=>{
  loading();
  const id = parseInt(idS,10);
  if(!isLive() && !demoCourt(slug)){ main.innerHTML = crumbs([{label:"Directory",href:"#/"}]) + notFound("No court by that slug."); return; }
  let ccount = null;
  if(isLive()){
    const n = await one(`ClaimCount(${gstr(slug)})`).catch(()=>null);
    ccount = n;
    const idn = parseInt(id,10);
    if(n===null){ main.innerHTML = crumbs([{label:"Directory",href:"#/"}]) + notFound("No such court on this node (or the node did not answer)."); return; }
    if(idn<1 || idn>n){ main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:slug,href:"#/c/"+slug}]) + notFound("No claim by that id."); return; }
  }
  /* THE COURT, THE CLAIM, THE HEIGHT AND THE AUTHOR, ALL AT ONCE. These were four
     sequential awaits. Only one dependency is real — claimDetail's own later
     reads are gated on flags it fetches first — and courtStats, chainHeight and
     ClaimAuthor need nothing from each other or from the claim. Measured on
     kourt.xyz before this, a claim page walked twelve round trips of ~80ms while
     the node answered each in under a hundred. */
  const [cs, d, nowH, authorRead] = await Promise.all([
    courtStats(slug),
    claimDetail(slug, id),
    chainHeight(),
    // ClaimAuthor is in the packed record too, but claimDetail has not returned
    // yet at this point — so it stays a read, and is free when it hits the
    // 30-second client cache on the way back.
    isLive()? one(`ClaimAuthor(${gstr(slug)},${id})`).catch(()=>null) : null,
  ]);
  // titles for the association rows: demo reads its dataset; live reuses the
  // docket's own render read ONCE, and only when local curation has relations
  let assocLookup = null;
  const cu = curationFor(slug);
  {
    if(cu && cu.relations.length){
      if(!isLive()) assocLookup = i => { const dd=DEMO.claims[slug+"/"+i]; return dd? {title:dd.title, statusText:statusText(dd)} : null; };
      else try{
        const pl = await listClaims(slug);
        const by = Object.fromEntries(pl.map(c2=>[c2.id, {title:c2.title, statusText:c2.statusText}]));
        assocLookup = i => by[i] || null;
      }catch(_){ assocLookup = ()=>null; }
    }
  }
  if(!d){ main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:slug,href:"#/c/"+slug}]) + notFound("No claim by that id."); return; }
  // opened-by: a file names who opened it — one read, claim page only
  const author = isLive()? authorRead
                         : ((DEMO.claims[slug+"/"+id]||{}).author||null);
  /* ONTO d, not just into a local. This read existed only to print "opened by"
     and stayed a local variable, so every later question about who the author
     is answered undefined — including the participant guard on Open the
     rewards, which requires author, answerer and stake to all say no and
     therefore never fired at all. It greyed nothing, and a reader pressed the
     button and met the panic in their wallet. */
  if(author) d.author = author;
  // shortAddr() elides the middle — g1oremf…0000 — and the full address appears
  // nowhere else on this route, so reading the page aloud gave an address that
  // cannot be used. The elision is for the eye; the value is for everyone.
  const openedBy = author? `<span class="tfact">opened by <span class="mono" aria-hidden="true">${shortAddr(author)}</span><span class="sr-only">${esc(author)}</span></span>` : "";
  // moderation provenance: four booleans, claim route only; a failed read
  // renders nothing — the page makes no completeness certificate to defend
  let mHidden=null, mRedacted=null, mPurged=null, mSeeded=null, polishBlocks=null, tlRaw=null;
  if(isLive()){
    const s2m = gstr(slug);
    // polishBlocks rides along in the same round trip. It is the court's
    // stakeOpenDelay: zero on every court StartCourt made, and zero means the
    // title froze before the opening transaction returned. A realm too old to
    // answer leaves it null, which hides the offer — the safe direction, since
    // the alternative is a form the realm refuses.
    /* AND THE TIMELINE RIDES WITH THEM. It was a wave of its own, immediately
       after this one and needing nothing from it — one more 80ms round trip on a
       page that was making twelve. Parsed below, where it was. */
    /* FIVE OF THESE SIX ARE IN THE PACKED RECORD claimDetail already read, so
       they cost nothing here — only the timeline is free text and needs its own
       query. Where the realm is too old to answer ClaimHead, d.head is null and
       every one is asked the way it always was. */
    const H = d && d.head;
    [mHidden, mRedacted, mPurged, mSeeded, polishBlocks, tlRaw] = await Promise.all([
      H? H.hidden   : one(`HiddenFromListing(${s2m},${id})`).catch(()=>null),
      H? H.redacted : one(`TextRedacted(${s2m},${id})`).catch(()=>null),
      H? H.purged   : one(`ClaimPurged(${s2m},${id})`).catch(()=>null),
      H? H.seeded   : one(`ClaimSeeded(${s2m},${id})`).catch(()=>null),
      H? H.stakeOpenDelay : one(`CourtStakeOpenDelay(${s2m})`).catch(()=>null),
      one(`ClaimTimeline(${gstr(slug)},${id})`).catch(()=>null),
    ]);
  } else { const dd0=DEMO.claims[slug+"/"+id]||{};
    mHidden=dd0.hidden===true; mRedacted=dd0.redacted===true; mPurged=dd0.purged===true; mSeeded=dd0.seeded===true; }
  const seededSpan = mSeeded===true? `<span class="tfact">seeded by a moderator to start this court; the author earns nothing from it</span>` : "";
  // the recorded stake history — 2 qevals, claim page only; null falls back
  // to the three-ratio display byte-identically
  // the claim's clock, as the chain recorded it (dates, with heights beside)
  let tline=null;
  if(isLive()) tline = parseTimeline(tlRaw);
  else { const dd1=DEMO.claims[slug+"/"+id]||{}; tline = parseTimeline(dd1.timeline); }
  // ONE HEIGHT SPACE. chainHeight() reads the RPC's latest_block_height, which
  // knows nothing about the realm's test-height skew — and ClaimSeries records
  // its epochs against the REALM's height. On a seeded chain those are different
  // numbers by a wide margin (measured on one: realm 88,560, RPC 836), and
  // mergeStakeSeries clamps every sample with Math.min(sampleHeight, nowHeight)
  // before de-duplicating equal heights. So all fourteen of a claim's samples
  // clamped to 836, collapsed to one, and the chart drew a single point at `now`
  // — every claim on the chain, identically flat.
  //
  // The timeline already carries the realm's own height for the same instant
  // ("now:<unix>:<height>"), so use that when it is there. On an ordinary chain
  // it equals the RPC height and nothing changes; on a skewed one it is the only
  // value the series can be read against.
  const chainAssocs = await chainAssociations(slug, id);
  const seriesH = (tline && tline.now && tline.now.h != null)? tline.now.h : nowH;
  let ser=null;
  if(isLive()){ if(seriesH!=null) ser = await fetchStakeSeries(slug, id, seriesH); }
  else { const dh=DEMO.claims[slug+"/"+id]||{};
    ser = mergeStakeSeries(parseStakeSeries(dh.seriesH), parseStakeSeries(dh.seriesD), NOW); }
  // filed-under chip: local/sample curation only — the chain has no reverse
  // read, and a chip must assert nothing this page did not read
  const fmClaim = cu && cu.folders && cu.folders.length? folderMeta(cu.folders,"",{}) : {};
  const chip = fmClaim[id]? `<a class="tlink" href="#/c/${esc(slug)}/f/${esc(fmClaim[id].path)}" title="${cu.source==="local"? esc(CUR_LABEL) : "sample curation"}">filed under <span class="tname">${safeInline(fmClaim[id].label)}</span> · ${cu.source==="local"? "local":"sample"}</a>` : "";
  // live maps draw only the newest window — do not offer a link that dead-ends
  const mapLink = (mHidden!==true && (!isLive() || (ccount!=null && id>ccount-50)))? `<a class="tlink" href="#/c/${esc(slug)}/map?focus=${id}">on the map<span aria-hidden="true">→</span></a>` : "";
  const polish = polishLink(slug, id, d, mPurged, mRedacted, polishBlocks);
  main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:cs?cs.name:slug,href:"#/c/"+slug},{label:"Claim #"+id}])
    + `<h1 class="page-h">${safeInline(d.title)}</h1>`
    + claimBody(d)
    /* THE EVIDENCE, ON THE PAGE THE CLAIM ACTUALLY LIVES ON. claimDetail has
       always read ClaimMedia into d.media — the round trip was already paid —
       and only the map's selection card ever drew it. So a claim's exhibits
       appeared on gnoweb's Render() and on a card you reach by opening the map
       and clicking the right node, and were invisible on the page every link,
       every share and every search result points at. Right after the body,
       because the owner ruling is that everything filed with a claim counts as
       its text; evidence is not an appendix to the statement. */
    + claimEvidenceNote(d)
    + claimExhibits(d)
    + `<div class="tagrow">
        <span class="tfacts">${verdictBanner(d)}${openedBy}${seededSpan}</span>
        <span class="tacts">${polish}${chip}${mapLink}<a class="tlink" href="#/raw/${esc(slug)}/${id}">chain<span aria-hidden="true">→</span></a>
        <button type="button" class="tlink" data-help="share-dlg" aria-haspopup="dialog">share<span aria-hidden="true">↗</span></button><span id="boardchip"></span></span></div>`
    + shareDialog(slug, id, d, cs ? cs.name : slug)
    + modBanner(mPurged, mRedacted, mHidden, slug)
    /* THE CHART AND THE LADDER ARE ONE PANEL when the ticket beside them was
       boilerplate. They were saying the same thing in two boxes: the chart
       already draws opened / answered / settle deadline / vote closes / now as
       marked verticals, and the ladder gives those same events their dates. Side
       by side that is a redundancy AND a squeeze — the chart had 1.3 of 2.3
       columns to plot a week of movement in. Stacked, the chart is the full
       width of the section and the ladder reads as its axis spelled out.
       THE LADDER WENT BACK DOWNSTAIRS, though, and the chart answers for itself:
       hovering a point reads out that point's date and share, which is what the
       ladder under the plot was for and is a better version of it — it names the
       moment you are actually pointing at instead of five fixed ones. The
       section below keeps the ladder for what a hover cannot carry: a dateless
       failed round, a verdict, the events with no point on the line. */
    /* THE BALLOT SITS BESIDE THE CHART, not in a section below it.
       It used to render from resolutionSection, which is the Timeline — so on a
       disputed claim the one live action on the page was underneath the graph and
       under the round narrative, while the right-hand column beside the chart held
       a stake ticket that says only "staking is frozen". Reported: "still shows the
       vote buttons below the graph... i thought we moved it the right bar."
       ABOVE the stake ticket, because during a dispute staking IS frozen and the
       ballot is the only thing there to do.
       ONE CELL, not two children: .stakewrap is a two-column grid, so a third
       child would drop onto a second row under the chart — which is the position
       this move exists to get out of. Both tickets share the right cell.
       seriesH, not nowH: it is already the realm's height for this instant (the
       same expression resolutionSection derives), and every height the ballot
       compares is realm-space. */
    + (() => {
        const ballot = d.phase==="disputed"? disputeTicket(slug,id,d,seriesH) : "";
        const sideCol = ballot + (stakeTicketHasActions(d)? stakeTicket(slug,id,d) : "");
        return `<section><div class="sec-h">The signal${d.phase==="open"? ` <span class="count">staking live</span>`
            : d.phase==="closed"? ` <span class="count">claim died unanswered</span>` : ""}</div>
        <div class="stakewrap${sideCol?"":" solo"}">
          <div class="panel">${signalChart(slug,id,d,seriesH,ser,tline)}${stakeBar(d,slug)}${chartChips(d,slug)}</div>
          ${sideCol? `<div class="sidecol">${sideCol}</div>` : ""}
        </div></section>`;
      })()
    + resolutionSection(slug,id,d,nowH,tline)
    + rewardsSection(slug,id,d)
    + associationSection(slug,id,assocLookup,chainAssocs)
    + `<section id="claimcomments"></section>`;
  // Unconditional: the board is the one action on this page that needs no
  // address, and the sample answers it offline like everything else here.
  fillBoardChip(slug, id);
  /* THE REALM'S CLOCK ON BOTH SIDES OF THE COMPARISON. chainHeight() asks the
     RPC for the latest block; the verdict height comes from ClaimTimeline, which
     the realm answers from heightNow() — chain height PLUS the test skew. On a
     seeded chain those are different numbers by design (that is what the
     testclock marker in the timeline announces), and this passed one of each:
     3 against 23,040. The subtraction went negative, negative is less than the
     grace window, and so the guard greyed every claim on the chain forever.
     ClaimTimeline publishes `now` next to `verdict` precisely so a consumer can
     subtract two heights from the same clock. */
  fillStakeBalance(slug);
  fillUnstakeSides(slug, id);
  fillWithdrawSides(slug, id, d,
    tline && tline.now? tline.now.h : nowH,
    tline && tline.verdict? tline.verdict.h : null);
  fillClaimComments(slug, id);
  if(isLive() && CFG.addr && d.disputeOpen) fillVoteEligibility(slug,id,d);
  if(isLive() && CFG.addr) fillVoteCommitment(slug,id);
  // arrived from an embed's side button
  if(QP.side) focusStakeSide(QP.side);
  // ?ex=N opens that exhibit, after the list it indexes into has been drawn.
  openExhibitFromURL();
});

/* ===================== the board: a claim's comments ===================== */
/* THE ROW IS THE UNIT OF QUOTATION — somebody links to one comment and argues
   about it — so every row carries its author, the block it landed in and its own
   link. A citation without a date is half a citation on a claim whose market
   moves under it, which is why `at` is on the wire at all.

   TEXT IS ESCAPED AND PARAGRAPHED, NEVER INTERPRETED. board_test.gno asserts the
   realm does NOT sanitise on the wire — sanitising belongs to whoever renders —
   so re-reading a comment as markdown here would be a second, differently-shaped
   attack surface on a field any stranger can fill with 2000 bytes. This is the
   rule claimBody already applies to the claim's own statement. */
function boardText(s){
  const paras = String(s == null ? "" : s).split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  if(!paras.length) return `<p class="muted">(empty)</p>`;
  return paras.map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
}

/* HIDDEN ROWS ARE NOT DRAWN, on any surface here.

   They used to render as a tombstone apiece — "Hidden from this list. It still
   reads at its own link." — and on a board a moderator had just cleared of a
   griefing run, that was the loudest thing on the page: a line of cruft per
   comment removed, more prominent than the comments had been. The griefing
   survived its own removal.

   So the wire still CARRIES them, because dropping them there would make paging
   cost O(offset + hidden) with the hidden count chosen by whoever is hiding —
   and this layer drops them at the point of drawing instead. The count and the
   chain's own /board/hidden page are the record of what went; this list is for
   what was said. */
const boardVisible = rows => (rows || []).filter(r => r.mark === ".");

const gnowebRow = (slug, id, row) =>
  String(CFG.gnoweb || "").replace(/\/$/, "") + "/r/kourt/kourtv2:" + slug + "/" + id + "/board/" + row;

/* One row. `meta` is what the ORDERING knows about it — a reply count on Newest,
   a score on Top — rendered as the thing it is rather than as a bare number. */
function boardRowHtml(slug, id, r, meta, role){
  const link = esc(gnowebRow(slug, id, r.id));
  const body = boardText(r.text);
  return `<article class="boardrow" id="c${esc(String(r.id))}">`
    + `<div class="boardmeta"><span class="mono">${shortAddr(r.author)}</span>`
    + (role ? ` <span class="pill">${esc(role)}</span>` : "")
    + (meta ? ` · ${esc(meta)}` : "")
    + ` · block ${esc(String(r.at))}`
    + ` · <a class="mono" href="${link}" rel="noopener">#${esc(String(r.id))}</a></div>`
    + body + `</article>`;
}

/* THE CAP IS THE REALM'S, AND THE PAGE SAYS SO RATHER THAN PRETENDING. The realm
   serves at most maxBoardRepliesShown replies for any parent, while the parent's
   own reply count is the true one — so a thread with fourteen answers shows eight
   and would otherwise read as complete. */
function boardRepliesHtml(slug, id, parent, reps){
  if(!reps || !reps.length) return "";
  const total = parseInt(parent.replies, 10);
  const more = (isFinite(total) && total > reps.length)
    ? `<p class="board-more">${reps.length} of ${total} replies shown — `
      + `<a href="${esc(gnowebRow(slug, id, parent.id))}" rel="noopener">the rest are on the row's own page</a>.</p>`
    : "";
  return `<div class="boardkids">`
    + reps.map(r => boardRowHtml(slug, id, r, "", "")).join("") + more + `</div>`;
}

/* The count and the state, in one line, from the two reads the chip already
   knows how to make. BoardSize counts EVERY row — replies and tombstones — so
   this number and the chip's are the same number. */
function boardStateLine(n, open){
  const count = n + (n === 1 ? " comment" : " comments");
  return open
    ? `${count} · open for comments`
    : `${count} · closed — this claim has a verdict`;
}

const boardMetaNewest = r => { const n = parseInt(r.replies, 10);
  return n > 0 ? n + (n === 1 ? " reply" : " replies") : ""; };
const boardMetaTop = r => { const n = parseInt(r.score, 10);
  return isFinite(n) && n > 0 ? "score " + fmtN(n) : ""; };

/* ---- the sources, live and sample, behind one shape ---- */
async function boardNewestOf(slug, id, off, n){
  if(!isLive()){ const b = demoBoard(slug, id); return boardNewestRows((b && b.newest) || ""); }
  return await readBoardNewest(slug, id, off, n);
}
async function boardTopOf(slug, id, off, n){
  if(!isLive()){
    const b = demoBoard(slug, id);
    if(b && b.top) return boardTopRows(b.top);
    // COLD START, REPRODUCED RATHER THAN INVENTED. With nothing upvoted every row
    // scores zero and ties break on the row id, so Top IS Newest — minus the rows
    // the score index never holds, because scoreIndexPut refuses hidden ones.
    return boardNewestRows((b && b.newest) || "").filter(r => r.mark === ".")
      .map(r => ({id:r.id, author:r.author, score:"0", mark:".", at:r.at, text:r.text}));
  }
  return await readBoardTop(slug, id, off, n);
}
async function boardRepliesOf(slug, id, parent){
  if(!isLive()){
    const b = demoBoard(slug, id);
    return boardReplyRows((b && b.replies && b.replies[String(parent)]) || "");
  }
  return await readBoardReplies(slug, id, parent);
}
async function claimTitleOf(slug, id){
  if(!isLive()){ const d = DEMO.claims[slug+"/"+id]; return d ? d.title : null; }
  return await one(`ClaimTitle(${gstr(slug)},${id})`).then(unesc).catch(()=>null);
}


/* ===================== the composer: who may write, and why ==============
   EVERY BRANCH IS A DIFFERENT PERSON TURNED AWAY FOR A DIFFERENT REASON, and
   getting one wrong tells somebody a false thing about their own account. Pure,
   so each branch is a test rather than a screenshot.

   TWO TRAPS LIVE IN HERE, both from reading posting.gno rather than guessing:

   1. PassPrice == 0 HAS TWO CAUSES and the price alone cannot separate them. A
      court that has not sealed an epoch has no price yet; a court with zero
      supply also has none, AND `postLevel` evaluates `s >= sup*t1Bps/10_000` as
      `0 >= 0` and hands EVERY address level 3. Opposite situations, identical
      price. PostLevel is what tells them apart.

   2. "PostsAvailable == 0 means you are out for today" MISFIRES. PostsAvailable
      returns 0 for an address with no standing row AT ALL — and in a zero-supply
      court that address is simultaneously level 3, so a first-time visitor would
      be told they had used posts they never had. In that court the allowance is
      not readable from here, so this says so instead of asserting. The realm
      creates the row on the first write and decides at signing.

   A person is never told they have spent something they have not. */
function composerState(st){
  const at = h => "block " + fmtN(h);
  if(!st.boardOpen)
    return {can:false, why:"This claim has a verdict, so its board is closed. The comments stay readable."};
  if(st.claimFrozenUntil > st.now)
    return {can:false, why:"The court has paused this board until " + at(st.claimFrozenUntil) + "."};
  if(!st.addr)
    return {can:false, why:"Connect a wallet to comment.", connect:true};
  if(st.frozenUntil > st.now)
    return {can:false, why:"Your posting in this court is paused until " + at(st.frozenUntil) + "."};
  if(!(st.level > 0))
    return st.passPrice > 0
      ? {can:false, why:"You need standing in this court, or an entry pass.", buy:st.passPrice}
      : {can:false, why:"This court has not sealed an epoch yet, so an entry pass has no price to quote. "
                      + "Earn standing, or come back once it has."};
  if(st.posts > 0)
    return {can:true, why:"You can post " + st.posts + " more " + (st.posts === 1 ? "comment" : "comments") + " today."};
  if(st.supply === 0)
    return {can:true, why:"This court has no supply yet, so a daily allowance cannot be read here. "
                       + "The court decides when you sign."};
  return {can:false, why:"You have used today's " + st.perDay + " " + (st.perDay === 1 ? "comment" : "comments") + "."};
}

/* The box. `parent` is 0 for a new comment; the realm enforces depth one, so a
   reply to a reply is not offered. */
function composerHtml(slug, id, state, parent){
  const head = `<p class="composer-why">${esc(state.why)}</p>`;
  const extra = state.connect
    ? `<p class="composer-why"><button type="button" class="btn" data-walletconnect>Connect Adena</button></p>`
    : state.buy
      ? `<p class="composer-why">An entry pass costs ${cc(state.buy, slug)}, burned. `
        + `<a href="#/c/${esc(slug)}">Get one from the court page</a>.</p>`
      : "";
  if(!state.can) return `<section class="composer">${head}${extra}</section>`;
  return `<section class="composer">${head}
    <label class="composer-lab" for="composer-text">Your comment</label>
    <textarea id="composer-text" class="composer-text" rows="5" maxlength="${MAX_COMMENT_CHARS}"
      data-slug="${esc(slug)}" data-claim="${esc(String(id))}" data-parent="${esc(String(parent || 0))}"
      placeholder="What does the record actually say?"></textarea>
    <div class="composer-foot">
      <span class="composer-count" id="composer-count">0 of ${fmtN(MAX_COMMENT_CHARS)} characters</span>
      <button type="button" class="btn composer-post" data-authored="1" disabled>Review and sign</button>
    </div>
    <p class="composer-note">Comments cannot be edited or deleted. You may withdraw one from
      the list; the row and its text stay on chain.</p></section>`;
}

/* CODE POINTS, matching the realm's runeLen exactly.
   
   `String.length` is UTF-16 code UNITS, so an emoji counts twice there and once
   in Gno — the spread counts code points, which is what `for range s` yields.
   Getting this wrong in either direction is the same failure: a counter that
   disagrees with the chain lets somebody finish writing and lose it at signing,
   or stops them writing something that would have been accepted. */
const commentChars = s => [...String(s == null ? "" : s)].length;

/* ---- the reads behind it ---- */
async function composerReads(slug, id){
  const s = gstr(slug), a = CFG.addr;
  const base = {addr:a, now:0, boardOpen:true, claimFrozenUntil:0, frozenUntil:0,
                level:0, posts:0, perDay:0, passPrice:0, supply:null};
  if(!isLive()){
    // The sample answers what it can and no more: a demo board is open or not,
    // and no wallet is connected to it.
    const b = demoBoard(slug, id);
    return Object.assign(base, {addr:null, boardOpen: b ? b.open !== false : await boardOpenOf(slug, id)});
  }
  const [now, open, claimFrozen] = await Promise.all([
    chainHeight().then(h => h || 0).catch(()=>0),
    boardOpenOf(slug, id).catch(()=>true),
    one(`ClaimBoardFrozenUntil(${s},${id})`).catch(()=>0)]);
  Object.assign(base, {now, boardOpen:open, claimFrozenUntil:claimFrozen});
  if(!a) return base;
  const [frozen, level, posts, perDay] = await Promise.all([
    one(`BoardFrozenUntil(${s},${gstr(a)})`).catch(()=>0),
    one(`PostLevel(${s},${gstr(a)})`).catch(()=>0),
    one(`PostsAvailable(${s},${gstr(a)})`).catch(()=>0),
    one(`PostsPerDay(${s},${gstr(a)})`).catch(()=>0)]);
  Object.assign(base, {frozenUntil:frozen, level, posts, perDay});
  // CONDITIONAL, both of them: a price only matters when there is no level to
  // spend, and the supply only when the allowance reads zero at a level above
  // zero — which is the one case the two zero-causes are indistinguishable in.
  if(!(level > 0)) base.passPrice = await one(`PassPrice(${s})`).catch(()=>0);
  else if(!(posts > 0)) base.supply = await one(`CoinSupply(${s})`).catch(()=>null);
  return base;
}
async function fillComposer(slug, id, parent){
  const slot = document.getElementById("composer"); if(!slot) return;
  try{ slot.innerHTML = composerHtml(slug, id, composerState(await composerReads(slug, id)), parent || 0); }
  catch(_){ /* an unreadable court leaves the board readable; it just cannot be written to here */ }
}

/* THE CLAIM PAGE'S OWN COMMENTS, at the foot of the page.
   
   A chip at the top pointing at another route asked a reader to leave the page
   they came to read in order to find out whether leaving was worth it. The
   thread belongs where every other discussion on the web puts it: after the
   thing being discussed. The chip stays as a jump for people who want the full
   paged view, and the section here is the reading surface.

   BOUNDED, AND HONEST ABOUT THE BOUND. Only CLAIM_COMMENTS top-level rows, so a
   busy claim does not turn its own page into a forum; the tail says how many are
   behind the link. The parties keep the reserved slot they have on the board
   page, for the same reason — being able to answer a question about your own
   claim and have the answer seen. */
const CLAIM_COMMENTS = 4;

/* THE REMOVED COUNT, and where it sends a reader.
   
   A tombstone in the list says a row was withheld; this says how many, in one
   place, before anybody scrolls. It is a LINK because "2 removed comments" that
   cannot be followed is a claim a reader has to take on trust, which is the
   opposite of what this realm is for.
   
   IT LEAVES THE SITE, deliberately. kourt.xyz does not host an index of
   withheld content; the chain already serves every one of those rows at its own
   permalink, because a hide is a discovery bit and not a delete. The chain's
   page is also strictly better than anything this one could draw: it reads both
   hide-bits and says WHICH authority acted — "Removed from this listing by this
   court's moderators" against "Withdrawn from this listing" — where the wire
   collapses both to `h` on purpose and the overlay must not guess.
   
   THE COUNT COMES FROM THE CHAIN, not from the rows on the page. Tallying marks
   client-side undercounts the moment a board outgrows one page — and a number in
   a header that quietly means "of the ones we happened to fetch" is worse than
   no number. BoardHiddenCount walks the claim's top-level index and answers
   for the whole board; it is a read, so it costs no gas, and the realm takes the
   walk rather than a counter for the reason boardPartyRows gives one level up. */
function removedLink(slug, id, k){
  if(!(k > 0)) return "";
  return `<a class="tlink secact" rel="noopener" href="${esc(gnowebRow(slug, id, "withheld"))}">`
    + `${k} hidden comment${k === 1 ? "" : "s"}<span aria-hidden="true">↗</span></a>`;
}

function claimCommentsHtml(slug, id, n, open, rows, kids, roles, withheld){
  const head = `<div class="sec-h">Comments <span class="count">`
    + esc(n > 0 ? boardStateLine(n, open) : (open ? "open" : "closed")) + `</span>`
    + removedLink(slug, id, withheld) + `</div>`;
  if(!(n > 0)){
    return `<section id="claimcomments">${head}<div class="cmt-empty"><p>${open
      ? "No comments yet. The first one is worth writing."
      : "No comments were written while this board was open."}</p></div>`
      + `<div id="composer"></div></section>`;
  }
  const body = rows.map((r, i) =>
    boardRowHtml(slug, id, r, boardMetaNewest(r), roles[r.id] || "")
    + boardRepliesHtml(slug, id, r, kids[i])).join("");
  const shown = rows.length + kids.reduce((a, k) => a + k.length, 0);
  const tail = shown < n
    ? `<p class="board-more"><a class="tlink" href="#/c/${esc(slug)}/${id}/board">`
      + `all ${esc(String(n))} comments<span aria-hidden="true">→</span></a></p>`
    : "";
  return `<section id="claimcomments">${head}<div class="boardlist">${body}${tail}</div>`
    + `<div id="composer"></div></section>`;
}

/* The reads, and the ordering matters: BoardSize first, so a claim nobody has
   commented on costs one read and renders an invitation rather than a thread. */
async function fillClaimComments(slug, id){
  const slot = document.getElementById("claimcomments");
  if(!slot) return;
  try{
    const [n, open] = await Promise.all([boardSize(slug, id), boardOpenOf(slug, id)]);
    if(!(n > 0)){
      slot.outerHTML = claimCommentsHtml(slug, id, 0, open, [], [], {});
      fillComposer(slug, id, 0);
      return;
    }
    // Filtered BEFORE the slice, or a page of hidden rows would render as a
    // page of nothing while the board had plenty to show.
    const rows = boardVisible(await boardNewestOf(slug, id, 0, BOARD_PAGE)).slice(0, CLAIM_COMMENTS);
    const parties = boardVisible(await boardParties(slug, id).catch(()=>[]));
    const roles = {}; parties.forEach(r => { roles[r.id] = r.role; });
    const kids = await Promise.all(rows.map(r =>
      parseInt(r.replies, 10) > 0 ? boardRepliesOf(slug, id, r.id).catch(()=>[])
                                  : Promise.resolve([])));
    slot.outerHTML = claimCommentsHtml(slug, id, n, open, rows, kids, roles,
                                       await boardHiddenOf(slug, id).catch(()=>0));
    fillComposer(slug, id, 0);
  }catch(_){ /* an unreadable board leaves the rest of the claim page intact */ }
}

const BOARD_PAGE = 25;

async function boardView(slug, idS, ranked){
  const id = parseInt(idS, 10);
  const title = await claimTitleOf(slug, id);
  const crumb = crumbs([{label:"Directory",href:"#/"},{label:slug,href:"#/c/"+slug},
    {label:"Claim #"+id, href:"#/c/"+slug+"/"+id},{label:"Comments"}]);
  if(title == null){ main.innerHTML = crumb + notFound("No claim by that id."); return; }

  const [n, open] = await Promise.all([boardSize(slug, id), boardOpenOf(slug, id)]);
  // ONE READ DECIDES WHETHER THE RANKED VIEW IS WORTH OFFERING. Cold start puts
  // every un-upvoted row in the score index at zero, so Top is byte-for-byte
  // Newest on a board nobody has upvoted — a toggle between two identical pages
  // is worse than no toggle at all.
  const probe = n > 0 ? await boardTopOf(slug, id, 0, 1).catch(()=>[]) : [];
  const rankable = probe.length > 0 && parseInt(probe[0].score, 10) > 0;

  let head = crumb
    + `<h1 class="page-h">Comments</h1>`
    + `<p class="board-on">on <a href="#/c/${esc(slug)}/${id}">${safeInline(title)}</a></p>`
    + `<div class="tagrow"><span class="tfacts">${esc(boardStateLine(n, open))}</span>`
    + `<span class="tacts">`
    + (rankable
        ? (ranked
            ? `<a class="tlink" href="#/c/${esc(slug)}/${id}/board">newest first<span aria-hidden="true">→</span></a>`
            : `<a class="tlink" href="#/c/${esc(slug)}/${id}/board/top">best first<span aria-hidden="true">→</span></a>`)
        : "")
    + `<a class="tlink" href="#/c/${esc(slug)}/${id}">back to the claim<span aria-hidden="true">→</span></a></span></div>`;

  if(!(n > 0)){
    main.innerHTML = head + `<div class="empty"><p>${open
      ? "No comments yet. The first one is worth writing."
      : "No comments were written while this board was open."}</p></div>`
      + `<div id="composer"></div>`;
    fillComposer(slug, id, 0);
    return;
  }

  const rows = boardVisible(ranked ? await boardTopOf(slug, id, 0, BOARD_PAGE)
                                   : await boardNewestOf(slug, id, 0, BOARD_PAGE));
  // The parties are badged IN PLACE rather than pinned above the list: this page
  // is the list, and a reserved copy at the top is the duplicate the realm's own
  // render had to grow a `seen` set to stop printing.
  const parties = boardVisible(await boardParties(slug, id).catch(()=>[]));
  const role = {}; parties.forEach(r => { role[r.id] = r.role; });

  // Replies only where the ordering says there are some. Top carries no reply
  // count, so it lists parents alone — the thread reads on the Newest page.
  const kids = ranked ? [] : await Promise.all(rows.map(r =>
    parseInt(r.replies, 10) > 0 ? boardRepliesOf(slug, id, r.id).then(boardVisible).catch(()=>[]) : Promise.resolve([])));

  const meta = ranked ? boardMetaTop : boardMetaNewest;
  const body = rows.map((r, i) => boardRowHtml(slug, id, r, meta(r), role[r.id] || "")
    + (ranked ? "" : boardRepliesHtml(slug, id, r, kids[i]))).join("");

  // COUNT WHAT IS ON THE PAGE, NOT THE TOP-LEVEL ROWS. `n` is BoardSize, which
  // counts EVERY row — replies and tombstones included — so comparing it against
  // rows.length made a fully-displayed board announce "3 of 4 shown" while
  // showing all four. The replies are on the page; they belong in the number
  // that says how much of the board is.
  const shown = rows.length + kids.reduce((a, k) => a + k.length, 0);
  const tail = shown < n
    ? `<p class="board-more">${shown} of ${n} shown — `
      + (ranked
          ? `the ranked ordering holds neither replies nor withheld rows.`
          : `<a href="#/raw/${esc(slug)}/${id}">the chain's own page</a> serves the rest.`)
      + `</p>`
    : "";
  // BELOW THE LIST, and only on Newest. A reader arrived to read; the box that
  // asks them to write belongs after what they came for. The ranked page is a
  // view of the same board — two composers on two routes for one board would be
  // two places to lose a draft.
  main.innerHTML = head + `<section class="boardlist">` + body + tail + `</section>`
    + (ranked ? "" : `<div id="composer"></div>`);
  if(!ranked) fillComposer(slug, id, 0);
}
on(/^\/c\/([a-z0-9-]+)\/(\d+)\/board$/,      async (slug,id)=> boardView(slug, id, false));

/* The glyph a name asks for, or null when nothing does.

   put a face on every court that failed to mention its own subject. Courts ask

function subjectGlyph(name, personFallback){
  const n = String(name||"").toLowerCase().trim();
  if(!n) return null;
  for(const [key, re] of SUBJECT_WORDS) if(re.test(n)) return SUBJECT_GLYPHS[key];
  if(personFallback && /^[a-z][a-z.'-]*$/.test(n)) return SUBJECT_GLYPHS.person;

/* A COURT'S FACE. Every court looked the same above the fold — a name, a seal

function fnv1a(str){ let h=0x811c9dc5>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }

    : (d.trailYesMature&&d.trailOImature&&d.trailOI>0? Math.round(1000*d.trailYesAvg/d.trailOI)/10 : null);

function demoSeries(slug,id,r){
  if(![r.inst,r.life,r.week].every(Number.isFinite)) return null;

/* The real record (stakeseries.gno): "grain,width,now,more;epoch:yes:no,…".

  if(typeof raw!=="string") return null;

/* HEIGHTS ARE WHAT THE CHAIN RECORDS; DATES ARE WHAT A READER CAN CHECK.

   Returns null rather than guessing when there is no anchor: an undated axis is
   better than a wrong one.

   EVERY ANCHOR THE CHAIN GIVES, NOT ONE. This took tl.now alone and walked
   backwards at a flat BLOCK_SECS, which assumes a chain that has never paused,
   never been restarted and never had its clock moved. Any of those and the
   error compounds with distance: on a seeded chain the ladder read the answer
   at "11 Nov 2021, 1860 days ago" — the block's own stamp — while the chart
   dated the same region four days back, because 5s a block over that span is
   hundreds of times more blocks than the chain actually produced. Two surfaces,
   one event, five years apart.

   verdict and now, so the map is piecewise-linear through the points the chain
   actually reached and exact at every one of them. Before the first anchor it
   continues at the first segment's own rate — that is still history.

   PAST THE LAST ANCHOR IT USES BLOCK_SECS, and that asymmetry is the point. An
   observed rate describes what a chain DID; it does not predict what it will
   do. Carrying it forward off a chain that had been down for most of its life
   turned a vote closing in five days into "25 Mar 2032 · in ≈1927.2d", because
   the seconds-per-block between the answer and now were hundreds of times the
   nominal and the extrapolation inherited all of it. Ahead of now the only
   honest number is the cadence the chain is trying to keep, which is also what
   the ladder beside the chart projects with — so the two now agree instead of
   disagreeing by six years.

   one to date the past would feed the page's own guess back in as evidence. */
function heightDater(tl){
  if(!tl || !tl.now) return null;
  const A = ["opened","answered","verdict","now"]
    .map(k=>tl[k])
    .filter(e=>e && e.t>0 && isFinite(e.h))
    .sort((a,b)=>a.h-b.h)
    .filter((e,i,all)=>i===0 || e.h!==all[i-1].h);

  // nominal interval, which is what this function did everywhere before.
  const rate=(p,q)=>{ const r=(q.t-p.t)/(q.h-p.h); return isFinite(r)&&r>0? r : BLOCK_SECS; };
  if(A.length===1) return h => A[0].t + (h-A[0].h)*BLOCK_SECS;
  return h => {
    if(h<=A[0].h) return A[0].t + (h-A[0].h)*rate(A[0],A[1]);
    for(let i=1;i<A.length;i++)
      if(h<=A[i].h) return A[i-1].t + (h-A[i-1].h)*rate(A[i-1],A[i]);

/* WHAT HAS HAPPENED TO THIS CLAIM, dated — the lane the claim page devotes a

              : (demo&&ds? ds.x0 : Math.min(now-WEEK, ...(ansH!=null?[ansH]:[])));
  let x1 = Math.max(...cands);
  const pad=(x1-x0)*.04||1; const d0=x0-pad, d1=x1+pad;
  // A long daily tail would crush the dense hourly week on one linear scale —
  // give the week 65% of the plot when the tail exceeds a week (the knee).
  const hs = now-WEEK;
  const knee = !!real && (hs-x0>WEEK);
  const Xs = +(PL+0.35*(PR-PL)).toFixed(1);
  const X = knee
    ? h=>{ h=Math.max(d0,Math.min(d1,h));
        return h<=hs? +(PL+(h-d0)/(hs-d0)*(Xs-PL)).toFixed(1)
                    : +(Xs+(h-hs)/(d1-hs)*(PR-Xs)).toFixed(1); }
    : h=>+(PL+(h-d0)/(d1-d0)*(PR-PL)).toFixed(1);
  /* HOW FAR OFF, BY THE CHAIN'S CLOCK. This multiplied a height difference by
     BLOCK_SECS — the same flat-cadence assumption heightDater used to make, and
     wrong in the same direction: the strip read "≈3.8d ago" over a first record
     the ladder dated five years back. The dater already knows what the chain
     did between two heights, so ask it, and keep the nominal interval only for
     a realm that publishes no timeline to ask. */
  const zdt = heightDater(tl);
  const days=h=> zdt
    ? Math.round(Math.abs(zdt(now)-zdt(h))/86400*10)/10
    : Math.round(Math.abs(now-h)*BLOCK_SECS/86400*10)/10;
  const ago=h=> h===now? "now" : (h<now? "≈"+days(h)+"d ago" : "in ≈"+days(h)+"d");
  // frame
  let g=`<line class="grid" x1="${PL}" y1="${y(100)}" x2="${PR}" y2="${y(100)}"></line>
<line class="mid" x1="${PL}" y1="${y(50)}" x2="${PR}" y2="${y(50)}"></line>
<line class="axis" x1="${PL}" y1="${Y0}" x2="${PR}" y2="${Y0}"></line>
`;
  /* WHAT A HOVER CAN READ OUT. Every point the chart actually draws, as
     x,y,height,share — the readout names the moment the pointer is on rather
     than the five fixed ones a ladder under the plot could list. Collected while
     the series is drawn so it cannot drift from the shape: one loop, one truth. */
  const hov=[], hovev=[];
  const endY = Number.isFinite(r.inst)? y(r.inst) : null;
  /* RIGHT-ANCHORED, so the gutter holds them at any font size. Left-anchored at
     610 they ran past the 640-unit viewBox the moment the mobile rules scaled
     them up, and stayed visible only because the svg does not clip — one
     ancestor with overflow:hidden and the readings would have vanished. */
  /* The top tick's baseline has a floor. ty+3 puts "100" three units under the
     100% line, which fits a 12-unit font and not the 20-unit one the mobile
     rules apply — there its cap height reached above the viewBox, and only the
     svg's lack of clipping kept it on screen. */
  /* A TICK BEHIND THE END READOUT IS MARKED, NOT DROPPED. It used to be omitted
     outright when the readout would sit on it — which was right while the
     readout was always drawn, and became a hole the moment the mobile rules
     hid the readout: the scale lost its top number to make room for something
     that was not there. The emitter says "this one is covered"; the breakpoint
     that uncovers it puts it back. */
  [[100,y(100)],[50,y(50)],[0,Y0]].forEach(([t,ty])=>{
    const covered = endY!=null && Math.abs(ty-endY)<11;
    g+=`<text class="tickL${covered?" covered":""}" x="638" y="${Math.max(ty+3,19)}" text-anchor="end">${t}</text>`; });
  // washes (under marks): 72h window, escrow reopenable, scheduled future
  if(now<d1) g+=`<rect class="washf" x="${X(now)}" y="${Y100}" width="${(X(d1)-X(now)).toFixed(1)}" height="${Y0-Y100}"></rect>`;
  if(ansH!=null && d.settleAt) g+=`<rect class="wash" x="${X(ansH)}" y="${Y100}" width="${(X(Math.min(d.settleAt,d1))-X(ansH)).toFixed(1)}" height="${Y0-Y100}"></rect>`;
  if(d.escrowUntil && d.escrowUntil>now) g+=`<rect class="wash" x="${X(now)}" y="${Y100}" width="${(X(Math.min(d.escrowUntil,d1))-X(now)).toFixed(1)}" height="${Y0-Y100}"></rect>`;
  // series: the recorded path (both modes), else demo synthesis, else live marks
  if(real){
    const frozen = d.phase!=="open" && ansH!=null;
    const endH = frozen? Math.min(now, Math.max(ansH, real.pts[real.pts.length-1][0])) : now;
    let seg=null, lastShare=null; const dParts=[], aParts=[];
    const closeSeg=(toH,snapTo)=>{ if(!seg) return;
      let tail=` H ${X(toH)}`;
      if(snapTo!=null && Math.abs(seg.share-snapTo)>0.05) tail+=` V ${y(snapTo)}`;
      dParts.push(seg.d+tail);
      aParts.push(`M ${seg.sx} ${Y0} L ${seg.sx} ${seg.y0}`+seg.a+` L ${X(toH)} ${seg.cur} L ${X(toH)} ${Y0} Z`);
      seg=null; };
    for(let i=0;i<real.pts.length;i++){
      const [h,sh]=real.pts[i];
      if(sh==null){ closeSeg(h,null); continue; }
      const xx=X(h), yy=y(sh);
      if(!seg) seg={sx:xx, y0:yy, d:`M ${xx} ${yy}`, a:"", cur:yy, share:sh};
      else { seg.d+=` H ${xx} V ${yy}`; seg.a+=` L ${xx} ${seg.cur} L ${xx} ${yy}`; seg.cur=yy; seg.share=sh; }
      hov.push([xx,yy,h,sh]);
      lastShare=sh;
    }
    closeSeg(endH, (!frozen && Number.isFinite(r.inst))? r.inst : null);
    aParts.forEach(a2=>{ g+=`<path class="ar" d="${a2}"></path>`; });
    dParts.forEach(d2=>{ g+=`<path class="ln" d="${d2}" fill="none"></path>`; });
    if(Number.isFinite(r.life)) g+=`<line class="ref" x1="${PL}" y1="${y(r.life)}" x2="${PR}" y2="${y(r.life)}"><title>Lifetime conviction ratio ${r.life}% YES.</title></line>`;
    // seam: the hourly window's left edge, when older points exist
    if(real.pts.some(p2=>p2[0]<hs) && hs>d0){
      g+=`<line class="seam" x1="${X(hs)}" y1="${Y100}" x2="${X(hs)}" y2="${Y0}"></line>`;
      // The seam label stays in the plot — it marks a POSITION on the axis, not
      // an end of the window — so it keeps its own class now that .zone has
      // left, and sits under the axis rather than on the row the strip used.
      const sxm=X(hs); if(sxm>=190 && sxm<=430) g+=`<text class="seamL" x="${sxm+4}" y="139">−7d · hourly</text>`;
    }
    const endShare = (!frozen && Number.isFinite(r.inst))? r.inst : lastShare;
    if(endShare!=null){
      g+=`<circle class="end" cx="${X(endH)}" cy="${y(endShare)}" r="4"></circle>
<text class="endL" x="638" text-anchor="end" y="${y(endShare)+4}">${endShare}%</text><text class="endS" x="638" text-anchor="end" y="${y(endShare)+18}">${d.phase!=="open"?"frozen":"YES now"}</text>`;
    }
  } else if(demo && ds){
    const sx=f=>X(ds.x0+f*ds.span);
    ds.pts.forEach(pt=>hov.push([sx(pt[0]), y(pt[1]), Math.round(ds.x0+pt[0]*ds.span), pt[1]]));
    const P=ds.pts.map(pt=>`${sx(pt[0])},${y(pt[1])}`).join(" ");
    g+=`<path class="ar" d="M ${sx(0)} ${Y0} L ${P.split(" ").join(" L ")} L ${sx(1)} ${Y0} Z"></path>`;
    g+=`<polyline class="ln" points="${P}"></polyline>`;
    g+=`<circle class="end" cx="${sx(1)}" cy="${y(r.inst)}" r="4"></circle>
<text class="endL" x="638" text-anchor="end" y="${y(r.inst)+4}">${r.inst}%</text><text class="endS" x="638" text-anchor="end" y="${y(r.inst)+18}">${d.phase!=="open"?"frozen":"YES now"}</text>`;
  } else if(!demo){
    if(Number.isFinite(r.life)) g+=`<g><line class="ref" x1="${PL}" y1="${y(r.life)}" x2="${PR}" y2="${y(r.life)}"></line><circle class="hit" cx="${(PL+PR)/2}" cy="${y(r.life)}" r="10"><title>Lifetime conviction ratio ${r.life}% YES — stake × time over the claim's whole history.</title></circle><circle class="evtDot" cx="${(PL+PR)/2}" cy="${y(r.life)}" r="0"></circle><text class="evtL" x="${PL+2}" y="${y(r.life)-5}">lifetime ${r.life}%</text></g>`;
    if(Number.isFinite(r.week)) g+=`<g><line class="band" x1="${X(Math.max(now-WEEK,d0))}" y1="${y(r.week)}" x2="${X(now)}" y2="${y(r.week)}"></line><circle class="hit" cx="${X(now-WEEK/2)}" cy="${y(r.week)}" r="10"><title>Trailing-week average ${r.week}% YES over the last ≈7 days.</title></circle><circle class="evtDot" cx="${X(now-WEEK/2)}" cy="${y(r.week)}" r="0"></circle></g>`;
    else g+=`<text class="note" x="${(PL+PR)/2}" y="${y(50)-8}" text-anchor="middle">trailing week — not enough history</text>`;
    if(Number.isFinite(r.inst)) g+=`<circle class="end" cx="${X(now)}" cy="${y(r.inst)}" r="4"></circle>
<text class="endL" x="638" text-anchor="end" y="${y(r.inst)+4}">${r.inst}%</text><text class="endS" x="638" text-anchor="end" y="${y(r.inst)+18}">${d.phase!=="open"?"frozen":"YES now"}</text>`;
  }
  // event markers (shared anatomy); labels alternate above/below
  const evts=[];
  if(real){ if(!real.capped) evts.push([real.firstH,"records begin","The chain's stake record for this claim begins at ≈block "+fmtN(real.firstH)+" ("+ago(real.firstH)+")."]); }
  /* THE WINDOW'S START IS NOT THE CLAIM'S OPENING, and this marker called it
     "opened" for as long as nothing made it say WHEN. demoSeries picks x0 as
     now minus a randomised one-to-two-week span — the shape's own left edge,
     the oldest of the three anchors it is drawn from — and the claim was
     opened whenever the chain says it was, which on the sample's claim 3 is
     four days earlier. The hover readout printed both and the ladder printed
     the other one, which is how a label that had been wrong all along became
     visible. It says what it is now; the real opening gets its own mark when it
     falls inside the window, and honestly does not appear when it does not. */
  else if(demo && ds){
    evts.push([ds.x0,"window start","Where the synthesized shape begins — the oldest of the three anchors it is drawn from, not the claim's opening."]);
    if(tl && tl.opened && tl.opened.h>ds.x0 && tl.opened.h<now)
      evts.push([tl.opened.h,"opened","The claim was opened at ≈block "+fmtN(tl.opened.h)+" ("+ago(tl.opened.h)+")."]);
  }
  if(ansH!=null && ansH>=d0) evts.push([ansH,"answered"+(d.answer!=null?" "+sideName(d.answer).toLowerCase():""),"An answer was posted at ≈block "+fmtN(ansH)+"; the 72-hour window runs from here."]);
  /* ONLY WHILE IT IS THE OPERATIVE CLOCK, which is the rule the ladder follows
     and the chart did not. SettleDeadline is the date an UNDISPUTED answer
     would settle on, and the realm keeps publishing it after a dispute has
     taken over — so a disputed claim carried a marker for a deadline that
     stopped meaning anything the moment somebody disputed, while the ladder
     under it had already dropped that row. Two surfaces, one claim, different
     answers about what its clock is. */
  if(d.settleAt && d.phase==="answered") evts.push([d.settleAt,"settle deadline","An undisputed answer settles at ≈block "+fmtN(d.settleAt)+" ("+ago(d.settleAt)+")."]);
  if(d.escrowUntil) evts.push([d.escrowUntil,"reopen closes","The reopen window closes at ≈block "+fmtN(d.escrowUntil)+" ("+ago(d.escrowUntil)+")."]);
  if(d.voteEndsAt) evts.push([d.voteEndsAt,"vote closes","The dispute vote's scheduled close at ≈block "+fmtN(d.voteEndsAt)+" ("+ago(d.voteEndsAt)+")."]);
  evts.push([now,"now","Chain height ≈"+fmtN(now)+"."]);
  evts.sort((a,b)=>a[0]-b[0]);
  evts.forEach((e,i)=>{
    const x=X(Math.max(d0,Math.min(d1,e[0]))), above=i%2===0;
    const ly= above? 22+((i>>1)%2)*11 : 112-((i>>1)%2)*11;
    /* NOW IS THE ONE MARK A READER LOOKS FOR FIRST, and it was a 3px dot in a
       row of identical 3px dots — the line dividing what happened from what is
       scheduled, drawn exactly like the schedule. It gets its own class: a full
       height rule rather than a stub, a ringed dot on the axis, and a label in
       the accent rather than the muted grey the other events share. */
    const isNow = e[0]===now;
    /* A LABEL THAT WOULD RUN OFF THE PLOT GROWS THE OTHER WAY. These were always
       start-anchored and clamped to x=560, which is a guess that holds only at
       the desktop font: at the mobile size "settle deadline" is 128 units wide
       and ran to 688 in a 640-unit box, saved from disappearing only by the svg
       not clipping. The width is estimated at the LARGEST font the stylesheet
       ever applies, so the flip is decided for the worst case rather than for
       the one the emitter happens to imagine. */
    const wide = e[1].length*12;
    const flip = x + 4 + wide > PR;
    /* THE EVENTS ARE HOVERABLE TOO. The readout began as a thing for the series
       and left every marker answering only through a native <title> — so
       pointing at "settle deadline" or at "now", the two marks a reader is most
       likely to point AT, gave a slow grey tooltip with a block height in it
       while the line beside them gave a date. Same surface, two manners.
       The drawn x, so the target is where the mark actually is (an event past
       the domain is clamped, and the hit has to follow it there); the event's
       own height for the date, so the readout names when it happens rather than
       where it had to be drawn. */
    hovev.push([x, zdt? Math.round(zdt(e[0])) : 0, e[1]]);
    g+=`<g class="${isNow?"evNow":"ev"}"><line class="${isNow?"evtnow":"evt"}" x1="${x}" y1="${isNow?Y100:(above?ly+3:Y100)}" x2="${x}" y2="${isNow?Y0:(above?Y0:ly-9)}"></line>`
      + `<circle class="hit" cx="${x}" cy="${Y0}" r="10"><title>${esc(e[2])}</title></circle>`
      + (isNow? `<circle class="nowHalo" cx="${x}" cy="${Y0}" r="6"></circle><circle class="nowDot" cx="${x}" cy="${Y0}" r="3.2"></circle>`
              : `<circle class="evtDot" cx="${x}" cy="${Y0}" r="3"></circle>`)
      + `<text class="${isNow?"evtL nowL":"evtL"}" x="${flip? Math.max(x-4,PL+2) : Math.min(x+4,560)}"`
      + `${flip?` text-anchor="end"`:""} y="${ly}">${esc(e[1])}</text></g>`;
  });
  // zone strip
  // THE STRIP UNDER THE PLOT SAYS WHEN, NOT WHICH BLOCK. It read "block
  // 4,596,480 · ≈11.8d ago" — most of its width spent on the chain's internal
  // index, and this strip is the chart's only statement of absolute time. Date
  // first, distance second; the height is still on every event's own tooltip for
  // anyone who wants it, and is still the fallback with no anchor to date from.
  const stamp = h => zdt? stampDate(zdt(h)) : `block ${fmtN(Math.round(h))}`;
  const zl = real? `${stamp(Math.round(x0))} · ${ago(Math.round(x0))}${demo?" · sample":""}`
    : demo? `sample window ≈${Math.round((ds?ds.span:WEEK)*BLOCK_SECS/86400)}d · synthesized shape` : `${stamp(Math.round(x0))} · ${ago(Math.round(x0))}`;
  /* THE RIGHT LABEL DESCRIBES THE RIGHT EDGE, and it used to describe `now`
     wherever now happened to be. The domain runs to the furthest event in
     `cands` — a settle deadline, a reopen close, a vote close — so on any claim
     with something scheduled ahead of it, `now` is a vertical somewhere in the
     middle of the plot while the axis end was labelled with now's date. A reader
     comparing the strip to the ladder found the chart ending on the 15th and the
     vote closing on the 25th, ten days past an axis that claimed to stop today.
     ago() already answers both cases: it returns "now" when the edge IS now, and
     "in ≈Nd" when the plot runs past it, so one expression covers a claim with
     nothing scheduled and a claim with a vote still to close. */
  const xEnd = Math.round(x1);
  const zr = (demo && !real)? ago(xEnd) : `${stamp(xEnd)} · ${ago(xEnd)}`;
  /* THE STRIP IS HTML NOW, NOT TEXT IN THE PLOT. Inside the svg its two ends
     were absolutely placed at PL and PR, which holds only while they are short:
     the mobile rules scale chart text to 20 units in a 640-unit viewBox — the
     right call for legibility on a narrow screen — and at that size "12 Aug 2026
     · ≈5.8d ago · sample" and "19 Aug 2026 · in ≈0.5d" ran straight through each
     other. Nothing caught it because the enlarged size was never measured.
     As a flex row under the plot it cannot collide at any size: it wraps, the
     ends stay apart, and the font is ordinary CSS instead of a user-unit guess
     that has to be re-tuned per breakpoint. */
  const zstrip = `<div class="chartzone"><span>${esc(zl)}</span><span>${esc(zr)}</span></div>`;
  const capR=[["now",r.inst],["week",r.week],["lifetime",r.life]].map(([k,v])=>`${k} ${Number.isFinite(v)?v+"%":"—"}`).join(" · ");
  const aria = real
    ? `${demo? "Sample data in the chain's real form — ":""}YES-share of stakes, recorded history: ${ser.pts.length} change points since block ${fmtN(real.firstH)}; ${capR}; events at real block heights.`
    : demo
    ? `Sample data: synthesized YES-share shape anchored to lifetime ${r.life}%, trailing week ${r.week}%, now ${r.inst}%.`
    : `YES-share of stakes: ${capR}; events at real block heights.`;
  /* NO CAPTION ROW. It named the axis ("YES-share of stakes"), the three series
     the chart already draws, and then printed the three ratios a second time —
     over a chart whose own axis is labelled, above a bar that states the split
     in the same numbers, under a section heading that says THE SIGNAL. Nothing
     is lost to a screen reader: the aria-label above still carries the ratios,
     the change-point count and the first block, which is more than the caption
     ever said.

     THE SOURCE NOTE SURVIVES ONLY WHERE IT IS A DISCLOSURE. On a live claim it
     was trivia about the sampling interval; in demo mode it is the sentence
     that stops a reader mistaking sample data for a court's record, and that is
     not decoration. */
  const srcnote = !demo? ""
    : real? `sample data — a sample series in the chain's real form (hourly for a week, daily beyond; a flat run means the pools did not change). YES-share of stakes, not a price.`
    : `sample data — a synthesized shape anchored to the claim’s three real ratios (lifetime conviction · trailing week · now). YES-share of stakes, not a price. This shape is illustrative — the chain records only those three numbers for this claim.`;
  /* THE HOVER LAYER. A crosshair, a dot on the point, and a readout naming its
     date and its share — the thing a ladder under the plot was standing in for,
     except it answers about the moment under the pointer.
     THE POINTS RIDE ON THE SVG as x,y,height,share quads, so one delegated
     listener serves every chart on the page and survives a re-render: there is
     no mount step to forget to call, and a chart drawn into innerHTML after the
     fact works with no extra wiring. Dates are computed HERE, from the same
     dater the axis strip uses, rather than in the listener — the two must never
     be able to disagree about a point, which is the bug this chart has already
     had three times.
     Hidden until a pointer arrives, and never when there is nothing to read:
     the live fallback with no series has no points and gets no layer. */
  const hovAttr = (hov.length||hovev.length)
    ? ` data-hov="${hov.map(q=>q[0]+","+q[1]+","+(zdt? Math.round(zdt(q[2])) : 0)+","+q[3]).join(";")}"`
      + ` data-hovev="${esc(hovev.map(q=>q[0]+","+q[1]+","+String(q[2]).replace(/[;,]/g,"")).join(";"))}"`
      + ` data-hovdated="${zdt?1:0}"`
    : "";
  const layer = (hov.length||hovev.length)? `<g class="xh" aria-hidden="true">`
      + `<line class="xhl" x1="0" y1="${Y100}" x2="0" y2="${Y0}"></line>`
      + `<circle class="xhd" cx="0" cy="0" r="4"></circle>`
      + `<g class="xhbox"><rect rx="2" x="0" y="0" width="0" height="17"></rect>`
      + `<text class="xht" x="0" y="0"></text></g></g>` : "";
  return `<figure class="bigchart">
<svg viewBox="0 0 640 150" role="img" aria-label="${esc(aria)}"${hovAttr}>${g}${layer}</svg>
${zstrip}${srcnote? `<div class="srcnote">${srcnote}</div>`:""}</figure>`;
}
/* The stake split, as one bar the width of the chart above it. Two numbers side
   by side made the reader do the division; the bar IS the division, and it is
   the same quantity the chart plots, so it belongs on the same axis. Labels sit
   inside their own side while there is room and swing outside when there is
   not, so a 3% side is still legible. */
function stakeBar(d, slug){
  const y = Math.max(0, d.yesStake||0), n = Math.max(0, d.noStake||0), t = y+n;
  if(t<=0) return `<div class="sbar empty"><span class="sbnone">no stake yet — the first stake sets the line</span></div>`;
  const py = y*100/t, pn = 100-py;
  // Labels sit BELOW the bar, never inside it. Inside, a label has only its own
  // side's width, and "NO 12.0 KOURT:OREM · 23.1%" does not fit a 23% block at
  // any viewport — the first attempt clipped it to "JRT:OREM · 23.1%".
  return `<div class="sbar" role="img" aria-label="staked YES ${ccText(y,slug)} ${py.toFixed(1)}%, NO ${ccText(n,slug)} ${pn.toFixed(1)}%">
      <div class="sbY" style="width:${py.toFixed(3)}%"></div>
      <div class="sbN" style="width:${pn.toFixed(3)}%"></div>
    </div>
    <div class="sbout"><span class="y"><b>YES ${py.toFixed(1)}%</b> · ${cc(y,slug)}</span><span class="n"><b>NO ${pn.toFixed(1)}%</b> · ${cc(n,slug)}</span></div>`;
}
function chartChips(d, slug){
  const chips=[
    `conviction ${ccText(d.convYes,slug).replace(/ [A-Z:]+$/,"")} / ${cc(d.convNo,slug)}`,
    d.round? `${d.round} failed round${d.round>1?"s":""}`:null,
    d.disputeBondNext? `next dispute bond ${cc(d.disputeBondNext,slug)}`:null,
    d.phase==="settled"? `verdict ${sideName(d.verdict!=null?d.verdict:d.answer)}${d.route?" · "+esc(d.route):""}`:null,
    d.crystallized? "rewards open":null,
  ].filter(Boolean).map(t=>`<span>${t}</span>`).join("");
  return `<div class="chartchips">${chips}</div>`;
}

/* DOES THE TICKET HOLD AN ACTION, OR ONLY RULES? That is the whole question, and
   naming it that way settles every phase at once instead of listing them.

   Open has Stake YES/NO and Unstake; closed has Unstake. Those are columns of
   buttons and they earn the space beside the chart. Every other phase renders a
   heading and three or four lines restating the rule that never changes —
   principal returns 1x — with nothing to press: "Staking is frozen" between an
   answer and a settlement, "Staking is closed" once one has been reached. Both
   held the best column on the page, level with the chart, to say something true
   of every claim in every court.

   Settled and provClose keep theirs, and their withdraw buttons MOVED INTO it:
   the ticket is where a reader acts on their stake, so a phase whose stake
   action lived in the resolution notice had the ticket describing a withdrawal
   two sections above the button that performs it.

   Provisional is the deliberate exception. One side may withdraw early there,
   so by this rule it would earn a ticket — but that button sits beside Reopen
   and Finalize, which are resolution actions, and a reader in that phase is
   choosing BETWEEN the three. Splitting them across two columns to satisfy a
   rule would cost more than the rule is worth. */
function stakeTicketHasActions(d){
  return d.phase==="open" || d.phase==="closed"
      || d.phase==="settled" || d.phase==="provClose";
}
/* The stake ticket — replaces the V1 order ticket. Principal is never at risk;
   the reward is conviction (stake × time held until the answer). */
function stakeTicket(slug,id,d){
  if(d.phase==="closed"){
    return `<div class="ticket"><h3>Closed — never answered</h3>
      <div class="hint">Nobody answered before the dead-claim timeout, so the claim died. Stakes were never frozen: unstake freely, 1×. New staking is closed.
        The author's deposit is refunded and the filing fee is burned — the price of filing something nobody would answer.</div>
      <!-- Wrapped and hidden like the live ticket's pair, so fillUnstakeSides
           reveals them and writes the real amount in. Unwrapped, the filler
           found no [data-unstake] here and returned early, which left this
           branch shipping the hardcoded one-coin unstake to anyone whose claim

      <div class="actions" style="margin-top:14px">

  if(d.phase==="settled"||d.phase==="provClose"){
    const v = d.verdict!=null? d.verdict : d.answer;
    /* THE HEADING AND THE BUTTONS, AND NOTHING ELSE. This card carried a
       paragraph explaining that principal returns 1x and a two-row table saying

       only question left is "what do I collect". The rules of settlement are
       true of every claim in every court and are not news to anybody reading
       this one.
       WHAT WAS LOST AND WHERE IT WENT: the resolution notice below still names
       the verdict and its route, and still explains the voter carrot. The one
       fact this card alone carried — who may open the rewards, and when — moved
       onto the button that opens them, as its own note.

       data-wside ON THE WITHDRAW PAIR: fillWithdrawSides reads the reader's
       position after the render, drops the side they do not hold, and writes
       what that side returns onto the button. It keys on this rather than on
       data-func, because the demo branch of btn() emits an inert button without

    return `<div class="ticket"><h3>Staking is closed</h3>
      <div class="actions" style="margin-top:12px">
        <span data-wside="0">${btn("Withdraw YES","WithdrawStake",{courtSlug:slug,claimID:id,side:0},d.phase==="settled"?"yes":"")}</span>
        <span data-wside="1">${btn("Withdraw NO","WithdrawStake",{courtSlug:slug,claimID:id,side:1},d.phase==="settled"?"no":"")}</span>
        ${d.phase!=="settled"? "" : d.crystallized
          /* FOUR PULLS, AND AT MOST ONE OR TWO ARE YOURS. They were all four
             offered to everybody, unpriced: the author's slice to readers who
             did not file the claim, the answerer's to readers who did not
             answer it, "deciding-round voters" to people who never voted. Each
             is one signature away from a panic.
             data-pull marks them for fillTicketPulls, which reads PullState and
             the reader's conviction and removes the ones that are not theirs.
             The slice sizes come from DrawSlices, already in hand: the author's
             and the answerer's are the WHOLE slice and can be stated exactly;
             the accuracy and voter pools are shared, so those name the pool. */
          ? `<span data-pull="winner" data-pool="${(d.draw&&d.draw.w)||0}">`
              + btn("Pull accuracy reward","WithdrawBonus",{courtSlug:slug,claimID:id,side:v}) + `</span>`
            +`<span data-pull="author" data-pool="${(d.draw&&d.draw.a)||0}">`
              + btn("Pull author bonus","AuthorBonus",{courtSlug:slug,claimID:id}) + `</span>`
            +`<span data-pull="answerer" data-pool="${(d.draw&&d.draw.ans)||0}">`
              + btn("Pull answerer bonus","AnswererBonus",{courtSlug:slug,claimID:id}) + `</span>`
            +`<span data-pull="carrot" data-pool="${(d.draw&&d.draw.carrot)||0}">`
              + btn("Pull voter reward","PullCarrot",{courtSlug:slug,claimID:id},"","if you voted with the verdict") + `</span>`
          /* WHAT THE REALM WILL REFUSE, said before the signature rather than
             after it. Crystallize is turned down in four states — an open
             quality question, the 24h quiet window after the last flag event,
             and the first week of the verdict for anyone who is not a
             participant. Only the first is greyed, because it is the only one
             this page can evaluate; the other two need lastFlagEventAt and the
             reader's own stake, neither of which is published. Greying a control
             somebody could have used is worse than offering one they cannot. */
          /* NO ELIGIBILITY NOTE. "participants first week, then anyone" told a
             reader the schedule and not the answer — whether THEY can press it
             — which is the only form of that fact worth four words under a
             button. Two ways to say the useful version, neither of them free:
             read the reader's own entitlement and grey it (needs verdictAt and

          /* data-crys, for the same reason data-wside exists: the demo branch of
             btn() emits no data-func, so a selector built on it finds nothing in
             the sample — and the sample is where this is seen without a wallet.
             The first version of the participant guard was written that way and
             silently guarded nothing. */
          : `<span data-crys="1">` + btn("Open the rewards","Crystallize",{courtSlug:slug,claimID:id},"",
                "",null,null,null,
                /* NO QUALITY QUESTION LEFT TO WAIT ON. This passed a reason when a
                   flag or counter window was open; both are gone, and the only
                   thing the draw now waits for is the participant week, which the
                   branch above this one already explains. */
                null,
                ICN_CHEST) + `</span>`}</div></div>`;
  }
  if(d.phase!=="open"){
    return `<div class="ticket"><h3>Staking is frozen</h3>
      <div class="hint">An answer has been posted, so stakes are locked until the verdict is final — except that once a provisional verdict stands, the side it runs against may withdraw 1× early rather than wait out further rounds. Principal is never withheld; both sides withdraw 1× at settlement.</div>
      <div class="line"><span class="l">Your principal</span><span class="r">returns 1×, always</span></div>
      <div class="line"><span class="l">Winning side</span><span class="r">1× + accuracy reward</span></div>
      <div class="line"><span class="l">Losing side</span><span class="r">1×, loses nothing</span></div></div>`;
  }
  /* THE HEADING, THE AMOUNT, THE BUTTONS. This card carried a paragraph on
     conviction, three rows restating that principal returns 1x, and a boxed
     aside repeating the paragraph — all of it true of every claim in every
     court, above the one control the reader came for. The rules live in
     how-it-works; this is a place to act.

     The amount is in COIN, because that is what the balance and the labels are
     in, and converts to the realm's millionths at the click: a reader typing
     1.222 should not have to know the chain counts in micro units. data-amt
     marks the buttons that read it.

     AND THIS COMMENT IS OUT HERE. The last version sat inside the template
     literal, so the page printed it: forty words of implementation note
     rendered as body text under the buttons, because a block comment inside
     backticks is just characters. Writing the delimiters into the prose then
     closed this comment early and broke the file — twice caught, once by the
     page going blank. */
  return `<div class="ticket" id="stake-ticket"><h3>Stake the claim</h3>
    <div class="argrow" style="margin-top:12px">
      <span class="amtwrap" id="stakeamtwrap"><input id="stakeamt" class="sendin" type="text"
             inputmode="decimal" value="0" autocomplete="off" aria-describedby="stakebal"
             aria-label="amount to stake, in ${esc(ccSym(slug))}"
             ><span class="amthave" id="stakebal" title="Stake all of it"></span
             ><span class="amtflash" aria-hidden="true"></span></span
      ><a class="amtget" id="stakeget" href="${esc("#/c/" + encodeURIComponent(slug) + "?at=join")}" hidden>get some <span aria-hidden="true">&rarr;</span></a>
    </div>
    <div class="actions" style="margin-top:10px">
      ${btn("Stake YES","Stake",{courtSlug:slug,claimID:id,side:0,amount:1000000},"yes","",null,null,null,null,null,true)}
      ${btn("Stake NO","Stake",{courtSlug:slug,claimID:id,side:1,amount:1000000},"no","",null,null,null,null,null,true)}
      <!-- amount:0 is a placeholder the realm would refuse ("unstake must be
           positive"). It is deliberately unusable: fillUnstakeSides writes the
           holder's real stake in before revealing the button, so a value that
           escaped without being filled fails loudly instead of moving a coin. -->
      <span data-unstake="0" hidden>${btn("Unstake YES","Unstake",{courtSlug:slug,claimID:id,side:0,amount:0},"","",null,null,null,null,null,true)}</span>
      <span data-unstake="1" hidden>${btn("Unstake NO","Unstake",{courtSlug:slug,claimID:id,side:1,amount:0},"","",null,null,null,null,null,true)}</span>
