   there looking like it had ignored the click. It had not; the click never
   reached the map.
   The column is reserved whether or not anything is selected, so opening a card
   cannot resize the map and move the thing you were aiming at. Empty, it holds
   the hint that the map is interactive at all. */
/* Full screen: fixed to the viewport, above the rail and the page it was on. A
   column, so the bar and the legend take what they need and the map takes the
   rest — no fixed heights, which is what let the old 640px box be a picture of a
   map rather than one. */
/* --paper, and it was --bg, which this stylesheet has never defined. An unknown
   custom property is not an error in CSS: the declaration is simply dropped, so
   a fixed, full-viewport panel meant to cover the page rendered COMPLETELY
   TRANSPARENT. The claim page stayed visible underneath and the map's own bar
   drew over it — reported as "curate, close are superimposed on top of Stake on
   claim... basically the background is too visible". Nothing in the harness
   looked at whether a var() resolves; css_test.js does now. */
.mapfull{position:fixed; inset:0; z-index:40; background:var(--paper);
  display:flex; flex-direction:column; gap:8px; padding:10px clamp(10px,2vw,20px) 12px}
.mapbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:34px}
.mapbar-t{font-weight:600}
.maphome{display:flex; align-items:center; gap:7px; flex:none; text-decoration:none;
  color:var(--ink); padding-right:12px; margin-right:2px; border-right:1px solid var(--line)}
.maphome b{font-family:var(--serif); font-size:16px; font-weight:600; letter-spacing:-.01em}
.maphome:hover{color:var(--accent)}
.maphome .seat{display:flex}
.mapbar-n{color:var(--ink-2); margin-left:auto}
.mapbar-x{margin-left:6px}
.mapback{white-space:nowrap}
.mapbar-note{margin:0}
.mlegend-h{margin-left:auto; color:var(--muted)}
.maphold{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:12px;
  align-items:stretch; flex:1; min-height:0}
.mapsel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 14px; overflow-y:auto; min-height:0}
.mapsel-hint{color:var(--muted); font-size:12px; line-height:1.5}
@media (max-width:860px){ .maphold{grid-template-columns:minmax(0,1fr)} }
.mapsel-h{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.mapsel-h .mono{font-weight:600}
.mapsel-x{margin-left:auto; background:none; border:0; cursor:pointer; font-size:18px;
  line-height:1; color:var(--ink-2); padding:0 2px}
.mapsel-x:hover{color:var(--ink)}
.mapsel-t{margin:0 0 8px; font-size:13px; line-height:1.45}
.mapsel-d{margin:0 0 8px; font-size:12px; line-height:1.5; color:var(--ink-2)}
/* The claim page's own body renderer, at the panel's scale. 15.5px serif in a
   column this narrow runs about six words to the line, which reads as a stack of
   fragments rather than as prose; the panel already scrolls, so length is fine. */
.mapsel .claimbody{margin:0 0 10px; max-width:none}
.mapsel .claimbody p{font-size:12.5px; line-height:1.55; margin:0 0 7px}
.mapsel p.small{margin:0 0 4px}
.mapsel-a{margin-top:10px}
.mapsel-l{list-style:none; margin:6px 0 0; padding:0; max-height:190px; overflow-y:auto}
.mapsel-l li{margin:0 0 2px}
/* A row on a card that picks another node instead of leaving the map. Two
   classes, one look: .mapsel-c selects a claim, .mapsel-f a folder, and the
   court's card lists both. */
.mapsel-c,.mapsel-f{display:block; width:100%; text-align:left; background:none; border:0; cursor:pointer;
  font:inherit; font-size:12px; color:var(--ink-2); padding:3px 4px; border-radius:4px}
.mapsel-c:hover,.mapsel-c:focus,.mapsel-f:hover,.mapsel-f:focus{background:var(--inset); color:var(--ink)}
.mapsel-c .mono,.mapsel-f .mono{color:var(--accent-2)}

/* THE TITLE IS PRIMARY INK, and it was secondary. Reported as "i can't read
   because the fore and back is greyish", and measured that is exactly what it
   was: --ink-2 is a slate (74,91,104) on a near-white box, 6.66:1 in light and
   7.66:1 in dark — passing AA and still visibly GREY, sitting right beside an id
   drawn in --ink at 15.61:1. Two inks in one box, and the muted one was on the
   sentence somebody is trying to read.
   The verdict line keeps --ink-2 deliberately. Hierarchy is the reason the two
   tokens exist, and "in dispute" is a label on the claim rather than the claim;
   with the title at full strength there is now something for it to be secondary
   TO, which there was not when both were the same grey. */
.mtext{fill:var(--ink)} .mtitle{fill:var(--ink)}
/* The id heads the title and the verdict closes the node. Both survive the
   level-of-detail rule below, which hides only .mtitle. */
.mid{fill:var(--ink); font-weight:600}
.mverdict{fill:var(--ink-2); font-weight:600}
.mapsvg.far .mtitle{display:none}
/* A folder is a NODE now, not a box drawn round its contents — the radial map
   hangs claims off it instead of nesting them inside. The court is the same
   shape one step up: filled, heavier, at the centre. */
.mfold{fill:var(--accent-wash); stroke:var(--accent); stroke-width:1}
/* HELD BACK ON PURPOSE. The heading has to stay the loudest thing in its own
   box — a reader is looking for a name, and a picture that wins that contest has
   made the map worse. So the face is a tint at rest, lifts when the box is the
   one being looked at, and is dropped entirely when the map is zoomed out far
   enough that boxes are 112px of label: at that size an image is texture, and
   texture at fifty boxes is noise. */
.mfimg{opacity:.42; pointer-events:none}
/* The drawn stand-in for a folder with no picture. Quieter than a real one —
   it is a pictogram this page chose, not something a moderator filed. */
.mfglyph{fill:var(--accent); opacity:.30; pointer-events:none}
/* The court node is already the accent colour, so its watermark is the ink of
   the label instead — the same drawing, legible on a filled box. */
.mcglyph{fill:var(--accent-ink); opacity:.26; pointer-events:none}
.mcourt-a:hover .mcglyph,.mcourt-a:focus .mcglyph{opacity:.42}
.mapsvg.far .mcglyph{display:none}
.mfold-a:hover .mfglyph,.mfold-a:focus .mfglyph,.mfold-a.selected .mfglyph{opacity:.52}
.mapsvg.far .mfglyph{display:none}
.mfold-a:hover .mfimg,.mfold-a:focus .mfimg,.mfold-a.selected .mfimg{opacity:.68}
.mapsvg.far .mfimg{display:none}
/* The same picture on the folder's own page, where it is the subject rather
   than the texture. Capped in height because a folder is a heading: the claims
   filed under it are what the page is for, and a cover that pushed the first
   row below the fold would have the picture outranking the record. */
.folderface{display:block; width:100%; max-height:180px; object-fit:cover;
  border:1px solid var(--line); border-radius:8px; margin:10px 0 2px; background:var(--surface-2)}
.mfold.pseudo{fill:none; stroke-dasharray:4 3; stroke:var(--muted)}
.mhdr-t{fill:var(--accent-2); font-weight:600}
.mcourt{fill:var(--accent); stroke:var(--accent-2); stroke-width:1.5}
.mcourt-t{fill:var(--surface); font-weight:700}
.medge{fill:none; stroke:var(--ink-2); stroke-width:1.2}
/* CONTAINMENT IS THE SKELETON, AND IT IS DRAWN LIKE ONE. It used to be the
   faintest thing on the map — hairlines in --line-2 — while a "part of" relation
   was the boldest, 2px of near-black. That was backwards, and it showed: the
   court's own structure, the thing that makes the drawing a map rather than a
   scatter of boxes, was the part a reader had to squint at, while one relation
   type shouted over it.
   The old note argued the spokes should not compete with the associations drawn
   across them. The rank is the other way round. A spoke is where a claim IS; a
   relation is what somebody says about it, and a court's curation has zero
   economic weight either way — but the skeleton is what you navigate by.
   IT IS DRAWN IN --accent, the court's own blue. Grey said "chrome"; the court
   node is filled with this and every folder box is outlined in it, so a blue
   spoke reads as the same object continuing — the court's structure reaching
   out to hold its folders — rather than as a connector that happens to be
   between them. It also puts the whole skeleton in one hue that no relation
   uses, so "is this containment or an assertion" is answered by colour before
   weight is consulted.
   Trunk, then branch, by weight within that one hue: two widths of one colour
   read as one structure at two depths, where two colours would read as two
   different kinds of line. */
.medge.spoke{stroke:var(--accent); stroke-width:3.2}
.medge.spoke.toclaim{stroke-width:2.2}
/* Filed here as well as somewhere else. Same blue, because it IS containment,
   and dashed and thin because it is the second place rather than the first —
   the claim is drawn once, at its other folder. */
.medge.spoke.also{stroke:var(--accent); stroke-width:1.4; stroke-dasharray:3 4}
/* A relation, not the skeleton. Solid — it is the structural one of the four —
   but no longer the heaviest line in the drawing, and it inherits --ink-2 from
   .medge rather than reaching for the near-black nothing else uses. */
.medge.part{stroke-width:1.4}
.medge.bears.yes{stroke:var(--yes); stroke-dasharray:5 4; stroke-width:1.6}
.medge.bears.no{stroke:var(--contra); stroke-dasharray:5 4; stroke-width:1.6}
.medge.sup{stroke:var(--muted); stroke-dasharray:2 3; stroke-width:1.6}
.medge.dim,.marrow.dim{opacity:.35}
/* The head matches its line. "part" used to be the one relation drawn in
   near-black, and its arrow was given --ink to match; now that the line is
   --ink-2 like every other relation, an --ink head would be a darker point on a
   lighter stroke. */
.marrow{fill:var(--ink-2)}
.mdot.g{fill:var(--good); stroke:var(--good)}
.mdot.gn{fill:var(--no); stroke:var(--no)}
/* decided, side unknown: neither palette, and distinct from the grey
   --void of "never answered" so the two do not read alike. */
.mdot.gu{fill:var(--ink-2); stroke:var(--ink-2)}
.mdot.e{fill:var(--escrow); stroke:var(--escrow)}
.mdot.ed{fill:var(--escrow-wash); stroke:var(--escrow); stroke-dasharray:2 2}
.mdot.o{fill:var(--escrow-wash); stroke:var(--escrow)}
.mdot.v{fill:none; stroke:var(--void)}
.mdot.vd{fill:none; stroke:var(--void); stroke-dasharray:2 2}
.mdot.vf{fill:var(--void); stroke:var(--void)}
/* search bar */
.qbar{margin:8px 0}
.qbar input{flex:1}
.docket .offp{display:none}
.qactive .docket .offp:not(.qhide){display:grid}
.qhide{display:none !important}
.qactive .pager,.qactive [data-qfold]{display:none}
/* pager: caption left, square chips right */
.pager{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:8px 0; color:var(--ink-2); flex-wrap:wrap}
.pager .chips{display:flex; gap:6px}
.pager a.pill{text-decoration:none}
.pager .pill.off{opacity:.35}
.pager .pill[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent-2); border-color:var(--accent)}
.pager.hidenav .pnav{display:none}
.schips{display:inline-flex; gap:6px; margin-right:8px}

/* body / untrusted text frame */

/* generic prose + tables */
.prose{max-width:70ch} .prose p{margin:0 0 12px} .prose h2{font-family:var(--serif); font-size:20px; margin:22px 0 10px}
.prose ul{padding-left:22px; margin:0 0 12px}
table.data{width:100%; border-collapse:collapse; font-size:13.5px}
table.data th,table.data td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line)}
table.data th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600}
table.data td.num{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:12.5px}
.scroll-x{overflow-x:auto}

.rawblock{background:var(--inset); border:1px solid var(--line); border-radius:var(--r); padding:18px; font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; line-height:1.5; color:var(--ink-2); overflow-x:auto}

/* The seeded-chain warning. Full-bleed above the page rather than inside it,
   because it describes the NODE and not whatever route you happen to be on. */
/* Column 2, row 1 — NOT 1/-1. Spanning every column put it under the rail,
   which is sticky and opaque, so the first third of the sentence was invisible.
   Padding matches .main's so the banner lines up with the page beneath it. */
.notice{border-radius:var(--r); padding:13px 16px; font-size:13.5px; display:flex; gap:10px; align-items:flex-start}
.notice.warn{background:var(--escrow-wash); color:var(--ink); border:1px solid var(--escrow); border-left-width:4px}
.notice.refuse{background:var(--no-wash); border:1px solid var(--no); border-left-width:4px; color:var(--ink)}
.notice.good{background:var(--yes-wash); color:var(--ink); border:1px solid var(--yes); border-left-width:4px}
.notice.void{background:var(--void-wash); color:var(--ink); border:1px solid var(--void); border-left-width:4px}
.notice .g{flex:none}
.empty{text-align:center; color:var(--muted); padding:50px 20px}
.empty .g{font-size:34px; opacity:.5}

.addrbar{display:flex; gap:9px; margin:8px 0 20px; flex-wrap:wrap}
.addrbar input{font-family:var(--mono); font-size:13px; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm); padding:9px 12px; color:var(--ink); min-width:min(360px,80vw)}
.muted{color:var(--muted)} .small{font-size:12.5px}
/* Visually gone, still in the accessible name. */
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0}
/* ============================ the utility row ============================
   The line under a page title: what this thing IS, then what you can do about
   it. Four routes use it (claim, court, curate, map) and the claim page was the
   only one that also put facts and an action in it, which is what made it read
   as a jumble.

   THE SIZE LIVES ON THE ROW. It used to live on each child's `.small`, and
   `button.helplink` is `font:inherit` — so the share trigger inherited the 15px
   BODY size while the anchors beside it were 12.5px. That one mismatch is most
   of "inconsistent in font": it made the button 20% larger than its neighbours
   and pushed it onto a line of its own.

   TWO ROLES, NOT FOUR VOICES. A fact is --muted and never reacts to the cursor;
   a link is --accent and grows an underline when you point at it. The pill is
   the only boxed thing here, and that border is the whole "this is status"
   signal. Nothing else gets a box, a second family, or a second size. */
.tagrow{display:flex; flex-wrap:wrap; align-items:center; column-gap:16px; row-gap:8px;
  margin-top:12px; font-size:12.5px; line-height:1.45; min-width:0}
/* Facts and actions are two groups, so the row wraps at the SEAM between them
   rather than wherever a wide status pill happens to push it. That is what
   stranded "share ↗" alone on line two. */
.tagrow .tfacts,.tagrow .tacts{display:flex; flex-wrap:wrap; align-items:center;
  column-gap:16px; row-gap:6px; min-width:0}
.tagrow .tfacts{column-gap:10px}
.tagrow .tfact{color:var(--muted)}
/* the only mono in the row, and only on the machine string inside a fact —
   "opened by" is prose. SF Mono sets larger than the UI sans at matched px. */
.tagrow .tfact .mono{font-size:.94em}
.tagrow .tlink{
  /* inline-flex buys the 24px target height, and costs the whitespace BETWEEN
     its children — flex discards it, which ran "filed under" into the folder
     name. `gap` puts it back, so the markup needs no &nbsp;. */
  display:inline-flex; align-items:center; gap:.32em;
  min-height:24px;   /* SC 2.5.8, and free beside a 24.7px pill */
  color:var(--accent); font:inherit; background:none; border:0; padding:0; cursor:pointer;
  text-decoration:underline; text-decoration-color:transparent; text-decoration-thickness:1px;
  text-underline-offset:3px; border-radius:2px; min-width:0;
  transition:color .12s ease, text-decoration-color .12s ease}
/* --accent-2 is the HIGHER-contrast variant in both themes, so hover reads as
   "more". button.helplink had this backwards and dimmed on hover. */
.tagrow .tlink:hover,.tagrow .tlink:focus-visible{
  color:var(--accent-2); text-decoration-color:currentColor}
@media(prefers-reduced-motion:reduce){ .tagrow .tlink{transition:none} }
/* THE ONLY UNBOUNDED STRING IN THE ROW: a folder label from local curation,
   which is imported JSON. safeInline() escapes it but does not bound it, and a
   flex item defaults to min-width:auto — so a 40-character label made this
   anchor the widest element on the PAGE and gave the whole document a
   horizontal scrollbar at 390px (scrollWidth 454 vs 390; 140 chars gave 1542).
   WCAG 1.4.10. Bounded here, and the ellipsis keeps the truncation visible. */
.tagrow .tname{display:inline-block; max-width:26ch; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom}
@media(pointer:coarse){ .tagrow .tlink{min-height:32px} }
@media(max-width:560px){
  /* the seam becomes a hard break, so facts and actions never interleave */
  .tagrow{column-gap:0}
  .tagrow .tfacts,.tagrow .tacts{width:100%}
  .tagrow .tname{max-width:14ch}
}

/* the board: a claim's comments.

   A ROW IS A QUOTATION UNIT — somebody links to one and argues about it — so it
   reads as a citation with prose under it, not as a chat bubble. The meta line
   is quiet and the text is not: the words are what somebody came for.

   REPLIES ARE INDENTED AGAINST A RULE, not boxed. Depth stops at one, so a
   single indent IS the whole tree; a box would imply there is more inside. */
.board-on{color:var(--ink-2); margin:-4px 0 14px}
.boardlist{margin-top:14px}
.boardrow{padding:14px 0 15px; border-top:1px solid var(--line)}
.boardrow:first-child{border-top:0; padding-top:4px}
.boardmeta{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px;
  margin:0 0 7px; font-size:.88em; color:var(--muted)}
/* The address is the row's identity, so it gets the one solid affordance in the
   line; everything after it is context and stays quiet. */
.boardmeta .mono{color:var(--ink-2); background:var(--inset);
  border:1px solid var(--line); border-radius:5px; padding:1px 6px}
.boardmeta .pill{font-size:.86em}
.boardmeta a.mono{margin-left:auto; background:none; border:0; padding:0;
  color:var(--muted); text-decoration:none}
.boardmeta a.mono:hover,.boardmeta a.mono:focus-visible{color:var(--accent-2)}
.boardrow p{margin:0 0 9px; overflow-wrap:anywhere; line-height:1.55}
.boardrow p:last-child{margin-bottom:0}
/* A tombstone is quieter than text and must not be invisible: it is the reason a
   row a reader can see the count of has nothing under it. */
.board-tomb{color:var(--muted); font-style:italic}
.board-tomb a{color:var(--ink-2)}
.board-more{color:var(--muted); font-size:.92em; margin:12px 0 0}
.boardkids{margin:11px 0 0 4px; padding-left:15px;
  border-left:2px solid var(--line-2)}
.boardkids .boardrow{padding:10px 0; border-top:1px solid var(--line)}
.boardkids .boardrow:first-child{border-top:0; padding-top:0}
.boardkids .boardmeta{font-size:.85em}
.cmt-empty{margin:14px 0 0; color:var(--ink-2)}
/* The removed-count, pushed to the far end of the section header. `.sec-h` is a
   baseline flex row, so margin-left:auto is the whole trick; the type is scaled
   back to the header's own size rather than the body's. */
.sec-h .secact{margin-left:auto; font:500 11px/1 var(--mono); letter-spacing:0;
  text-transform:none; color:var(--muted); text-decoration:none;
  border-bottom:1px solid var(--line-2); padding-bottom:1px}
.sec-h .secact:hover,.sec-h .secact:focus-visible{color:var(--accent-2);
  border-bottom-color:var(--accent)}
@media(max-width:560px){
  .boardkids{margin-left:0; padding-left:11px}
  .boardmeta a.mono{margin-left:0}
}

/* mobile */
@media(max-width:820px){
  body{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  /* .zone is not in the plot any more — .chartzone is real text below it and
     needs no user-unit compensation. */
  .bigchart .tickL,.bigchart .evtL,.bigchart .note,.bigchart .seamL{font-size:20px}
  .chartzone{font-size:11px}
  /* THE END READOUT COMES OFF ON A SMALL SCREEN. At the mobile size it is the
     widest thing in the plot and it lives in a gutter 34 units deep, so it
     reached back across the drawing and sat on whatever event label was nearest
     the right — "now" among them. It is also the one number on the chart that is
     restated immediately below it, in full, by the stake bar; and any point's
     share is a hover away. The dot stays: that is the reading, and it is where
     the line ends. */
  .bigchart .endL,.bigchart .endS{display:none}
  .bigchart .tickL.covered{display:inline}
  body{grid-template-rows:none}
  .rail,.main{grid-row:auto; grid-column:auto}
  .docket a.crow{grid-template-columns:44px minmax(0,1fr) auto}
  .docket a.crow > span:nth-child(2){grid-column:2/4}
  .docket a.crow .id{grid-row:1/3; align-self:start}
  .docket a.crow .px{grid-row:2; grid-column:2; flex-direction:row; flex-wrap:wrap; align-items:baseline; gap:4px 8px; min-width:0}
  .docket a.crow .pill{grid-row:2; grid-column:3; justify-self:end}
  .docket a.courtrow{grid-template-columns:30px minmax(44px,auto) minmax(0,1fr) auto}
  .rail{position:static; height:auto; flex-direction:column}
  .nav{flex-direction:row; flex-wrap:wrap; gap:4px} .nav .sec{width:100%}
  .rail .foot{border-top:1px solid var(--line)}
  .main{padding:24px 18px 80px}
  .stakewrap{grid-template-columns:1fr}
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;
  box-shadow:var(--glow-a)}
.act{display:inline-flex; align-items:flex-start; gap:6px; flex-wrap:wrap; position:relative; max-width:100%; min-width:0}
/* The signing dialog's fields. Monospaced because most of them are chain
   identifiers — a slug, a claim id, a side — where a transposed character has to
   be visible, and full width because a truncated value cannot be checked. */
.argrow{margin:8px 0}
.argrow input{
  width:100%; box-sizing:border-box; margin-top:3px; padding:6px 8px;
  border-radius:var(--r-sm); border:1px solid var(--line-2);
  background:var(--surface); color:var(--ink); font-size:13px;
}
.argrow input:focus{outline:none; border-color:var(--accent)}
.argrow .sendin{width:auto; min-width:12ch; display:inline-block}
/* The stake amount, beside its unit. A row rather than a stacked field: it is
   one short number and the coin's name has to sit next to it to mean anything. */
.ticket .argrow{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
/* SIZED TO WHAT IT HOLDS. It inherited a 12ch min-width from the composer's
   argrow and rendered 182px — wider than the label, the unit and the balance put
   together, which pushed the row past the ticket and wrapped it onto two lines
   with the unit orphaned below the box. 11ch takes "201.744973", the widest
   value a balance can put in it. 13 rather than 11 because the flash shares the
   box: at 11 the selected value and "ya got none!" met in the middle. */
.ticket .argrow .sendin{width:27ch; min-width:0; font-family:var(--mono)}
/* The balance, inside the box at the right: "1.5 / 201.7". Clickable to stake
   all of it, which is why this one is not pointer-events:none like the flash. */
.amthave{position:absolute; right:7px; top:50%; transform:translateY(-50%);
  font:11.5px var(--mono); color:var(--muted); cursor:pointer; white-space:nowrap}
.amthave.none{cursor:default}
.amthave:hover{color:var(--accent-2)}
.amthave.none:hover{color:var(--muted)}
.amtwrap.flash .amthave{visibility:hidden}
/* The flash, inside the box and right-aligned, behind the value. It goes on its
   own after a moment: a warning that stays becomes part of the furniture, and
   the red border is already the persistent half of this. */
.amtwrap{position:relative; display:inline-block}
.amtflash{position:absolute; right:7px; top:50%; transform:translateY(-50%);
  font:11px var(--sans); color:var(--contra); pointer-events:none;
  opacity:0; transition:opacity .12s linear}
.amtwrap.flash .amtflash{opacity:1}
/* "GET SOME" LIVES OUTSIDE THE BOX AND STAYS. It used to be injected into the
   flash — inside the field, right-aligned behind the value, gone after 1800ms —
   which put the only way out of "you hold none" on a timer, and behind the
   reader's own cursor. It is the one piece of this row that is not a warning:
   a warning that stays becomes furniture, but a way out that vanishes is worse
   than furniture.
   A flex sibling of .amtwrap in .ticket .argrow, so the row's own gap places it
   and nothing has to be positioned by hand. */
/* THE ACCOUNT WIDGET. Fixed top-right; the pop is anchored to it and closes on
   Escape, on an outside click, and on navigation. */
.acct{position:fixed; top:10px; right:12px; z-index:35; display:flex; align-items:center; gap:8px}
.forkbtn{text-decoration:none; color:var(--muted); background:transparent; box-shadow:none; border-color:var(--line)}
.forkbtn:hover{color:var(--accent); border-color:var(--accent); background:var(--surface)}
/* chrome, not content: below 640px the wallet button owns the corner alone. */
@media(max-width:640px){ .forkbtn{display:none} }
.acctbtn{display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  padding:6px 10px; border:1px solid var(--line-2); border-radius:8px;
  background:var(--surface); color:var(--ink); font:12px var(--sans);
  box-shadow:var(--shadow-sm)}
.acctbtn:hover{border-color:var(--accent); color:var(--accent)}
.acctbtn .g{color:var(--muted)}
.acctwho{font-family:var(--mono); font-size:11.5px}
.acctcar{color:var(--muted); font-size:10px}
.acctpop{position:absolute; top:calc(100% + 6px); right:0; min-width:16rem;
  max-width:min(22rem, calc(100vw - 24px));
  padding:10px 12px; border:1px solid var(--line-2); border-radius:10px;
  background:var(--surface); box-shadow:var(--shadow); font:12px var(--sans)}
.acctpop[hidden]{display:none}
.acctpop .arow{display:flex; justify-content:space-between; gap:12px;
  padding:4px 0; border-bottom:1px solid var(--line)}
.acctpop .arow:last-of-type{border-bottom:0}
.acctpop .arow .l{color:var(--muted)}
.acctpop .arow .r{font-variant-numeric:tabular-nums; text-align:right}
.acctpop .afull{font-family:var(--mono); font-size:11px; word-break:break-all;
  color:var(--ink-2); margin:0 0 8px}
.acctpop .awarn{color:var(--contra); margin:8px 0 0}
.acctpop .aacts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.acctpop .aacts a, .acctpop .aacts button{font:11.5px var(--sans); cursor:pointer;
  padding:4px 8px; border:1px solid var(--line-2); border-radius:6px;
  background:var(--surface-2); color:var(--ink); text-decoration:none}
.acctpop .aacts a:hover, .acctpop .aacts button:hover{border-color:var(--accent); color:var(--accent)}
@media (max-width:640px){ .acctwho{display:none} }
.amtget{font:11.5px var(--sans); color:var(--contra); text-decoration:none;
  white-space:nowrap; align-self:center}
.amtget:hover{color:var(--accent-2); text-decoration:underline}
.amtget[hidden]{display:none}
@media (prefers-reduced-motion:reduce){ .amtflash{transition:none} }
/* An amount the court would refuse. Border AND text, so it is not colour alone. */
/* The focus rule sets border-color too and is declared later, so it won and the
   field went accent-blue at the exact moment it was supposed to read as wrong.
   The invalid state has to beat focus, because it is always focused when it is
   set — that is the point of setting it. */
.sendin[aria-invalid="true"],
.sendin[aria-invalid="true"]:focus{border-color:var(--contra); color:var(--contra);
  outline-color:var(--contra)}
.helper .err{color:var(--contra)}
.copybtn{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--muted);
  border:1px solid var(--line-2); border-radius:var(--r); padding:3px 7px; align-self:center}
.copybtn:hover{color:var(--accent-2); border-color:var(--accent-2)}
/* Three theme buttons with no pressed state left the reader guessing which one
   built the snippet on screen. aria-pressed carries it to a screen reader. */
.copybtn[aria-pressed=true]{color:var(--accent-2); border-color:var(--accent-2);
  background:var(--accent-wash)}
.copybtn{margin-top:5px}
.cliblock{flex-basis:100%; background:var(--inset); border:1px solid var(--line-2);
  border-radius:var(--r-sm); padding:10px 12px; font-size:11.5px; line-height:1.5;
  white-space:pre; overflow-x:auto; cursor:copy; margin-top:6px; min-width:0; max-width:min(640px,100%)}
.cliblock.copied{outline:2px solid var(--good)}
#share-dlg .cliblock{white-space:pre-wrap; word-break:break-all; max-width:100%}
#share-dlg h4{margin:14px 0 2px}
/* You could not see the thing you were about to send. It downloaded unseen. */
.clipprev{margin:0 0 10px; border:1px solid var(--line-2); border-radius:var(--r-sm);
  overflow:hidden; background:var(--inset); min-height:40px}
.clipprev img{display:block; width:100%; height:auto}
#share-dlg h4 .hint{font-weight:400; font-size:10.5px; letter-spacing:.06em;
  font-family:var(--mono); color:var(--muted); margin-left:8px; text-transform:none}
.txnote{flex-basis:100%; font-size:12px; color:var(--ink-2); margin-top:5px}
.txnote.ok{color:var(--good)}
.btn.inert{opacity:.55; cursor:not-allowed}
.intro{background:var(--accent-wash);border:1px solid var(--line-2);border-radius:var(--r);
  padding:16px 18px;margin-bottom:22px;font-size:14.5px;line-height:1.6;max-width:72ch}
.intro b{color:var(--accent-2)}
.intro .btn-row{margin-top:10px;display:flex;gap:14px;align-items:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* A ROUTE CHANGE SHOULD READ AS MOVEMENT. Clicking a claim on the map replaced the
   whole view in a single frame with nothing to say the click had landed — and the
   map and the claim page share a layout and a crumb strip, so the swap looked like
   a redraw rather than an arrival. 140ms is picked to be FELT and not waited for.
   The reduced-motion rule above kills transitions and not animations, so this opts
   out on its own line. */
@keyframes vin{from{opacity:.5; transform:translateY(5px)} to{opacity:1; transform:none}}
/* backwards, NOT both. A forwards fill keeps the animation's final transform
   applied for ever, and an element with a transform applied is the containing
   block for any position:fixed descendant — so #main, not the viewport, would go
   on defining where a fixed child sits long after the 140ms was over. The final
   keyframe is the element's resting state anyway, so filling forwards bought
   nothing and cost that. */
#main.vin{animation:vin .14s ease-out backwards}
@media(prefers-reduced-motion:reduce){#main.vin{animation:none}}

   cost of loading the realm at all. So the printed command could not execute
   anything, which is a straightforward bug in the command.

   it does cost is the floor it sets on the fee: at the genesis price of

   deducted IN FULL whatever the tx burns (gnolang/gno #3805). So the ceiling is

const BLOCK_SECS = 5;      // gno.land block time — how block heights become wall-clock
const WEEK = 120960;       // one emission period, in blocks (trailing-ratio window)

const FINALIZE_GRACE = 120960;

//

const MAX_COMMENT_CHARS = 2000;

/* ============================ gno RPC client ============================= */

function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function unb64(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(_){ return atob(s); } }

async function chainHeight(){
  if(!isLive()) return NOW;

    const r = await fetch(CFG.rpc.replace(/\/+$/,"")+"/status");
    const j = await r.json();

  }catch(e){ return null; }

/* ONE ANSWER PER QUESTION, FOR A FEW SECONDS.
   Measured on the live site: a court page asks 122 questions and 121 of them are
   DISTINCT, so this saves nothing on a first paint — and it was never meant to.
   What it saves is the second visit. Opening a claim and pressing back re-asked
   all 122, because every render starts from nothing; each of those costs the node
   a realm load (~60-90ms), so the way back was as slow as the way in.

   NOT batching, which is the idea this replaced: gno executes a JSON-RPC array
   serially, so posting the page's reads together was measurably slower than
   letting the browser run them in parallel.

   A promise is cached, not a value, so two callers asking the same question in
   the same tick share one request — and a failure is evicted rather than
   remembered, because a node that was briefly unreachable must not answer for
   the next half minute.

   HOW LONG, measured rather than guessed. At five seconds this saved nothing
   worth having — a reader spends longer than that on a claim page, so coming
   back cost 70 of the 80 reads over again. At thirty it costs ONE. That number
   is the whole value of this cache.

   Thirty seconds of staleness is the price, and it is affordable because nothing
   is DECIDED from a cached figure: every action goes through the wallet and is
   evaluated by the chain at execution, never against what this page last drew.
   The buy panel already says so in as many words — quoted just now, fewer units
   if somebody buys first, never more — and a stale supply errs in that same
   direction. Anything this reader WRITES clears the cache outright, so only
   other people's activity can be up to half a minute old, which is what any
   painted render is anyway. */
const RPC_TTL_MS = 30000;
const RPCC = new Map();          // "path\0data" -> {t, p}

/* THE SAME CACHE, SURVIVING A RELOAD.
 *
 * The map above is memory, so F5 threw it away and the page asked all 122
 * questions again. That is the one case where the reader is most obviously
 * waiting, because they just watched the page work and asked for it again.
 *
 * sessionStorage rather than localStorage: a cache that outlives the tab would
 * have to answer for its own staleness on a machine that has been closed for a
 * week, and nothing here is worth that. Per TAB is exactly the span where "I
 * was just looking at this" holds.
 *
 * Keyed by endpoint, so switching Source or pointing at another node cannot be
 * answered out of the last one's cache.
 *
 * Only whole successful answers are written, and only small ones: a render can
 * be large, the quota is a few megabytes, and a cache that throws on write is
 * worse than no cache at all. Every write is wrapped for that reason — quota
 * and disabled-storage both surface as exceptions, and neither is fatal here. */
const RPC_SS_MAX = 64 * 1024;    // per entry; a big render is not worth a slot
function ssKey(k){ return "rpcc\u0000" + (CFG.rpc||"") + "\u0000" + k; }
function ssGet(k){

    const raw = sessionStorage.getItem(ssKey(k));
    if(!raw) return null;

    if(!rec || Date.now() - rec.t >= RPC_TTL_MS){ sessionStorage.removeItem(ssKey(k)); return null; }
    return rec;
  }catch(_){ return null; }
}
function ssPut(k, v){

function chainCacheClear(){

function abci(path, data){

  if(hit && now - hit.t < RPC_TTL_MS) return hit.p;
  // Carried over from the last load of this tab, if it is still fresh.
  const stored = ssGet(k);
  if(stored){
    const p = Promise.resolve(stored.v);
    RPCC.set(k, {t:stored.t, p});
    return p;

  // returns in the same tick — never appears as work the reader is waiting for.
  RPCQ.started++;
  const settle = () => { RPCQ.done++; rpcProgress(); };
  p.then(settle, settle);

  // .then(fn) alone forks a second promise nobody is watching and every failed
  // query becomes an unhandled rejection in the console. The eviction below
  // handles the same failure for the cache; this one is only about not leaking
  // a branch.
  p.then(v => ssPut(k, v), () => {});

  // swallow nothing — the caller still sees the rejection it was handed.
  p.catch(()=>{ const c = RPCC.get(k); if(c && c.p === p) RPCC.delete(k); });

async function abciFetch(path, data){

  const j = await res.json();
  if(j.error) throw new Error(j.error.message||"rpc error");
  const r = (j.result&&j.result.response) || {};
  const err = r.Error || (r.ResponseBase&&r.ResponseBase.Error);
  if(err) throw new Error((r.Log||(r.ResponseBase&&r.ResponseBase.Log)||"query failed"));

const qeval  = expr => abci("vm/qeval",  PKG+"."+expr);
const qrender = pth => abci("vm/qrender", PKG+":"+pth);

/* qeval returns typed lines like `(123 int64)` or `("orem" string)`, one per

  const lines = out.trim().split("\n").filter(Boolean);

    if(/^".*"$/s.test(raw)){ try{ return JSON.parse(raw); }catch(_){ return raw.slice(1,-1); } }

const tup = async expr => parseTyped(await qeval(expr));

/* ======================== the comment board's wire ======================= */
/* FOUR PACKINGS, NOT ONE, and board_test.gno states the contract:
 *
 *     BoardNewest     id | author | replyCount | mark | at | text   (6 fields)
 *     BoardTop        id | author | score      | mark | at | text   (6 fields)
 *     BoardPartyRows  id | author | role       | mark | at | text   (6 fields)
 *     BoardReplies    id | author | mark       | at   | text        (5 fields)
 *
 * A shared parser reads a reply's MARK as its reply count. The field count is
 * the argument, and each caller passes its own.
 *
 * `at` is the block the comment landed in. It sits BEFORE the text on every
 * packing because the text is the field that may contain an unescaped pipe, and
 * last is the only position a bounded split recovers whole.
 *
 * `role` is spelled out — `author` or `answerer` — and must be READ, never
 * inferred from position: the realm returns one party row when only one party
 * has commented, and it may be either of them.
 *

 * client which, deliberately, so no caller may say which. */

/* JS split with a limit TRUNCATES; Go's SplitN joins the remainder, and comment
   text legitimately contains pipes. Split whole, keep the first n-1, rejoin the
   tail — anything else silently eats the end of somebody's sentence. */
function wireFields(line, n){
  const p = String(line).split("|");
  if(p.length < n) return null;            // malformed: drop the row, never guess
  return p.slice(0, n-1).concat(p.slice(n-1).join("|"));
}

/* ONE LEFT-TO-RIGHT PASS. escapeWireText escapes the BACKSLASH FIRST precisely so
   the escape cannot be forged: an author who types a literal backslash-n gets
   \\n on the wire, and a naive .replace(/\\n/g,"\n") turns their two characters
   into a real newline — re-forging what the realm went to trouble to prevent. */
function unwire(s){
  return String(s).replace(/\\(.)/g, (_, c) => c === "n" ? "\n" : c === "r" ? "\r" : c);

/* A Go quoted string, decoded properly. qeval hands back strconv.Quote output,
   which is NOT JSON: it can carry \a, \v and \xNN, and parseTyped's fallback for
   those is raw.slice(1,-1) — every escape left literal, INCLUDING the \n that
   separates rows. One comment containing such a byte would collapse a whole
   board into a single garbage row for every reader, so the board decodes for
   itself rather than trusting that path. */
function goUnquote(raw){
  const s = String(raw);
  if(!/^".*"$/s.test(s)) return s;
  try { return JSON.parse(s); } catch(_) {}
  const b = s.slice(1, -1);
  let out = "";
  for(let i = 0; i < b.length; i++){
    if(b[i] !== "\\"){ out += b[i]; continue; }
    const c = b[++i];
    if(c === "n") out += "\n";
    else if(c === "r") out += "\r";
    else if(c === "t") out += "\t";
    else if(c === "a") out += "\x07";
    else if(c === "b") out += "\b";
    else if(c === "f") out += "\f";
    else if(c === "v") out += "\v";
    else if(c === "x"){ out += String.fromCharCode(parseInt(b.substr(i+1, 2), 16) || 0); i += 2; }
    else if(c === "u"){ out += String.fromCharCode(parseInt(b.substr(i+1, 4), 16) || 0); i += 4; }
    else out += c;                          // \\ and \" land here, as themselves
  }

}

/* Rows, already unescaped. `text` is still UNSANITISED — the realm sanitises on

function boardRows(out, n, names){
  return String(out || "").split("\n").filter(Boolean).map(line => {
    const f = wireFields(line, n);
    if(!f) return null;
    const row = {};
    names.forEach((k, i) => { row[k] = k === "text" ? unwire(f[i]) : f[i]; });
    row.id = parseInt(row.id, 10);

}
/* THE TYPED WRAPPER, REMOVED WITHOUT parseTyped — which is the whole point of

   that separates rows. strconv.Quote emits \a, \v and \xNN for bytes JSON
   refuses, so one comment containing one such byte collapses the entire board
   into a single garbage row — for every reader, not just its author. Comment

   makes, not an accident somebody has.

   Go's escapes properly. Anything the wrapper does not match is passed through
   quoted-or-not for goUnquote to judge. */
function boardUnwrap(out){
  const s = String(out == null ? "" : out).trim();
  const m = s.match(/^\((.*)\s+string\)$/s);
  return goUnquote(m ? m[1] : s);
}

/* FOUR PACKINGS, THREE ARITIES, AND THEY ARE NOT INTERCHANGEABLE. Field 3 is
   always what THAT ordering knows about the row — a reply count, a score, or a
   role — so a line read at the wrong arity does not fail, it MIS-READS: a reply's
   mark parsed as a reply count, and the text short by a field. `at` is the block
   the comment landed in, and it sits before the text because the text is what
   may contain an unescaped pipe: last is the only position a bounded split can
   recover whole. */
const boardNewestRows  = out => boardRows(out, 6, ["id","author","replies","mark","at","text"]);
const boardTopRows     = out => boardRows(out, 6, ["id","author","score","mark","at","text"]);
const boardReplyRows   = out => boardRows(out, 5, ["id","author","mark","at","text"]);
const boardPartyRows   = out => boardRows(out, 6, ["id","author","role","mark","at","text"]);

/* THE FOUR READS. qeval() DIRECTLY — not one(), not tup(). Both route through
   parseTyped, whose fallback is the hazard boardUnwrap and goUnquote exist to
   avoid; a board that read through one() would be defended by a parser it never
   reaches.

   These quote their own slug, which the other reads in this file do not — they
   take a pre-quoted `s`. The deviation is deliberate: a reader that quotes its
   own argument cannot be called wrongly, and a court slug is chain data that
   arrives in the URL. gstr is JSON.stringify, so a slug carrying a quote becomes
   a gno string literal instead of an expression.

   Each ordering gets its OWN reader bound to its own arity, so there is no
   shared entry point through which a caller can pass the wrong field count. */
const boardWire = async expr => boardUnwrap(await qeval(expr));
const readBoardNewest  = (slug, id, off, n) =>
  boardWire(`BoardNewest(${gstr(slug)},${id},${off},${n})`).then(boardNewestRows);
const readBoardTop     = (slug, id, off, n) =>
  boardWire(`BoardTop(${gstr(slug)},${id},${off},${n})`).then(boardTopRows);
const readBoardReplies = (slug, id, parent) =>
  boardWire(`BoardReplies(${gstr(slug)},${id},${parent})`).then(boardReplyRows);
const readBoardParties = (slug, id) =>
  boardWire(`BoardPartyRows(${gstr(slug)},${id})`).then(boardPartyRows);

/* ONE SOURCE SWITCH, and the sample carries WIRE STRINGS rather than row
   objects. A second row shape would be a second thing to keep in step with the
   realm, and the sample is the only fixture that exercises this parser with a
   browser attached — so it should go through it, not around it. */
const demoBoard = (slug, id) => (DEMO.claims[slug+"/"+id]||{}).board || null;
async function boardSize(slug, id){
  if(!isLive()){ const b = demoBoard(slug, id); return b ? (b.size||0) : 0; }
  // one() is correct HERE, and only here: BoardSize returns an int64. The
  // parseTyped hazard the four readers above avoid is specific to quoted
  // strings, so routing a count through boardUnwrap would be cargo cult.
  return await one(`BoardSize(${gstr(slug)},${id})`);
}
async function boardOpenOf(slug, id){
  if(!isLive()){
    const b = demoBoard(slug, id);
    if(b && b.open != null) return b.open;
    // MOST SAMPLE CLAIMS CARRY NO BOARD, and that is the common live case too —
    // an empty board, not an absent feature. Falling back to "closed" would have
    // hidden the invitation on nearly every offline page. The rule mirrors the
    // realm's: boardOpen is `verdictAt == 0 && !closed` (board.gno:196), which
    // is settled and provClose (a verdict exists) plus a closed claim. An
    // answered, disputed or provisional claim still takes comments.
    const d = DEMO.claims[slug+"/"+id];
    return !!d && d.phase !== "settled" && d.phase !== "provClose" && d.phase !== "closed";
  }
  return await one(`BoardOpen(${gstr(slug)},${id})`);
}
async function boardHiddenOf(slug, id){
  if(!isLive()){
    // The sample carries wire strings, so it counts its own top-level marks —
    // which is exact here because a demo board is never longer than one page.
    const b = demoBoard(slug, id);
    return boardNewestRows((b && b.newest) || "").filter(r => r.mark !== ".").length;
  }
  return await one(`BoardHiddenCount(${gstr(slug)},${id})`);
}
async function boardParties(slug, id){
  if(!isLive()){ const b = demoBoard(slug, id); return boardPartyRows((b && b.parties) || ""); }
  return await readBoardParties(slug, id);
}

/* THE CHIP IS THE COUNT. It used to lead with who had spoken — "the author and
   the answerer have replied · 5 comments" — on the argument that a fact beats a
   number. In the row it lives in, beside four other links, that is a sentence
   where every neighbour is a word, and the owner asked for it gone. The parties
   are still on the board; the chip's job is to say there is something there and
   how much of it.

   ONE LABEL FOR THE COUNT on every branch. An earlier draft said "5 comments"
   beside a party line and "5 comments and replies" without one, which reads as
   two different numbers of two different things — it is one number, and it is
   the one the realm's own page prints (board.gno:writeBoardLink counts every
   row, replies included).

   NOTHING AT ALL for a claim that is settled with no comments, which is the call
   the realm makes on its own page: an empty board is worth an invitation only
   while somebody can still accept it.

   Pure so it can be tested without a DOM — the caller does the reads. */
function boardChipLabel(n, open, parties){
  if(!(n > 0)) return open ? "discuss this claim" : "";
  return n + (n === 1 ? " comment" : " comments");
}
function boardChip(slug, id, n, open, parties){
  const label = boardChipLabel(n, open, parties);
  if(!label) return "";
  return `<a class="tlink" href="#/c/${esc(slug)}/${id}/board">${esc(label)}`
       + `<span aria-hidden="true">→</span></a>`;
}

/* BoardSize FIRST AND ALONE. A claim nobody has commented on needs one read: the
   chip has nothing to say about which party replied when neither did, and a
   party scan on every claim page would be a read per view bought for nothing.
   BoardOpen is paid only on the empty branch, where it decides between an
   invitation and silence. */
async function fillBoardChip(slug, id){
  const slot = document.getElementById("boardchip");
  if(!slot) return;
  try{
    const n = await boardSize(slug, id);
    if(!(n > 0)){ slot.innerHTML = boardChip(slug, id, 0, await boardOpenOf(slug, id), []); return; }
    // Filtered like every other party read: the chip says a party "has replied",
    // and a party whose only comment is hidden has not, on any surface here.
    slot.innerHTML = boardChip(slug, id, n, true,
                               boardVisible(await boardParties(slug, id).catch(()=>[])));
  }catch(_){ /* an unreadable board leaves the tagrow as it was, never a broken chip */ }
}

/* DEMO is the two halves joined. Kept as one object so every consumer below is
   untouched by the split — the page never learns which half a field came from,
   only this function does. */
function mergeDemo(chain, overlay){
  const out = {...chain, courts:{}, relations: overlay.relations, claims:{}};
  for(const [slug,c] of Object.entries(chain.courts))
    out.courts[slug] = {...c, ...(overlay.courts[slug]||{})};
  for(const [key,d] of Object.entries(chain.claims)){
    let m = d;
    if(overlay.voteEndsAt[key]!=null) m = {...m, voteEndsAt: overlay.voteEndsAt[key]};
    /* Evidence joins here rather than in the generated half because the sample's
       bytes have no chain source — see DEMO_OVERLAY.media. claimDetail's demo
       branch spreads the claim, so this is all it takes to reach the card. */
    if(overlay.media && overlay.media[key]) m = {...m, media: overlay.media[key]};
    out.claims[key] = m;
  }
  return out;
}

async function listCourts(){

    return Object.entries(DEMO.courts).filter(([,c])=>c.tier!==0) // the render omits hidden courts
      .map(([slug,c])=>({slug, name:c.name, tier:c.tier, claims:c.claims.length}));
  const md = await qrender("");
  const out=[]; let tier=1;
  for(const line of md.split("\n")){
    if(/^##\s+Featured/i.test(line)) tier=2;
    else if(/^##\s+Courts/i.test(line)) tier=1;
    const m = line.match(/^\-\s*\[(.+?)\]\(\/r\/kourt\/kourtv2:([a-z0-9-]+)\)(?:\s*·\s*\S+)?\s*—\s*(\d+)/);
    if(m) out.push({slug:m[2], name:unesc(m[1]), tier, claims:parseInt(m[3],10)});
    // the render's own overflow footer ("…and N more") — a subset must never
    // be labeled as the total. Only the Featured section emits one (the
    // listed-by-burn section has NO footer), so attribute it to featured.
    const f = line.match(/…and\s+(\d+)\s+more/);
    if(f){ if(tier===2) out.moreFeatured=(out.moreFeatured||0)+parseInt(f[1],10);
           else out.more=(out.more||0)+parseInt(f[1],10); }
  }
  return out;
}

  const s=gstr(slug);

  const [md,tier,price,supply,emitted,reservoir,seniorOwed,claims,minted,burnHist,burned,tlAnchor] = await Promise.all([
    qrender(slug), one(`CourtTier(${s})`), one(`CoinPrice(${s})`), one(`CoinSupply(${s})`),
    one(`EmittedTotal(${s})`), one(`Reservoir(${s})`), one(`SeniorOwed(${s})`), one(`ClaimCount(${s})`),
    one(`CurvePosition(${s})`).catch(()=>null),
    // The graph is decoration next to the figures: a court that cannot answer
    // this still renders every number, it just draws no line.
    one(`BurnSeries(${s})`).catch(()=>null),
    one(`CourtBurnedGNOT(${s})`).catch(()=>null),
    // A CLOCK ANCHOR, and it has to be the REALM'S clock. Every other date on

    // shift; dating the burn graph off the browser or off block timestamps

    one(`ClaimTimeline(${s},1)`).catch(()=>null)]);

/* The chain's per-court policing lists, derived from the sample exactly as
   strips.gno defines membership: the review strip enters at PostAnswer and
   exits at crystallize/provClose/dead-close (NOT at settle), nearest deadline
   first, and it IGNORES hide bits by construction — a hidden claim stays
   policeable. Pending = seeded claims nobody answered, oldest first. */
function demoStrips(slug){
  const c = demoCourt(slug); if(!c) return {strip:[], pending:[]};
  const rows = c.claims.map(id=>[id, DEMO.claims[slug+"/"+id]]).filter(([,d])=>d);
  const strip = rows
    .filter(([,d])=> d.phase==="answered" || d.phase==="disputed" || d.phase==="provisional"
                  || (d.phase==="settled" && !d.crystallized))
    .map(([id,d])=>({id, title:d.title, deadline:d.settleAt!=null? d.settleAt:null}))
    .sort((a,b)=>(a.deadline==null?Infinity:a.deadline)-(b.deadline==null?Infinity:b.deadline));
  const pending = rows
    .filter(([,d])=> d.phase==="open" && d.seeded===true)
    .map(([id,d])=>({id, title:d.title, seeded:true}))
    .sort((a,b)=>a.id-b.id);
  return {strip, pending};
}
async function listClaims(slug){
  if(!isLive()){ const c=demoCourt(slug); if(!c) return [];
    // newest first, matching the chain's own docket order
    const outD = [...c.claims].sort((a,b)=>b-a)
      .filter(id=>!(DEMO.claims[slug+"/"+id]||{}).hidden) // the render omits hidden claims
      .map(id=>{ const d=DEMO.claims[slug+"/"+id];
      return {id, title:d.title, statusText:statusText(d), series:claimSeries(d),
              inst:pctYes(d.yesStake,d.noStake), settleAt:d.settleAt, escrowUntil:d.escrowUntil}; });
    const dsp = demoStrips(slug);
    outD.strip = dsp.strip; outD.pending = dsp.pending;
    return outD; }
  const md = await qrender(slug);
  const out=[]; out.strip=[]; out.pending=[];
  const seen=new Set(), seenS=new Set(), seenP=new Set();
  let sec=null; // "claims" | "strip" | "pending" | null — the render's own sections
  const re = new RegExp("^\\-\\s*\\[(.+?)\\]\\(\\/r\\/kourt\\/kourtv2:"+slug+"\\/(\\d+)\\)\\s*—\\s*(.*)$");
  const reBare = new RegExp("^\\-\\s*\\[(.+?)\\]\\(\\/r\\/kourt\\/kourtv2:"+slug+"\\/(\\d+)\\)(?:\\s*—\\s*(.*))?$");
  for(const line of md.split("\n")){
    if(/^##\s/.test(line)){
      sec = /^##\s+Claims/.test(line)? "claims"
          : /^##\s+Needs review/.test(line)? "strip"
          : /^##\s+Awaiting an answer/.test(line)? "pending" : null;
      continue;
    }
    if(sec==="claims"){
      const f = line.match(/…and\s+(\d+)\s+older/);
      if(f){ out.more = parseInt(f[1],10); continue; }
      const m=line.match(re); if(!m) continue;
      const id=parseInt(m[2],10); if(seen.has(id)) continue; seen.add(id);
      out.push({id, title:unesc(m[1]), statusText:m[3].trim()});
    } else if(sec==="strip"){
      const f = line.match(/…and\s+(\d+)\s+more/);
      if(f){ out.stripMore = parseInt(f[1],10); continue; }
      const m=line.match(reBare); if(!m) continue;
      const id=parseInt(m[2],10); if(seenS.has(id)) continue; seenS.add(id);
      // BOTH WORDS, because the realm and this page ship separately: a node may be
      // running either wording, and a parser that knows only the new one silently
      // loses every deadline on an older chain.
      const dm = (m[3]||"").match(/settles at (?:height|block)\s+(\d+)/);
      out.strip.push({id, title:unesc(m[1]), deadline: dm? parseInt(dm[1],10):null});
    } else if(sec==="pending"){
      const f = line.match(/…and\s+(\d+)\s+more/);
      if(f){ out.pendingMore = parseInt(f[1],10); continue; }
      const m=line.match(reBare); if(!m) continue;
      const id=parseInt(m[2],10); if(seenP.has(id)) continue; seenP.add(id);
      out.pending.push({id, title:unesc(m[1]), seeded:/seeded by a moderator/.test(m[3]||"")});
    }
  }
  await nameTheSide(slug, out);
  return out;
}
/* THE VERDICT SIDE IS NOT IN ClaimStatus, so it is asked for once, here, where
   every surface's claim data is born. "settled" says a claim reached its terminal
   state and not what it decided, so a settled-NO row and a settled-YES row read
   identically — in the docket pill, in the map's node tooltip, in the selection
   panel, everywhere.
   Spliced into statusText rather than carried as a field because phaseClass reads
   the side back out of that string, so nothing downstream needs to know. And the
   ask is CONDITIONAL on the status not already naming a side: the realm's
   PROVISIONAL line writes sideName() and its SETTLED line does not, so the day
   that is fixed this goes quiet by itself instead of becoming a second source of
   truth. */
async function nameTheSide(slug, rows){
  if(!isLive() || !rows || !rows.length) return;
  const need = rows.filter(r=>/settled/i.test(r.statusText||"")
                            && !/\b(YES|NO)\b/.test(r.statusText||""));
  if(!need.length) return;
  const sq = gstr(slug);
  await inChunks(need, 6, async r=>{
    const v = await one(`Verdict(${sq},${r.id})`).catch(()=>null);
    if(v==null) return;                    // mid-crystallise, or closed without a decision
    const side = sideName(Number(v));
    if(side==="—") return;                 // never print a dash where a side belongs
    r.statusText = String(r.statusText).replace(/settled/i, m=>m+" "+side);
  });
}

        const hidden = await one(`HiddenFromListing(${s2},${i})`).catch(()=>true); // fail closed: an unreadable moderation state never lists
        if(hidden) return null;
        const [t,st] = await Promise.all([one(`ClaimTitle(${s2},${i})`).then(unesc), one(`ClaimStatus(${s2},${i})`)]);
        return {id:i, title:t, statusText:st};
      }catch(_){ return {id:i, title:"read failed — reload to retry", statusText:"", failed:true}; }
    });
    out.push(...fetched.filter(Boolean));

/* THE PACKED CLAIM RECORD, parsed by POSITION. Thirty-nine tab-separated columns
   in the order claim.gno's ClaimHead documents; the width is checked before any
   of them is read, because a record of the wrong length means the realm and this
   page disagree about the format and reading it anyway would put a bond in the
   deadline's variable with nothing to notice.
   Returns null on any doubt — a missing entrypoint, a short record, an
   unparseable number — and the caller then reads every field the old way. */
const CLAIM_HEAD_FIELDS = 39;
async function claimHeadOf(s, i){
  let raw;
  try{ raw = await one(`ClaimHead(${s},${i},${WEEK})`); }
  catch(_){ return null; }                  // an older realm: read them singly
  const f = String(unesc(raw||"")).split("\t");
  if(f.length !== CLAIM_HEAD_FIELDS) return null;
  const n = k => { const v = Number(f[k]); return Number.isFinite(v)? v : null; };
  const b = k => f[k] === "1";
  const h = {
    yesStake:n(0), noStake:n(1), convYes:n(2), convNo:n(3),
    trailOI:n(4), trailOImature:b(5), trailYesAvg:n(6), trailYesMature:b(7),
    answered:b(8), disputeOpen:b(9), settled:b(10), provClose:b(11),
    provisional:n(12), closed:b(13),
    answer:n(14), answerBond:n(15), settleAt:n(16), answerer:f[17], answerRecord:n(18),
    round:n(19), disputeBondNext:n(20), escrowUntil:n(21),
    quorumFloor:n(22) || null, voteCloses:n(23) || null,
    verdict:n(24), route:f[25], crystallized:b(26),
    drawW:n(27), drawA:n(28), drawAns:n(29), drawCarrot:n(30),
    author:f[31] || null, hidden:b(32), redacted:b(33), purged:b(34), seeded:b(35),
    stakeOpenDelay:n(36), boardSize:n(37), boardOpen:b(38),
  };
  // a number that did not parse is a format disagreement, not a zero
  for(const k of ["yesStake","noStake","convYes","convNo","trailOI","trailYesAvg"])
    if(h[k] === null) return null;
  return h;
}
async function claimDetail(slug,id){
  if(!isLive()){ const d=DEMO.claims[slug+"/"+id]; if(!d) return null;
    const ph=d.phase;
    return {id, ...d,
      statusText: statusText(d),
      answered: ph==="answered"||ph==="disputed"||ph==="provisional"||ph==="settled",
      disputeOpen: ph==="disputed",
      settled: ph==="settled"||ph==="provClose",
      provClose: ph==="provClose",
      provisional: ph==="provisional"? (d.provisional!=null? d.provisional:0) : -1,
      closed: ph==="closed"}; }
  const s=gstr(slug), i=id;
  /* ONE READ FOR EVERY NUMBER ON THIS PAGE. A qeval costs the same whatever it
     returns — measured against the live node, one field takes 270ms and
     eighty-eight take 310ms, because the price is loading the realm into the VM
     before the question is even read. A claim page asking thirty-eight of them
     paid that toll thirty-eight times, which no amount of parallelism, HTTP/2 or
     caching could touch. ClaimHead is the same thirty-eight answers in one call.

     The free text keeps its own reads: a title may contain a tab and a body
     contains newlines, and a delimited record that a caption can break is worse
     than a second query. Those four go in the same wave, so it is one round trip
     either way.

     A chain without the entrypoint answers "name ClaimHead not declared", and
     then every field is read the old way — this page is static and can be
     pointed at any node. */
  const head = isLive()? await claimHeadOf(s, i) : null;
  const [title,status,pools,pconv,toi,tyes,answered,disputeOpen,settled,provClose,provisional,closed,body,mediaRaw] = await Promise.all([
    one(`ClaimTitle(${s},${i})`).then(unesc),
    one(`ClaimStatus(${s},${i})`),
    head? [head.yesStake, head.noStake] : tup(`StakePools(${s},${i})`),
    head? [head.convYes, head.convNo] : tup(`PoolConviction(${s},${i})`),
    head? [head.trailOI, head.trailOImature] : tup(`TrailingOI(${s},${i},${WEEK})`),
    head? [head.trailYesAvg, head.trailYesMature] : tup(`TrailingYes(${s},${i},${WEEK})`),
    head? head.answered : one(`HasAnswer(${s},${i})`),
    head? head.disputeOpen : one(`DisputeOpen(${s},${i})`),
    head? head.settled : one(`Settled(${s},${i})`),
    head? head.provClose : one(`ProvClose(${s},${i})`),
    head? head.provisional : one(`Provisional(${s},${i})`),
    head? head.closed : one(`ClaimClosed(${s},${i})`).catch(()=>false),
    // A realm deployed before bodies existed has no ClaimBody, and a claim page
    // that fails whole because of a missing optional field would be the worse
    // bug. Empty is the same answer as "this claim has no body".
    one(`ClaimBody(${s},${i})`).then(unesc).catch(()=>""),
    // Same tolerance, same reason: a realm deployed before media existed has no
    // ClaimMedia, and "[]" is the same answer as "this claim carries none".
    one(`ClaimMedia(${s},${i})`).then(unesc).catch(()=>"[]")]);
  const d = {head, id, title, body, media: (typeof mediaParse==="function"? mediaParse(mediaRaw) : []), statusText:status, yesStake:pools[0], noStake:pools[1],
    convYes:pconv[0], convNo:pconv[1], trailOImature:toi[1], trailOI:toi[0], trailYesMature:tyes[1], trailYesAvg:tyes[0],
    answered, disputeOpen, settled, provClose, provisional, closed};
  if(answered){
    const answerer = head? head.answerer : await one(`Answerer(${s},${i})`);
    /* THREE READS FEWER. QualityTier, FlagState and FlagBondNext went with the
       quality lane and no longer exist on chain — every claim page was asking a
       realm that answers InvalidPkgPathError, and Promise.all means one missing
       read takes the whole batch with it. The claim's SIZE rating comes from the
       realm's own Render now (see tierText in render.gno); the page does not
       recompute it. */
    const [ans,bond,rec,settleAt] = head
      ? [head.answer, head.answerBond, head.answerRecord, head.settleAt]
      : await Promise.all([
          one(`AnswerVerdict(${s},${i})`), one(`AnswerBond(${s},${i})`), one(`AnswerRecord(${s},${gstr(answerer)})`).catch(()=>0),
          one(`SettleDeadline(${s},${i})`)]);
    Object.assign(d,{answer:ans, answerer, answerBond:bond, record:rec, settleAt});
  }
  /* ONE WAVE, NOT NINE. Every read below was awaited on its own line, so a claim
     page walked FailedRounds -> DisputeBondNext -> EscrowUntil -> QuorumFloorOf
     -> DisputeVoteCloses -> Crystallized -> ... one round trip at a time.
     Measured on kourt.xyz before this: the reads marched from 1610ms to 3220ms
     in thirteen steps of about 80ms each, while the node answered every one of
     them in under a hundred. Nothing here reads a value the line above it
     produced — they are all keyed on the same claim and gated on flags this
     function already has — so waiting was pure ceremony.

     The phase flags still gate what is ASKED: a settled claim is not asked for a
     dispute bond. What changed is that the asking happens at once.

     Each keeps its own .catch, because Promise.all rejects as a whole and one
     absent entrypoint must cost its own field rather than the page — the same
     reason the answer batch above it is written that way. */
  {
    const live = answered && !settled;
    const ready = settled && !provClose;
    const [round, bondNext, escrow, quorum, voteEnds, verdict, route, cryst] = head
      ? [head.round, head.disputeBondNext, head.escrowUntil, head.quorumFloor,
         head.voteCloses, head.verdict, head.route, head.crystallized]
      : await Promise.all([
      live? one(`FailedRounds(${s},${i})`).catch(()=>0) : null,
      live? one(`DisputeBondNext(${s},${i})`).catch(()=>0) : null,
      live? one(`EscrowUntil(${s},${i})`).catch(()=>0) : null,
      // the running round's own bar was snapshotted at open and is unexposed;
      // this is the bar a NEW dispute faces today — labeled that way in the UI
      (live && disputeOpen)? one(`QuorumFloorOf(${s},${i})`).catch(()=>null) : null,
      // THE ROUND'S CLOSE, read rather than guessed. A HEIGHT — the number the
      // governor actually gates on (dispute.gno) — so everything downstream
      // keeps treating it as one. 0 means no open round, and 0 is falsy, which
      // is the same "nothing to show" every consumer already handled.
      (live && disputeOpen)? one(`DisputeVoteCloses(${s},${i})`).catch(()=>0) : null,
      ready? one(`Verdict(${s},${i})`).catch(()=>-1) : null,
      ready? one(`VerdictRoute(${s},${i})`).catch(()=>"") : null,
      one(`Crystallized(${s},${i})`).catch(()=>false),
    ]);
    // the draw slices ride in the record too, so a crystallized claim costs no
    // extra round trip either
    if(head && cryst) d.draw = {w:head.drawW, a:head.drawA, ans:head.drawAns, carrot:head.drawCarrot};
    if(live){
      d.round = round; d.disputeBondNext = bondNext; d.escrowUntil = escrow;
      if(disputeOpen){ d.quorumFloor = quorum; d.voteEndsAt = voteEnds || null; }
    }
    if(ready){ d.verdict = verdict; d.route = route; }
    if(cryst){
      d.crystallized = true;
      if(!d.draw){ const ds = await tup(`DrawSlices(${s},${i})`);
        d.draw = {w:ds[0], a:ds[1], ans:ds[2], carrot:ds[3]}; }
    }
  }
  // phase for the demo-shaped views
  d.phase = d.closed?"closed": d.provClose?"provClose": d.settled?"settled": d.disputeOpen?"disputed": (d.provisional>=0?"provisional": d.answered?"answered":"open");
  return d;
}
/* WHICH SIDE YOU ACTUALLY HOLD. The ticket offers Withdraw (YES side) and
   Withdraw (NO side) because the realm withdraws one side at a time — a staker
   can hold both — and the page had never asked which. So most readers met two
   buttons, one of which answers "nothing staked on that side", and found out
   which by pressing.

   AFTER THE RENDER, not before it: the ticket must not wait on a read, and the
   answer needs an address the reader may not have connected yet. Both buttons
   stand until the read comes back, because "we do not know" and "you hold
   nothing" are different answers and only one of them should remove a control.

   Reads nothing new — positionOf is the same pair of StakeOf calls the vote
   lane and the me page already make. */
/* WHO THE CLAIM'S PARTIES ARE, asked rather than assumed. The participant guard
   needs the author and the answerer, and its first version read them off `d` —
   where the claim route had never put the author (it read it into a local, for
   one line of "opened by") and the sample had never carried the answerer on its
   settled claim. Both absences made the guard bail silently, which is how a
   reader still met the panic in their wallet after the guard shipped.
   A control that decides whether to grey itself has to fetch its own inputs. */
async function claimParties(slug, id, d){
  let a2 = (d && d.author) || null, b2 = (d && d.answerer) || null;
  if(a2 && b2) return {author:a2, answerer:b2};
  if(!isLive()){
    const c = DEMO.claims[slug+"/"+id] || {};
    return {author: a2 || c.author || null, answerer: b2 || c.answerer || null};
  }
  const s2 = gstr(slug);
  const [ra, rb] = await Promise.all([
    a2? Promise.resolve(a2) : one(`ClaimAuthor(${s2},${id})`).catch(()=>null),
    b2? Promise.resolve(b2) : one(`Answerer(${s2},${id})`).catch(()=>null)]);
  return {author: ra, answerer: rb};
}
/* WHICH OF THE FOUR PULLS ARE ACTUALLY YOURS, and what they are worth.
   All four were offered to everybody and none said an amount: the author's
   slice to readers who did not file the claim, the answerer's to readers who
   did not answer it, a voter reward to people who never voted. Each one is a
   signature away from a panic, which is the same fault the withdraw pair had
   and the same fix — ask, then remove what is not theirs.
   THE RULES ARE claimables()'s, deliberately. That function already decides
   which draws an address may take, and the me page has been using it; a second
   opinion here is how the two surfaces start disagreeing about whose draw it
   is. What is new is only the amount and the removal.
   PullState is per address and one read. A failed read leaves every pull
   standing rather than removing one somebody could have taken. */
/* HOW MUCH THERE IS TO STAKE, beside the field that asks for an amount. The

/* UNSTAKE IS ONLY OFFERED WHERE THERE IS SOMETHING TO TAKE BACK. Both buttons

   The same rule the settled ticket already applies to its withdraw sides.

   HIDDEN RATHER THAN GREYED, unlike the crystallize button: a greyed control

   for a window. There is no story for unstaking a position you never took, and a
   permanently dead button is furniture.

   Marked with data-unstake because btn()'s demo branch emits an inert button
   with no data-func, so a selector built on the function name matches nothing in
   the sample — the mistake three earlier fills here made. */
async function fillUnstakeSides(slug, id){
  const wrap = document.getElementById("stake-ticket");
  if(!wrap) return;
  const sides = [...wrap.querySelectorAll("[data-unstake]")];
  if(!sides.length) return;
  if(!CFG.addr) return;                 // no wallet: nothing is known, so nothing is offered
  let pos;
  try{ pos = await positionOf(slug, id, CFG.addr); }catch(_){ return; }
  for(const el of sides){
    const held = el.dataset.unstake === "0"? Number(pos.yes) : Number(pos.no);
    if(!(held > 0)) continue;           // stays hidden
    const b = el.querySelector(".btn");
    /* THE AMOUNT IS WRITTEN HERE, NOT IN THE MARKUP, and that was the bug.
       The button shipped with a hardcoded amount:1000000 — one whole coin — and
       this function then appended the REAL holding to its label. So it showed
       "Unstake YES 19.5 KOURT:COVID" and sent an unstake of 1.0: under a coin
       the realm refused the whole transaction with "unstaking more than is
       staked", and over a coin it quietly unstaked a fraction of what the label
       named. The second is the worse half — a wrong number that succeeds.
       data-args is read at click time, so rewriting it here is the fix, and it
       has to happen BEFORE the button is revealed.
       FAIL CLOSED. If the args cannot be parsed or rewritten the button stays
       hidden, because the only alternative is offering a control that sends an
       amount nobody chose. */
    if(b){
      let ok = false;
      try{
        const a = JSON.parse(b.dataset.args || "{}");
        a.amount = held;
        b.dataset.args = JSON.stringify(a);
        ok = true;
      }catch(_){ ok = false; }
      if(!ok) continue;                 // stays hidden rather than send 1000000
      b.insertAdjacentHTML("beforeend", ` <small>${cc(held, slug)}</small>`);
    }
    el.hidden = false;
  }
}
async function fillStakeBalance(slug){
  const out = document.getElementById("stakebal");
  const f = document.getElementById("stakeamt");
  if(!out || !f || !CFG.addr) return;
  let bal;
  try{ bal = await balanceOf(slug, CFG.addr); }catch(_){ return; }
  if(bal==null || !isFinite(+bal)) return;
  const micro = +bal;
  /* BOTH NUMBERS IN THE BOX: what you are staking, and out of how much. It read
     "KOURT:COVID of 201.7" beside the field — the coin's name once as a unit and
     again inside a figure, six words to assemble — and then wrapped onto a second
     line the moment the balance was long. In the box it is one glance:
     1.5 / 201.7, with the unit once after it. Clicking the balance stakes all
     of it. */
  /* THE WHOLE ROW IS THE BOX NOW. A label to its left and the coin's name to its
     right made three elements for one question, and the two of them wrapped the
     moment the balance grew. Inside: what you are staking, then out of how much,
     then of what. "0 / 201.7 KOURT:COVID" — one glance, and the unit governs
     both numbers because it sits after both. */
  const fig = ccText(micro, slug).replace(" " + ccSym(slug), "");
  out.textContent = "/ " + (micro>0? fig : "0") + " " + ccSym(slug);
  // Left where the click handler can read it: whether the reader holds any coin
  // decides what a refused amount should SAY, and that is decided at the press.
  const w = document.getElementById("stakeamtwrap");
  if(w) w.dataset.held = String(micro);
  /* SHOWN ON THE BALANCE, NOT ON A REFUSED CLICK. A reader holding none learns it
     from the row rather than by pressing a button and being told no — and it is
     the same fact either way, known here as soon as the balance is read. */
  const g = document.getElementById("stakeget");
  if(g) g.hidden = micro > 0;
  if(micro<=0){ out.classList.add("none"); return; }
  out.classList.remove("none");
  out.addEventListener("click", ()=>{ f.value = String(micro/1e6); f.focus(); });
}
async function fillTicketPulls(slug, id, d, p){
  const wraps = [...document.querySelectorAll(".stakewrap .ticket [data-pull]")];
  if(!wraps.length || !d || !d.crystallized) return;
  const addr = CFG.addr;
  let pulls = d.pulls || null;
  if(!pulls && isLive()){
    const ps = await tup(`PullState(${gstr(slug)},${id},${gstr(addr)})`).catch(()=>null);
    pulls = ps? {winnerPaid:!!ps[0], authorPaid:!!ps[1], answererPaid:!!ps[2]} : null;
  }
  if(!pulls) return;                       // unread: leave them all
  const party = await claimParties(slug, id, d);
  const v = (d.verdict!=null && d.verdict>=0)? d.verdict : (d.route==="vote"? null : d.answer);
  const mine = {
    winner:  v!=null && !pulls.winnerPaid && ((v===0 && (+p.cy||0)>0) || (v===1 && (+p.cn||0)>0)),
    author:  !pulls.authorPaid && party.author===addr && !d.seeded,
    answerer:!pulls.answererPaid && party.answerer===addr && !(d.draw && d.draw.ans===0),
    // The carrot excludes every participant, and only the court knows whether
    // this address voted with the verdict — so it is offered to a non-
    // participant and labelled as conditional rather than promised.
    carrot:  d.route==="vote" && d.draw && d.draw.carrot>0
             && party.author!==addr && party.answerer!==addr
             && !(+p.yes>0) && !(+p.no>0) && !(+p.cy>0) && !(+p.cn>0),
  };
  for(const w of wraps){
    const k = w.getAttribute("data-pull");
    const pool = +w.getAttribute("data-pool") || 0;
    // A slice of nothing is not a control. claimables already says this about
    // the overturned answerer ("draws nothing"); it is true of any empty slice.
    if(!mine[k] || pool<=0){ w.remove(); continue; }
    const el = w.querySelector(".btn");
    if(!el || el.querySelector("small")) continue;
    // The author's and the answerer's slices are the WHOLE slice, so they can be
    // stated. Accuracy and the carrot are shared out, so they name the pool.
    const sm = document.createElement("small");
    sm.textContent = (k==="author"||k==="answerer")? ccText(pool, slug) : "of "+ccText(pool, slug);
    el.appendChild(document.createTextNode(" "));
    el.appendChild(sm);
  }
}
async function fillWithdrawSides(slug, id, d, nowH, vAt){

     the one place this behaviour can be seen without a wallet. */
  const wraps = [...document.querySelectorAll(".stakewrap .ticket [data-wside]")];
  if(!wraps.length) return;

  if(!p) return;

     participant-only for FINALIZE_GRACE blocks after the verdict, and the page
     used to offer it to everyone and let Adena relay the panic — which is
     exactly what a reader got: a button they could press, and
     "kourtv2: Crystallize is participant-only for its first week" from a wallet.
     isParticipant is author, answerer, or a stake on either side (dispute.gno),

     GREYED ONLY WHEN ALL THREE ARE KNOWN AND ALL THREE ARE NO. A missing

    crys.setAttribute("aria-disabled","true");

       number is already in hand from the position read that kept the button. */
    const lab = w.querySelector(".btn");

  if(box && !box.querySelector(".txnote")){
    const n = document.createElement("div");
    n.className = "txnote"; n.setAttribute("role","status");
    n.textContent = "You have no stake on this claim.";
    box.appendChild(n);
  }
}
