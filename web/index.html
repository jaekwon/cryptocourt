<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kourt — the ledger of record</title>
<meta name="description" content="A court of record for factual claims. Anyone may state a claim; stake decides which claims get answered; the answer and its route are kept on-chain.">
<!-- Link previews, and the honest limit of them.
     These are SITE-level and deliberately so. A crawler fetching a URL is served
     this one file and never runs its JavaScript, so #/c/orem/1 and #/ are the
     same document to it — a per-claim og:title is not something a hash-routed
     static page can express, and faking one would show every claim the same
     preview. The share panel's downloadable card is the answer for a specific
     claim: the sharer attaches a picture of the actual claim, which is what
     Polymarket's per-market card achieves through a server this page does not
     have. web/README.md records what a server would need to do.

     THE IMAGE IS THE SITE'S OWN FACE, which is the one picture that is true of
     every URL here. This used to carry no og:image at all, on the grounds that a
     fixed image would misrepresent whichever claim was being shared — right about
     a claim, wrong as a reason to have none, because the seat is not a claim. A
     data: URI still cannot be used (no major crawler follows one), so og.png is a
     real file shipped beside this one and named absolutely, and deploy.sh will
     refuse to ship a page whose og:image it is not also uploading. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kourt">
<meta property="og:url" content="https://kourt.xyz/">
<meta property="og:title" content="Kourt — the ledger of record">
<meta property="og:description" content="A court of record for factual claims. Stake decides which claims get answered; the answer and its route are kept on-chain.">
<meta property="og:image" content="https://kourt.xyz/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="An empty stone seat of judgment, over the word Kourt.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kourt — the ledger of record">
<meta name="twitter:description" content="A court of record for factual claims. Stake decides which claims get answered; the answer and its route are kept on-chain.">
<meta name="twitter:image" content="https://kourt.xyz/og.png">
<meta name="twitter:image:alt" content="An empty stone seat of judgment, over the word Kourt.">
<!-- THE CHAIN IS A SECOND ORIGIN, and the first read cannot start until DNS, TCP
     and TLS to it are up. Measured on kourt.xyz: the page is interactive at
     560ms and the first query leaves at 548ms — the handshake is on the critical
     path, in series with a parse that had already finished. preconnect starts it
     while the HTML is still being read.
     Written with the RPC host rather than ${CFG.rpc} because a <link> in <head>
     is acted on before any script runs; deploy.sh stamps this file's chain
     config, and a page pointed elsewhere simply opens a connection it does not
     use. crossorigin is required — the RPC is fetched with CORS, and a
     preconnect without it warms a socket the fetch will not reuse. -->
<link rel="preconnect" href="https://rpc.kourt.xyz" crossorigin>
<link rel="dns-prefetch" href="https://rpc.kourt.xyz">
<!-- The tab icon is the same drawing as the rail's mark, and follows the
     browser theme: an SVG favicon carries its own stylesheet, so
     prefers-color-scheme works inside it. Was ⚖️, which every platform
     draws differently. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='3 0 94 100'%3E%3Cstyle%3Erect{fill:%23111}@media(prefers-color-scheme:dark){rect{fill:%23e6edf2}}%3C/style%3E%3Crect x='17' y='0' width='5' height='66'/%3E%3Crect x='24' y='0' width='5' height='66'/%3E%3Crect x='31' y='0' width='5' height='66'/%3E%3Crect x='64' y='0' width='5' height='66'/%3E%3Crect x='71' y='0' width='5' height='66'/%3E%3Crect x='78' y='0' width='5' height='66'/%3E%3Crect x='36' y='8' width='28' height='58'/%3E%3Crect x='12' y='66' width='76' height='10'/%3E%3Crect x='20' y='76' width='10' height='11'/%3E%3Crect x='70' y='76' width='10' height='11'/%3E%3Crect x='8' y='87' width='84' height='6'/%3E%3Crect x='3' y='93' width='94' height='7'/%3E%3C/svg%3E">
<style>
/* ============================================================================
   Kourt overlay — a presentation layer over the r/kourt/kourtv2 realm.
   The chain carries all the information (every screen here can be served by the
   realm's own Render); this overlay only makes it prettier, and every button is
   a signable gnoweb transaction link, never a private API. Self-contained: no
   external fonts, scripts, or styles — it runs from a file:// or any static host.
   ========================================================================== */

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul[role=list]{list-style:none;padding:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
img,svg{display:block;max-width:100%}

:root{
  --paper:#eaeef1; --surface:#f7f9fa; --surface-2:#e2e8ec; --inset:#e2e8ec;
  --ink:#16202a; --ink-2:#4a5b68; --muted:#56646f;
  --line:#dbe3e8; --line-2:#c8d2d9;
  --accent:#2e3a7d; --accent-2:#24306b; --accent-wash:#dfe3f2; --accent-ink:#fff;
  --yes:#1c6551; --yes-wash:#d8e7e1; --no:#93362b; --no-wash:#f0dcd8; --contra:#d92d20; --contra-wash:#fbe0dd;
  --escrow:#7d5c0f; --escrow-wash:#f0e6cd; --void:#74848f; --void-wash:#e2e8ec;
  --good:#1c6551; --bad:#a3281c;
  --gilt:#9a6f12;   /* the mark's highlight; deeper here so it reads on cream */
  --shadow-sm:0 1px 2px rgba(27,27,33,.05);
  --shadow:0 1px 2px rgba(27,27,33,.05), 0 10px 30px -16px rgba(27,27,33,.22);
  /* NEON, OFF. Every glow in this file is a token, so the light theme turns
     them all off in one place rather than each rule needing a theme guard.
     Glow on white paper is smudge, not light. */
  --glow-a:none; --glow-y:none; --glow-n:none; --glow-e:none;
  --trace:none; --edge:transparent;
  /* THE REGISTER. Surfaces lose their fills and become hairline frames with
     registration marks; the chain's own data is the only thing that glows; and
     gold marks PROVENANCE — which record you are looking at — never state.
     Three colours, and only two of them are new: --mark reuses the values
     already proven as --escrow rather than adding a third gold to the palette.
     --scan and --ring are none/transparent here for the same reason every glow
     is: a scanline is a CRT artifact and ink does not emit light. */
  --mark:#7d5c0f; --data:#0f6b7a; --retic:#0d6b5a;
  --rule:rgba(46,58,125,.34); --rule-2:rgba(46,58,125,.18);
  --scan:transparent; --ring:none;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
  --r:3px; --r-sm:3px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#11171c; --surface:#171f26; --surface-2:#1d2731; --inset:#0d1317;
    --ink:#e6edf2; --ink-2:#a3b2bd; --muted:#8a99a4;
    --line:#212b33; --line-2:#2b3843;
    --accent:#9aa8ee; --accent-2:#b3bef3; --accent-wash:#1e2545; --accent-ink:#11171c;
    --yes:#6fc0a5; --yes-wash:#12302a; --no:#e08b7c; --no-wash:#351a16; --contra:#ff6b5e; --contra-wash:#3a1512;
    --escrow:#d7b264; --escrow-wash:#2e2512; --void:#7a8994; --void-wash:#1a232b;
    --good:#6fc0a5; --bad:#e5847a;
    --gilt:#e2b552;   /* and brighter on the dark page */
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.7);
    /* NEON, ON — and kept to the things that carry information: the traces on
       the chart, the stake bar, the state pills, the focused control. Nothing
       animates and nothing decorative glows, because a UI that pulses is a toy
       and this one is a record. Each is one shadow, no stacked blurs.
       0 0 Npx: a halo with no offset reads as emitted light rather than as a
       drop shadow, which is the whole difference between Tron and a bevel. */
    /* TURNED UP. The first pass was invisible: measured side by side against the
       previous build, the only perceptible difference was a faint halo on one
       dot. "Subtle" has to mean restrained-but-present, not absent — so the
       radius roughly doubles, the opacity goes up by half, and the traces get a
       second wider halo underneath the tight one. Two shadows is what makes it
       read as emitted light rather than a blurred edge. */
    --glow-a:0 0 8px rgba(154,168,238,.55), 0 0 22px rgba(154,168,238,.22);
    --glow-y:0 0 8px rgba(111,192,165,.60), 0 0 22px rgba(111,192,165,.26);
    --glow-n:0 0 8px rgba(224,139,124,.55), 0 0 22px rgba(224,139,124,.22);
    --glow-e:0 0 8px rgba(215,178,100,.50), 0 0 20px rgba(215,178,100,.20);
    /* CYAN, not indigo. Two hues doing two jobs: gold annotates, cyan is what
       the chain recorded. The accent is the interface's colour and it was also
       the data's, so the one line on the page that is a measurement looked like
       another piece of furniture. */
    --trace:drop-shadow(0 0 3px rgba(95,211,230,.85)) drop-shadow(0 0 11px rgba(95,211,230,.4));
    --edge:rgba(179,190,243,.9);
    /* A lit top edge on a panel, so a card reads as a slab with light on it. */
    --mark:#d7b264; --data:#5fd3e6; --retic:#7fe3d0;
    --rule:rgba(154,168,238,.30); --rule-2:rgba(154,168,238,.16);
    /* 1px of black in every 3, multiplied. Imperceptible on near-black; the
       same value on near-white is a huge visible step, which is why the light
       theme has none. */
    --scan:rgba(0,0,0,.10); --ring:drop-shadow(0 0 4px rgba(215,178,100,.85));
  }
}

  --paper:#eaeef1; --surface:#f7f9fa; --surface-2:#e2e8ec; --inset:#e2e8ec;

  --escrow:#7d5c0f; --escrow-wash:#f0e6cd; --void:#74848f; --void-wash:#e2e8ec; --good:#1c6551; --bad:#a3281c;
  --gilt:#9a6f12;
  --shadow-sm:0 1px 2px rgba(27,27,33,.05); --shadow:0 1px 2px rgba(27,27,33,.05), 0 10px 30px -16px rgba(27,27,33,.22);
  --glow-a:none; --glow-y:none; --glow-n:none; --glow-e:none;
  --trace:none; --edge:transparent;
  --mark:#7d5c0f; --data:#0f6b7a; --retic:#0d6b5a;
  --rule:rgba(46,58,125,.34); --rule-2:rgba(46,58,125,.18);
  --scan:transparent; --ring:none;
}
:root[data-theme=dark]{
  --paper:#11171c; --surface:#171f26; --surface-2:#1d2731; --inset:#0d1317;

  --yes:#6fc0a5; --yes-wash:#12302a; --no:#e08b7c; --no-wash:#351a16; --contra:#ff6b5e; --contra-wash:#3a1512;

  --gilt:#e2b552;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.7);
  --glow-a:0 0 8px rgba(154,168,238,.55), 0 0 22px rgba(154,168,238,.22);
  --glow-y:0 0 8px rgba(111,192,165,.60), 0 0 22px rgba(111,192,165,.26);
  --glow-n:0 0 8px rgba(224,139,124,.55), 0 0 22px rgba(224,139,124,.22);
  --glow-e:0 0 8px rgba(215,178,100,.50), 0 0 20px rgba(215,178,100,.20);
  --trace:drop-shadow(0 0 3px rgba(95,211,230,.85)) drop-shadow(0 0 11px rgba(95,211,230,.4));
  --edge:rgba(179,190,243,.9);
  --mark:#d7b264; --data:#5fd3e6; --retic:#7fe3d0;
  --rule:rgba(154,168,238,.30); --rule-2:rgba(154,168,238,.16);

body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  display:grid; grid-template-columns:clamp(230px,22vw,290px) 1fr;
  grid-template-rows:auto 1fr; min-height:100vh;
}
/* THE RULING. 1px of black in every 3, multiplied, fixed to the viewport so it
   belongs to the screen and not to the document. It is the one effect here that
   taxes EVERY contrast ratio on the page — a multiply layer scales text and
   background together, which pushes their ratio toward 1 — so it is deliberately
   the weakest thing in the file, and --scan is transparent in the light theme:
   a scanline is a CRT artifact, and the same value on near-white paper is a huge
   visible step that reads as a fax rather than as a screen.
   pointer-events:none, or it would eat every click on the page. */
body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:60;
  background:repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply}
.tnum{font-variant-numeric:tabular-nums}
code,.mono{font-family:var(--mono)}

/* ---- left rail ---------------------------------------------------------- */
.rail{
  grid-row:1/-1; border-right:1px solid var(--rule); background:transparent;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:auto;
}
.brand{padding:22px 22px 16px; border-bottom:1px solid var(--line)}
.brand .mark{display:flex; align-items:center; gap:10px; text-decoration:none}
.brand .scale{font-size:26px; filter:grayscale(.2)}
.brand .seat{display:flex; flex:none; color:var(--ink)}
.brand .mark:hover .seat{color:var(--accent)}
.brand h1{font-family:var(--serif); font-size:22px; font-weight:600; letter-spacing:-.01em; line-height:1.05}
.brand .tag{color:var(--muted); font-size:12.5px; margin-top:6px; letter-spacing:.02em}
.nav{padding:14px 12px; display:flex; flex-direction:column; gap:2px}
.nav a{
  display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:var(--r-sm);
  text-decoration:none; color:var(--ink-2); font-size:14px; font-weight:500;
}
.nav a .g{width:18px; text-align:center; opacity:.8}
.nav a:hover{background:var(--surface-2); color:var(--ink)}
/* The lit edge. A filled block says "selected"; a bright rule down its leading
   edge says it, and looks like a circuit. inset so it costs no layout. */
/* THE LIT RULE ALONE. --glow-a came off with the fill and had to: an outer glow
   on a FILLED block reads as light coming off a slab, and on an unfilled one it
   reads as a glowing rectangle hanging in space around nothing. The inset rule
   still says "selected", and it is the only thing that needs to. */
.nav a.on{background:transparent; color:var(--accent-2); font-weight:600;
  box-shadow:inset 2px 0 0 var(--edge)}
.nav .sec{padding:14px 12px 5px; font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.rail .foot{margin-top:auto; padding:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px}

/* ---- node + theme controls --------------------------------------------- */
.node{font-size:12px}
.node .row{display:flex; align-items:center; gap:7px; margin-bottom:7px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--void); flex:none}
.dot.live{background:var(--good)} .dot.demo{background:var(--escrow)}
.node select,.node input{
  width:100%; font:inherit; font-size:12px; color:var(--ink); background:var(--inset);
  border:1px solid var(--line-2); border-radius:var(--r); padding:6px 8px;
}
.node input.mono{font-family:var(--mono); font-size:11px}
.node label{color:var(--muted); display:block; margin:6px 0 3px}
.themebtn{display:flex; align-items:center; gap:8px; color:var(--ink-2); font-size:12.5px; padding:2px}
.themebtn:hover{color:var(--ink)}

/* ---- main --------------------------------------------------------------- */
.main{grid-column:2; grid-row:2; min-width:0; padding:34px clamp(20px,4vw,56px) 90px; max-width:1080px}
/* THE BREADCRUMB AS A DOCKET REFERENCE. Note what is NOT here: `.crumbs a`
   sets its own colour, so the links stay link-grey and only the separators and
   the page you are ON go gold. Gold = where you are, grey = where you can go.
   That fell out of specificity rather than design, and it is better than what
   was designed, so it is kept deliberately. */
/* The author's statement, in the serif the titles use — it is the same voice.
   Bounded to a reading measure rather than the panel width: 90 characters of
   prose is a wall, and this sits directly under a headline. */
/* A CLAIM'S STATEMENT NEEDS AIR UNDER THE TITLE. This was -4px, which pulled the
   body up against a 36px serif heading and read as one wrapped block. */
.claimbody{margin:10px 0 18px; max-width:74ch}
.claimbody p{font-family:var(--serif); font-size:15.5px; line-height:1.6; color:var(--ink-2); margin:0 0 9px}
.claimbody p:last-child{margin-bottom:0}
.crumbs{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--mark); opacity:.85; margin-bottom:18px; display:flex; gap:7px; flex-wrap:wrap; align-items:center}
/* A JUMP SET INTO A HEADING. It must not inherit the h1's clamp(26px,3.4vw,36px)
   — at that size it competes with the folder's own name — so the size, weight
   and family are all restated. Baseline-aligned rather than middle: the heading
   is serif with a long descender and `middle` floats the link visibly high.
   white-space:nowrap because "on the map" breaking after "on" next to a wrapped
   folder title is the one way this can look accidental. */
.page-h .hjump{display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  margin-left:14px; vertical-align:baseline; text-decoration:none;
  font-family:var(--sans); font-size:13px; font-weight:500; letter-spacing:0;
  color:var(--accent-2)}
.page-h .hjump .icn{width:16px; height:14px; flex:none}
.page-h .hjump:hover{color:var(--accent); text-decoration:underline}
.page-h .hjump:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.seal{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  border:1px solid var(--mark); color:var(--mark); border-radius:0; padding:3px 7px;
  white-space:nowrap; vertical-align:middle}
.crumbs a{text-decoration:none; color:var(--ink-2)} .crumbs a:hover{color:var(--accent-2)}
.crumbs .sep{opacity:.5}

/* These two are PROGRAMMATIC SCROLL TARGETS, not tab stops — the page moves
   focus to them so a screen reader lands in the right place, and they suppress
   the ring for that reason. The glow added to :focus-visible leaked straight
   onto them: a claim title wearing a neon box for no reason the reader can
   explain. Whatever :focus-visible grows, these must cancel all of it. */
.page-h:focus,.page-h:focus-visible{outline:none; box-shadow:none}
#timeline:focus,#timeline:focus-visible{outline:none; box-shadow:none}
.page-h{font-family:var(--serif); font-size:clamp(26px,3.4vw,36px); font-weight:600; letter-spacing:-.015em; line-height:1.08; text-wrap:balance; overflow-wrap:anywhere}
.page-sub{color:var(--ink-2); margin-top:8px; max-width:66ch}
.lead-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap}

section{margin-top:34px}
/* The section rule starts lit at the left and fades to nothing, so a page of
   them reads as etched rather than ruled. border-image, so the border box and
   every existing measurement stay exactly as they were. */
.sec-h{font:600 11px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line-2); padding-bottom:6px; margin-bottom:10px; display:flex; align-items:baseline; gap:10px;
  border-image:linear-gradient(90deg, var(--edge), var(--line-2) 22%, transparent) 1}
.sec-h .count{font-family:var(--mono); font-size:11px; color:var(--ink-2); font-weight:500; letter-spacing:0; text-transform:none}

/* cards + grids */
.grid{display:grid; gap:14px}
.grid.courts{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
/* ONE RULED TABLE, not four cards. Four separate cells each with its own edge
   is four objects; a strip divided by rules is one instrument with four
   readings, which is what it is. */
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0; padding:0;
  background:transparent; border:1px solid var(--rule)}
.grid.stats>div{border-left:1px solid var(--rule); border-radius:0}
.grid.stats>div:first-child{border-left:0}
/* THE COURT'S FACE, in the directory row and beside its title. A fixed box either
   way, so a real picture arriving after the paint does not reflow the row. */
.courtface{flex:none; width:34px; height:34px; border-radius:3px; overflow:hidden;
  display:block; background:var(--surface-2); align-self:center}
.courtface svg,.courtface img{display:block; width:100%; height:100%; object-fit:cover}
.lead-row .courtface{width:52px; height:52px; border-radius:4px; margin-right:14px}
.leadface{display:flex; align-items:center}
/* IN THE COLUMN THE STRIP IS A 2x2 BLOCK, at every width. auto-fit gave three
   across and one orphan on a second row, with the rules still drawn as if it
   were one line — the orphan carried a left edge and no top edge. Fixing that
   per breakpoint went wrong twice, because which cell starts a row is exactly
   what auto-fit will not tell CSS: at 820 the third cell lost its left edge, at
   420 the second row lost its top one. Two columns always, and the edges follow
   from the count. */
/* THREE ACROSS: price, supply, burn. The three figures a reader is comparing,
   so they belong on one line — and the burn history costs no extra row. */
.courtstats .grid.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.courtstats .grid.stats>div:nth-child(3n+1){border-left:0}
.courtstats .grid.stats>div:nth-child(n+4){border-top:1px solid var(--rule)}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px; box-shadow:var(--shadow-sm); text-decoration:none; color:inherit; display:block;
}
a.card{transition:border-color .12s}
a.card:hover{border-color:var(--line-2)}
.kv .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.kv .v{font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px}
.kv .v small{font-weight:500; color:var(--ink-2); font-size:12px}

.stat{background:transparent; border:none; border-radius:0; padding:12px 14px; box-shadow:none}
.stat .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.stat .v{font-family:var(--mono); font-size:18px; font-weight:500; font-variant-numeric:tabular-nums; margin-top:6px}
.stat .v small,.stat .sub{font-size:12px; color:var(--ink-2); font-weight:500}
.stat .sub{margin-top:3px}

/* pills / status */
.pill{
  display:inline-flex; align-items:center; gap:6px; font:600 10.5px/1.4 var(--sans);
  letter-spacing:.08em; text-transform:uppercase;
  padding:4px 7px; border-radius:2px; background:transparent; color:var(--ink-2);
  border:1px solid var(--line-2); white-space:nowrap;
}
.pill .g{font-size:10px}
.pill.yes{background:var(--yes-wash); color:var(--yes); border-color:var(--yes)}
.pill.no{background:var(--no-wash); color:var(--no); border-color:var(--no)}
/* A pill is a state, so it emits in that state's colour. --glow-* is `none` in
   the light theme, which is why these need no theme guard. */
.pill.open,.pill.good{box-shadow:var(--glow-y)}
.pill.no,.pill.contra{box-shadow:var(--glow-n)}
.pill.escrow{box-shadow:var(--glow-e)}
.pill.escrow{background:var(--escrow-wash); color:var(--escrow); border-color:var(--escrow)}
.pill.void{background:transparent; color:var(--muted); border-color:var(--line-2)}
.pill.contra{background:var(--contra-wash); color:var(--contra); border-color:var(--contra)}
.pill.open{background:var(--escrow-wash); color:var(--escrow); border-color:var(--escrow)}
.pill.good{background:var(--yes-wash); color:var(--good); border-color:var(--good)}
.pill.verdict-no{background:var(--no-wash); color:var(--no); border-color:var(--no);
  box-shadow:var(--glow-n)}
.pill.decided{background:var(--void-wash); color:var(--ink-2); border-color:var(--void)}

/* docket list */
.docket{border:1px solid var(--rule); border-radius:0; overflow:hidden; background:transparent}
.docket a{display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; padding:14px 18px; text-decoration:none; border-top:1px solid var(--rule-2)}
.docket a:first-child{border-top:none}
.docket a:hover{background:var(--surface-2)}
.docket .t{font-weight:560; color:var(--ink); line-height:1.35}
.docket .m{font-size:12.5px; color:var(--muted); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap}
.docket .rt{display:flex; align-items:center; gap:10px}
.docket a.crow{grid-template-columns:52px minmax(0,1fr) 64px 124px; align-items:baseline; padding:11px 14px}
.docket a.crow .px{justify-self:end}
.docket a.crow .pill{justify-self:end}
.docket .t{overflow-wrap:anywhere}
.docket a.courtrow{grid-template-columns:34px minmax(52px,auto) minmax(0,1fr) auto 124px; align-items:center}
.docket a.courtrow .id{max-width:110px; overflow:hidden; text-overflow:ellipsis}
.docket a.crow .t{font-family:var(--serif); font-size:15.5px; font-weight:600}
.docket .id{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap; display:flex; align-items:center; gap:6px}
.icn{width:14px; height:12px; flex:none}
/* THE THIRD BALLOT BUTTON IS NOT A THIRD CHOICE. Overturn and uphold are the
   question; spam says the question should not have been asked. Sized to match
   that: an icon and one word, beside two full-width verbs, rather than a control
   as loud as them carrying a subtitle longer than either. Reported as "comically
   big" — it was, because it was the only one with a <small> explanation on it,
   and that explanation now lives in "How this vote works" where the rest of the
   spam rules already are. */
.btn.mini{padding:5px 9px; font-size:12px; letter-spacing:0}
.btn.mini .icn{width:12px; height:11px}
.courtrow .icn{color:var(--escrow)}
.cols{display:grid; grid-template-columns:minmax(0,1fr) 288px; gap:22px; margin-top:20px; align-items:start}
.panel h4{font:600 11px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
/* A FOLDER IS MARKED BY ITS TYPE, NOT BY A WASH. It carried --accent-wash to
   separate folders from claims, which was fine when every row sat on a filled
   docket; with the fills gone it became the loudest block on the court page —
   and it is marking structure, which is exactly what this register does with
   rules and marks rather than colour. The folder icon and the accent title
   below already say "folder", twice. */
.docket a.folderrow:hover{background:var(--surface-2)}
.docket a.folderrow .id .icn{color:var(--accent)}
.docket a.folderrow .t{color:var(--accent-2)}
.px{display:flex; flex-direction:column; align-items:flex-end; min-width:64px}
.px b{font-family:var(--mono); font-size:13px; font-weight:500; font-variant-numeric:tabular-nums}
.px small{font-size:10px; color:var(--muted); letter-spacing:.05em}
.spark{width:60px; height:16px; display:block; margin-bottom:2px}
.spark polyline{fill:none; stroke:var(--muted); stroke-width:1.5; stroke-linejoin:round}
.docket a.crow:hover .spark polyline{stroke:var(--accent)}
.spark .base{stroke:var(--line); stroke-width:1}
.rpcwrap{width:min(260px,60%); height:3px; margin:14px auto 6px; background:var(--line); border-radius:2px; overflow:hidden}
.rpcbar{height:100%; width:0; background:var(--accent); transition:width .18s linear}
.rpcnum{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
/* The chat's slot in the rail. It TAKES THE LEFTOVER HEIGHT rather than a fixed
   one — the rail is a flex column, so min-height:0 is what lets it shrink below
   its content and scroll inside instead of pushing the account block off the
   bottom. */
.railchat{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  overflow:hidden; border-top:1px solid var(--line)}
.railchat[hidden]{display:none}
.railchat > *{min-height:0}
/* The court coin's name, everywhere it is written. One hardcoded purple rather
   than a theme token: the token IS the colour, and it must read the same in
   light and dark. */
.ccsym{color:#a855f7; font-weight:500}
/* A figure's own history, directly under it. Muted and small on purpose: the
   number is the statement and the shape is the context, never the other way. */
.tspark{width:100%; height:44px; display:block; margin:6px 0 2px; overflow:visible}
.tspark path{fill:none; stroke:var(--muted); stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round;
  vector-effect:non-scaling-stroke}
.tspark line.end{stroke:var(--muted); stroke-width:5; stroke-linecap:round;
  vector-effect:non-scaling-stroke}
.stat:hover .tspark path{stroke:var(--accent)}
.stat:hover .tspark line.end{stroke:var(--accent)}
/* No history: the box holds its height so the three tiles stay level, and
   draws nothing at all. */
.tspark-none{visibility:hidden}

.lead-row{border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:16px}

/* buttons / txlinks */
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px}
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:var(--r-sm);
  background:var(--surface); border:1px solid var(--line-2); color:var(--ink); font-weight:560; font-size:14px;
  text-decoration:none; transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--accent); background:var(--accent-wash)}
/* A block of actions the round has moved past. Dimmed rather than removed, and
   dimmed at render — the async eligibility marks land on individual buttons
   after paint, and fading those would flicker. */
/* A single control the chain would refuse right now. Same treatment as a
   blocked ballot, one button at a time — it stays pressable so the press can
   say why. */
.btn[data-blocked]{opacity:.5; cursor:not-allowed}
.btn[data-blocked]:hover{border-color:var(--line-2); background:var(--surface); box-shadow:none}
.actions[data-voteblocked] .btn{opacity:.5; cursor:not-allowed}
.actions[data-voteblocked] .btn:hover{border-color:var(--line-2); background:var(--surface); box-shadow:none}
/* WAKING THE WALLET. Adena is an MV3 extension, so the first call after it has
   been idle cold-starts a suspended service worker — about a second in which
   nothing at all happened on screen and the button looked ignored. The wait is
   the extension's, but the second of silence was ours, so the button says it is
   busy for exactly as long as we are waiting.
   The glyph is swapped, not appended, so the label does not reflow mid-press. */
.btn.busy{opacity:.75; cursor:progress}
.btn.busy .g{
  width:11px; height:11px; border-radius:50%; display:inline-block;
  border:2px solid currentColor; border-right-color:transparent; font-size:0;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* A spinner is decoration; a reader who has asked for stillness gets the state
   from the cursor and the dimming, which say the same thing without moving. */
@media (prefers-reduced-motion: reduce){ .btn.busy .g{animation:none} }
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.yes{border-color:var(--yes); color:var(--yes)} .btn.yes:hover{background:var(--yes-wash)}
.btn.no{border-color:var(--no); color:var(--no)} .btn.no:hover{background:var(--no-wash)}
/* On hover only: a page of permanently glowing buttons is a slot machine. */
.btn.yes:hover{box-shadow:var(--glow-y)} .btn.no:hover{box-shadow:var(--glow-n)}
/* the side an embed's button asked for — a ring, not a pre-filled form */
.btn.picked{box-shadow:0 0 0 3px var(--accent-wash); outline:2px solid var(--accent-2)}
.btn .g{font-size:13px; opacity:.85}
.btn small{font-weight:500; color:var(--muted); font-size:11.5px}

/* the four-things primer */
.primer{background:linear-gradient(180deg,var(--surface),var(--surface)); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:var(--r); padding:16px 20px}
.primer h3{font-family:var(--serif); font-size:15px; margin-bottom:10px; color:var(--accent-2)}
.primer ol{margin:0; padding-left:20px; display:grid; gap:7px}
.primer li{font-size:13.5px; color:var(--ink-2)} .primer li b{color:var(--ink); font-weight:600}

/* stake panel + ratio series */
.stakewrap{display:grid; grid-template-columns:1.3fr 1fr; gap:16px}
/* One column when the timeline moved inside the chart's panel: there is no
   second thing to sit beside, and the chart takes the width back. */
.stakewrap.solo{grid-template-columns:1fr}
/* ---- embed mode -------------------------------------------------------
   Polymarket serves embeds from a separate host (embed.polymarket.com/market
   ?market=<slug>&theme=&features=) at a default 400x400 in a <figure>. This
   page cannot do that: web/README.md promises one self-contained file that runs
   from file:// and makes no network calls in demo mode, so there is no second
   host to serve. The equivalent is a ROUTE — #/embed/<slug>/<id> — which the
   same file answers, so an embed needs no infrastructure at all and a reader
   who saves the file keeps working embeds.
   The chrome goes away: an iframe has no room for a sidebar, and a nav inside
   someone else's article is a trap rather than a courtesy. */
html.embed, html.embed body{margin:0; padding:0; background:var(--paper)}
html.embed body{display:block; min-height:0}
html.embed .rail, html.embed #nav{display:none !important}
/* The page banner is a paragraph; an embed is a fixed box. It would overflow,
   so the card carries the short form (.esrc) and this stays out of the way. */
/* The frame is the host's; the card is ours. `margin:auto` on the flex child
   centres it on both axes AND, unlike align-items:center, never clips the top of
   a card taller than the frame — a long title must push the iframe into a
   scrollbar, not lose its own first line. */
html.embed .main{grid-column:1; grid-row:1; max-width:none; padding:0;
  min-height:100vh; display:flex}
/* The card is a surface like any other: hairline frame, registration marks at
   the corners, and the head in the same gold as the docket reference it is. */
.emb{display:flex; flex-direction:column; gap:9px; padding:14px 15px;
  border:1px solid var(--rule); border-radius:0; background:transparent;
  box-sizing:border-box; position:relative;
  /* AN EMBED DOES NOT CHOOSE ITS OWN SIZE — the host page does, and the snippet
     only suggests 400x500. Left to the frame it stretched every row to whatever
     width the host gave it and, with the footer pinned to the bottom, opened a
     void of whatever height the host gave it between the actions and "Open on
     Kourt". So: one width up to a cap, a height that is just its content, and
     centred in whatever it is handed.

     min-width:0 because a flex item defaults to min-width:auto and so REFUSES to
     shrink below its own min-content width — measured, claim #2's card came out
     422px wide inside a 400px frame, overflowing the very thing it is sized to
     fit. margin:auto rather than align-items:center: auto margins centre on both
     axes and never clip, so a card taller than the frame pushes the iframe into a
     scrollbar instead of losing its own first line. */
  width:100%; min-width:0; max-width:520px; margin:auto}
.emb::before, .emb::after{content:""; position:absolute; width:10px; height:10px;
  pointer-events:none; border:1px solid var(--mark); opacity:.55}
.emb::before{top:0; left:0; border-right:0; border-bottom:0}
.emb::after{bottom:0; right:0; border-left:0; border-top:0}
/* NOWRAP, not wrap. A court name is whatever its creator typed; wrapping turned
   a one-line head into three and pushed the card 9px past the iframe it was
   sized for — a scrollbar in somebody else's article. One line, and the name is
   the part that gives way. */
.emb .ehead{display:flex; align-items:baseline; gap:8px; flex-wrap:nowrap; overflow:hidden;
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--mark); opacity:.9}
.emb .ehead .ename{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
/* Inherit, like Polymarket's: the card should read as a card, not as a page of
   blue links. The affordance arrives on hover, and the footer link stays the
   one explicit call to action. */
.emb .eacts{display:flex; gap:8px; margin-top:2px}
.emb .eact{flex:1 1 0; min-width:0; display:flex; align-items:baseline; justify-content:center; gap:7px;
  padding:8px 6px; border-radius:var(--r-sm); text-decoration:none; font-size:12.5px;
  border:1px solid transparent; white-space:nowrap; overflow:hidden}
.emb .eact b{font-weight:600}
.emb .eact .epc{font-variant-numeric:tabular-nums; opacity:.85}
.emb .eact.y{color:var(--yes); background:var(--yes-wash); border-color:var(--yes)}
.emb .eact.n{color:var(--no);  background:var(--no-wash);  border-color:var(--no)}
.emb .eact:hover{filter:brightness(1.06); text-decoration:underline; text-underline-offset:2px}
.emb .elink{color:inherit; text-decoration:none}
.emb .elink:hover{text-decoration:underline; text-underline-offset:2px}
.emb .etitle .elink:hover{color:var(--accent-2)}
.emb .ehead > :not(.ename){flex:0 0 auto}
/* Four lines, then the browser's own ellipsis. An embed is a FIXED box on
   someone else's page — it cannot grow to fit, so an unbounded title either
   overflows into a scrollbar or forces every card to be sized for the longest
   claim anyone might ever file. Clamping bounds the card, and the ellipsis is
   what keeps it honest: a cut sentence is MARKED as cut, and "Open on Kourt"
   is on the same card. The share clip does the same thing for the same reason. */
.emb .etitle{font-family:var(--serif,inherit); font-size:17px; line-height:1.3; color:var(--ink);
  font-weight:600; margin:0; display:-webkit-box; -webkit-line-clamp:4;
  -webkit-box-orient:vertical; overflow:hidden}
.emb .estat{font-size:12.5px; color:var(--ink-2)}
/* The claim's own events, dated. Wraps rather than truncating: a claim that has
   been answered AND disputed AND reopened has more history than one line, and
   the history is the point. */
.emb .enopath{font-size:11px; color:var(--muted); font-style:italic}
.emb .etrail{display:flex; flex-wrap:wrap; gap:2px 10px; font-size:11px; color:var(--ink-2)}
.emb .etrail span{white-space:nowrap}
.emb .etrail b{font-weight:600; color:var(--muted); font-weight:500}
.emb .etrail .fut{color:var(--muted)}
.emb .etrail .fut b{font-style:italic}
.emb .esparkwrap{display:flex; flex-direction:column; gap:3px}
/* The card's chart is a .bigchart and takes the claim page's marks, colours,
   dashes and glow from those rules. What it must NOT take is their sizes.
   Everything in an SVG is in user units, so a mark's apparent size is
   `declared x (renderWidth / viewBoxWidth)`. The claim page draws 640 units into
   about 459px, a factor of 0.717; this card draws 300 units into 368px, a factor
   of 1.227. Share the declarations and every stroke and glyph lands 1.71x too
   big — measured, the 10px scale labels rendered at 24px and ran off the edge.
   So the sizes below are the page's own, multiplied by 0.717/1.227 = 0.584. They
   are a conversion, not a taste: identity is shared, scale is local. */
.emb .espark{margin:0}
.emb .espark .grid, .emb .espark .axis, .emb .espark .mid,
.emb .espark .seam, .emb .espark .evt{stroke-width:.6}
.emb .espark .ln{stroke-width:1.3}
.emb .espark .ref{stroke-width:.9; stroke-dasharray:3 2.3}
.emb .espark .mid{stroke-dasharray:1.2 1.8}
.emb .espark .evt{stroke-dasharray:1.2 1.2}
.emb .espark .seam{stroke-dasharray:.6 1.8}
.emb .espark .tickL{font-size:6px}
.emb .espark .endL{font-size:7px}
.emb .espark .end{stroke-width:1px; r:3px}
.emb .espark .evtDot{r:1.2}
.emb .espan{display:flex; justify-content:space-between; gap:6px; font-family:var(--mono);
  font-size:9.5px; letter-spacing:.02em; color:var(--muted); white-space:nowrap; overflow:hidden}
.emb .espan .efrozelab{overflow:hidden; text-overflow:ellipsis; min-width:0}
/* margin-top:auto was pinning this to the bottom of a stretched card. With the
   card at content height there is nothing to push into, and a small gap reads
   better than none. */
.emb .efoot{margin-top:2px; display:flex; justify-content:space-between; align-items:baseline;
  gap:10px; font-size:11.5px}
.emb .efoot a{color:var(--accent-2); text-decoration:none; font-weight:600}
.emb .efoot a:hover{text-decoration:underline}
.emb .ewhen{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
/* --escrow is already this page's "provisional / not the real thing" colour —
   it is what paints the demo dot in the rail — so the note reads the same way
   in both themes without a new token. */
.emb .esrc{font-family:var(--mono); font-size:10px; letter-spacing:.04em; line-height:1.35;
  color:var(--escrow); background:var(--escrow-wash); border:1px solid var(--escrow);
  border-radius:var(--r-sm); padding:3px 6px; align-self:flex-start; max-width:100%}
/* The stake split — full chart width, so the proportion is read rather than computed. */
.sbar{display:flex; width:100%; height:14px; margin:12px 0 0; border-radius:var(--r);
  overflow:hidden; border:1px solid var(--line)}
.sbar>div{min-width:0}
/* Each side lights in its own colour, and inset:0 0 0 1px puts a bright hairline
   INSIDE the segment so the two meet at a lit seam rather than a butt joint.
   The glow is the side's own hue, so which side is ahead is legible from the
   light alone before any number is read. */
.sbar .sbY{background:var(--yes); box-shadow:var(--glow-y), inset 0 1px 0 rgba(255,255,255,.14)}
.sbar .sbN{background:var(--no);  box-shadow:var(--glow-n), inset 0 1px 0 rgba(255,255,255,.14)}
.sbar.empty{height:auto; padding:7px 10px; justify-content:center; background:var(--surface);
  color:var(--muted); font-size:12px}
.sbout{display:flex; justify-content:space-between; gap:14px; margin-top:6px; font-size:12.5px; flex-wrap:wrap}
.sbout .y{color:var(--yes)} .sbout .n{color:var(--no); text-align:right}
/* NO FILL, A HAIRLINE, AND REGISTRATION MARKS AT THE CORNERS. A court of record
   is rules and type; a filled card is a slab floating over a page. Taking the
   fill away is what makes the one glowing line on the page mean something.
   The marks are a REINFORCEMENT of the frame, not a replacement for it. That was
   tried the other way — ticks and no border, which is the more interesting idea
   — and it failed on this exact element: .panel and .ticket are equal-height
   grid items, so the chart's panel is stretched to the taller ticket and four
   10px marks ended up ~960px apart around a 500px void, reading as stray marks
   outlining nothing. Hence align-self below, and the hairline stays. */
.panel{background:transparent; border:1px solid var(--rule); border-radius:0; padding:18px;
  position:relative}
/* The chart's panel stops at its content instead of stretching to the ticket.
   Only visible once the fill is gone: an empty stretched surface reads as a
   surface, an empty stretched FRAME reads as a box around nothing. */
.stakewrap>.panel{align-self:start}
/* THE RIGHT CELL STACKS. It holds one thing on most claims and two on a disputed
   one — the ballot and the frozen-stake ticket — and .stakewrap is a two-column
   grid, so they share this cell rather than becoming a second row. */
.sidecol{display:flex; flex-direction:column; gap:16px; align-self:start; min-width:0}
.panel::before, .ticket::before, .panel::after, .ticket::after{
  content:""; position:absolute; width:10px; height:10px; pointer-events:none;
  border:1px solid var(--mark); opacity:.55}
.panel::before, .ticket::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
.panel::after,  .ticket::after{bottom:-1px; right:-1px; border-left:0; border-top:0}
/* The reticle arrives on HOVER and in a third hue. An interface that is always
   reticulating is a toy; this one is a record. */
.panel:hover::before, .ticket:hover::before, .panel:hover::after, .ticket:hover::after{
  width:14px; height:14px; border-color:var(--retic); opacity:.85}
.panel:hover::before, .ticket:hover::before{top:-2px; left:-2px}
.panel:hover::after,  .ticket:hover::after{bottom:-2px; right:-2px}
/* ONE FRAME GETS THE MARKS. The court page nests a buy ticket inside its "join
   this court" panel, and both took marks — two gold corners 170px apart, which
   reads as clutter. A registration mark marks the sheet, not every box on it. */
.panel .panel::before, .panel .panel::after, .panel .ticket::before, .panel .ticket::after,
.ticket .ticket::before, .ticket .ticket::after, .ticket .panel::before, .ticket .panel::after{
  display:none}
.bigchart{margin:2px 0 6px}
.bigchart figcaption{display:flex; justify-content:space-between; gap:12px; font-size:12px; color:var(--muted); margin-bottom:6px; align-items:baseline}
.bigchart figcaption b{font-family:var(--mono); font-weight:500; color:var(--ink)}
.bigchart svg{display:block; width:100%; height:auto; overflow:visible}
.bigchart .grid{stroke:var(--line); stroke-width:1}
.bigchart .axis{stroke:var(--line-2); stroke-width:1}
.bigchart .mid{stroke:var(--line-2); stroke-width:1; stroke-dasharray:2 3}
/* The recorded path reads as a light trace rather than a drawn line. filter on
   the PATH only, not the <svg>: on the svg it would halo the axes, the labels
   and the gridlines too, and a glowing axis is decoration. */
.bigchart .ln{fill:none; stroke:var(--data); stroke-width:2.25; stroke-linejoin:round; stroke-linecap:round;
  filter:var(--trace)}
.bigchart .ar{fill:var(--data); opacity:.1}
.bigchart .seam{stroke:var(--line-2); stroke-width:1; stroke-dasharray:1 3}
.bigchart .ref{stroke:var(--accent); stroke-width:1.5; stroke-dasharray:5 4; opacity:.75}
.bigchart .band{stroke:var(--accent); stroke-width:4; opacity:.45; stroke-linecap:round}
.bigchart .wash{fill:var(--escrow-wash); opacity:.55}
.bigchart .washf{fill:var(--void-wash); opacity:.5}
.bigchart .tickL{font:10px var(--mono); fill:var(--mark); opacity:.7}
.bigchart .zone{font:9.5px var(--sans); fill:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.bigchart .evt{stroke:var(--ink-2); stroke-width:1; stroke-dasharray:2 2}
/* EVERY LABEL IS HALOED, because the chart draws lines through the same space
   it writes in and had no answer for it. The lifetime reference runs the full
   width at whatever height that ratio lands on, and on a claim near 93% it went
   straight through "records begin"; the now rule is full height by design and
   crossed "settle deadline"; gridlines cross the ticks. Moving labels out of
   the way is a packing problem with no solution on a 640x150 plot — a stroke
   the colour of the ground, painted under the glyph, is the standard answer and
   costs no layout at all.
   --paper, not --surface: the plot's ground is the page. Over the two washes
   the halo does read as a faint outline rather than vanishing — a real cost,
   and a small one next to a reference line drawn through the middle of a
   word. */
.bigchart text{paint-order:stroke fill; stroke:var(--paper); stroke-width:3px;
  stroke-linejoin:round; stroke-linecap:round}
/* The hover readout writes on its own plate, so it wants no halo — the stroke
   would eat into the pill it is deliberately reversed out of. */
.bigchart .xht{stroke:none}
.bigchart .evtDot{fill:var(--ink-2)}
/* NOW, LOUDER THAN THE REST. It divides what happened from what is scheduled,
   and it was drawn as one more 3px dot among the deadlines. A rule the full
   height of the plot, a ringed dot on the axis, and a label that is not the
   same muted grey as everything else. */
.bigchart .evtnow{stroke:var(--accent); stroke-width:1.4; stroke-dasharray:none; opacity:.55}
.bigchart .nowHalo{fill:var(--surface); stroke:var(--accent); stroke-width:1.4}
.bigchart .nowDot{fill:var(--accent)}
.bigchart .nowL{fill:var(--accent); font-weight:600}
/* The hover readout. Hidden until a pointer is over the plot — `.on` is set by
   the delegated listener, so a chart with no points never shows an empty box.
   pointer-events:none throughout: the layer sits over the plot and must not
   steal the hover that put it there, nor the event dots' own tooltips. */
.bigchart .xh{opacity:0; pointer-events:none; transition:opacity .09s linear}
.bigchart .xh.on{opacity:1}
.bigchart .xhl{stroke:var(--ink-2); stroke-width:1; stroke-dasharray:2 3}
.bigchart .xhd{fill:var(--surface); stroke:var(--data); stroke-width:2.25}
/* On a marker rather than on the line: the mark's own colour, so the readout
   reads as pointing at the event and not at a reading of the series. */
.bigchart .xh.onev .xhd{stroke:var(--accent); r:5}
.bigchart .xh.onev .xhl{stroke:var(--accent); stroke-dasharray:none; opacity:.5}
.bigchart .xhbox rect{fill:var(--ink); opacity:.92}
.bigchart .xht{font:600 10px var(--mono); fill:var(--surface)}
@media (prefers-reduced-motion:reduce){ .bigchart .xh{transition:none} }
.bigchart .evtL{font:10px var(--sans); fill:var(--ink-2)}
.bigchart .hit{fill:transparent}
.bigchart .hit:hover + .evtDot, .bigchart .hit:focus + .evtDot{r:5}
.bigchart .note{font:10.5px var(--sans); fill:var(--muted)}
/* The "now" dot is where the trace terminates — the one point a reader looks
   for, so it is the one that emits. */
/* A RING, not a disc. A hollow mark reads as a measurement taken; a filled one
   reads as a decoration. It also had a --surface stroke to punch it out of the
   panel's fill, which stops meaning anything once the panel has none. */
.bigchart .end{fill:none; stroke:var(--mark); stroke-width:1.75px; r:5px; filter:var(--ring)}
.bigchart .endL{font:600 12px var(--mono); fill:var(--accent)}
.bigchart .endS{font:9.5px var(--sans); fill:var(--muted)}
/* The scale reading the end readout sits on top of. Hidden while the readout is
   there to be read instead; the mobile rules, which drop the readout, bring it
   back rather than leaving the scale a number short. */
.bigchart .tickL.covered{display:none}
/* The chart's statement of absolute time: where the window starts, where it
   ends. HTML rather than text in the plot, so the two ends cannot be placed on
   top of each other — see the note in signalChart. */
.chartzone{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
  font:10.5px var(--mono); letter-spacing:.04em; text-transform:uppercase;
  color:var(--muted); margin:2px 0 0}
.chartzone span:last-child{text-align:right}
/* The seam: where the hourly week meets the daily tail. In the plot because it
   marks a place on the axis. */
.bigchart .seamL{font:9.5px var(--mono); fill:var(--muted); letter-spacing:.04em}
.srcnote{font-size:10.5px; color:var(--muted); margin:6px 0 0}
.chartchips{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 12px; font-family:var(--mono); font-size:11.5px; color:var(--ink-2)}
.chartchips span{border:1px solid var(--line-2); border-radius:2px; padding:3px 7px; background:var(--surface)}

/* stake ticket */
.ticket{background:transparent; border:1px solid var(--rule); border-radius:0; padding:18px;
  position:relative}
.ticket h3{font-family:var(--serif); font-size:17px; margin-bottom:4px}
.ticket .hint{font-size:12.5px; color:var(--muted); margin-bottom:14px}
/* THE SAME ROW, OUTSIDE A TICKET. voteLockLine and the reward-pool row emit a
   .line, and every rule for one was written as `.ticket .line` — so on the
   quality panel, which has no ticket, both came out as two bare inline spans:
   "what voting commitsCasting commits the weight you vote with…", label and
   prose printed as one word with no emphasis and no column. Added to the
   selectors rather than restated beneath them, because a second copy of this
   grid is a second thing to keep in step. Not `.ticket` on the wrapper: that
   carries a border and 18px of padding, and would put a second box inside a
   panel that already has one. */
/* A ticket row is a label and what it says. The label is the bold thing on the
   LEFT and the text reads left-to-right from its own aligned column: two real
   grid tracks with a gutter, because space-between put the emphasis on the
   right, ragged-left, and closed the gap entirely once a row's text filled it. */
.ticket .line,.qrows .line{display:grid; grid-template-columns:minmax(0,20ch) minmax(0,1fr); column-gap:24px;
  align-items:baseline; padding:9px 0; border-top:1px dashed var(--line); font-size:14px}
.ticket .line:first-of-type,.qrows .line:first-of-type{border-top:none}
.ticket .line>*:first-child,.qrows .line>*:first-child{font-weight:600; color:var(--ink)}
.ticket .line .r,.qrows .line .r{font-weight:400; color:var(--ink-2); text-align:left; font-variant-numeric:tabular-nums}
.ticket .line .r b{color:var(--ink)}
.ticket .line.spent>*:first-child{color:var(--muted); font-weight:400}
.ticket .line.spent .r{color:var(--muted)}
@media (max-width:640px){ .ticket .line,.qrows .line{grid-template-columns:minmax(0,1fr); row-gap:2px} }
/* the clock ladder: what happened on the left, when on the right — the dates
   align in their own column because the grid lives on the container, not the
   row, and the column sits just past the labels rather than at the far edge */
.ticket .clockrows{display:grid; grid-template-columns:minmax(0,30ch) max-content;
  column-gap:28px; justify-content:start; align-items:baseline}
.ticket .clockrows>*{padding:9px 0; border-top:1px dashed var(--line); font-size:14px}
.ticket .clockrows>*:nth-child(-n+2){border-top:none}
.ticket .clockrows .ev{font-weight:600; color:var(--ink)}
.ticket .clockrows .dt{color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}
.ticket .clockrows .ev small,.ticket .clockrows .dt small{font-weight:400; color:var(--muted)}
.ticket .clockrows .ev small{display:block; margin-top:1px}
@media (max-width:640px){ .ticket .clockrows{grid-template-columns:minmax(0,1fr) max-content; column-gap:14px}
  .ticket .clockrows .dt{white-space:normal} }
/* THE LADDER BESIDE THE CHART. Half the width, so the fixed 30ch label column
   no longer fits with a date next to it and the browser breaks the LABEL —
   "vote closes · round 2" came out four lines, one word each. Both columns
   flex here and the date is the one allowed to wrap: a date breaks cleanly
   after its comma, and "1 failed round" has nowhere to break that still reads
   as one event. */
/* THE LADDER INSIDE THE CHART'S PANEL. No border and no padding of its own —
   the panel already draws both, and a bordered box inside a bordered box reads
   as two things rather than one. Its first row keeps the rule that separates it
   from the chips above. */
.ticket.clockbare{border:0; padding:0; margin-bottom:0}
.ticket.clockbare .clockrows>*:nth-child(-n+2){border-top:1px dashed var(--line)}
/* The ladder's own name, inside the panel. Quieter than a section heading —
   it labels a block, it does not open one. */
.subh{font:600 11px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); margin:16px 0 2px}
.ticket.clocknarrow .clockrows{grid-template-columns:minmax(0,1fr) minmax(0,auto); column-gap:12px}
.ticket.clocknarrow .clockrows>*{font-size:13px; padding:7px 0}
.ticket.clocknarrow .clockrows .dt{white-space:normal; text-align:right}
/* Helper modals: the long "why" lives one click away, so a ballot reads as a
   ballot. Native <dialog> — Escape, the backdrop and focus come with it. */
dialog.helper{border:1px solid var(--line-2); border-radius:var(--r); padding:0;
  max-width:min(640px,92vw); background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
dialog.helper::backdrop{background:rgba(12,18,24,.5)}
dialog.helper .hd{display:flex; justify-content:space-between; align-items:baseline; gap:18px;
  padding:16px 18px; border-bottom:1px solid var(--line)}
dialog.helper .hd h3{font-family:var(--serif); font-size:17px; margin:0}
dialog.helper .bd{padding:16px 18px 18px; font-size:14px; line-height:1.6; color:var(--ink-2)}
dialog.helper .bd h4{color:var(--ink); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  margin:16px 0 6px; font-family:var(--mono)}
dialog.helper .bd h4:first-child{margin-top:0}
dialog.helper .bd p{margin:0 0 8px}
dialog.helper .bd ul{margin:4px 0 0; padding-left:18px}
dialog.helper .bd li{margin:5px 0}
dialog.helper .bd b{color:var(--ink)}
button.helplink{color:var(--accent-2); cursor:pointer; text-decoration:underline; background:none;
  border:0; padding:0; font:inherit; font-size:inherit}
button.helplink:hover{color:var(--accent)}
/* AN ASIDE IS MARKED BY A RULE IN THE MARGIN, not by a panel. This paragraph —
   the one that corrects what readers get wrong about conviction — was separated
   from the ticket's body copy by NOTHING but its fill, so taking fills away
   turned it into a fourth row of the payoff table above it. The notices came
   through the same change intact because they carry a 4px left border instead,
   which is where this borrows from. */
.ticket .never{margin-top:12px; border-left:2px solid var(--rule); padding:2px 0 2px 11px;
  font-size:12.5px; color:var(--ink-2)}
.ticket .never b{color:var(--ink)}
/* buy receipt — reuses the ticket's row token inside the join panel */
.buyrcpt{padding:12px 14px; margin:0 0 4px; background:var(--inset)}
.buyrcpt .line{font-size:13px; grid-template-columns:minmax(0,1fr); row-gap:3px; column-gap:0}
/* THE HALF ABOVE THE BUTTON IS A CONTROL, NOT A RECEIPT. Stacked, its two rows
   ran 190px and pushed the button that far down the panel; side by side they
   are half that and the button rides near the top. The receipt below keeps the
   stacked form — it is read, not operated. */
.buyrcpt.compact .line{grid-template-columns:max-content minmax(0,1fr); column-gap:10px; align-items:baseline}
.buyrcpt.compact .line .r{text-align:right}
/* The receipt lives in the 288px join rail, where the ticket's 20ch label track
   leaves the value ~100px and "185.2 KOURT:OREM / 185,241,936 units" wraps into
   a ragged stack. Label above value instead — the rail is too narrow for two
   columns, and the token name got longer when CC became KOURT:SLUG. */
.buyrcpt .line>*:first-child{font-size:12px; color:var(--muted); font-weight:600;
  letter-spacing:.02em; text-transform:uppercase}
.buyrcpt .line .r{font-size:14px; color:var(--ink)}
.buyrcpt .line .r small{display:block; font-weight:400; color:var(--muted)}
.buyrcpt input{width:9ch; min-width:0; background:var(--surface); border:1px solid var(--line-2); border-radius:2px;
  color:var(--ink); font:inherit; font-weight:600; font-variant-numeric:tabular-nums; padding:3px 7px; text-align:right}
.buyrcpt input:focus{outline:2px solid var(--accent); outline-offset:1px}
.ack{display:flex; gap:8px; align-items:flex-start; margin:10px 0 0; cursor:pointer; color:var(--ink-2)}
.ack input{margin-top:2px; accent-color:var(--accent)}
/* court scope line + record panel (p.sub so the stat tiles' div.sub stay untouched) */
p.sub{font-size:13.5px; color:var(--ink-2); max-width:54ch; margin-top:6px}
.panel .kv+.kv{margin-top:8px}
/* association rows: no sparkline slot — id · title · relation chip · status pill */
/* the relation chip needs its own column: a wrapped title must never end a
   few pixels from it and read as one sentence. Specificity matches
   `.docket a.crow`, which sets the docket's own four-track grid. */
.docket a.crow.assocrow{grid-template-columns:52px minmax(0,1fr) 268px; gap:20px}
.docket a.crow.assocrow>.rt,.docket a.crow.assocrow>.pill{justify-self:end}
.docket a.crow.assocrow .rt{justify-content:flex-end; gap:10px; flex-wrap:wrap}
@media (max-width:820px){ .docket a.crow.assocrow{grid-template-columns:44px minmax(0,1fr); gap:10px}
  .docket a.crow.assocrow .rt{grid-column:2; justify-content:flex-start; margin-top:2px} }
/* the map */
.mapwrap{border:1px solid var(--line); border-radius:var(--r); background:var(--inset); overflow:hidden}
.mapwrap{min-height:0}
.mapwrap svg{display:block; width:100%; height:100%; cursor:grab; touch-action:none; outline-offset:-2px}
/* The evidence strip on a node. Brighter than the corner badge it replaced —
   .62 was set when the picture sat BESIDE the title and competed with it, and
   under the sentence it does not. Still short of full strength at rest, and full
   on the node a reader has selected, which is the moment the pictures are worth
   looking at rather than counting. */
.mthumb{opacity:.85}
/* The lightbox. Dark enough that the exhibit is the only thing lit, because the
   reader opened it to look at one picture. */
.lbox{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:rgba(8,8,10,.92); padding:24px; gap:8px}
.lbox-fig{margin:0; max-width:min(1100px,92vw); text-align:center}
.lbox-img{max-width:100%; max-height:78vh; margin:0 auto; border-radius:4px}
.lbox-n{display:block; margin-top:10px; font-size:12px; color:var(--muted)}
.lbox-cap{margin-top:4px; font-size:13.5px; color:var(--ink-2)}
.lbox-x,.lbox-prev,.lbox-next{background:none; border:0; color:var(--ink-2); cursor:pointer;
  font-size:26px; line-height:1; padding:8px}
.lbox-x{position:absolute; top:10px; right:14px; font-size:22px}
.lbox-prev:disabled,.lbox-next:disabled{opacity:.25; cursor:default}
/* THE VERDICT. "matches" is quiet — it is the expected answer and a reader who
   ignores it loses nothing. "altered" is the whole feature and is styled to be
   impossible to skim past: a reader who misses it is worse off than one who
   never opened the exhibit at all. */
.lbox-v{margin-top:8px; font-size:12.5px; color:var(--muted)}
.lbox-matches{color:var(--good)}
.lbox-altered{color:#fff; background:#a1201e; padding:8px 12px; border-radius:3px;
  font-size:14px; font-weight:600; letter-spacing:.02em}
/* sample joins the muted set, NOT the green one: it is the absence of a check,
   and styling it like a passed check is the confusion it exists to prevent. */
.lbox-unavailable,.lbox-unverifiable,.lbox-sample{color:var(--muted); font-style:italic}
/* ---- THE COMPOSER --------------------------------------------------------
   Eighteen classes, and until this was rendered and looked at, not one of them
   had a rule. §2 opens by saying media "requires the page's first real input
   surface, and the quality of that surface IS the quality of this feature" —
   and the surface was raw browser defaults: no drop zone, a native Choose Files
   button, thumbnails at full size, and every label welded to the control beside
   it ("2 of 3" running straight into the caption box).

   rowscope_layout could not have caught it: the composer does not mount in demo
   mode, so the crawl that measures every other page never reaches it. */
.composepanel{margin-top:12px; display:flex; flex-direction:column; gap:10px}
.composetitle,.composebody{width:100%; font:inherit; background:var(--inset);
  color:var(--ink); border:1px solid var(--line); border-radius:3px; padding:9px 11px}
.composetitle{font-size:15px; font-weight:600}
.composebody{font-size:14px; line-height:1.5; resize:vertical; min-height:88px}
.composetitle:focus,.composebody:focus{outline:2px solid var(--accent); outline-offset:1px}

/* The drop target has to LOOK like one, and say so when a drag is over it —
   the dragover handler has always added `.over` and nothing has ever drawn it. */
.mediadrop{border:1px dashed var(--line); border-radius:4px; padding:12px;
  display:flex; flex-direction:column; gap:10px; transition:border-color .12s, background .12s}
.mediadrop:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mediadrop.over{border-color:var(--accent); border-style:solid; background:var(--inset)}
@media(prefers-reduced-motion:reduce){ .mediadrop{transition:none} }
.mediahint{margin:0; font-size:12.5px; line-height:1.5; color:var(--muted)}
.mediapick{font:inherit; font-size:12.5px; color:var(--ink-2)}
.mediapick::file-selector-button{font:inherit; font-size:12.5px; background:var(--inset);
  color:var(--ink-2); border:1px solid var(--line); border-radius:3px;
  padding:5px 10px; margin-right:8px; cursor:pointer}
.mediapick::file-selector-button:hover{color:var(--ink); border-color:var(--accent)}
.medialist{display:flex; flex-direction:column; gap:10px}
/* pre-line, because the panel's warnings are separate sentences joined with a
   newline: run together on one line they read as one, and "...imgur or GitHub
   work A claim needs a title." is two pieces of advice welded into nonsense. */
.medianote{margin:0; font-size:12.5px; line-height:1.5; color:var(--ink-2);
  min-height:1em; white-space:pre-line}
/* The last look. Set apart from the exhibit rows above it, because it is a
   different act: those are things to change, this is a thing to read. */
.composereview:not(:empty){border-top:1px solid var(--line); padding-top:10px;
  display:flex; flex-direction:column; gap:6px}
.reviewhead{margin:0; font-size:12.5px; font-weight:600; color:var(--ink)}
.reviewlist{margin:0; padding-left:18px; font-size:12.5px; line-height:1.6;
  color:var(--ink-2)}
.reviewwarn{margin:0; font-size:12.5px; line-height:1.5; color:var(--muted)}

/* One exhibit: the thumbnail small and fixed, everything about it beside it,
   so seven of them stay a list rather than seven screens. */
.mediaitem{margin:0; display:grid; grid-template-columns:72px minmax(0,1fr);
  gap:10px; align-items:start; padding:9px; border:1px solid var(--line);
  border-radius:3px; background:var(--surface)}
.mediathumb{width:72px; height:72px; object-fit:cover; border-radius:2px;
  border:1px solid var(--line); background:var(--inset)}
.mediacap{display:flex; flex-direction:column; gap:5px; min-width:0}
/* A VIDEO ROW HAS NO THUMBNAIL. Without this the caption block lands in the
   72px track meant for one, and the whole row renders as a column of single
   words — which is what the first version of this did. */
.mediaitem > .mediacap:first-child{grid-column:1 / -1}
.medianum{font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.mediacaption{width:100%; font:inherit; font-size:13px; background:var(--inset);
  color:var(--ink); border:1px solid var(--line); border-radius:3px; padding:6px 8px}
.mediacaption:focus{outline:2px solid var(--accent); outline-offset:1px}
.mediastate{font-size:12px; color:var(--muted); font-style:italic}
/* The two that report a problem carry weight; the rest of the row does not. */
/* --bad, not a literal with a fallback. This said var(--bad, #c0564f) because I
   was unsure the token existed — it did not, so both themes got the same
   hard-coded red, and css_test says in its own comment that a fallback is
   exactly what it does not check. --good had no partner; now it does. */
.mediabroken{font-size:12.5px; line-height:1.45; color:var(--bad)}
.medialink{font-size:12.5px; line-height:1.45; color:var(--muted)}
/* WRAPS RATHER THAN SQUEEZES. At 320px the row's second column has room for
   three glyph buttons and not for a four-word label beside them, and flex's
   default is to shrink the item rather than move it: "try the copy again" came
   out 54px wide and 44px tall, its label stacked into a column. Measured on a
   phone width, which is the size nothing here had ever been rendered at.

   WHICH RULE HOLDS, honestly: below 420px the media query further down gives the
   retry its own row, and that alone is enough — ablating `flex:0 0 auto` changes
   nothing the harness can see, because the button is never asked to share a line
   there. The no-shrink pair guards the widths in between, which no test
   enumerates. Kept as defence, not claimed as covered. */
.mediabar{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:2px}
.mediamove,.mediadel,.mediaretry,.mediaundo{flex:0 0 auto; white-space:nowrap;
  font:inherit; font-size:12px;
  background:none; color:var(--ink-2); border:1px solid var(--line);
  border-radius:3px; padding:3px 7px; cursor:pointer; line-height:1}
.mediamove,.mediadel{min-width:28px}
.mediamove:hover,.mediadel:hover,.mediaretry:hover,.mediaundo:hover{
  color:var(--ink); border-color:var(--accent)}
.mediamove:focus-visible,.mediadel:focus-visible,.mediaretry:focus-visible,
.mediaundo:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
/* The retry is the one action here with a consequence, so it reads as a word
   rather than a glyph and sits first. */
.mediaretry{margin-right:auto}
/* On a phone the bar wraps, and where it wraps matters: left to itself it broke
   between ↑ and ↓, splitting the three-glyph group across two lines. The retry
   takes its own row instead, so move and remove stay together. */
@media(max-width:420px){ .mediaretry{flex-basis:100%; margin-right:0} }
@media(pointer:coarse){ .mediamove,.mediadel,.mediaretry,.mediaundo{min-height:32px} }

/* EXHIBITS, and every rule below existed only after a render was looked at.
   These classes were emitted with NO style at all, which is not a neutral state:
   .ex-n and .ex-cap are adjacent inline spans, so an exhibit came out reading
   "1 of 1north span rating, 2025 inspection report" — the number and the caption
   printed as one word, both at the body size, competing with the claim they are
   evidence for. A source-reading test cannot see that; only the picture can. */
.ex-lede{margin:0 0 8px; font-size:12.5px; line-height:1.5; color:var(--muted)}
/* THE GRID. Bounded on purpose: seven exhibits stacked full-width put the ballot
   about four screens below the title, so the evidence buried the thing a reader
   came to do. This block is the same height for one exhibit or seven. */
.exhibits{display:grid; gap:2px; margin:0 0 8px; border-radius:6px; overflow:hidden;
  border:1px solid var(--line); background:var(--inset)}
.exhibits[data-n="1"]{grid-template-columns:1fr}
.exhibits[data-n="2"]{grid-template-columns:1fr 1fr; aspect-ratio:16/9}
.exhibits[data-n="3"],.exhibits[data-n="4"]{grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr; aspect-ratio:16/9}
/* Three tiles read as one large and two stacked, which is what a set of three
   looks like everywhere else. */
.exhibits[data-n="3"] > :first-child{grid-row:1 / span 2}
.exhibits .ex,.exhibits .ex-gone{position:relative; margin:0; min-width:0; min-height:0;
  display:flex; align-items:center; justify-content:center; background:var(--inset)}
.exhibits .ex{cursor:zoom-in}
.exhibits .ex:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
/* One tile keeps the image's own shape; two or more are cropped to fill, which
   is what makes the block a fixed size. There the tile is a way IN — the whole
   image is in the lightbox, one click away. */
.exhibits[data-n="1"] .ex-img,.exhibits[data-n="1"] .ex-v{
  width:auto; max-width:100%; max-height:52vh; object-fit:contain}
.exhibits:not([data-n="1"]) .ex-img,.exhibits:not([data-n="1"]) .ex-v{
  width:100%; height:100%; object-fit:cover}
/* The number is how somebody refers to an exhibit, so it is legible on any
   picture rather than tinted by one. */
.ex-n{position:absolute; top:6px; left:6px; z-index:1; font-size:11px;
  line-height:1; padding:3px 6px; border-radius:3px; color:#fff;
  background:rgba(17,23,28,.72); letter-spacing:.02em}
.ex-more{position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; font-size:20px; font-weight:600; color:#fff;
  background:rgba(17,23,28,.62)}
.ex-gone{padding:10px 12px; text-align:center}
/* The captions, kept on the page because they are claim text and the number
   beside each is how a moderator and a reader refer to one. */
.ex-caps{list-style:none; margin:0 0 10px; padding:0; display:flex;
  flex-direction:column; gap:3px; font-size:12.5px; line-height:1.45; color:var(--ink-2)}
.ex-caps .ex-capn{display:inline-block; min-width:1.4em; color:var(--muted);
  font-variant-numeric:tabular-nums}
/* WHAT THE STACKED LAYOUT LEFT BEHIND, removed rather than left to fight the
   grid above. A second .ex-n later in the file won on cascade and turned the
   badge into muted uppercase prose; .ex-img carried a border and a 60vh contain
   that the grid cell now decides; .ex-cap describes markup this renderer no
   longer emits at all, since captions moved to the list below the grid. Two
   rules for one element is the defect this file has been bitten by twice.

   A taken-down slot keeps its place, so it keeps a shape to hold. */
.ex-gone{border:1px dashed var(--line)}
/* The note is prose inside a caption line, so it stays on that line — as its own
   block it put "taken down" underneath a bare number. It is still a block on a
   tombstone TILE, where it is the only thing there. */
.ex-note{font-size:12px; color:var(--muted); font-style:italic}
.ex-caps .ex-note{display:inline; margin-left:.35em}
/* A video is not zoomed into a lightbox — it is played where it is. The
   lightbox exists to say whether bytes match what was filed, and a video has no
   hash to check, so opening one there would offer a verdict it cannot give. */
.ex-vid{cursor:default}
.mnode-a:hover .mthumb,.mnode-a:focus .mthumb,.mnode-a.sel .mthumb{opacity:1}
/* Hidden when the map is zoomed far enough out that titles go too: a 6px smear
   of colour is noise, not information, and `.mapsvg.far .mtitle{display:none}`
   already makes that judgement for the labels. */
.mapsvg.far .mthumb{display:none}
.mapwrap svg:active{cursor:grabbing}
.mapctl{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:10px 0}
.mapctl .pill{cursor:pointer; font:inherit}
.mapctl .pill[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent-2); border-color:var(--accent)}
.mapctl input[type=range]{accent-color:var(--accent); width:140px}
.mlegend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--ink-2); align-items:center}
.mlegend span{display:inline-flex; gap:6px; align-items:center}
/* `hidden` on a legend key would do NOTHING without this: the rule above is a
   class selector and beats the user agent's [hidden]{display:none}, so the key
   would sit there explaining a line the map had not drawn. */
.mlegend span[hidden]{display:none}
/* THE MAP SETS TYPE THE WAY THE PAGE DOES. SVG text inherits font-family from
   body, so every label was --sans — including claim titles, which are --serif
   in the docket, on the claim page and in the rail. Same words, two faces, and
   the map was the odd one. Named per class rather than one blanket rule,
   because the page does not set them all the same way either: a title is
   serif, an id is mono and tabular, a header and a verdict are sans.
   est() reads these SAME tokens to measure with — see mapSvg — so a change
   here cannot silently un-fit the labels. */
.mtitle,.mcourt-t{font-family:var(--serif)}
.mid{font-family:var(--mono); font-variant-numeric:tabular-nums}
.mhdr-t,.mverdict{font-family:var(--sans)}
.mnode{fill:var(--surface); stroke:var(--ink-2); stroke-width:1}
.mnode-a{cursor:pointer}
/* THE PICKED NODE GROWS, so its label is readable without leaving the map.
   Scaled on the <a> that wraps the box AND its text, so the words grow with the
   box rather than staying put inside a bigger frame.
   ALL THREE KINDS, and the first version did only claims. That shipped and was
   reported straight back as the feature not working — the big labelled folder
   boxes are the most obvious thing on the map to click, and they sat still. A
   rule that answers only one of three node kinds does not read as "folders are
   different", it reads as broken.
   transform-box:fill-box is load-bearing, not tidiness: without it an SVG
   transform-origin resolves against the whole viewBox, so `center` is the
   middle of the MAP and a scale flings the node across the drawing instead of
   swelling it in place.
   THE OVERSHOOT IS THE POINT. A plain ease lands so softly at this duration and
   this size that the change reads as a redraw; the back-out curve passes its
   target and comes back, which is what makes it legible AS motion — the eye is
   told where to look. 200ms: enough for a longer throw to be seen travelling,
   still finishing before the camera glide it rides along with.
   BIGGER, ON THE OWNER'S ASK — 1.18 to 1.35, and the curve's overshoot from
   1.56 to 1.9 so the spring grew with the step rather than the same nudge over a
   longer distance.
   THIS SIZE IS A JUDGEMENT, AND THE RING DOES NOT BOUND IT. That is worth
   recording because the opposite was written here first: the claim was that
   collision with a neighbour sets the ceiling, since SVG cannot paint the grown
   node above its siblings. Measured, it does not. Pushed to 2.0 on the demo
   docket the worst overlap is still 11% of the node and every overlapping
   neighbour is DIMMED, which is the state selection puts them in — so nothing in
   the layout objects to a much larger spring, and 1.35 is chosen rather than
   forced. map_boing.js keeps counting it anyway, as a guard for a layout that
   packs tighter later, not as the reason for this number.
   WHAT DOES THE READING IS THE CAMERA, not this. A transform can only multiply a
   12-unit font by 1.35; selection also zooms to MAPK.readSelPx, and that is what
   took the picked title from 19px to 38px.
   The court gets a smaller step. It is already the largest box on the map and
   sits at the centre of everything, so the full step there is a lurch rather
   than a nudge; the point is to answer the click, not to fill the view.
   The dim is what keeps the grown node readable against its neighbours: it does
   not paint above them — SVG has no z-index and reordering the nodes to fake it
   would scramble tab order — so the contrast has to come from everything else
   stepping back, which .dim already does. */
.mnode-a,.mfold-a,.mcourt-a{transform-box:fill-box; transform-origin:center;
  transition:transform .2s cubic-bezier(.34,1.9,.64,1)}
.mnode-a.selected,.mfold-a.selected{transform:scale(1.35)}
.mcourt-a.selected{transform:scale(1.18)}
/* NO LOCAL reduced-motion RULE, deliberately. One was written here and it was
   dead the moment it landed: this stylesheet already carries
   `*{transition:none!important}` under the same query, which outranks anything
   per-class. Ablating the local rule changed nothing, which is how it was found.
   The behaviour it was meant to give is the right one and still happens — the
   node grows to full size, it just arrives instead of springing, because only
   the TRANSITION is suppressed and the transform is not. browser/map_boing.js
   asserts both halves of that under emulated reduce. */
.mnode-a:hover .mnode,.mnode-a:focus .mnode{stroke:var(--accent); stroke-width:2}
.mnode-a.focused .mnode{stroke:var(--accent); stroke-width:3}
.mnode-a.selected .mnode{stroke:var(--accent); stroke-width:3; fill:var(--accent-wash)}
.mfold-a{cursor:pointer}
.mfold-a:hover .mfold,.mfold-a:focus .mfold{stroke-width:2}
.mfold-a.selected .mfold{stroke:var(--accent-2); stroke-width:3}
/* The court answers a click like anything else on the map. Its ring is drawn in
   --accent-wash rather than a heavier --accent-2: the box is already filled with
   --accent, so a darker outline on a dark fill is a stroke nobody can see, and
   the wash is the one accent token that contrasts against it in both themes. */
.mcourt-a{cursor:pointer}
.mcourt-a:hover .mcourt,.mcourt-a:focus .mcourt{stroke-width:3}
.mcourt-a.selected .mcourt{stroke:var(--accent-wash); stroke-width:3.5}
/* DIMMING COVERS ALL THREE. It covered only claims, which is why selecting a
   folder appeared to highlight nothing: the folders and the court kept full
   strength, so there was no contrast for the lit node to stand out against. */
.mnode-a.dim,.mfold-a.dim,.mcourt-a.dim{opacity:.35}
/* THE CARD GETS ITS OWN COLUMN, and does not float over the map. It did float,
   at top-right with a z-index, and that made the nodes underneath unclickable —
   on a map with anything in its top-right corner, selecting one of those claims
   was impossible while a card was open, and the card that WAS open just sat
