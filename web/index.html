/* An embed's side button lands here. Without this the button would be a fake
   affordance: it would say "Stake YES" and drop the reader at the top of a long
   page with no idea what it wanted them to do. Polymarket's tid=0/tid=1 does the
   same job on their market page.
   It does NOT stake anything, and it must not: it scrolls to the panel and marks
   the side, leaving every signature to the reader's own deliberate click. */
function focusStakeSide(side){
  if(side !== "yes" && side !== "no") return;
  const t = document.getElementById("stake-ticket");
  if(!t) return;   // the claim moved on — staking is frozen, so there is nothing to point at
  const b = t.querySelector(".act .btn." + side);
  if(b) b.classList.add("picked");
  t.scrollIntoView({block: "center", behavior: "smooth"});
}
function verdictBanner(d){
  if(d.phase==="provClose") return `<span class="pill void">closed · no decision</span>`;
  if(d.phase==="settled"){ const v=(d.verdict!=null?d.verdict:d.answer); return `<span class="pill good">✓ settled ${sideName(v)}${d.route?" · "+esc(d.route):""}</span>`; }
  /* NO "tally sealed". The pill asserted a property the chain does not have: the
     ballots are on chain and anyone can add them up, so the only thing that is
     true is that THIS PAGE does not sum them mid-vote. A status chip is the
     wrong place to make that distinction — it has room for a state, not for a
     caveat — and the state is that a dispute is running. Where the difference
     actually matters (the ballot, the ballots page) the prose says it in full,
     including that the running count is readable off the chain. */
  if(d.phase==="disputed") return `<span class="pill escrow">⚖ dispute under way</span>`;
  if(d.phase==="provisional") return `<span class="pill escrow">provisional ${sideName(d.provisional)} · reopenable</span>`;
  if(d.phase==="answered") return `<span class="pill open">answered ${sideName(d.answer)}</span>`;
  return d.phase==="closed"? `<span class="pill void">closed · never answered</span>` : `<span class="pill void">open · no answer yet</span>`;
}

/* Resolution: answer / dispute / settlement, showing the verdict's ROUTE and
   wall-clock timing, and NEVER the live tally while a vote is open. */
/* The timeline — a when/what ladder of this claim's REAL event heights.
   Both modes show only fields that exist (live: reads; demo: its dataset);
   no height is ever fabricated, and the derived "answered" rung says so.
   The dispute ROUNDS are here too, dateless: the chain stamps a round's
   opening nowhere, so they carry an em-dash rather than a projection. */
/* ClaimTimeline (clock.gno): "opened:<unix>:<height>;answered:…;settle:…;now:…".
   Past events carry the block's own timestamp — nothing derived, nothing
   estimated. A zero stamp means the claim predates the stamps; then only its
   height is knowable and the row says so. */
function parseTimeline(raw){
  if(typeof raw!=="string" || !raw) return null;
  const out={};
  for(const part of raw.split(";")){
    const m=part.match(/^([a-z]+):(\d+):(\d+)$/); if(!m) continue;
    out[m[1]]={t:+m[2], h:+m[3]};
  }
  return out.now? out : null;
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* A recorded date, spelled out. UTC so two readers never disagree. */
function stampDate(unix, withTime){
  const dt=new Date(unix*1000);
  const day=`${dt.getUTCDate()} ${MON[dt.getUTCMonth()]} ${dt.getUTCFullYear()}`;
  if(!withTime) return day;
  const hh=String(dt.getUTCHours()).padStart(2,"0"), mm=String(dt.getUTCMinutes()).padStart(2,"0");
  return `${day}, ${hh}:${mm} UTC`;
}
/* How far off, in the plain words the rest of the page uses. */
function sinceWords(nowT, t){
  const s=Math.abs(t-nowT), past=t<nowT;
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  const q = d? d+(d===1?" day":" days") : h? h+(h===1?" hour":" hours") : Math.max(1,m)+" min";
  return past? q+" ago" : "in "+q;
}
/* `narrow` when the ladder is drawn beside the chart rather than under the page:
   it has about half the width there, and the grid that is right at full width
   turns the label column into one word per line at half. */
function resolutionLadder(d, nowH, tl, narrow, bare){
  const rows=[];
  if(tl){
    // The chain's own record: each row is a stamped date, its height kept for
    // reference in the row's title. Only rows the realm has not reached yet
    // are projections, and they say so.
    const nowT = tl.now.t;
    /* NO GLOSS UNDER THE LABEL. Every row carried one — "opened / the claim was
       filed", "verdict / the court's conclusion" — which is the label again in
       a smaller type. A ladder is read by scanning the left column, and a
       second line per row halves how much of it fits on a screen while adding
       nothing to any of them.
       The rows that keep a second line are the two whose label genuinely does
       not carry the fact: a failed round says what it COST, and that is not
       inferable from the word "failed". */
    const R=(k,what,sub)=>{ const e=tl[k]; if(!e) return;
      rows.push({t:e.t, h:e.h, what, sub, future:e.t>nowT}); };
    R("opened","opened");
    R("answered","answered"+(d.answer!=null?" "+sideName(d.answer):""));
    R("verdict","verdict"+(d.route?" · "+d.route:""));
    /* THE SETTLE DEADLINE ONLY WHILE IT IS THE CLOCK. It is the date an
       UNDISPUTED answer would settle on, and the realm keeps publishing it
       after a dispute has taken over — so a disputed or settled claim listed a
       deadline that stopped meaning anything the moment somebody disputed. The
       flat branch below already got this right; this one did not. */
    if(d.phase==="answered") R("settle","settle deadline");
    R("reopen","reopen closes");
    // THE ROUNDS ARE EVENTS, so they belong on the timeline with the other
    // events — but ClaimTimeline (clock.gno:118) publishes no stamp for a
    // round's opening, so they cannot be dated. They are rendered with an
    // em-dash in the date column rather than a projected date: a guess printed
    // in the same type as the chain's own record is worse than no date.
    //
    // ONE ROW FOR ALL THE FAILED ROUNDS, not one apiece. With no dates to tell
    // them apart, N identical rows are N copies of the same sentence.
    if(d.round) rows.push({t:nowT-0.5, nodate:true,
      what:`${d.round} failed round${d.round>1?"s":""}`});
    /* THE DISPUTE ITSELF IS AN EVENT, and the ladder did not have a row for it.
       On a claim in its FIRST round the rungs read opened, answered, now, vote
       closes — while the notice above said "a dispute is under way". A reader
       had to infer the dispute from the existence of a vote, on the one surface
       whose whole job is to say what has happened.
       Dateless, for the reason the failed rounds are: clock.gno stamps a round's
       opening nowhere, so this carries an em-dash rather than a projection.
       Sorted after the failed rounds, which is when it opened. */
    if(d.phase==="disputed") rows.push({t:nowT-0.4, nodate:true,
      what:`dispute opened · round ${(d.round||0)+1}`});
    if(d.voteEndsAt && nowH!=null) rows.push({h:d.voteEndsAt, t:nowT+(d.voteEndsAt-nowH)*BLOCK_SECS,
      what:`vote closes · round ${(d.round||0)+1}`, future:true, est:true});
    rows.push({t:nowT, h:tl.now.h, what:"now", now:true});
    rows.sort((a,b)=>a.t-b.t);
    const body = rows.map(r=>{
      const known = r.t>0;
      /* NO TIME OF DAY BESIDE THE CHART. "6 Aug 2026, 22:13 UTC" plus "11 days
         ago" does not fit half a column and wrapped mid-date; the minute a
         claim was filed is not what a reader scanning a ladder wants, and the
         row's title still carries the block it happened at. Under the page,
         where there is room, the stamp stays whole. */
      const when = r.nodate? "—"
        : !known? `≈block ${fmtN(r.h)}`
        : r.now? stampDate(r.t,!narrow)
        : (r.future? (r.est?"≈ ":"")+stampDate(r.t,false) : stampDate(r.t,!narrow));
      // The nodate row's t is a SORT KEY, not a time — glossing it would print
      // "just now" about rounds that may have run for weeks.
      const gloss = known && !r.now && !r.nodate? sinceWords(nowT, r.t) : "";
      const title = r.nodate? "the chain publishes no stamp for a dispute round's opening"
        : known? `block ${fmtN(r.h)}${r.est?" — projected from the current pace":""}`
        : "this claim predates the chain's date stamps; only its height is recorded";
      return `<div class="ev" title="${esc(title)}">${esc(r.what)}${r.sub?`<small>${esc(r.sub)}</small>`:""}</div>`
        + `<div class="dt" title="${esc(title)}">${esc(when)}${gloss?` <small>${esc(gloss)}</small>`:""}</div>`;
    }).join("");
    let fut2=null;
    if(d.phase==="open") fut2="awaiting an answer — anyone may post one with a bond";
    else if(d.phase==="disputed" && !d.voteEndsAt) fut2=`round ${(d.round||0)+1} is voting — its close height could not be read`;
    else if(d.phase==="settled") fut2="settled — every stake withdraws 1×";
    else if(d.phase==="provClose") fut2="closed without a decision — everyone 1×";
    else if(d.phase==="closed") fut2="closed — never answered";
    // NO h3. The section heading directly above already says "Timeline"; a
    // ticket heading here printed the same word twice down the page.
    /* NO FOOTNOTE. It explained three things the rows already say: that the
       dates come from the chain (every row's title carries its block), that
       hovering shows the block (that is what a title attribute is), and what ≈
       means (a projection, in front of a date that has not happened yet). Three
       lines of instructions under a ladder that is six lines long. */
    return `<div class="ticket${narrow?" clocknarrow":""}${bare?" clockbare":""}" style="margin-bottom:12px">
      <div class="clockrows">${body}${fut2?`<div class="ev">${esc(fut2)}</div><div class="dt">—</div>`:""}</div></div>`;
  }
  if(d.answered && d.settleAt) rows.push([d.settleAt-51840, "answered"+(d.answer!=null?" "+sideName(d.answer):""), "derived: settle deadline − 72h"]);   // kept: this row's height is NOT the chain's
  // SettleDeadline persists after freeze, but once a dispute/vote decided the
  // claim the old deadline is history that never happened — show it only
  // while it is the operative clock.
  if(d.settleAt && d.phase==="answered") rows.push([d.settleAt, "settle deadline"]);
  if(d.voteEndsAt) rows.push([d.voteEndsAt, `vote closes · round ${(d.round||0)+1}`]);
  if(d.escrowUntil) rows.push([d.escrowUntil, "reopen closes"]);
  if(nowH!=null) rows.push([nowH, "now"]);
  // SORTED INTO PLACE, not appended. Rendered after the body it came out below
  // "now" and below "vote closes", reading as something still to come — and
  // failed rounds are the most recent thing that already happened. The height
  // is a sort key half a block before now, and the 4th field says so: it prints
  // an em-dash, because the chain stamps a round's opening nowhere.
  if(d.round) rows.push([(nowH!=null? nowH : 0)-0.5,
    `${d.round} failed round${d.round>1?"s":""}`,
    "quorum was not met — half of each disputer's bond burned, half returned", true]);
  // Same row, same reason, on the branch that has no timeline to date from.
  if(d.phase==="disputed") rows.push([(nowH!=null? nowH : 0)-0.4,
    `dispute opened · round ${(d.round||0)+1}`, "", true]);
  rows.sort((a,b)=>a[0]-b[0]);
  let fut=null;
  if(d.phase==="open") fut="awaiting an answer — anyone may post one with a bond";
  else if(d.phase==="disputed" && !d.voteEndsAt) fut=`round ${(d.round||0)+1} is voting — its close height could not be read, and Resolve refuses until it has passed`;
  else if(d.phase==="settled") fut="settled — every stake withdraws 1×";
  else if(d.phase==="provClose") fut="closed without a decision — everyone 1×";
  else if(d.phase==="closed") fut="closed — never answered";
  if(!rows.length && !fut) return "";
  const body = rows.map(([h,what,sub,nodate])=>{
    const w = !nodate && nowH!=null? wall(nowH,h) : null;
    const when = nodate? "—" : `≈block ${fmtN(h)}`;
    return `<div class="line"><span class="l tnum">${when}${w?` <small>${esc(w)}</small>`:""}</span><span class="r">${esc(what)}${sub?` <small>${esc(sub)}</small>`:""}</span></div>`;
  }).join("");
  return `<div class="ticket" style="margin-bottom:12px">${body}
      ${fut?`<div class="line"><span class="l tnum">—</span><span class="r">${esc(fut)}</span></div>`:""}</div>`;
}
function resolutionSection(slug,id,d,nowH,tl){
  /* ONE HEIGHT SPACE, and this whole function was in the wrong one.
     nowH is the RPC's latest_block_height. Every value compared against it here
     — voteEndsAt, settleAt, escrowUntil, the ladder's rows — is a REALM height,
     and on a test-clock chain those are different numbers by a wide margin.
     Measured on kourt.xyz: the realm's own now is 88,562, the RPC's is 529, and
     DisputeVoteCloses(covid,10) is 180,722 — so the ballot said the vote closes
     in 10.4 days when the realm puts it 5.3 days out, nearly 2x wrong.
     WORSE THAN A WRONG COUNTDOWN: four of these comparisons gate BUTTONS —
     Reopen, Finalize, Dispute this answer, Settle — so the page could hide an
     action that works or offer one that panics in the wallet.
     The claim's timeline already carries the realm's height for the same instant
     ("now:<unix>:<height>"), which is how the stake chart was fixed for exactly
     this reason; the ballot and the ladder were left behind. On an ordinary chain
     tl.now.h equals nowH and nothing changes. */
  const rH = (tl && tl.now && tl.now.h != null)? tl.now.h : nowH;
  let inner="";
  // Drawn here only when the signal column did not take it — one ladder per
  // page. The heading follows the content: a section titled "Timeline" holding
  // no timeline is worse than a section named for what it actually has.
  const ladder = resolutionLadder(d, rH, tl);
  const head = "Timeline";
  if(d.phase==="closed"){
    // No notice here. It used to repeat the stake ticket almost verbatim —
    // both opened "Closed — never answered" and both ended "stakes were never
    // frozen, unstake freely". The two facts it alone carried (deposit
    // refunded, fee burned) now live in the ticket, next to the buttons they
    // describe; the ladder already carries the dates.
    return `<section id="timeline" tabindex="-1"><div class="sec-h">${head}</div>${ladder}</section>`;
  }
  if(d.phase==="provClose"){
    inner = `<div class="notice void"><span class="g">◌</span><div><b>Closed without a decision.</b>
      Three dispute rounds failed to reach quorum, so nobody's answer stands. Everyone withdraws their principal 1×; the deposit and fee refund. No reward is drawn.
      </div></div>`;   // the buttons are in the ticket beside the chart, with the sentence that describes them
  } else if(d.phase==="settled"){
    const v=(d.verdict!=null?d.verdict:d.answer);
    inner = `<div class="notice good"><span class="g">✓</span><div><b>Settled ${sideName(v)}</b>${d.route?" — "+esc(d.route)+"":""}.
      Both sides withdraw principal 1×; the winning side also draws its accuracy reward once the rewards are opened.
      ${d.crystallized && d.route==="vote"? `<p class="small" style="margin:8px 0 0">Voters whose ballot matched the final verdict may pull a small participation carrot — newly issued, capped below half a flag bond, queued behind earlier awards; abstain and against-verdict ballots receive nothing.</p>`:""}</div></div>`;
  } else if(d.phase==="disputed"){
    inner = `<div class="notice warn"><span class="g">⚖</span><div><b>A dispute is under way</b>${d.round?` (after ${d.round} failed round${d.round>1?"s":""})`:""}.
      The court is voting on <i>“overturn the answer?”</i> — the verdict belongs to everyone but the claim\u2019s own participants.
      <p class="small" style="margin:8px 0 0">The ballot is beside the chart, above.</p></div></div>`;
  } else if(d.phase==="provisional"){
    const cost = d.disputeBondNext? " The next dispute bond is "+cc(d.disputeBondNext,slug)+" (it doubles each failed round).":"";
    const when = d.escrowUntil? (rH==null? " Reopenable until block "+fmtN(d.escrowUntil)+"."
      : (d.escrowUntil>rH? " Reopenable until block "+fmtN(d.escrowUntil)+" (in "+wall(rH,d.escrowUntil)+")."
        : " The reopen window has closed — participants may finalize now; anyone may after a week.")):"";
    inner = `<div class="notice warn"><span class="g">⏳</span><div><b>Provisional ${sideName(d.provisional)}, in escrow.</b>
      A new dispute can still reopen it before it locks.${when}${cost} The side it runs against may withdraw 1× now — their outcome can't improve.
      <div class="actions" style="margin-top:10px">
        ${(rH!=null && d.escrowUntil && d.escrowUntil<=rH)? "" : btn("Reopen (dispute again)","OpenDispute",{courtSlug:slug,claimID:id},"no")}
        ${(rH!=null && d.escrowUntil && d.escrowUntil>rH)? "" : btn("Finalize","Finalize",{courtSlug:slug,claimID:id},"","participants first week")}
        ${btn("Withdraw (losing side)","WithdrawStake",{courtSlug:slug,claimID:id,side:1-d.provisional})}</div></div></div>`;
  } else if(d.phase==="answered"){
    const bondt = d.answerBond!=null? " backed by a bond of "+cc(d.answerBond,slug)+" that burns if the answer is overturned":"";
    const rec = d.record? " The answerer's contested-and-upheld record here is "+d.record+".":"";
    const when = d.settleAt? (rH==null? ""
      : (d.settleAt>rH? " It settles undisputed in "+wall(rH,d.settleAt)+" if nobody disputes it."
        : " Its 72-hour window has passed — the next touch settles it.")):"";
    const cost = d.disputeBondNext? " Disputing now costs "+cc(d.disputeBondNext,slug)+".":"";
    inner = `<div class="notice warn"><span class="g">◷</span><div><b>Answered ${sideName(d.answer)}</b> by ${shortAddr(d.answerer)}${bondt}.${when}${cost}${rec}
      <div class="actions" style="margin-top:10px">
        ${(rH!=null && d.settleAt && d.settleAt<=rH)? "" : btn("Dispute this answer","OpenDispute",{courtSlug:slug,claimID:id},"no")}
        ${(rH!=null && d.settleAt && d.settleAt>rH)? "" : btn("Settle (aged & undisputed)","SettleUndisputed",{courtSlug:slug,claimID:id})}</div></div></div>`;
  } else {
    inner = `<div class="notice warn"><span class="g">◔</span><div><b>No answer yet.</b> Once the claim's trailing total stake passes this court's minimum, an answer may be posted with a bond sized so lying does not pay. In a court that already has answerers with a track record, they hold the first day; a young court opens to anyone at once. A claim nobody ever answers dies at its timeout — anyone may close it then. Posting freezes staking; an undisputed answer settles 72 hours later.
      <div class="actions" style="margin-top:10px">
        ${btn("Answer YES","PostAnswer",{courtSlug:slug,claimID:id,verdict:0},"yes")}
        ${btn("Answer NO","PostAnswer",{courtSlug:slug,claimID:id,verdict:1},"no")}
        ${btn("Close dead claim","CloseDeadClaim",{courtSlug:slug,claimID:id},"","if its timeout passed")}</div></div></div>`;
  }
  return `<section id="timeline" tabindex="-1"><div class="sec-h">${head}</div>${ladder}${inner}</section>`;
}

/* Every court slug, unbounded — the directory Render caps each section at 50
   and omits hidden courts, but balances are per-court. ListByTier returns []string;
   qeval's slice syntax varies by gnovm version, so extract the quoted slug
   tokens permissively and fall back to the (capped) directory if none parse. */
async function allCourtSlugs(){
  if(!isLive()) return {slugs:Object.keys(DEMO.courts), degraded:false};
  try{
    const raws = await Promise.all([0,1,2].map(t=>qeval(`ListByTier(${t})`)));
    const slugs = [...new Set((raws.join("\n").match(/"[a-z0-9-]+"/g)||[]).map(x=>x.slice(1,-1)))];
    if(slugs.length) return {slugs, degraded:false};
  }catch(_){}
  // The directory render caps at 50/section and hides tier-0 courts — a lossy
  // universe. Say so: callers count this as a failed read so the warning shows.
  return {slugs:(await listCourts()).map(c=>c.slug), degraded:true};
}

/* All claim ids in a court. The rendered docket caps at the 50 newest and
   hides moderated claims, but positions are read by id — so the holdings views
   scan 1..ClaimCount (ids are 1-based and inclusive — the realm increments nextID before assigning) instead of parsing the docket. */
const SCAN_DEPTH = 100;
async function claimIdsFor(slug, depth){
  if(!isLive()){ const c=demoCourt(slug); return c? {ids:c.claims.slice(), total:c.claims.length} : {ids:[], total:0}; }
  const n = await one(`ClaimCount(${gstr(slug)})`);
  const lo = depth? Math.max(1, n-depth+1) : 1;
  const ids=[]; for(let i=n;i>=lo;i--) ids.push(i);
  return {ids, total:n};
}
/* ONE READ FOR THE WHOLE DOCKET, and four per row as the fallback.
   A court page drew fourteen rows by asking StakePools, PoolConviction,
   TrailingOI and TrailingYes for each: 56 queries. Measured against the live
   node, every qeval reloads the realm at ~60-90ms, so those 56 were most of the
   four seconds the page spent reading after it had already painted.
   DocketSeries answers all of them in one query — the realm walks its claims
   once — and this pre-loads it for the ids about to be drawn.
   NOT an RPC batch: gno executes a JSON-RPC array serially (forty reads batched
   took 3.56s against 1.74s for the same forty in parallel), so the saving has to
   come from asking the REALM once, not from posting once.
   A chain without the entrypoint answers "name DocketSeries not declared", and
   then every row reads the old way — this page is served from a static host and
   has no idea which build of the realm it is pointed at. */
const DSERIES = new Map();   // "slug\u0000id" -> row, for this render only
function dseriesKey(s2, id){ return s2 + "\u0000" + id; }
async function docketSeriesPreload(s2, ids){
  DSERIES.clear();
  if(!ids.length) return;
  let packed;
  try{ packed = await one(`DocketSeries(${s2},${gstr(ids.join(","))},${WEEK})`); }
  catch(_){ return; }          // older realm: every row falls back on its own
  for(const rec of String(packed||"").split(";")){
    const f = rec.split(":");
    if(f.length !== 9) continue;
    const n = i => Number(f[i]);
    DSERIES.set(dseriesKey(s2, f[0]), {
      yesStake:n(1), noStake:n(2), convYes:n(3), convNo:n(4),
      trailOI:n(5), trailOImature:f[6]==="1", trailYesAvg:n(7), trailYesMature:f[8]==="1"});
  }
}
async function docketSeriesRow(s2, id){
  const hit = DSERIES.get(dseriesKey(s2, id));
  if(hit) return hit;
  try{
    const [pools,pconv,toi,tyes] = await Promise.all([
      tup(`StakePools(${s2},${id})`), tup(`PoolConviction(${s2},${id})`),
      tup(`TrailingOI(${s2},${id},${WEEK})`), tup(`TrailingYes(${s2},${id},${WEEK})`)]);
    return {yesStake:pools[0],noStake:pools[1],convYes:pconv[0],convNo:pconv[1],
      trailOI:toi[0],trailOImature:toi[1],trailYesAvg:tyes[0],trailYesMature:tyes[1]};
  }catch(_){ return null; }
}
async function inChunks(items, size, fn){
  const out=[];
  for(let i=0;i<items.length;i+=size) out.push(...await Promise.all(items.slice(i,i+size).map(fn)));
  return out;
}

/* ================= personal claimables + last-visit memory ==============
   claimables() decides pulls ONLY from readable state (PullState paid flags,
   roles, phases). The one undecidable pull — the voter carrot, whose voted-
   with-verdict record is private — renders as a hedge; an unreadable flag
   drops its row rather than guessing. Reward rows carry NO amounts (the cap
   that scales them is unexposed; an estimate would read as a promised gain).
   Senior entitlements DO show amounts: `payable` is the realm's own owed
   figure — "owed to you", never "you earn". */
function claimables(slug, id, d, p, addr, nowH){
  const out={now:[], maybe:[]};
  const hasStake=(p.yes||0)>0||(p.no||0)>0;
  const hasConv=(p.cy||0)>0||(p.cn||0)>0;
  // one row per HELD side — the realm withdraws per side, and an address may
  // hold both
  const sides=[]; if((p.yes||0)>0) sides.push(0); if((p.no||0)>0) sides.push(1);
  for(const side of sides){
    if(d.phase==="settled"||d.phase==="provClose"){
      out.now.push({id, label:`withdraw your ${sideName(side)} stake — returns 1×; principal, not a prize`, act:["WithdrawStake",{courtSlug:slug,claimID:id,side}]});
    } else if(d.phase==="provisional" && d.provisional>=0 && side!==d.provisional){
      out.now.push({id, label:`leave with your ${sideName(side)} stake, 1× now — the standing verdict runs against it; a reopen may still flip it`, act:["WithdrawStake",{courtSlug:slug,claimID:id,side}]});
    } else if(d.phase==="closed"){
      out.now.push({id, label:`unstake your ${sideName(side)} stake — the claim died unanswered; stakes were never frozen`, act:["Unstake",{courtSlug:slug,claimID:id,side,amount:(side===0?p.yes:p.no)}]});
    }
  }
  if(d.crystallized){
    // a vote-settled claim whose Verdict read failed gets NO winner row —
    // guessing the side from the (possibly overturned) answer could build a
    // button the realm would panic on
    const v = (d.verdict!=null && d.verdict>=0)? d.verdict : (d.route==="vote"? null : d.answer);
    const pulls = d.pulls || null;
    if(v!=null && pulls && !pulls.winnerPaid && ((v===0&&(p.cy||0)>0)||(v===1&&(p.cn||0)>0)))
      out.now.push({id, label:"draw your accuracy reward (conviction) — winning side, one draw", act:["WithdrawBonus",{courtSlug:slug,claimID:id,side:v}]});
    if(pulls && !pulls.authorPaid && d.author===addr && !d.seeded)
      out.now.push({id, label:"draw the author's slice — one draw", act:["AuthorBonus",{courtSlug:slug,claimID:id}]});
    if(pulls && !pulls.answererPaid && d.answerer===addr){
      if(d.draw && d.draw.ans===0) out.now.push({id, label:"the overturned answer draws nothing", decisive:true});
      else out.now.push({id, label:"draw the answerer's slice — one draw", act:["AnswererBonus",{courtSlug:slug,claimID:id}]});
    }
    // the carrot excludes every participant — author, answerer, stakers.
    // A claim reached through a position scan is decidably carrot-free, so
    // per-claim hedge rows would be wrong; the caller shows one court-level
    // hedge line instead.
    if(!hasStake && !hasConv && d.author!==addr && d.answerer!==addr && d.route==="vote" && d.draw && d.draw.carrot>0)
      out.maybe.push({id, label:"may be drawable — the voter reward goes to whoever voted with the verdict, and the court decides whether that is you. It is paid in turn, after earlier awards, at full size", act:["PullCarrot",{courtSlug:slug,claimID:id}]});
  }
  if(d.phase==="provisional" && d.escrowUntil && nowH!=null && d.escrowUntil<=nowH
     && (hasStake||hasConv||d.author===addr||d.answerer===addr))
    out.now.push({id, label:"finalize the verdict — opens 1× withdrawals for everyone; participants first week", act:["Finalize",{courtSlug:slug,claimID:id}]});
  return out;
}
/* the last-visit memory: this browser's record of real reads it made */
function seenKey(addr){ return "cc.seen."+(CFG.mode==="demo"?"demo":(CFG.chainid||"dev"))+"."+addr; }
function diffSeen(prev, curr){
  if(!prev || !prev.claims) return [];
  const out=[];
  for(const k of Object.keys(curr.claims||{})){
    const a=prev.claims[k];
    if(a!=null && a!==curr.claims[k]) out.push({key:k, from:a, to:curr.claims[k]});
  }
  return out;
}
/* one claimDetail per claim per render, shared by /me and /needs; live adds
   the two marginal reads (author, paid flags) only on crystallized claims */
let DETC = new Map();
async function meDetail(slug, id, addr){
  const k=slug+"/"+id+"/"+(addr||"");
  if(DETC.has(k)) return DETC.get(k);
  const pr=(async()=>{
    const d=await claimDetail(slug,id);
    if(d && isLive() && d.crystallized){
      const s2=gstr(slug);
      d.author = await one(`ClaimAuthor(${s2},${id})`).catch(()=>null);
      // a seeded claim's author draws nothing (I5) — read the bit or the row
      // below would offer an act the realm refuses at signing
      d.seeded = (await one(`ClaimSeeded(${s2},${id})`).catch(()=>null)) !== false; // unread = never offer the draw
      // PullState is per ADDRESS — three args; a failed read leaves pulls
      // null and every draw row stays hidden (never guessed)
      const ps = addr? await tup(`PullState(${s2},${id},${gstr(addr)})`).catch(()=>null) : null;
      d.pulls = ps? {winnerPaid:!!ps[0], authorPaid:!!ps[1], answererPaid:!!ps[2]} : null;
    }
    return d;
  })();
  DETC.set(k, pr); return pr;
}
async function seniorFor(slug, addr){
  if(!isLive()){
    const q=(DEMO.seniorQueues&&DEMO.seniorQueues[slug])||null;
    return q? {rows:q.entries.filter(e=>e.to===addr), total:q.queueLen, scanned:q.entries.length} : {rows:[],total:0,scanned:0};
  }
  const s2=gstr(slug);
  const n = await one(`QueueLen(${s2})`).catch(()=>null);
  if(n==null || n<1) return {rows:[],total:n||0,scanned:0};
  const K=25, lo=Math.max(1, n-K+1);
  const seqs=[]; for(let i=n;i>=lo;i--) seqs.push(i);
  const rows=(await inChunks(seqs, 6, async seq=>{
    try{ const e=await tup(`SeniorEntitlement(${s2},${seq})`);
      return {seq, to:e[0], amount:e[1], paid:e[2], payable:e[3]}; }catch(_){ return null; }
  })).filter(Boolean).filter(e=>e.to===addr);
  return {rows, total:n, scanned:seqs.length};
}
let meSeq=0;
async function meHoldings(addr,courts){
  const seq=++meSeq;
  DETC = new Map();
  const box=document.getElementById("holdings"); box.innerHTML=`<div class="empty"><div class="g">⚖︎</div><p>Reading your positions…</p></div>`;
  let mefail = courts.degraded? 1 : 0;
  const nowH = await chainHeight().catch(()=>null);
  const blocks=[], mescan=[], pullsNow=[], maybeCourts=[], seniorBlocks=[];
  let seniorCount=0;
  const snapshot={h:nowH, claims:{}};
  let posClaims=0, posCourts=0, anyArec=false;
  const heldList=[];   // [slug, court name, balance] for every court holding coin
  /* EVERY COURT'S READS START AT ONCE, and the loop below then walks them in
     order. Measured as waves of requests against the live node, the page fired
     covid's four reads at 1082ms and meta's at 1942ms — the second court was
     waiting on the first court's entire body, including its per-claim detail
     fetches, for no reason: no court's reads depend on another's.
     PREFETCHED RATHER THAN PARALLELISED IN PLACE. The loop pushes into blocks,
     seniorBlocks, pullsNow and heldList, and the order of those pushes is the
     order of the page; running the bodies concurrently would make the layout
     depend on which reply landed first. Starting the READS up front and leaving
     the assembly sequential overlaps the round trips and keeps the render
     deterministic. */
  const preRead = new Map(courts.slugs.map(slug => [slug, (async () => {
    const lv = isLive();
    return Promise.all([
      balanceOf(slug,addr).catch(()=>{mefail++; return 0;}),
      seniorFor(slug, addr).catch(()=>{mefail++; return {rows:[],total:0,scanned:0};}),
      lv? one(`StakedPage(${gstr(slug)},${gstr(addr)},0,0)`).catch(()=>{mefail++; return null;})
        : Promise.resolve(null),
      lv? one(`StakedSize(${gstr(slug)},${gstr(addr)})`).catch(()=>null)
        : Promise.resolve(null),
    ]);
  })()]));
  for(const slug of courts.slugs){
    /* FOUR INDEPENDENT QUESTIONS, ASKED AT ONCE. These were four awaits in a row —
       the balance, the holder's staked page, its size, and the senior tickets —
       and not one of them needs another's answer. Measured against the live node,
       a read from a browser costs about 142ms of which the node itself is ~25ms:
       the rest is the round trip, so three extra ROUND TRIPS per court is what
       this cost, not three extra queries. The senior scan moved up here from
       below the row loop for the same reason; it never depended on the rows.
       Promise.all and not a batch: gno runs a JSON-RPC array serially, which the
       cache's own note above records as measurably slower than letting the
       browser use its one HTTP/2 connection in parallel. */
    const live = isLive();
    const [bal, sen, stakedRaw, held] = await preRead.get(slug);
    // LIVE: one read names the holder's own positions, so only those claims are
    // probed. DEMO has no chain and keeps the sample scan.
    let ids, mine = [];
    if(live){
      const got = parseStaked(stakedRaw);
      mine = stakedByClaim(got);
      ids = mine.map(r=>r.id);
      // POSITIONS against POSITIONS. StakedSize counts (claim, side) entries and
      // stakedByClaim collapses both sides of a claim into one row, so comparing the
      // grouped length here claimed the page was truncated for anyone holding both
      // sides of a single claim. The cap is on the holder's own positions rather than
      // on all claims, so this note now appears only if there really are more.
      if(held!=null && held>got.length) mescan.push([slug, got.length, held]);
    } else {
      ids = (await claimIdsFor(slug, 0).catch(()=>{mefail++; return {ids:[]};})).ids;
    }
    // LIVE MODE READS THE PAGE IT ALREADY HAS. StakedPage carries the stake AND the
    // conviction for every position, so probing positionOf per claim would repeat four
    // reads — two StakeOf, two ConvictionOf — for numbers already in hand, and two of
    // the four would re-read the very stake this page returned. Demo mode has no page,
    // so it still probes.
    const probes = isLive()
      ? mine.map(r => ({id:r.id, p:{yes:r.yes, no:r.no, cy:r.cy, cn:r.cn}}))
      : await inChunks(ids, 8, id => positionOf(slug,id,addr).then(p=>({id,p})).catch(()=>{mefail++; return null;}));
    const rows=[]; let courtHasVoteSettle=false;
    /* THE DETAILS ARE FETCHED TOGETHER, THEN WALKED. This loop awaited meDetail
       per row, so a holder with ten positions paid ten round trips end to end —
       about 1.4 seconds of pure waiting on a page whose reads do not depend on
       each other at all. Eight at a time, the same width inChunks already uses
       for the demo probe, so the node sees the same burst shape it always did.
       The walk below stays a plain loop: it pushes into rows, pullsNow and
       snapshot in order, and order is what makes the page deterministic. */
    const held0 = probes.filter(Boolean).filter(h => h.p.yes||h.p.no||h.p.cy||h.p.cn);
    const details = await inChunks(held0, 8,
      h => meDetail(slug,h.id,addr).catch(()=>{mefail++; return null;}));
    for(let hi=0; hi<held0.length; hi++){
      const hit = held0[hi];
      const {id,p}=hit;
      const d = details[hi];
      if(!d){ rows.push({cl:{id,title:"claim #"+id+" — read failed"}, p, d:null}); continue; }
      snapshot.claims[slug+"/"+id]=d.phase;
      if(d.route==="vote" && d.crystallized && d.draw && d.draw.carrot>0) courtHasVoteSettle=true;
      const c = claimables(slug, id, d, p, addr, nowH);
      c.now.forEach(r=>pullsNow.push({slug, ...r, d}));
      rows.push({cl:{id, title: d.title || ("claim #"+id)}, p, d});
    }
    // senior tickets are owed regardless of current holdings; asked for above,
    // alongside the balance, because it never depended on the rows.
    if(bal || rows.length || sen.rows.length){
      if(bal || rows.length){ posCourts++; posClaims+=rows.length; }
      const st = await courtStats(slug).catch(()=>null);
      const cname = st? st.name : slug;
      if(bal>0) heldList.push([slug, cname, bal]);
      let arec = 0;
      if(isLive()) arec = (await one(`AnswerRecord(${gstr(slug)},${gstr(addr)})`).catch(()=>0)) || 0;
      if(arec>0) anyArec = true;
      // One read for the whole commitment picture; see parseCommitments above.
      let com = null;
      if(isLive()) com = parseCommitments(await one(`CommitmentsOf(${gstr(slug)},${gstr(addr)})`).catch(()=>null));
      if(courtHasVoteSettle) maybeCourts.push([slug, cname]);
      seniorCount += sen.rows.length;
      if(sen.rows.length || (isLive() && sen.total>sen.scanned)){
        seniorBlocks.push(`<section style="margin-top:14px"><div class="sec-h">Senior queue — ${safeInline(cname)} <span class="count">${isLive()? `checked newest ${sen.scanned} of ${fmtN(sen.total)} tickets`:`${sen.rows.length} of ${sen.total} tickets are yours`}</span></div>`
          + (sen.rows.length? `<div class="ticket">${sen.rows.map(e=>
              `<div class="line"><span class="l tnum">ticket #${e.seq}</span><span class="r tnum">${cc(e.payable,slug)} payable now <small>of ${cc(e.amount-e.paid,slug)} still owed to you — paid as budget accrues, the court's pace, not a promise</small></span></div>`).join("")}
              <div class="actions" style="margin-top:8px">${sen.rows.map(e=>btn("Pull senior ticket #"+e.seq,"PullSenior",{courtSlug:slug,seq:e.seq},"","owed, not earned")).join("")}</div></div>`
            : `<p class="small muted">none of the checked tickets are yours</p>`)
          + `</section>`);
      }
      blocks.push(`<section style="margin-top:14px"><div class="sec-h">${safeInline(cname)} <span class="count">${cc(bal,slug)} balance${rows.length?` · ${cc(rows.reduce((t,{p})=>t+(p.yes||0)+(p.no||0),0),slug)} in positions`:""}${arec>0?` · answer record ${fmtN(arec)} — contested-and-upheld`:""}</span></div>`
        + commitmentsTicket(com, slug)
        + (rows.length? `<div class="scroll-x"><table class="data"><thead><tr><th>Claim</th><th>state</th><th>YES stake</th><th>NO stake</th><th>conviction</th></tr></thead><tbody>`
            + rows.map(({cl,p,d})=>{
                const yourSide = (p.yes||0)>0? 0 : (p.no||0)>0? 1 : ((p.cy||0)>=(p.cn||0)?0:1);
                let personal="";
                if(d && (d.answered||d.provisional>=0) && !d.settled && !d.provClose){
                  const standing = d.provisional>=0? d.provisional : d.answer;
                  if(standing!=null) personal = standing===yourSide? "runs with your side" : "runs against your side";
                  if(d.phase==="provisional" && d.escrowUntil && nowH!=null && d.escrowUntil>nowH) personal += ` · reopenable until ≈block ${fmtN(d.escrowUntil)} — in ${wall(nowH,d.escrowUntil)}`;
                }
                return `<tr><td><a href="#/c/${esc(slug)}/${cl.id}" style="color:var(--accent-2);text-decoration:none">${safeInline(cl.title)}</a>${personal?`<span class="m" style="display:block">${esc(personal)}</span>`:""}</td>
                <td>${d? statusPill(d.statusText):""}</td>
                <td class="num">${cc(p.yes,slug)}</td><td class="num">${cc(p.no,slug)}</td><td class="num">${cc((p.cy||0)+(p.cn||0),slug)}</td></tr>`;
              }).join("")
            + `</tbody></table></div>`
          : `<p class="small muted">Coin only — no open positions in this court.</p>`)
        + `</section>`);
    }
  }
  if(seq!==meSeq) return; // a newer query for a different address owns the box
  // last-visit memory: this browser's record of real reads it made
  let ladder="";
  try{
    const prevRaw = store.get(seenKey(addr));
    // demo teaches the feature with a canned prior look, labeled (sample)
    const prev = prevRaw? JSON.parse(prevRaw) : (CFG.mode==="demo"? {h:NOW-3_000, claims:{"orem/3":"answered"}} : null);
    const changes = prev? diffSeen(prev, snapshot) : [];
    if(changes.length){
      ladder = `<section style="margin-top:14px"><div class="sec-h">Since you were last here <span class="count">this browser's memory${CFG.mode==="demo"?" (sample)":""}</span></div>
        <div class="ticket">${changes.map(ch=>{ const [sl,id]=ch.key.split("/");
          return `<div class="line"><span class="l tnum"><a href="#/c/${esc(sl)}/${esc(id)}">#${esc(id)} · ${esc(sl)}</a></span><span class="r">${esc(ch.to)} since your last visit — was ${esc(ch.from)}</span></div>`; }).join("")}
        <p class="small muted" style="margin:8px 0 0">this browser's memory of your last look${prev&&prev.h!=null&&nowH!=null?` — height ${fmtN(prev.h)} → ${fmtN(nowH)}`:""}. Clear storage and it forgets. Phases only — sealed votes never move here.</p></div></section>`;
    }
    if(mefail===0) store.set(seenKey(addr), JSON.stringify(snapshot)); // never memorize a partial view
  }catch(_){}
  const pullSec = pullsNow.length? `<section style="margin-top:14px"><div class="sec-h">You can pull these now <span class="count">${pullsNow.length}</span></div>
      <div class="ticket">${pullsNow.map(r=>`<div class="line"><span class="l tnum"><a href="#/c/${esc(r.slug)}/${r.id}?at=timeline">#${r.id} · ${esc(r.slug)}</a></span><span class="r">${esc(r.label)}</span></div>`).join("")}
      <div class="actions" style="margin-top:8px">${pullsNow.filter(r=>r.act).map(r=>btn(r.act[0]==="WithdrawStake"?"Withdraw #"+r.id: r.act[0]==="Finalize"?"Finalize #"+r.id: r.act[0]+" #"+r.id, r.act[0], r.act[1])).join("")}</div></div></section>` : "";
  const maybeSec = maybeCourts.length? `<section style="margin-top:14px"><div class="sec-h">Maybe — the court decides <span class="count">${maybeCourts.length} court${maybeCourts.length>1?"s":""}</span></div>
      <p class="small muted">${maybeCourts.map(([sl,nm])=>`Voted in a dispute in ${safeInline(nm)}? Voters in the deciding round may have a reward waiting — the court will tell you when you pull it from the claim's own page.`).join(" ")}</p></section>` : "";
  /* WHAT YOU HOLD, FIRST, because it is the thing a holder opens this page to see
     and it was not in the summary at all. Reported as "i have 19.5 Kourt:covid.
     i don't see any in 'positions'" — the balance WAS on the page, in the court
     section's own heading, under a strip whose first number said "open positions
     0". Nothing was missing; the summary was answering a different question in
     the place a reader looks for this one, and 0 beat 19.5 for attention.
     A LIST, NOT A SUM, and that is not a shortcut. KOURT:COVID and KOURT:OREM are
     different coins with different prices and no exchange rate between them, so
     a single total would be a number that means nothing. One court gets its
     balance; several get a count with the balances spelled out beneath. */
  const heldStat = !heldList.length
    ? `<div class="stat"><div class="k">coin held</div><div class="v tnum">none</div><div class="sub">buy a court's coin from its own page to take a position</div></div>`
    : heldList.length===1
    ? `<div class="stat"><div class="k">coin held</div><div class="v tnum">${cc(heldList[0][2], heldList[0][0])}</div><div class="sub">in ${safeInline(heldList[0][1])} — stake it on a claim to earn conviction</div></div>`
    : `<div class="stat"><div class="k">coin held</div><div class="v tnum">${heldList.length} courts</div><div class="sub">${heldList.map(([sl,,b])=>cc(b,sl)).join(" · ")} — one coin per court, never summed</div></div>`;
  const strip = `<section><div class="grid stats">
      ${heldStat}
      <div class="stat"><div class="k">staked on claims</div><div class="v tnum">${posClaims}</div><div class="sub">${posClaims? `across ${posCourts} court${posCourts===1?"":"s"}` : "holding coin is a position; staking it takes a side"}</div></div>
      <div class="stat"><div class="k">you can pull now</div><div class="v tnum">${pullsNow.length}</div><div class="sub">principal and earned pools — open each claim</div></div>
      <div class="stat"><div class="k">maybe — the court decides</div><div class="v tnum">${maybeCourts.length}</div><div class="sub">voter carrots — a pull costs only gas</div></div>
      <div class="stat"><div class="k">senior tickets</div><div class="v tnum">${seniorCount}</div><div class="sub">owed payouts — paid as budget accrues${isLive()? " · newest 25 per court checked":""}</div></div>
     </div></section>`;
  const depth0 = isLive()? (parseInt(QP.scan||"",10)||SCAN_DEPTH) : 0;
  const mescanNote = mescan.length? `<div class="pager"><span class="mono small">live scan: ${mescan.map(([sl,k,n])=>`${fmtN(k)} of ${fmtN(n)} of your positions in ${esc(sl)}`).join(" · ")} — your positions come from the court's address index, so none is out of reach; older PULLS still are</span><span class="chips"><a class="pill void" href="#/me?scan=${depth0+100}">scan older ›</a></span></div>` : "";
  const mewarn = mefail? `<p class="small" style="color:var(--no)">${mefail} chain read${mefail>1?"s":""} failed — this view may be incomplete; a pull is never guessed, so rows may be missing. Reload before trusting it.</p>` : "";
  box.innerHTML = (blocks.length||pullsNow.length
    ? strip + pullSec + maybeSec + seniorBlocks.join("") + blocks.join("")
      + (anyArec? `<p class="small muted" style="margin:8px 0 0">answer record is the court's own credential: only a contested-and-upheld answer scores, and an overturn resets it to zero.</p>`:"")
      + ladder
    : `<div class="empty"><div class="g">${mefail?"⚠":"◌"}</div><p>${mefail? "Could not read everything — no conclusions." : `No coin and no positions found for <span class="mono">${shortAddr(addr)}</span>.`}</p><p class="small">${mefail? "" : "Get a court's coin and stake a claim to begin."}</p></div>`) + mescanNote + mewarn;
}

/* --- what needs you: live answers on claims YOU staked, flagged if against your
   side. The people whose reward a false answer would deny are the ones told. --- */
on(/^\/needs$/, async ()=> needsView(CFG.mode==="demo"? DEMO_ME : (CFG.addr||null)));
async function needsView(addr){
  loading();
  const courts = await allCourtSlugs();
  main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:"What needs you"}])
    + `<h1 class="page-h">What needs you</h1>
       <p class="page-sub">Answers posted on claims you've staked — flagged when the answer runs <b>against your side</b>. Nobody is more motivated to contest a false answer than the stakers whose reward it would deny. It's a notification, not a role — you cannot vote on a claim you've staked (the rest of the court votes), but you can open the dispute.</p>
       <div class="addrbar"><input id="naddr" class="mono" value="${esc(addr||"")}" placeholder="g1… address" spellcheck="false" aria-label="your address">
         <button class="btn" id="ngo">Check</button></div><div id="needs"></div>`;
  const go=()=>{ const a=document.getElementById("naddr").value.trim(); if(a) needsList(a,courts); };
  document.getElementById("ngo").onclick=go;
  document.getElementById("naddr").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  if(addr) needsList(addr,courts);
  else document.getElementById("needs").innerHTML =
    `<div class="empty"><div class="g">◇</div><p>Connect Adena, or paste the address whose stakes to watch.</p></div>`;
}
let needsSeq=0;
async function needsList(addr,courts){
  const seq=++needsSeq;
  DETC = new Map();
  const box=document.getElementById("needs"); box.innerHTML=`<div class="empty"><div class="g">⚖︎</div><p>Checking your claims…</p></div>`;
  const nowH = await chainHeight().catch(()=>null);
  const items=[]; let failed = courts.degraded? 1 : 0; const nscan=[];
  const posBySlug = {}; // ids where THIS address has any position — decidably excluded from those ballots
  for(const slug of courts.slugs){
    const ndepth = isLive()? (parseInt(QP.scan||"",10)||SCAN_DEPTH) : 0;
    const {ids, total} = await claimIdsFor(slug, ndepth).catch(()=>{failed++; return {ids:[],total:0};});
    if(isLive() && total>ids.length) nscan.push([slug, ids.length, total]);
    const probes = await inChunks(ids, 8, id => positionOf(slug,id,addr).then(p=>({id,p})).catch(()=>{failed++; return null;}));
    posBySlug[slug] = new Set(probes.filter(Boolean).filter(h=>h.p.yes||h.p.no||(h.p.cy||0)||(h.p.cn||0)).map(h=>h.id));
    const before = items.length;
    /* SAME SHAPE AS meView'S, AND IT WAS FOUND THE SAME WAY. This awaited
       meDetail once per held position inside the loop, so "What needs you" cost
       one round trip per claim end to end — at ~142ms a read from a browser,
       ten positions is a second and a half of waiting on reads that do not
       depend on each other. The assertion written for meView's version failed
       here, which is how this copy surfaced; narrowing the test to meView would
       have left the second one serial and the guard lying about coverage.
       Eight wide, matching the probe fetch just above, and the walk stays a
       plain loop because it pushes into items in order. */
    const heldHits = probes.filter(Boolean)
      .filter(h => h.p.yes || h.p.no || (h.p.cy||0) || (h.p.cn||0));
    const heldDetails = await inChunks(heldHits, 8,
      h => meDetail(slug,h.id,addr).catch(()=>{failed++; return null;}));
    for(let hi=0; hi<heldHits.length; hi++){
      const hit = heldHits[hi];
      const d = heldDetails[hi];
      if(!d||!d.answered||d.settled||d.provClose) continue;
      const yourSide = (hit.p.yes+(hit.p.cy||0)) >= (hit.p.no+(hit.p.cn||0)) ? 0 : 1;
      const standing = d.provisional>=0 ? d.provisional : d.answer;
      items.push({c:{slug, name:slug}, cl:{id:hit.id, title:d.title}, d, against: standing!==yourSide});
    }
    if(items.length>before){
      const st = await courtStats(slug).catch(()=>null);
      if(st) for(let i=before;i<items.length;i++) items[i].c.name = st.name;
    }
  }
  // Open ballots — courts you hold (D6-4): the coin is the door, the sealed
  // hourly snapshot is the weight, and the realm refuses participants at
  // signing. phaseClass only — "answered" contains "disputable"/"undisputed".
  const ballots=[], bexcluded=[]; let ballotCourts=0, stripUnchecked=0;
  for(const slug of courts.slugs){
    const bal = await balanceOf(slug, addr).catch(()=>{failed++; return 0;});
    if(!(bal>0)) continue;
    ballotCourts++;
    let bp=null;
    try{ bp = await listClaims(slug); }catch(_){ failed++; continue; }
    const bst = await courtStats(slug).catch(()=>null);
    const bname = bst? bst.name : slug;
    const seenB = new Set();
    const push = (id, title) => {
      if(seenB.has(id)) return; seenB.add(id);
      const rec = {slug, name:bname, id, title};
      if((posBySlug[slug]||new Set()).has(id)) bexcluded.push(rec); else ballots.push(rec);
    };
    for(const c2 of bp){ if(phaseClass(c2.statusText).short==="in dispute") push(c2.id, c2.title); }
    const inDocket = new Set(bp.map(c2=>c2.id));
    for(const r of (bp.strip||[])){
      if(inDocket.has(r.id)) continue;
      let stx=null;
      if(isLive()) stx = await one(`ClaimStatus(${gstr(slug)},${r.id})`).catch(()=>{failed++; return null;});
      else { const dd=DEMO.claims[slug+"/"+r.id]; stx = dd? statusText(dd) : null; }
      if(stx!=null && phaseClass(String(stx)).short==="in dispute") push(r.id, r.title);
    }
    if(bp.stripMore) stripUnchecked += bp.stripMore;
  }
  if(seq!==needsSeq) return; // a newer query for a different address owns the box
  const ndepth0 = isLive()? (parseInt(QP.scan||"",10)||SCAN_DEPTH) : 0;
  const nscanNote = nscan.length? `<div class="pager"><span class="mono small">live scan: ${nscan.map(([sl,k,n])=>`the newest ${fmtN(k)} of ${fmtN(n)} claims in ${esc(sl)}`).join(" · ")} — older stakes are not checked</span><span class="chips"><a class="pill void" href="#/needs?scan=${ndepth0+100}">scan older ›</a></span></div>` : "";
  const warn = failed? `<p class="small" style="color:var(--no)">${failed} chain read${failed>1?"s":""} failed — this view may be incomplete. Reload before trusting it.</p>` : "";
  const brow = r => `<div class="crow" style="cursor:default">
      <span class="id">#${r.id}</span>
      <span><a class="t" href="#/c/${esc(r.slug)}/${r.id}?at=timeline" style="color:inherit">${safeInline(r.title)}</a>
        <span class="m" style="display:block">${safeInline(r.name)} · the ballot — overturn the answer? · a sealed vote is deciding — its countdown is on the claim page</span></span>
      <span class="rt">${statusPill("disputed")}</span></div>`;
  const exrow = r => `<div class="crow" style="cursor:default">
      <span class="id">#${r.id}</span>
      <span><a class="t" href="#/c/${esc(r.slug)}/${r.id}?at=timeline" style="color:inherit">${safeInline(r.title)}</a>
        <span class="m" style="display:block">${safeInline(r.name)} · you staked this claim — the rest of the court votes</span></span>
      <span class="rt"><span class="pill void">excluded</span></span></div>`;
  const ballotsSec = (ballots.length||bexcluded.length)
    ? `<div class="sec-h" style="margin-top:14px">Open ballots — courts you hold <span class="count">${ballots.length} · checked ${ballotCourts} court${ballotCourts===1?"":"s"} you hold coin in</span></div>
       <p class="small muted" style="margin:0 0 8px">Sealed votes running in courts whose coin you hold — one question per ballot: overturn the answer? Sealed means un-summed, not secret — this page will not add ballots up mid-vote, and anyone who wants the running count can read it off the chain. Weight is the balance at the hourly snapshot before the round opened — buying now adds nothing; the claim's author, answerer, and stakers are excluded — the court refuses them when they sign.${stripUnchecked? ` …and ${fmtN(stripUnchecked)} more rows awaiting review were not checked — the chain's page shows the nearest 50.`:""}</p>
       ${ballots.length? `<div class="docket">${ballots.map(brow).join("")}</div>`:""}
       ${bexcluded.length? `<div class="sec-h" style="margin-top:10px">You are excluded from these <span class="count">${bexcluded.length}</span></div><div class="docket">${bexcluded.map(exrow).join("")}</div>`:""}`
    : "";
  if(!items.length && !ballots.length && !bexcluded.length){ box.innerHTML=`<div class="empty"><div class="g">${failed?"⚠":"✓"}</div><p>${failed? "Could not read everything — no conclusions." : "Nothing needs you right now — no live answers on claims you've staked, and no open ballots in the courts you hold."}</p>${warn}</div>`+nscanNote; return; }
  if(!items.length){ box.innerHTML = `<p class="small mono" style="margin:0 0 8px">no live answers on claims you've staked</p>` + warn + nscanNote + ballotsSec; return; }
  // deadline per row: the operative clock in the claim's current phase
  const clock = d => {
    if(d.phase==="answered" && d.settleAt) return {h:d.settleAt, txt: nowH!=null? (d.settleAt>nowH? `you may dispute until ≈block ${fmtN(d.settleAt)} — in ${wall(nowH,d.settleAt)}` : "the settle window has passed — anyone may settle it now") : `you may dispute until ≈block ${fmtN(d.settleAt)}`};
    if(d.phase==="provisional" && d.escrowUntil) return {h:d.escrowUntil, txt: nowH!=null? (d.escrowUntil>nowH? `reopenable until ≈block ${fmtN(d.escrowUntil)} — in ${wall(nowH,d.escrowUntil)}` : "the reopen window has closed — finalizable") : `reopenable until ≈block ${fmtN(d.escrowUntil)}`};
    if(d.phase==="disputed") return {h:Infinity, txt:"a sealed vote is deciding — its countdown is on the claim page"};
    return {h:Infinity, txt:""};
  };
  items.forEach(it=>{ it.clk = clock(it.d); });
  const against = items.filter(i=>i.against).sort((a,b)=>a.clk.h-b.clk.h);
  const withYou = items.filter(i=>!i.against).sort((a,b)=>a.clk.h-b.clk.h);
  const urgent = against.find(i=>isFinite(i.clk.h) && (nowH==null || i.clk.h>nowH));
  const urgentBox = urgent? `<div class="notice warn"><span class="g">⚑</span><div><b>Closing soonest:</b> <a href="#/c/${esc(urgent.c.slug)}/${urgent.cl.id}?at=timeline" style="color:inherit;text-decoration:underline">${safeInline(urgent.cl.title)}</a> — ${esc(urgent.clk.txt)}.${urgent.d.disputeBondNext?` A new dispute posts ${cc(urgent.d.disputeBondNext,urgent.c.slug)}.`:""}</div></div>` : "";
  const row = ({c,cl,d,against,clk}) => {
    const canDispute = d.phase==="answered" && (nowH==null || !d.settleAt || d.settleAt>nowH);
    const canSettle = d.phase==="answered" && nowH!=null && d.settleAt && d.settleAt<=nowH;
    const canReopen = d.phase==="provisional" && (nowH==null || !d.escrowUntil || d.escrowUntil>nowH);
    return `<div class="crow" style="cursor:default">
      <span class="id">#${cl.id}</span>
      <span><a class="t" href="#/c/${esc(c.slug)}/${cl.id}?at=timeline" style="color:inherit">${safeInline(cl.title)}</a>
        <span class="m" style="display:block">${safeInline(c.name)} · ${d.provisional>=0? "provisional "+sideName(d.provisional) : "answered "+sideName(d.answer)}${clk.txt?` · ${esc(clk.txt)}`:""}</span>
        ${against? `<span class="m" style="display:block">their bond ${cc(d.answerBond,c.slug)}${d.disputeBondNext?` · a new dispute posts ${cc(d.disputeBondNext,c.slug)}`:""}</span>
        <span class="actions" style="margin-top:6px; display:flex">${canDispute||canReopen? btn(d.phase==="provisional"?"Reopen (dispute again)":"Dispute this answer","OpenDispute",{courtSlug:c.slug,claimID:cl.id},"no") : ""}${canSettle? btn("Settle (aged & undisputed)","SettleUndisputed",{courtSlug:c.slug,claimID:cl.id}) : ""}</span>`:""}</span>
      <span class="rt">${against?`<span class="pill no">⚑ against your side</span>`:`<span class="pill good">matches you</span>`}</span></div>`;
  };
  box.innerHTML = `<p class="small mono" style="margin:0 0 8px">${items.length} answer${items.length===1?" stands":"s stand"} on claims you staked — ${against.length} against your side · ${withYou.length} with you</p>`
    + urgentBox + warn + nscanNote
    + (against.length? `<div class="sec-h" style="margin-top:14px">Against your side <span class="count">${against.length}</span></div><div class="docket">${against.map(row).join("")}</div>`:"")
    + ballotsSec
    + (withYou.length? `<div class="sec-h" style="margin-top:14px">With your side <span class="count">${withYou.length}</span></div><div class="docket">${withYou.map(row).join("")}</div>`:"");
}
