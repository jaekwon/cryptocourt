/* ============================ router =================================== */
const main = document.getElementById("main");
const routes = [];
function on(re, fn){ routes.push([re,fn]); }
let renderSeq = 0, paintedSeq = 0;
/* The live chat panel's stop function. render() is async AND re-entrant, so a
   poller can outlive the DOM it was writing to; mountChat guards that with its
   own generation counter, and this is the other half — the timer is released
   promptly rather than at its next tick.

   Deleting the CHATSTOP() call below passes every browser check, and that is a
   fact about reachability rather than a gap: the checks run in demo mode, where
   there is no poller and so no timer to release, and mountChat's generation
   counter already makes a stale tick inert. The property this line actually
   carries — that the pending timer is gone rather than merely harmless — is
   pinned in web/tests/chat_test.js, which counts outstanding timers directly. */
let CHATSTOP = null;
/* Query params ride the hash (#/c/orem?p=2) so pages, back/forward, and
   shared links all land on the same window. Routes match the path part. */
let QP = {};
/* The seeded-chain warning. A node whose test clock was ever armed carries
   fabricated dates FOREVER — sealing takes away the steering wheel, not the
   invented history — so this asks TestClockFabricated rather than
   TestClockActive, and a sealed demo chain still says so.

   It sits outside #main on purpose: every route replaces main.innerHTML, and a
   warning that blinks out on navigation is worse than none. Cached per RPC
   endpoint, so it costs one query per node and not one per page.
   Demo mode never shows it — nothing there claims to be a chain. */
/* CACHE THE PROMISE, NOT JUST THE RESULT.
   This used to publish the cache KEY (TCFAB_FOR) and a null value before doing
   the reads, so any second caller arriving while the first was still awaiting
   the chain got the placeholder — null, meaning "no test clock" — and believed
   it. That was unreachable while the banner was the only caller. It became
   reachable the moment an embed asked the same question: render() fires
   paintTestClockBanner() without awaiting it and then runs the route, so the
   route's sourceNote() lands squarely inside the banner's in-flight read.
   Found on a real seeded chain, where the embed card showed no disclosure at all
   while the clip drawn a second later showed it correctly. Demo mode returns
   before touching this, so nothing offline could have caught it. */
let TCFAB = null, TCFAB_FOR = null, TCFAB_P = null;
function testClockState(){
  if(!isLive()) return Promise.resolve(null);
  if(TCFAB_FOR===CFG.rpc && TCFAB_P) return TCFAB_P;
  TCFAB_FOR = CFG.rpc; TCFAB = null;
  return TCFAB_P = tcRead();
}
async function tcRead(){
  try{
    const fab = await one("TestClockFabricated()");
    if(fab!==true) return TCFAB=null;
    let secs = null, blocks = null, live = false;
    try{ secs = await one("TestClockPeakSkew()"); }catch(_){}
    // The override moves HEIGHT as well as the calendar, and a chain advanced
    // only in height would otherwise read "moved forward 0 days" — which says
    // nothing was moved, on a page whose conviction, emission and trailing
    // averages all came from a block count the scenario supplied. An older
    // realm has no such read; absent is not zero, so it stays null.
    try{ blocks = await one("TestHeightPeakSkew()"); }catch(_){}
    try{ live = (await one("TestClockActive()"))===true; }catch(_){}
    const num = v => (typeof v==="number" && isFinite(v))? v : null;
    return TCFAB = {secs: num(secs), blocks: num(blocks), live};
  }catch(e){
    // An older realm has no such function. That is not a warning-worthy state:
    // a node without the entrypoint never had a test clock to arm.
    return TCFAB=null;
  }
}
/* WHERE AN EMBED'S NUMBERS COME FROM, in one short line.
   The full banner is a paragraph. It is the right size for a page and the wrong
   size for a 400x340 card pasted into somebody's article — measured, it ate the
   top third and pushed the card's only exit link below the fold. So an embed
   suppresses the banner (see `html.embed #tcbanner`) and carries THIS instead.
   It also covers a case the banner never did: DEMO mode. Demo is the default
   for any reader who has never opened this page, so an embed's default state is
   invented courts with invented stakes — and the one element that admitted it
   ("Demo data", in the rail) is display:none in an embed. A card that travels
   to other people's websites has to say what it is. Returns null only for the
   one honest case: a live node whose clock was never faked. */
async function sourceNote(){
  if(!isLive()) return "sample data — these courts exist on no chain";
  const st = await testClockState();
  if(st) return "test chain — the dates here were set by hand";
  return null;
}
async function paintTestClockBanner(){
  const el = document.getElementById("tcbanner");
  if(!el) return;
  const st = await testClockState();
  if(!st){ el.hidden = true; el.innerHTML = ""; return; }
  const days = st.secs!=null? Math.round(st.secs/86400) : null;
  const parts = [];
  if(days) parts.push(`${fmtN(days)} day${days===1?"":"s"}`);
  if(st.blocks) parts.push(`${fmtN(st.blocks)} block${st.blocks===1?"":"s"}`);
  const moved = parts.length? ` — moved forward ${parts.join(" and ")}` : "";
  const tail = st.live
    ? "The clock is still open, so they can move again."
    : "The clock is sealed, so they are now fixed.";
  el.innerHTML = `<div class="tcbar"><span class="g">⏱</span><div><b>Test chain — the dates here are fabricated.</b>
    This node's clock was set by hand${moved}. ${tail} Balances and stakes are real.</div></div>`;
  el.hidden = false;
}

async function render(){
  const seq = ++renderSeq;
  paintTestClockBanner();
  const raw = location.hash.replace(/^#/,"") || "/";
  const qx = raw.indexOf("?");
  const hash = qx<0? raw : raw.slice(0,qx);
  QP = {};
  if(qx>=0) for(const kv of raw.slice(qx+1).split("&")){
    const eq=kv.indexOf("="); const k=eq<0?kv:kv.slice(0,eq);
    if(k){ try{ QP[k]=decodeURIComponent(eq<0?"":kv.slice(eq+1)); }catch(_){ QP[k]=""; } } }
  setNav(hash);
  embedMark(hash);
  for(const [re,fn] of routes){
    const m = hash.match(re);
    if(m){ try{ await fn(...m.slice(1)); }catch(e){ errorView(e); }
      if(seq===renderSeq){ paintedSeq=seq; return; }
      // Stale. If the newer render is still in flight it will paint over us —
      // do nothing. Only if it already painted (we clobbered it) redraw once.
      if(paintedSeq>seq) return render();
      return; }
  }
  main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:"No such page"}]) + notFound("No such page.");
  paintedSeq = seq;
}
function setNav(hash){
  const k = hash==="/"||hash.startsWith("/c")||hash.startsWith("/raw")?"dir": hash.startsWith("/me")?"me":
            hash.startsWith("/needs")?"needs": hash.startsWith("/about")?"about":"";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.k===k));
}
const AT_OK = new Set(["resolution"]); // ?at= allowlist — QP is user text, never a selector
const atTarget = () => (QP.at && AT_OK.has(QP.at))? document.getElementById(QP.at) : null;

  await render();

  // a route that already landed focus (e.g. the map's ?focus node) keeps it —
  // an innerHTML swap leaves focus on <body>, so ordinary navigation passes through
  if(document.activeElement && document.activeElement!==document.body && main.contains(document.activeElement)) return;
  const h = main.querySelector(".page-h");

/* ONE path from the route to the picture, used by the preview and by both
   buttons. Built separately they could drift, and the whole point of showing a
   preview is that it is the file you are about to send. */
async function buildClip(){
  const m = location.hash.match(/^#\/c\/([a-z0-9-]+)(?:\/(\d+))?/);
  if(!m) return null;
  const slug = m[1], id = m[2] ? parseInt(m[2], 10) : null;
  const [cs, d, note] = await Promise.all([courtStats(slug).catch(()=>null),
                                           id == null ? Promise.resolve(null) : claimDetail(slug, id),
                                           sourceNote()]);
  const [ser, tl] = (id == null) ? [null, null] : await Promise.all([
    claimStakeSeries(slug, id, d).catch(()=>null), claimTimeline(slug, id, d).catch(()=>null)]);
  const bg = getComputedStyle(document.body).backgroundColor.match(/^rgb\((\d+)/);
  const isDark = bg && parseInt(bg[1], 10) < 128;
  const url = shareIsPublic() ? shareURLBase() + "#/c/" + slug + (id == null ? "" : "/" + id) : null;
  return {cv: drawClip(slug, id, d, cs ? cs.name : slug, isDark ? "dark" : "light", note, url, ser, tl),
          name: "kourt-" + slug + (id == null ? "" : "-" + id) + ".png"};
}
async function paintClipPreview(){

}

/* Share panel: theme switch, copy, and the clip. Delegated like every other
   handler here, because the dialog is re-rendered with each claim. */
/* Copy the way the CLI blocks above already do it. The Clipboard API needs a
   SECURE CONTEXT: served over plain http:// from anything but localhost —
   which "host index.html on any static host" invites — navigator.clipboard is
   undefined outright. The first version of this handler was `if(clipboard)
   … .catch(()=>{})`, so on such a host the block did nothing at all: no copy,
   no message, and a cursor:copy still promising otherwise. Selecting the text
   and saying so is the fallback the rest of this file uses. */
function copyBlock(pre, btn){
  const say = m => { if(btn){ const o = btn.dataset.label || btn.textContent; btn.dataset.label = o;
    btn.textContent = m; setTimeout(()=>{ btn.textContent = btn.dataset.label || "Copy"; }, 2200); } };
  const select = ()=>{
    const r = document.createRange(); r.selectNodeContents(pre);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    say("Selected — press Ctrl/⌘-C");
  };
  const done = ()=>{ pre.classList.add("copied"); setTimeout(()=>pre.classList.remove("copied"), 900);
    say("Copied ✓"); };
  if(!navigator.clipboard){ select(); return; }
  navigator.clipboard.writeText(pre.textContent).then(done).catch(select);
}

document.addEventListener("click", async ev=>{
  // The generic [data-help] handler opens the dialog; this fills the one thing
  // it cannot know how to draw. Not an early return: the other branches below
  // simply will not match this target.
  if(ev.target.closest('[data-help="share-dlg"]')) paintClipPreview();
  const th = ev.target.closest("[data-embtheme]");
  if(th){
    const m = location.hash.match(/^#\/c\/([a-z0-9-]+)(?:\/(\d+))?/);
    if(m){
      const snip = document.getElementById("emb-snip");
      if(snip) snip.textContent = embedSnippet(m[1], m[2] ? parseInt(m[2],10) : null,
                                               {theme: th.getAttribute("data-embtheme") || null});
    }
    // Which of the three built what is on screen. Three identical buttons and a
    // changed snippet left that to be inferred.
    for(const b of document.querySelectorAll("[data-embtheme]"))
      b.setAttribute("aria-pressed", String(b === th));
    return;
  }
  // The keyboard path. A <pre> takes no focus, so click-to-copy alone made the
  // link and the snippet mouse-only — the same defect this project already
  // caught once in the helper-modal triggers.
  const cbtn = ev.target.closest("[data-copyfor]");
  if(cbtn){
    const t = document.getElementById(cbtn.getAttribute("data-copyfor"));
    if(t) copyBlock(t, cbtn);
    return;
  }
  const pre = ev.target.closest("pre[data-copytext]");
  if(pre){
    copyBlock(pre, document.querySelector('[data-copyfor="' + pre.id + '"]'));
    return;
  }
  const clip = ev.target.closest("[data-clip]");
  if(!clip) return;
  const say = document.getElementById("clip-say");
  try{
    const built = await buildClip();
    if(!built){ if(say) say.textContent = "could not build the image"; return; }
    const {cv, name} = built;
    if(clip.getAttribute("data-clip") === "download"){
      const a = document.createElement("a");
      a.download = name; a.href = cv.toDataURL("image/png"); a.click();
      if(say) say.textContent = "saved " + name;
      return;
    }
    // Copying an image needs a Blob and a permission the browser may refuse;
    // say which happened rather than failing silently.
    if(!navigator.clipboard || !window.ClipboardItem){
      if(say) say.textContent = "this browser cannot copy images — use Download"; return;
    }
    cv.toBlob(async blob=>{
      try{
        await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
        if(say) say.textContent = "copied to clipboard";
      }catch(e){ if(say) say.textContent = "the browser refused the clipboard — use Download"; }
    }, "image/png");
  }catch(e){ if(say) say.textContent = "could not build the image"; }
});

/* ---------------- pagination (one pattern site-wide) ----------------
   Newest-first windows of 25, window state in the hash (?p=2). Captions
   state counts plainly; a live list never pretends to rows beyond what was
   actually read, and a failed row says "read failed", never a guess. */
const PAGE_N = 25;
function pageOf(){ const p=parseInt(QP.p||"1",10); return (Number.isFinite(p)&&p>0)? p:1; }
function pagerHtml(base, page, shown, total, label, order, chips){
  if(!(total>0)) return "";                 // an empty ledger has no order to state
  const lab = total===1? String(label||"rows").replace(/s$/,"") : (label||"rows");
  const lo=(page-1)*PAGE_N+1, hi=lo+shown-1;
  // links carry sort and p only — q mutates live, at/focus never belong on a listing
  const link=p=>{ const ps=new URLSearchParams(); if(QP.sort) ps.set("sort",QP.sort); if(p>1) ps.set("p",String(p)); const t=ps.toString(); return "#"+base+(t?"?"+t:""); };
  const cap = shown>0
    ? (page===1 && hi>=total? `all ${fmtN(total)} ${esc(lab)} · ${esc(order||"newest first")}`
                            : `showing ${fmtN(lo)}–${fmtN(hi)} of ${fmtN(total)} ${esc(lab)} · ${esc(order||"newest first")}`)
    : `page ${fmtN(page)} is past the end — ${fmtN(total)} ${esc(lab)} in all`;
  const nav = (total>PAGE_N || page>1)
    ? `${page>1?`<a class="pill void pnav" href="${esc(link(page-1))}">‹ newer</a>`:`<span class="pill void off pnav">‹ newer</span>`}${hi<total?`<a class="pill void pnav" href="${esc(link(page+1))}">older ›</a>`:`<span class="pill void off pnav">older ›</span>`}`
    : "";
  return `<div class="pager"><span class="mono small">${cap}</span>
    <span class="chips">${chips||""}${nav}</span></div>`;
}
function pageSlice(list, page){ return list.slice((page-1)*PAGE_N, page*PAGE_N); }

/* ---- D4 sort chips: a display re-order of the loaded rows, never a re-read.
   Scoped to [data-sortable] only — folder pages, the specimen tour, argument
   dockets and /needs keep their load-bearing order. Keys ride data-* attrs
   stamped at build (demo) or by the spark fill (live); keyless rows sink. ---- */
const SORT_TAILS = {
  dk: { old: "oldest first (this window)",
        yes: "YES-share of stakes, high to low (this window) — stakes, never ballots" },
  dir:{ claims: "most claims filed first — deeper pages exist only in burn order" } };
function applySort(keyRaw){
  const boxes = document.querySelectorAll("[data-sortable]");
  if(!boxes.length) return;
  const kind = boxes[0].getAttribute("data-sortkind");
  const ok = kind==="dk"? {new:1,old:1,yes:1} : {rank:1,claims:1};
  const key = ok[keyRaw]? keyRaw : (kind==="dk"? "new":"rank");
  const dflt = key==="new"||key==="rank";
  const num=(n,a)=>{ const v=n.getAttribute(a); return (v==null||v==="")? null : parseFloat(v); };
  const cmp=(a,b)=>{
    if(kind==="dir"){
      if(key==="claims"){ const x=num(a,"data-claims"), y=num(b,"data-claims");
        if(x!=null||y!=null){ if(x==null) return 1; if(y==null) return -1; if(y!==x) return y-x; } }
      return num(a,"data-rank")-num(b,"data-rank");
    }
    const ia=num(a,"data-id"), ib=num(b,"data-id");
    if(key==="old") return ia-ib;
    if(key==="yes"){ const x=num(a,"data-yes"), y=num(b,"data-yes");
      if(x!=null||y!=null){ if(x==null) return 1; if(y==null) return -1; if(y!==x) return y-x; } }
    return ib-ia;
  };
  // appendChild detaches-and-reinserts, which blurs a focused row — keep it
  const hadFocus = document.activeElement && [...boxes].some(dk=>dk.contains(document.activeElement))? document.activeElement : null;
  boxes.forEach(dk=>{ [...dk.querySelectorAll("a.crow")].sort(cmp).forEach(n=>dk.appendChild(n)); });
  if(hadFocus && document.activeElement!==hadFocus){ try{ hadFocus.focus({preventScroll:true}); }catch(_){} }
  document.querySelectorAll(".schips [data-sort]").forEach(b=>
    b.setAttribute("aria-pressed", String(b.getAttribute("data-sort")===key)));
  // captions were baked with the ledger's order — swap the order tail in place
  document.querySelectorAll(".pager > span.mono.small").forEach(sp=>{
    if(!sp.dataset.cap0) sp.dataset.cap0 = sp.textContent;
    sp.textContent = dflt? sp.dataset.cap0
      : sp.dataset.cap0.replace(/ · [^·]*$/, " · "+((SORT_TAILS[kind]||{})[key]||""));
  });
  // a client-side order has no deeper pages on the directory — hide its nav
  document.querySelectorAll(".pager").forEach(pg=>pg.classList.toggle("hidenav", kind==="dir" && !dflt));
  // pager hrefs were baked at render — keep them carrying the active sort
  document.querySelectorAll(".pager a.pnav").forEach(a=>{
    try{ const [h,qs]=(a.getAttribute("href")||"").split("?"); const ps=new URLSearchParams(qs||"");
      if(dflt) ps.delete("sort"); else ps.set("sort", key);
      const t=ps.toString(); a.setAttribute("href", h+(t?"?"+t:"")); }catch(_){}
  });
  if(QCTX){ if(QCTX.orderTail0===undefined) QCTX.orderTail0=QCTX.orderTail;
    QCTX.orderTail = dflt? QCTX.orderTail0
      : " · "+(kind==="dk"? (key==="old"? "oldest first":"%YES of stakes, high to low") : "most claims filed first"); }
}
document.addEventListener("click", ev=>{
  const b = ev.target.closest(".schips [data-sort]"); if(!b) return;
  const key = b.getAttribute("data-sort");
  const dflt = key==="new"||key==="rank";
  try{ const raw=location.hash.replace(/^#/,"")||"/"; const [path,qs]=raw.split("?");
    const ps=new URLSearchParams(qs||"");
    if(dflt) ps.delete("sort"); else ps.set("sort", key);
    const t=ps.toString().replace(/\+/g,"%20");
    history.replaceState(null,"","#"+path+(t?"?"+t:""));
  }catch(_){}
  if(dflt) delete QP.sort; else QP.sort=key;
  applySort(key);
});

/* ---------------- search + jump (D2) ----------------
   A records office searches the drawer you're standing at: one filter row
   per listing surface, over the rows THIS PAGE loaded — never a pretended
   index. Zero reads. The same box jumps to a claim id on Enter. */
function qPredicate(hay, q){
  q = String(q||"").trim().toLowerCase();
  if(!q) return true;
  return String(hay||"").toLowerCase().includes(q);
}
function parseJump(q, slugCtx){
  q = String(q||"").trim().toLowerCase();
  let m = q.match(/^#?(\d+)$/);
  if(m){ const id=parseInt(m[1],10); if(id>0 && String(id)===m[1]) return {slug:slugCtx||null, id, bare:true}; return null; }
  m = q.match(/^([a-z0-9-]+)[\/ ]+#?(\d+)$/);
  if(m){ const id=parseInt(m[2],10); if(id>0 && String(id)===m[2]) return {slug:m[1], id, bare:false}; }
  return null;
}
function qCaption(state){
  // state: {mode:"idle"|"active"|"zero", demo, kind:"claims"|"court names",
  //         loaded, total, matches, q, orderTail}
  const noun = state.kind||"claim titles";
  const unit = noun==="court names"? "name" : "title";
  if(state.mode==="active") return `${fmtN(state.matches)} of ${fmtN(state.loaded)} loaded ${unit}s match "${state.q}"${state.orderTail||" · newest first"}`;
  if(state.mode==="zero")
    return state.demo? (state.total>state.loaded
        ? `no loaded ${unit} matches "${state.q}" — ${fmtN(state.total-state.loaded)} hidden claim${state.total-state.loaded===1?"":"s"} omitted; their pages still answer by id`
        : `no ${unit} matches "${state.q}" — the sample is complete`)
      : noun==="court names"
      ? `no loaded name matches "${state.q}" — ${fmtN(Math.max(0,state.total-state.loaded))} more courts are not loaded; page older ›`
      : `no loaded title matches "${state.q}" — ${fmtN(Math.max(0,state.total-state.loaded))} older claims were never loaded; browse the docket pages`;
  return state.demo? (state.total>state.loaded
      ? `searches the ${fmtN(state.loaded)} loaded ${noun} of ${fmtN(state.total)} — hidden claims are omitted`
      : `searches all ${fmtN(state.loaded)} ${noun} — the sample is complete`)
    : state.kind==="court names"
    ? `searches the ${fmtN(state.loaded)} loaded court names — ${fmtN(Math.max(0,state.total-state.loaded))} more are not loaded; page older ›`
    : `searches the ${fmtN(state.loaded)} loaded ${noun} of ${fmtN(state.total)} — older claims live on the docket pages`;
}
function qBarHtml(placeholder, cap){
  return `<div class="addrbar qbar"><input id="q" type="search" class="mono" placeholder="${esc(placeholder)}" spellcheck="false" autocomplete="off" aria-label="filter loaded titles or jump to a claim id" aria-describedby="qcap">
    <span id="qcap" class="mono small muted" role="status">${esc(cap)}</span></div>`;
}
let QCTX = null; // {kind, demo, loaded, total, orderTail, slug, totalClaims}
function applyQ(qRaw){
  const box = document.getElementById("qscope"); if(!box || !QCTX) return;
  const q = String(qRaw||"").trim();
  const cap = document.getElementById("qcap");
  const active = q.length>0;
  box.classList.toggle("qactive", active);
  let matches = 0;
  box.querySelectorAll("[data-q]").forEach(row=>{
    const hit = !active || qPredicate(row.getAttribute("data-q"), q);
    row.classList.toggle("qhide", active && !hit);
    if(active && hit) matches++;
  });
  // sections with nothing visible collapse while a query is active
  box.querySelectorAll("section[data-qsec]").forEach(sec=>{
    const any = [...sec.querySelectorAll("[data-q]")].some(r=>!r.classList.contains("qhide") && (active || !r.classList.contains("offp")));
    sec.classList.toggle("qhide", active && !any);
  });
  const empty = document.getElementById("qempty");
  if(empty) empty.classList.toggle("qhide", !(active && matches===0));
  if(cap) cap.textContent = qCaption(active
    ? (matches? {mode:"active", matches, loaded:QCTX.loaded, q, kind:QCTX.kind, orderTail:QCTX.orderTail}
              : {mode:"zero", demo:QCTX.demo, q, kind:QCTX.kind, loaded:QCTX.loaded, total:QCTX.total})
    : {mode:"idle", demo:QCTX.demo, kind:QCTX.kind, loaded:QCTX.loaded, total:QCTX.total});
  // shareable: ?q rides the hash without re-rendering
  try{
    const raw = location.hash.replace(/^#/,"")||"/";
    const [path, qs] = raw.split("?");
    const params = new URLSearchParams(qs||"");
    if(active) params.set("q", q); else params.delete("q");
    const tail = params.toString()? "?"+params.toString().replace(/\+/g,"%20") : "";
    history.replaceState(null, "", "#"+path+tail);
  }catch(_){}
}
let QDEB = 0;
document.addEventListener("input", ev=>{
  if(ev.target && ev.target.id==="q"){
    clearTimeout(QDEB);
    QDEB = setTimeout(()=>applyQ(ev.target.value), 120);
  }
});
document.addEventListener("keydown", ev=>{
  const t = ev.target;
  if(t && t.id==="q"){
    if(ev.key==="Escape"){ t.value=""; applyQ(""); t.blur(); ev.preventDefault(); return; }
    if(ev.key==="Enter"){

      const j = parseJump(t.value, QCTX && QCTX.slug);

/* Folders ARE on-chain (folders.gno) and LIVE courts now read them —
   chainFolders() fetches the flat chain shape and foldersFor() composes one
   labeled source: local curation ?? chain ?? demo sample ?? none. */
function folderCount(f){
  return (f.claims||[]).length + (f.folders||[]).reduce((a,x)=>a+folderCount(x),0);
}
/* Screen-2 layout: folders are a compact CLICKABLE list, the docket is
   sectioned (open / recently settled) with each claim carrying its folder as
   meta — so a long docket never nests. Folders remain overlay-level. */
/* Resolve a /f/<path> to a folder and its ancestry, for both path schemes.

   TWO SCHEMES, because there are two kinds of folder. A chain folder has a
   stable fid and is addressed by it; a curation folder has no id at all, so
   position is the only handle it has and its path is dotted indices. Neither is
   convertible to the other, so the source decides.

   EXTRACTED FROM THE ROUTE so it can be tested. It lived inline in the folder
   view and carried a regression nothing could reach: when chainFolders started
   nesting, this searched only the root array, so every chain SUBFOLDER answered
   "no such folder" while the court page linked to it. A harness that could only
   see chainFolders' output tested the tree and never the lookup.

   Returns {folder, trail} or null. */
function resolveFolderPath(curF, fpath){
  if(!curF || !curF.folders || !curF.folders.length) return null;
  if(curF.source === "chain"){
    // one exact integer: "01" and "1.2" are not aliases of "1"
    if(!/^\d+$/.test(fpath) || String(parseInt(fpath,10)) !== fpath) return null;
    const fid = parseInt(fpath,10);
    const path = [];
    const dig = (list, up) => {
      for(const x of list){
        if(x.fid === fid){ path.push(...up, x); return true; }
        if(x.folders && x.folders.length && dig(x.folders, [...up, x])) return true;
      }
      return false;
    };
    dig(curF.folders, []);
    if(!path.length) return null;
    return {folder: path[path.length-1],
            trail: path.map(a=>({label:a.name, href:"#/c/__SLUG__/f/"+a.fid}))};
  }
  let f = {name:"", folders:curF.folders};
  const trail = [];
  let sofar = "";
  for(const part of String(fpath).split(".")){
    const ix = parseInt(part,10);
    f = (f.folders||[])[ix];
    if(!f) return null;
    sofar = sofar? sofar+"."+part : part;
    trail.push({label:f.name, href:"#/c/__SLUG__/f/"+sofar});
  }
  return {folder:f, trail};
}

function folderMeta(folders, prefix, map, ppath){
  (folders||[]).forEach((f,i)=>{
    const label = prefix? prefix+" · "+f.name : f.name;
    const path = f.path!=null? String(f.path) : (ppath!=null? ppath+"."+i : String(i));
    (f.claims||[]).forEach(id=>{ if(map[id]==null) map[id]={label, path}; }); // first-wins: chain folders may share a claim
    folderMeta(f.folders, label, map, path);
  });
  return map;
}

  const n = folderCount(f), subs = (f.folders||[]).length;

   floor(s/D) µGNOT per unit, cost(s0→s1) = ceil((s1²−s0²)/2D), and Buy takes
   the largest Δ whose cost fits the send, refunding the rest in the same
   transaction. BigInt throughout — s0² overflows doubles. The quote can only
   err stale, never generous: a buy landing first raises s0, so the same send

      + `${r.kind==="e"? ` #${r.sub}` : ` on claim #${r.id}`}</span>`
      + `<span class="r tnum">${cc(r.amt,slug)}</span></div>`).join("");
  return `<div class="ticket" style="margin-top:8px">`
    + `<div class="line"><span class="l">committed by voting</span><span class="r tnum">${cc(com.vote,slug)}`
    + (com.q.length>1? ` <small>the largest of ${com.q.length} open commitments, not their total — one pile of coin honours all of them</small>`:"")
    + `</span></div>`
    + `<div class="line"><span class="l">committed as stake</span><span class="r tnum">${cc(com.stake,slug)}</span></div>`
    + `<div class="line"><span class="l">free to bond, deposit or transfer</span><span class="r tnum">${cc(com.free,slug)} <small>the figure the realm enforces</small></span></div>`
    + rows + `</div>`;
}

/* ---------------- the argument (related claims) ----------------
   Overlay-level curation, labeled sample; the chain stores no relations, so
   live mode renders nothing here. Three relation types (matching the repo's
   own future design in docs/COURTS_STRUCTURE.md §5): part-of (one parent),
   bears-on (supports|contradicts), supersedes (a re-filing after a
   no-decision). Rows carry title + relation chip + status pill ONLY — a
   yes-share next to a stance chip would read as a trading hint (§7.4). */
function argRow(slug, rid, chip, lookup){
  const d = lookup? lookup(rid) : null;
  // an id the current chain page doesn't carry renders bare — never invented
  return `<a class="crow argrow" href="#/c/${esc(slug)}/${rid}">
    <span class="id">#${rid}</span>
    <span><span class="t">${d? safeInline(d.title) : `<span class="muted">claim #${rid} — not in the rendered docket window</span>`}</span></span>
    <span class="rt"><span class="pill ${/contradict/.test(chip)?"contra":"void"}">${esc(chip)}</span>
    ${d? statusPill(d.statusText) : ""}</span></a>`;
}
function argumentSection(slug, id, lookup, chainRows){
  const cur = curationFor(slug);
  const chain = Array.isArray(chainRows)? chainRows : [];
  if((!cur || !cur.relations.length) && !chain.length) return "";
  const rels = cur? cur.relations : [];
  const mine = rels.filter(r=>r.from===id || r.to===id);
  if(!mine.length && !chain.length) return "";
  const dOf = i => lookup? lookup(i) : null;
  const parent = mine.find(r=>r.type==="part" && r.from===id);
  const children = mine.filter(r=>r.type==="part" && r.to===id).map(r=>r.from);
  // THE CHAIN OWNS `bears` NOW. Curation keeps only the two kinds the realm has
  // no concept of — containment, which §5 says may only hang off a section, and
  // supersedes, which is in no spec — so a curation bears-edge is dropped rather
  // than shown beside a chain one saying the same thing differently. Nothing
  // merges silently: a row is either the chain's record or somebody's file.
  const rel = [];
  const seen = new Set();
  chain.forEach(([other, chip]) => { rel.push([other, chip]); seen.add(other + "|" + chip); });
  mine.forEach(r=>{
    if(r.type==="bears" && chain.length) return; // the chain answered this kind
    if(r.type==="bears" && r.to===id) rel.push([r.from, r.stance==="supports"? "supports":"contradicts"]);
    else if(r.type==="bears" && r.from===id) rel.push([r.to, r.stance==="supports"? "supported by this":"contradicted by this"]);
    else if(r.type==="supersedes" && r.to===id) rel.push([r.from, "supersedes"]);
    else if(r.type==="supersedes" && r.from===id) rel.push([r.to, "superseded by this"]);
  });
  const settledN = children.filter(i=>{ const d=dOf(i); return d && phaseClass(d.statusText).short==="settled"; }).length;
  const undecided = children.length - settledN;
  // NOT "The argument". COURTS_STRUCTURE.md §5 names two kinds of edge and says
  // they must not be merged: containment (a tree, at most one parent, no stance)
  // and argument (a graph on top of it, any number, supports/counters). This
  // section renders BOTH, so heading it with the name of one axis labelled half
  // its own contents — and a reader asked what it meant, which is the evidence.
  // THE CAPTION HAD TO CHANGE, because it asserted something that stopped being
  // true: "the chain stores no relations". It stores argument edges now. What it
  // still does not store is containment and supersedes, so the caption names the
  // source that actually applies rather than one blanket disclaimer.
  const srcNote = chain.length
    ? (mine.some(r=>r.type!=="bears")
        ? "argument edges from the chain; containment and supersedes are curation"
        : "the chain's own record")
    : (cur && cur.source==="local"? CUR_LABEL : "sample curation — the chain stores no relations");
  let g = `<section style="margin-top:22px"><div class="sec-h">Where this claim sits <span class="count">${esc(srcNote)}</span></div>`;
  // The parent is CONTAINMENT, the same axis as "Rests on" and pointing the
  // other way, so it belongs beside it rather than under "Related" — that group
  // is the argument graph, and filing a containment edge in it is exactly the
  // merge §5 forbids. It also used to be the only relation in the section
  // rendered as a bare line of prose: no relation chip, and no status pill, so
  // the one thing you most want to know about the whole you are a part of —
  // whether it is already settled — was the one thing not shown.
  // The chip reads as a predicate with the ROW as its subject and the claim you
  // are on as the implied object — "#6 supports [this]", "#3 one part [of this]",
  // "#5 superseded by this". So the parent's is "contains this".
  //
  // It said "the whole", which asserts the row is the top of the tree. Wrong in
  // general: containment is a tree and §5's own worked example runs three levels,
  // so a parent routinely has a parent and is a part as much as a whole. The
  // sample docket has exactly one level — 3, 4 and 7 are parts of 9 and 9 has no
  // parent — so the only parent it can render genuinely IS the top, and the label
  // looked right for the one case the fixture is able to show.
  if(parent){
    g += `<div class="sec-h" style="margin-top:6px">Part of</div>`
      + `<div class="docket">${argRow(slug, parent.to, "contains this", lookup)}</div>`;
  }
  if(children.length){
    g += `<div class="sec-h" style="margin-top:${parent?14:6}px">Rests on <span class="count">${settledN} of ${children.length} part${children.length===1?"":"s"} settled</span></div>`
      + (undecided? `<p class="small muted" style="margin:0 0 8px">${undecided} of ${children.length} parts are still undecided — any verdict here is reached without them.</p>`:"")
      + `<div class="docket">${children.map(i=>argRow(slug,i,"one part",lookup)).join("")}</div>`;
  }
  if(rel.length){
    g += `<div class="sec-h" style="margin-top:${children.length||parent?14:6}px">Related</div>`
      + `<div class="docket">${rel.map(([i,c])=>argRow(slug,i,c,lookup)).join("")}</div>`;
  }
  g += `<p class="small muted" style="margin:10px 0 0">Curation, not mechanics: relations move no stake, no bond, no bar, no verdict — each claim is decided alone. They are here so you need not leave the page you vote on to find the argument.</p></section>`;
  return g;
}
/* ======================= local curation (C2) =========================
   What the chain cannot hold yet — a court description, nested folders,
   relations — lives in a JSON file the curator keeps: exported, edited,
   imported, held in THIS BROWSER's storage and written to no chain. Every
   surface that renders it says so. cleanCuration follows cleanCfg's
   fail-hard philosophy: reject with precise errors, never partial-apply. */
const CURATION_V = 1;
function curKey(slug){ return "cc.cur."+(CFG.mode==="demo"?"demo":(CFG.chainid||"dev"))+"."+slug; }
function cleanCuration(raw, slug, validIds){
  const errs=[], warn=[], out={kourtCuration:CURATION_V, court:slug, chain:(CFG.mode==="demo"?"demo":(CFG.chainid||"dev")), note:"local curation — held in a browser, recorded on no chain", desc:"", folders:[], relations:[]};
  if(typeof raw!=="object"||raw===null||Array.isArray(raw)){ return {errs:["not a JSON object"], warn, cur:null}; }
  if(raw.kourtCuration!==CURATION_V) errs.push("kourtCuration must be "+CURATION_V);
  if(raw.court!==slug) errs.push(`court must be "${slug}" (got ${JSON.stringify(raw.court)})`);
  if(raw.chain!=null && raw.chain!==out.chain) warn.push(`chain "${raw.chain}" ≠ current "${out.chain}" — claim ids are chain-relative`);
  if(raw.desc!=null){
    if(typeof raw.desc!=="string") errs.push("desc must be a string");
    else if(raw.desc.length>240) errs.push("desc over 240 chars");
    else if(/\n/.test(raw.desc)) errs.push("desc must be a single paragraph");
    else out.desc=raw.desc;
  }
  const known=new Set(["kourtCuration","court","chain","note","desc","folders","relations"]);
  const stripped=Object.keys(raw).filter(k=>!known.has(k));
  if(stripped.length) warn.push("unknown keys stripped: "+stripped.join(", "));
  if(raw.folders!=null && !Array.isArray(raw.folders)) errs.push("folders must be an array");
  if(raw.relations!=null && !Array.isArray(raw.relations)) errs.push("relations must be an array");
  const seenClaim=new Set(); let folderN=0;
  function cleanFolder(f, depth, path){
    if(depth>4){ errs.push(path+": folders nested deeper than 4"); return null; }
    if(typeof f!=="object"||f===null){ errs.push(path+": folder must be an object"); return null; }
    if(typeof f.name!=="string"||!f.name.trim()||f.name.length>60){ errs.push(path+": folder name must be 1–60 chars"); return null; }
    if(++folderN>100){ errs.push("more than 100 folders"); return null; }
    const cf={name:f.name.trim(), claims:[], folders:[]};
    for(const id of (Array.isArray(f.claims)?f.claims:[])){
      if(!Number.isInteger(id)||id<1||id>1e12){ errs.push(path+": claim id "+JSON.stringify(id)+" is not a sane positive integer"); continue; }
      if(cf.claims.includes(id)){ errs.push(path+": claim #"+id+" listed twice in this folder"); continue; }
      if(seenClaim.has(id)){ errs.push("claim #"+id+" is in more than one folder"); continue; }
      seenClaim.add(id); cf.claims.push(id);
    }
    (Array.isArray(f.folders)?f.folders:[]).forEach((sub,i)=>{
      const c=cleanFolder(sub, depth+1, path+"."+i); if(c) cf.folders.push(c);
    });
    return cf;
  }
  (Array.isArray(raw.folders)?raw.folders:[]).forEach((f,i)=>{
    const c=cleanFolder(f,1,"folders["+i+"]"); if(c) out.folders.push(c);
  });
  const seenRel=new Set(); const parentOf={};
  (Array.isArray(raw.relations)?raw.relations:[]).forEach((r,i)=>{
    const pfx="relations["+i+"]";
    if(typeof r!=="object"||r===null){ errs.push(pfx+": not an object"); return; }
    if(!Number.isInteger(r.from)||!Number.isInteger(r.to)||r.from<1||r.to<1||r.from>1e12||r.to>1e12){ errs.push(pfx+": from/to must be sane positive integers"); return; }
    if(r.from===r.to){ errs.push(pfx+": from equals to"); return; }
    if(!["part","bears","supersedes"].includes(r.type)){ errs.push(pfx+": type must be part|bears|supersedes"); return; }
    if(r.type==="bears" && !["supports","contradicts"].includes(r.stance)){ errs.push(pfx+": bears needs stance supports|contradicts"); return; }
    if(r.type!=="bears" && r.stance!=null){ errs.push(pfx+": stance only belongs on bears"); return; }
    const key=r.type+":"+r.from+":"+r.to+":"+(r.stance||"");
    if(seenRel.has(key)){ errs.push(pfx+": duplicate relation"); return; }
    seenRel.add(key);
    if(r.type==="part"){
      if(parentOf[r.from]!=null){ errs.push(pfx+": claim #"+r.from+" already has a part-parent"); return; }
      parentOf[r.from]=r.to;
    }
    if(out.relations.length>=300){ errs.push("more than 300 relations"); return; }
    out.relations.push(r.type==="bears"? {from:r.from,to:r.to,type:"bears",stance:r.stance} : {from:r.from,to:r.to,type:r.type});
  });
  // part cycles
  const inCycle=new Set();
  for(const start of Object.keys(parentOf).map(Number)){
    let cur=start; const seen=new Set();
    while(parentOf[cur]!=null){
      if(seen.has(cur)){ if(!inCycle.has(cur)) errs.push("part-of cycle through #"+cur); seen.forEach(n=>inCycle.add(n)); break; }
      seen.add(cur); cur=parentOf[cur];
    }
  }
  if(validIds){
    const bad=[];
    out.folders.forEach(function chk(f){ f.claims=f.claims.filter(id=>{ const okId=validIds.has(id); if(!okId) bad.push(id); return true; }); (f.folders||[]).forEach(chk); });
    out.relations.forEach(r=>{ if(!validIds.has(r.from)) bad.push(r.from); if(!validIds.has(r.to)) bad.push(r.to); });
    const uniq=[...new Set(bad)];
    if(uniq.length) warn.push(uniq.length+" claim id"+(uniq.length>1?"s are":" is")+" not on this chain — held, not rendered until the docket reaches them");
  }
  if(JSON.stringify(out).length>65536) errs.push("curation over 64KB");
  return {errs, warn, cur: errs.length? null : out};
}
/* precedence: local (this browser) ?? demo sample ?? none */
/* THE CHAIN'S OWN ARGUMENT EDGES. ClaimArguments answers
   "out:<to>:<s|c>,...;in:<from>:<s|c>,..." — bounded by the realm's own caps, so
   this parse can never be handed more rows than a page can draw.

   Only the ARGUMENT edge lives on chain, which is not a shortcoming to route
   around: COURTS_STRUCTURE.md §5's containment guard is "only sections may be
   containment parents", so claim→claim part-of is the shape the spec forbids,
   and `supersedes` is in no spec at all. Those two stay curation and are labelled
   as curation, which is why this returns only the bears rows and the caller
   merges rather than replaces. */
async function chainArguments(slug, id){
  if(!isLive()) return null;
  const raw = await one(`ClaimArguments(${gstr(slug)},${id})`).then(unesc).catch(()=>null);
  if(typeof raw !== "string" || raw.indexOf("out:") !== 0) return null;
  const half = raw.split(";in:");
  const rows = [];
  const eat = (blob, inbound) => {
    for(const part of String(blob||"").split(",")){
      const bits = part.split(":");
      if(bits.length !== 2) continue;
      const other = parseInt(bits[0], 10);
      if(!Number.isInteger(other) || other < 1) continue;
      const contests = bits[1] === "c";
      rows.push([other, inbound
        ? (contests ? "contradicts" : "supports")
        : (contests ? "contradicted by this" : "supported by this")]);
    }
  };
  eat(half[0].slice(4), false);
  eat(half[1], true);
  return rows;
}

function curationFor(slug){
  const rawS = store.get(curKey(slug));
  if(rawS){
    try{
      const {cur} = cleanCuration(JSON.parse(rawS), slug, null);
      if(cur) return {desc:cur.desc, folders:cur.folders, relations:cur.relations, source:"local"};
    }catch(_){}
  }
  if(CFG.mode==="demo"){
    const c=demoCourt(slug);
    if(c) return {desc:c.desc||"", folders:c.folders||[], relations:(DEMO.relations&&DEMO.relations[slug])||[], source:"sample"};
  }
  return null;
}
const CUR_LABEL = "your local curation — held in this browser, not on any chain";
/* ids the current chain/dataset cannot hold are held out of every rendered
   folder (counts included) — the import warned about them already */
function curFilterFolders(folders, validSet){
  return (folders||[]).map(f=>({name:f.name,
    claims:(f.claims||[]).filter(id=>validSet.has(id)),
    folders:curFilterFolders(f.folders, validSet)}));
}
function curValidSet(slug, count){
  if(!isLive()){ const c=demoCourt(slug); return new Set(c? c.claims:[]); }
  const n=count||0, set=new Set(); for(let i=1;i<=n;i++) set.add(i); return set;
}

/* ---------------- live on-chain folders (D1) ----------------
   The realm stores folders (moderator curation, zero economic weight) and
   exposes FolderCount/FolderName/FolderItems. Live courts read them here —
   the flat chain shape enters the SAME folders array every surface already
   renders. Folder ids are contiguous 1..Count (the realm has no delete op —
   load-bearing, documented in the realm wishlist). FolderName returns a
   "[purged:CODE]" tombstone for purged folders: rendered escaped verbatim,
   never styled from the prefix (user text could spoof it). No desc read
   exists (stored but unreadable — wishlisted). */
const CHAIN_FOLDER_CAP = 100;
async function chainFolders(slug){
  const s2=gstr(slug);
  const n = await one(`FolderCount(${s2})`).catch(()=>null);
  if(n==null) return null;                 // the read itself failed
  if(n<1) return {folders:[], count:0, capped:false};
  const F = Math.min(n, CHAIN_FOLDER_CAP);
  // THE SHAPE IN ONE READ. FolderTree answers "id:parent:flags" per folder, so
  // the parent, the retired bit and the purged bit cost one round trip for the
  // whole court instead of three per folder — 300 at the cap. Names and items
  // still come per folder, because those are user text and only the folders
  // actually drawn need them.
  //
  // Falls back to a flat list when the read is absent: a realm deployed before
  // FolderTree existed answers nothing, and a flat tree is what the overlay drew
  // for that realm anyway. The feature degrades to the old behaviour rather than
  // to an error.
  const treeRaw = await one(`FolderTree(${s2})`).then(unesc).catch(()=>null);
  const shape = new Map();
  if(typeof treeRaw === "string" && treeRaw){
    for(const row of treeRaw.split(",")){
      const bits = row.split(":");
      if(bits.length !== 3) continue;
      const id = parseInt(bits[0],10), parent = parseInt(bits[1],10);
      if(!Number.isInteger(id) || !Number.isInteger(parent)) continue;
      shape.set(id, {parent, retired: bits[2].includes("r"), purged: bits[2].includes("p")});
    }
  }
  const fids=[]; for(let i=1;i<=F;i++){
    const sh = shape.get(i);
    // A RETIRED FOLDER IS SKIPPED, NOT DRAWN GREY. The realm keeps the row so
    // ids stay contiguous for exactly this walk; it is struck from the tree, so
    // the tree does not show it.
    if(sh && sh.retired) continue;
    fids.push(i);
  }
  const folders = await inChunks(fids, 6, async fid=>{
    try{
      const [name, itemsRaw] = await Promise.all([
        one(`FolderName(${s2},${fid})`),
        tup(`FolderItems(${s2},${fid})`).then(t=>t[0])]);
      // ids: prefer per-element "(N uint64)" tokens (their 64s must not leak);
      // fall back to bare digits with any type token stripped first
      const rawS = String(itemsRaw);
      const el = [...rawS.matchAll(/\((\d+)\s+uint64\)/g)].map(m2=>Number(m2[1]));
      const ids = el.length? el : ((rawS.replace(/\[\]uint64|uint64/g,"").match(/\d+/g)||[]).map(Number));
      const sh = shape.get(fid);
      return {name:String(name), claims:ids, folders:[], fid,
              parent: sh? sh.parent : 0, path:String(fid), chain:true};
    }catch(_){ return {name:"read failed — reload to retry", claims:[], folders:[], fid, path:String(fid), chain:true, failed:true}; }
  });
  return {folders: nestChainFolders(folders), count:n, capped:n>CHAIN_FOLDER_CAP};
}

/* Hang each folder under its parent. The realm caps depth at 4 and refuses
   cycles, but this walk does not trust that — a client that hangs on malformed
   state is a client that a bad read can wedge, and the cost of not trusting it
   is one Set. A folder whose parent was skipped (retired) or never read (past
   CHAIN_FOLDER_CAP) stays at the root rather than disappearing. */
function nestChainFolders(flat){
  const byId = new Map(flat.map(f=>[f.fid, f]));
  const roots = [];
  for(const f of flat){
    const p = f.parent && byId.get(f.parent);
    if(!p || p === f){ roots.push(f); continue; }
    // refuse to descend into a loop: walk up, and root the folder if we meet it
    let up = p, hops = 0, loop = false;
    while(up && hops++ < 8){ if(up === f){ loop = true; break; } up = byId.get(up.parent); }
    if(loop){ roots.push(f); continue; }
    p.folders.push(f);
  }
  return roots;
}
/* one source, labeled: local curation ?? chain (live) ?? sample (demo) ?? none.
   Never merged — local enforces one-folder-per-claim and nesting, the chain
   allows multi-membership and is flat; a merged tree has no honest caption. */
function foldersFor(slug, chainF){
  const cur = curationFor(slug);
  if(cur && cur.source==="local") return cur;
  if(isLive() && chainF && chainF.folders.length)
    return {desc:"", folders:chainF.folders, relations:[], source:"chain", capped:chainF.capped, count:chainF.count};
  return cur; // demo sample, or null
}

/* ============================ the map ================================
   A dedicated, interactive view of the court's structure. Folder containment
   takes POSITION (disjoint boxes — a partition drawn as one); part-of keeps
   PRIMACY as the heaviest edge and orders claims within a folder; bears/
   supersedes are lighter cross-links. The layout is deterministic (pure
   cumulative sums — same input, same bytes) and overlap-free BY CONSTRUCTION;
   map_test.js re-verifies the generated SVG geometrically (nodes, labels,
   edge crossings) on every change. No stake sizing, no amounts anywhere:
   a node is an id, a phase, and the verbatim sentence (§7.4). */
const MAPK = {
  node: { titles:{w:240,h:64}, ids:{w:64,h:28} },
  vgap:12, hgap:12, cgap:16, padMin:16, headerH:28, fgap:56,

  fs:{header:13, id:12, title:11}, charW:0.62, maxTitleLines:2, colRows:8,

  }

    lines[lines.length-1] = lines[lines.length-1].slice(0, Math.max(1,budget-1))+"…";
  return lines;
}
function mapLayout(data, mode){

  const inFolder = new Set();
  (function walk(fs){ for(const f of fs||[]){ (f.claims||[]).forEach(c=>inFolder.add(c)); walk(f.folders); } })(data.folders);
  const loose = data.all.filter(id=>!inFolder.has(id));
  const tops = (data.folders||[]).concat(loose.length? [{name:data.looseName||"(no folder)", claims:loose, folders:[], pseudo:true}]:[]);
  const orderClaims = cs => [...cs].sort((a,b)=>{
    const ka = parentOf[a]!==undefined? [0,parentOf[a],a]:[1,0,a];
    const kb = parentOf[b]!==undefined? [0,parentOf[b],b]:[1,0,b];

  const topIdxOf = {};
  tops.forEach((f,i)=>(function mark(g){ (g.claims||[]).forEach(c=>topIdxOf[c]=i); (g.folders||[]).forEach(mark); })(f));
  const laneCount = {}; const laneKey=(col,side)=>col+":"+side;
  for(const r of (data.relations||[])){
    const a=topIdxOf[r.from], b=topIdxOf[r.to];
    if(a===b) laneCount[laneKey(a,"right")]=(laneCount[laneKey(a,"right")]||0)+1;
    else if(a<b){ laneCount[laneKey(a,"right")]=(laneCount[laneKey(a,"right")]||0)+1; laneCount[laneKey(b,"left")]=(laneCount[laneKey(b,"left")]||0)+1; }

    const rows = nc? Math.min(nc, K.colRows) : 0;
    const hClaims = rows? rows*N.h+(rows-1)*K.vgap : 0;
    const wClaims = nc? cols*N.w+(cols-1)*K.hgap : 0;

    const wIn=Math.max(wClaims, N.w, ...kids.map(k=>k.w), 0);

    const ordered = orderClaims(m.f.claims||[]);

    });
    let cy = y+K.headerH+pad+m.hClaims+(ordered.length? K.cgap:0);

function mapDotClass(short){

  // second non-hue channel (solid / washed / hollow / dashed)
  if(short==="settled") return "g";
  if(short==="in dispute") return "e";
  if(short==="settling") return "ed";
  if(short==="answered") return "o";
  if(short==="no decision") return "vd";
  if(short==="never answered") return "vf";
  return "v"; // open
}
function mapSvg(L, data, slug){
  const K=MAPK, [vx,vy,vw,vh]=L.viewBox, out=[];
  const est=(t,fs)=>Math.round(t.length*fs*K.charW*10)/10;
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" class="mapsvg" viewBox="${vx} ${vy} ${vw} ${vh}" tabindex="0" role="img" aria-label="Map of ${esc(slug)} — folders and claims; every node is a link.">`);
  L.folders.forEach((f,i)=>{
    out.push(`<rect class="mfold${f.pseudo?" pseudo":""}" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" data-fid="${i}"/>`);
    const hdr=`<rect class="mhdr" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.headerH}" data-fid="${i}"/>`;
    const budget=Math.floor((f.w-2*K.tpad)/(K.fs.header*K.charW));
    const label=`${f.name} · ${f.count}`;
    const nm=label.length>budget? label.slice(0,Math.max(1,budget-1))+"…" : label;
    const txt=`<text class="mtext mhdr-t" x="${f.x+K.tpad}" y="${f.y+19}" font-size="${K.fs.header}" textLength="${Math.min(est(nm,K.fs.header), f.w-2*K.tpad)}" lengthAdjust="spacingAndGlyphs" data-owner="h${i}">${esc(nm)}</text>`;
    if(!f.pseudo && f.path!=null && data.linkFolders) out.push(`<a href="#/c/${esc(slug)}/f/${f.path}">${hdr}${txt}</a>`);
    else out.push(hdr+txt);
  });
  L.edges.forEach((e,i)=>{
    const cls = e.type==="part"? "part" : e.type==="supersedes"? "sup" : "bears "+(e.stance==="supports"?"yes":"no");
    out.push(`<polyline class="medge ${cls}" points="${e.pts.map(q=>q.join(",")).join(" ")}" data-e="${i}" data-from="${e.from}" data-to="${e.to}"/>`);
    if(e.type==="part"){
      const n=e.pts.length, [ex,ey]=e.pts[n-1], [px,py]=e.pts[n-2];
      const dx=Math.sign(ex-px), dy=Math.sign(ey-py);
      const a = dx!==0
        ? `${ex},${ey} ${ex-6*dx},${ey-3.5} ${ex-6*dx},${ey+3.5}`
        : `${ex},${ey} ${ex-3.5},${ey-6*dy} ${ex+3.5},${ey-6*dy}`;
      out.push(`<polygon class="marrow" points="${a}" data-e="${i}"/>`);
    }
  });
  for(const n of L.nodes){
    const c=data.claims[n.id]; if(!c) continue;
    const pc=phaseClass(c.statusText);
    out.push(`<a href="#/c/${esc(slug)}/${n.id}" class="mnode-a" data-id="${n.id}">`);
    out.push(`<rect class="mnode" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" data-id="${n.id}" rx="3"/>`);
    out.push(`<circle class="mdot ${mapDotClass(pc.short)}" cx="${n.x+n.w-12}" cy="${n.y+14}" r="4" data-owner="c${n.id}"/>`);
    const l1=`#${n.id} · ${pc.short}`;
    const innerW=n.w-2*K.tpad-14;
    out.push(`<text class="mtext" x="${n.x+K.tpad}" y="${n.y+16}" font-size="${K.fs.id}" textLength="${Math.min(est(l1,K.fs.id), innerW)}" lengthAdjust="spacingAndGlyphs" data-owner="c${n.id}">${esc(l1)}</text>`);
    if(L.mode==="titles"){
      mapWrapTitle(c.title, n.w-2*K.tpad).forEach((ln,i)=>
        out.push(`<text class="mtext mtitle" x="${n.x+K.tpad}" y="${n.y+34+i*14}" font-size="${K.fs.title}" textLength="${Math.min(est(ln,K.fs.title), n.w-2*K.tpad)}" lengthAdjust="spacingAndGlyphs" data-owner="c${n.id}">${esc(ln)}</text>`));
    }
    out.push(`<title>#${n.id} · ${esc(pc.short)} — ${esc(c.title)}</title></a>`);
  }
  out.push(`</svg>`);
  return out.join("\n");
}

        <div class="kv"><div class="k">supply</div><div class="v tnum">${cc(s.supply,slug)}</div></div>
        <p class="small muted" style="margin:8px 0 0">No quote — the node did not answer the curve read; the chain computes the true amount when you buy.</p>

        <div class="actions" style="margin-top:10px" id="buyactions">${buyActionsHtml(slug,null)}</div>`;
  }else{
    BUYCTX = {slug, minted, supply:s.supply, price:s.price};

            <span class="r tnum"><input id="buyamt" type="text" inputmode="decimal" value="100" autocomplete="off" aria-describedby="buynote"> GNOT
              <small id="buyugnot">= ${fmtN(1e8)} µGNOT</small></span></div>
          <div id="buyrows" aria-live="polite">${buyRowsHtml(q, s.price, slug)}</div>
        </div>
        <p id="buynote" class="small muted" style="margin:8px 0 0">${isLive()
          ? "Quoted from the chain just now — if someone buys first you'll receive fewer units than shown, never more; the transaction's own result is final."
          : "Sample data — computed from the demo court, no chain involved."}</p>
        <label class="ack small"><input type="checkbox" id="buyack"> I understand ${sym} cannot be sold back to the court.</label>
        <div class="actions" style="margin-top:10px" id="buyactions">${buyActionsHtml(slug,q)}</div>`;
  }
  return `<div class="panel"><h4>Join this court</h4>
        <p class="small" style="margin:0 0 10px"><b>Buying ${sym} is permanent</b> — the GNOT is burned: spent, held by no one. There is no sell-back, now or ever.</p>

       </div>`;
}
function recomputeBuy(){

/* Map interactions: viewBox pan/zoom (one coordinate system), explicit text
   toggle (relayout, center preserved), CSS-only label LOD, hover/focus
   highlighting. Listeners live on the container, surviving innerHTML swaps. */
function mountMap(slug, data, focusId){
  const box = document.getElementById("mapbox"); if(!box) return;
  let mode="titles", L=mapLayout(data,mode);
  let fit={w:L.viewBox[2], h:L.viewBox[3]};
  let z=1, cx=fit.w/2, cy=fit.h/2, raf=0;
  const svgEl=()=>box.querySelector("svg");
  let far=false;
  function lod(){
    const el=svgEl(); if(!el) return;
    const px = MAPK.fs.title * el.clientWidth/(fit.w/z);
    // hysteresis: enter below 7px, leave above 8.5px — no flicker at the line
    if(far && px>8.5) far=false; else if(!far && px<7) far=true;
    el.classList.toggle("far", far);
  }
  function apply(){
    const el=svgEl(); if(!el) return;
    const w=fit.w/z, h=fit.h/z;
    el.setAttribute("viewBox", `${cx-w/2} ${cy-h/2} ${w} ${h}`);
    const sl=document.getElementById("mz-slider"); if(sl) sl.value=Math.log2(z);
    lod();
  }
  const schedule=()=>{ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; apply(); }); };
  function put(){ box.innerHTML = mapSvg(L, data, slug);
    if(focusId!=null){ const a=box.querySelector(`.mnode-a[data-id="${focusId}"]`); if(a) a.classList.add("focused"); }
    apply(); }
  function setZ(nz, anchor){
    const el=svgEl(); if(!el) return;
    nz=Math.min(8, Math.max(0.5, nz));
    if(anchor){
      cx = anchor.x + (cx-anchor.x)*z/nz;
      cy = anchor.y + (cy-anchor.y)*z/nz;
    }
    z=nz; schedule();
  }
  const toWorld=ev=>{
    const el=svgEl(); if(!el) return null;
    try{ const m=el.getScreenCTM(); if(!m) return null;
      return new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse()); }catch(_){ return null; }
  };
  box.addEventListener("wheel", ev=>{
    ev.preventDefault();
    setZ(z*Math.pow(1.0015, -ev.deltaY), toWorld(ev));
  }, {passive:false});
  let drag=null;
  box.addEventListener("pointerdown", ev=>{
    const el=svgEl(); if(!el) return;
    let inv=null; try{ const m=el.getScreenCTM(); inv=m&&m.inverse(); }catch(_){}
    if(!inv) return;
    // NO capture yet: capturing on pointerdown retargets the compat click to
    // the box and node links never fire (verified in Chromium). Capture is
    // taken only once movement crosses a drag threshold.
    drag={x:ev.clientX, y:ev.clientY, cx0:cx, cy0:cy, inv, live:false, pid:ev.pointerId};
  });
  box.addEventListener("pointermove", ev=>{
    if(!drag) return;
    if(!(ev.buttons&1)){ drag=null; return; } // the press ended outside the box
    if(!drag.live){
      if(Math.abs(ev.clientX-drag.x)+Math.abs(ev.clientY-drag.y) < 4) return;
      drag.live=true;
      try{ box.setPointerCapture(drag.pid); }catch(_){}
    }
    const a=new DOMPoint(drag.x,drag.y).matrixTransform(drag.inv);
    const b=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(drag.inv);
    cx=drag.cx0-(b.x-a.x); cy=drag.cy0-(b.y-a.y); schedule();
  });
  box.addEventListener("pointerup", ()=>{ drag=null; });
  box.addEventListener("pointercancel", ()=>{ drag=null; });
  // hover/focus: highlight the node's own edges + neighbors, dim the rest
  const neighborsOf=id=>{
    const set=new Set([id]);
    (data.relations||[]).forEach(r=>{ if(r.from===id) set.add(r.to); if(r.to===id) set.add(r.from); });
    return set;
  };
  function dim(id){
    const keep=neighborsOf(id);
    box.querySelectorAll(".mnode-a").forEach(a=>a.classList.toggle("dim", !keep.has(parseInt(a.dataset.id,10))));
    box.querySelectorAll(".medge,.marrow").forEach(e=>{
      const p=box.querySelector(`.medge[data-e="${e.dataset.e}"]`);
      const from=parseInt(p.dataset.from,10), to=parseInt(p.dataset.to,10);
      e.classList.toggle("dim", !(from===id||to===id));
    });
  }
  function undim(){ box.querySelectorAll(".dim").forEach(e=>e.classList.remove("dim")); }
  box.addEventListener("mouseover", ev=>{ const a=ev.target.closest(".mnode-a"); if(a) dim(parseInt(a.dataset.id,10)); });
  box.addEventListener("mouseout", ev=>{ if(ev.target.closest(".mnode-a")) undim(); });
  box.addEventListener("focusin", ev=>{ const a=ev.target.closest(".mnode-a"); if(a) dim(parseInt(a.dataset.id,10)); });
  box.addEventListener("focusout", ()=>undim());
  box.addEventListener("keydown", ev=>{
    const w=fit.w/z, h=fit.h/z;
    if(ev.key==="ArrowLeft"){ cx-=w*0.1; schedule(); ev.preventDefault(); }
    else if(ev.key==="ArrowRight"){ cx+=w*0.1; schedule(); ev.preventDefault(); }
    else if(ev.key==="ArrowUp"){ cy-=h*0.1; schedule(); ev.preventDefault(); }
    else if(ev.key==="ArrowDown"){ cy+=h*0.1; schedule(); ev.preventDefault(); }
    else if(ev.key==="+"||ev.key==="="){ setZ(z*1.25); ev.preventDefault(); }
    else if(ev.key==="-"){ setZ(z/1.25); ev.preventDefault(); }
    else if(ev.key==="0"){ z=1; cx=fit.w/2; cy=fit.h/2; schedule(); ev.preventDefault(); }
  });
  const bind=(id,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener("click",fn); };
  bind("mz-in", ()=>setZ(z*1.25));
  bind("mz-out", ()=>setZ(z/1.25));
  bind("mz-fit", ()=>{ z=1; cx=fit.w/2; cy=fit.h/2; schedule(); });
  const slider=document.getElementById("mz-slider");
  if(slider) slider.addEventListener("input", ()=>setZ(Math.pow(2, parseFloat(slider.value))));
  function setMode(m){
    if(m===mode) return;
    const rx=cx/fit.w, ry=cy/fit.h;
    mode=m; L=mapLayout(data,mode); fit={w:L.viewBox[2], h:L.viewBox[3]};
    cx=rx*fit.w; cy=ry*fit.h;
    document.getElementById("mt-titles").setAttribute("aria-pressed", String(m==="titles"));
    document.getElementById("mt-ids").setAttribute("aria-pressed", String(m==="ids"));
    put();
  }
  bind("mt-titles", ()=>setMode("titles"));
  bind("mt-ids", ()=>setMode("ids"));
  put();
  if(focusId!=null){ const n = L.nodes.find(x=>x.id===focusId);
    if(n){ cx=n.x+n.w/2; cy=n.y+n.h/2;
      // land zoomed so titles clear the LOD line (enter<7px, leave>8.5px)
      const el=svgEl();
      z=Math.min(8, Math.max(1, 9*fit.w/(MAPK.fs.title*((el&&el.clientWidth)||960))));
      apply();
      const a=box.querySelector(`.mnode-a[data-id="${focusId}"]`); if(a) a.focus({preventScroll:true});
    } }
}

/* Folder page — chain folders live at their stable fid; local/demo trees use dot-paths. */
on(/^\/c\/([a-z0-9-]+)\/f\/([0-9.]+)$/, async (slug,fpath)=>{
  loading();
  const chainF = isLive()? await chainFolders(slug).catch(()=>null) : null;
  const curF0 = foldersFor(slug, chainF);
  let curF = curF0;
  if(curF0 && curF0.source!=="chain"){
    if(isLive()){
      const n = await one(`ClaimCount(${gstr(slug)})`).catch(()=>null);
      if(n!=null) curF = Object.assign({}, curF0, {folders: curFilterFolders(curF0.folders, curValidSet(slug, n))});
    } else {
      curF = Object.assign({}, curF0, {folders: curFilterFolders(curF0.folders, curValidSet(slug, 0))});
    }
  }
  if(!curF || !curF.folders.length){
    main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:slug,href:"#/c/"+slug}])
      + notFound(isLive()? "This court's moderators have filed no folders, and no local curation is present — the docket is the whole record." : "No folders in this court.");
    return;
  }
  const hit = resolveFolderPath(curF, fpath);
  if(!hit){
    main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:slug,href:"#/c/"+slug}])
      + notFound(curF.source==="chain"? "No such folder on this court." : "No such folder.");
    return;
  }
  const f = hit.folder;
  const trail = hit.trail.map(t=>({label:t.label, href:t.href.replace("__SLUG__", esc(slug))}));
  delete trail[trail.length-1].href;
  const claims = await listClaims(slug);
  const byId = Object.fromEntries(claims.map(cl=>[cl.id,cl]));
  // A CHAIN SUBFOLDER LINKS BY ITS OWN ID. The index path is a curation idea:
  // curation folders have no ids, so position is all there is. A chain folder
  // has a stable fid, and an index path would ALSO be unstable — retiring one
  // folder shifts every later sibling's index, silently repointing bookmarks at
  // a different folder.
  const subs = (f.folders||[]).map((sf,i)=>
    folderRowHtml(slug, sf, sf.chain? String(sf.fid) : fpath+"."+i)).join("");
  // page over the folder's ids in CURATED order first (the realm orders its
  // items; a re-sort would betray the "curated order" caption), then resolve
  // only THIS PAGE's out-of-window ids — bounded at 25×3 reads per page
  const fpage = pageOf();
  const idWin = pageSlice(f.claims||[], fpage);
  let omitted = 0;
  const resolved = [];
  for(const id of idWin){
    if(byId[id]){ resolved.push(byId[id]); continue; }
    if(curF.source!=="chain"){ omitted++; continue; }
    resolved.push({id, pending:true});
  }
  if(curF.source==="chain"){
    const s2=gstr(slug);
    await inChunks(resolved.filter(m=>m.pending), 6, async m=>{
      try{
        const hidden = await one(`HiddenFromListing(${s2},${m.id})`).catch(()=>true); // fail closed
        if(hidden){ m.drop=true; return; }
        const [t,st] = await Promise.all([one(`ClaimTitle(${s2},${m.id})`).then(unesc), one(`ClaimStatus(${s2},${m.id})`)]);
        m.title=t; m.statusText=st; delete m.pending;
      }catch(_){ m.drop=true; }
    });
  }
  // THE FOLDER'S OWN DESCRIPTION, one read on the one page that shows it. Not
  // fetched for the folder LIST: that would be a read per row for text the list
  // does not draw, which is the cost FolderTree exists to avoid — the same rule,
  // applied to the same data, in the other direction.
  //

/* Three ratio series (§3.9): instantaneous stake, trailing week, and the
   lifetime conviction ratio — the one a manipulator can only move by paying
   real capital-time. */
/* The claim page's hero — one component, two honest data shapes (B1 spec):
   DEMO draws a dense synthesized shape, deterministic and anchored to the
   claim's three real ratios, labeled as sample data. LIVE never invents
   history: a dashed lifetime reference, a trailing-week band, a "now" dot,
   and real event heights. One accent hue owns the series; events are ink
   and words (CVD-safe). */
function fnv1a(str){ let h=0x811c9dc5>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }

function ratios(d){
  const inst=pctYes(d.yesStake,d.noStake);
  const life=pctYes(d.convYes,d.convNo);
  const week=(d.trailYes!=null)? d.trailYes
    : (d.trailYesMature&&d.trailOImature&&d.trailOI>0? Math.round(1000*d.trailYesAvg/d.trailOI)/10 : null);
  return {inst,life,week};
}
function demoSeries(slug,id,r){
  if(![r.inst,r.life,r.week].every(Number.isFinite)) return null;
  const rnd=mulberry32(fnv1a(slug+"/"+id));
  const N=49, span=WEEK+Math.floor(rnd()*WEEK), x0=NOW-span;
  const fW=(span-WEEK/2)/span;
  const base=f=> f<=fW? r.life+(r.week-r.life)*(f/fW) : r.week+(r.inst-r.week)*((f-fW)/(1-fW));
  const amp=Math.max(1.5,.35*Math.max(Math.abs(r.week-r.life),Math.abs(r.inst-r.week)));
  const pts=[];
  for(let i=0;i<N;i++){
    const f=i/(N-1);
    const env=Math.min(f,Math.abs(f-fW),1-f);
    pts.push([f,Math.max(0,Math.min(100,base(f)+(rnd()*2-1)*amp*Math.min(1,env*6)))]);
  }
  pts[0][1]=r.life; pts[N-1][1]=r.inst;
  let bi=1,bd=2; pts.forEach((pt,i)=>{const dd=Math.abs(pt[0]-fW); if(dd<bd){bd=dd;bi=i;}});
  pts[bi]=[fW,r.week];
  return {pts,x0,span};
}
/* The real record (stakeseries.gno): "grain,width,now,more;epoch:yes:no,…".
   Rows are CHANGE points — a missing epoch means the pools held — so the only
   honest line is step-after. One parser serves live and the demo sample. */
function parseStakeSeries(raw){
  if(typeof raw!=="string") return null;
  const semi=raw.indexOf(";"); if(semi<0) return null;
  const h=raw.slice(0,semi).split(",");
  if(h.length!==4) return null;
  const grain=h[0], width=parseInt(h[1],10), nowE=parseInt(h[2],10), more=h[3];
  if((grain!=="hourly"&&grain!=="daily") || !(width>0) || !(nowE>0) || (more!=="0"&&more!=="1")) return null;
  const body=raw.slice(semi+1), rows=[];
  if(body.length){
    for(const rr of body.split(",")){
      const m=rr.match(/^(\d+):(\d+):(\d+)$/); if(!m) return null; // one bad row distrusts the whole read
      rows.push([parseInt(m[1],10), +m[2], +m[3]]);
    }
  }
  rows.sort((a,b)=>a[0]-b[0]);
  return {grain,width,nowE,more:more==="1",rows};
}
/* Daily tail below the hourly window, hourly week on top: one ascending list
   of [height, share|null, yes, no]. A row plots at its epoch's seal, clamped
   to now; a 0:0 row keeps share null — a real change, drawn as a gap. */
function mergeStakeSeries(hp,dp,nowHeight){
  const pts=[]; let capped=false;
  const push=(e,width,yes,no)=>{ pts.push([Math.min(e*width,nowHeight), pctYes(yes,no), yes, no]); };
  const hFirst = hp&&hp.rows.length? hp.rows[0][0]*hp.width : Infinity;
  if(dp){ capped=capped||dp.more; for(const [e,yv,nv] of dp.rows){ if(e*dp.width<hFirst) push(e,dp.width,yv,nv); } }
  if(hp){ capped=capped||hp.more; for(const [e,yv,nv] of hp.rows) push(e,hp.width,yv,nv); }
  if(!pts.length) return null;
  pts.sort((a,b)=>a[0]-b[0]);
  const out=[]; for(const q of pts){ if(out.length&&out[out.length-1][0]===q[0]) out[out.length-1]=q; else out.push(q); }

/* The recorded path, for the two surfaces that are not the claim page.
   The claim route builds this inline from pieces it already has; the clip and
   the embed need the same thing without those pieces, and must not each grow
   their own version of the live/demo split. */
/* HEIGHTS ARE WHAT THE CHAIN RECORDS; DATES ARE WHAT A READER CAN CHECK.
   The chart was drawn entirely in block heights, so it showed a shape with no
   when — a reader could not tell whether the line covered a day or a season.
   ClaimTimeline carries both for the same instant ("now:<unix>:<height>"), so
   one anchor plus the block interval dates every sample without another read.
   Returns null rather than guessing when there is no anchor: an undated axis is
   better than a wrong one. */
function heightDater(tl){
  if(!tl || !tl.now) return null;
  const aT = tl.now.t, aH = tl.now.h;
  return h => aT + (h - aH) * BLOCK_SECS;
}
/* WHAT HAS HAPPENED TO THIS CLAIM, dated — the lane the claim page devotes a
   whole section to, compressed to one line.
   It costs NOTHING extra: ClaimTimeline is already read for the chart's dates,
   and it is the realm's own record of the claim's clock rather than anything
   this page derives. Past events carry the block's own timestamp; `settle` and
   `reopen` are the deadlines the realm will actually gate on, so they are
   labelled as pending rather than as things that happened.
   A zero stamp means the claim predates the timestamps and only its height is
   knowable — those are dropped rather than dated to 1970. */
function eventTrail(tl){
  if(!tl) return [];
  const out = [];
  for(const [k, label] of [["opened","opened"], ["answered","answered"], ["verdict","verdict"]])
    if(tl[k] && tl[k].t) out.push({label, t: tl[k].t, future: false});
  if(tl.settle && tl.settle.t) out.push({label: "settles", t: tl.settle.t, future: true});
  if(tl.reopen && tl.reopen.t) out.push({label: "reopenable to", t: tl.reopen.t, future: true});
  return out;
}
/* Day and month; the year only when it is not this claim's "now" year, so a

function stampShort(unix, nowT){
  const dt = new Date(unix * 1000);
  const day = `${dt.getUTCDate()} ${MON[dt.getUTCMonth()]}`;
  const ny = nowT ? new Date(nowT * 1000).getUTCFullYear() : dt.getUTCFullYear();
  return dt.getUTCFullYear() === ny ? day : `${day} ${dt.getUTCFullYear()}`;

async function claimTimeline(slug,id,d){
  if(!isLive()) return parseTimeline(d && d.timeline);

}
/* NOT claimSeries(). That name was already taken, 2,200 lines up, by the

async function claimStakeSeries(slug,id,d){
  if(!isLive()) return mergeStakeSeries(parseStakeSeries(d&&d.seriesH), parseStakeSeries(d&&d.seriesD), NOW);

async function fetchStakeSeries(slug,id,nowHeight){
  const [hh,dd] = await Promise.all([
    one(`ClaimSeries(${gstr(slug)},${id},${gstr("hourly")})`).catch(()=>null),
    one(`ClaimSeries(${gstr(slug)},${id},${gstr("daily")})`).catch(()=>null),

function signalChart(slug,id,d,nowH,ser,tl){
  const r=ratios(d), demo=!isLive();
  const now = demo? NOW : nowH;
  const PL=8,PR=606,Y0=124,Y100=12;
  const y=p=>+(Y0-(p/100)*(Y0-Y100)).toFixed(1);
  const ds = demo? demoSeries(slug,id,r) : null;
  // domain in block heights
  const ansH = d.settleAt? d.settleAt-51840 : null;
  const cands=[now, d.settleAt||null, d.escrowUntil||null, d.voteEndsAt||null, ansH].filter(v=>v!=null&&isFinite(v));
  if(now==null || !cands.length) return "";
  const real = ser && ser.pts && ser.pts.length? ser : null;
  // THE DATA SETS THE DOMAIN. This used to take min(firstH, now-WEEK), padding
  // the axis out to a full week of blocks whether or not anything happened in it.
  // On a claim whose whole recorded life is shorter than a week — every claim on
  // a seeded chain, and any young claim anywhere — that spent most of the plot on
  // empty axis and squeezed the actual staircase into the last fifth of it.
  // A week is not a promise the chart owes anybody: the zone labels underneath
  // say what span is shown, so showing the claim's own span is more honest and
  // uses the width. now-WEEK survives only as the floor when there is no series
  // to take a span from.

    : h=>+(PL+(h-d0)/(d1-d0)*(PR-PL)).toFixed(1);

  const ago=h=> h===now? "now" : (h<now? "≈"+days(h)+"d ago" : "in ≈"+days(h)+"d");

  let g=`<line class="grid" x1="${PL}" y1="${y(100)}" x2="${PR}" y2="${y(100)}"></line>
<line class="mid" x1="${PL}" y1="${y(50)}" x2="${PR}" y2="${y(50)}"></line>
<line class="axis" x1="${PL}" y1="${Y0}" x2="${PR}" y2="${Y0}"></line>
`;

  if(ansH!=null && d.settleAt) g+=`<rect class="wash" x="${X(ansH)}" y="${Y100}" width="${(X(Math.min(d.settleAt,d1))-X(ansH)).toFixed(1)}" height="${Y0-Y100}"></rect>`;
  if(d.escrowUntil && d.escrowUntil>now) g+=`<rect class="wash" x="${X(now)}" y="${Y100}" width="${(X(Math.min(d.escrowUntil,d1))-X(now)).toFixed(1)}" height="${Y0-Y100}"></rect>`;
