<!-- Link previews, and the honest limit of them.
     These are SITE-level and deliberately so. A crawler fetching a URL is served
     this one file and never runs its JavaScript, so #/c/orem/1 and #/ are the
     same document to it — a per-claim og:title is not something a hash-routed
     static page can express, and faking one would show every claim the same
     preview. There is no og:image for the same reason: a data: URI is ignored by
     every major crawler, and a fixed hosted image would be a picture of a claim
     that is not the one being shared. The share panel's downloadable card is the
     answer instead: the sharer attaches a picture of the actual claim, which is
     what Polymarket's per-market card achieves through a server this page does
     not have. web/README.md records what a server would need to do. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kourt">
<meta property="og:title" content="Kourt — the ledger of record">
<meta property="og:description" content="A court of record for factual claims. Stake decides which claims get answered; the answer and its route are kept on-chain.">

<style>
/* ============================================================================
   Kourt overlay — a presentation layer over the r/kourt/kourtv2 realm.
   The chain carries all the information (every screen here can be served by the
   realm's own Render); this overlay only makes it prettier, and every button is
   a signable gnoweb transaction link, never a private API. Self-contained: no
   external fonts, scripts, or styles — it runs from a file:// or any static host.
   ========================================================================== */

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul[role=list]{list-style:none;padding:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
img,svg{display:block;max-width:100%}

:root{
  --paper:#eaeef1; --surface:#f7f9fa; --surface-2:#e2e8ec; --inset:#e2e8ec;
  --ink:#16202a; --ink-2:#4a5b68; --muted:#56646f;
  --line:#dbe3e8; --line-2:#c8d2d9;
  --accent:#2e3a7d; --accent-2:#24306b; --accent-wash:#dfe3f2; --accent-ink:#fff;
  --yes:#1c6551; --yes-wash:#d8e7e1; --no:#93362b; --no-wash:#f0dcd8; --contra:#d92d20; --contra-wash:#fbe0dd;
  --escrow:#7d5c0f; --escrow-wash:#f0e6cd; --void:#74848f; --void-wash:#e2e8ec;
  --good:#1c6551;
  --shadow-sm:0 1px 2px rgba(27,27,33,.05);
  --shadow:0 1px 2px rgba(27,27,33,.05), 0 10px 30px -16px rgba(27,27,33,.22);
  /* NEON, OFF. Every glow in this file is a token, so the light theme turns
     them all off in one place rather than each rule needing a theme guard.
     Glow on white paper is smudge, not light. */
  --glow-a:none; --glow-y:none; --glow-n:none; --glow-e:none;
  --trace:none; --edge:transparent; --lip:none;
  /* THE REGISTER. Surfaces lose their fills and become hairline frames with
     registration marks; the chain's own data is the only thing that glows; and
     gold marks PROVENANCE — which record you are looking at — never state.
     Three colours, and only two of them are new: --mark reuses the values
     already proven as --escrow rather than adding a third gold to the palette.
     --scan and --ring are none/transparent here for the same reason every glow
     is: a scanline is a CRT artifact and ink does not emit light. */
  --mark:#7d5c0f; --data:#0f6b7a; --retic:#0d6b5a;
  --rule:rgba(46,58,125,.34); --rule-2:rgba(46,58,125,.18);
  --scan:transparent; --ring:none;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
  --r:3px; --r-sm:3px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#11171c; --surface:#171f26; --surface-2:#1d2731; --inset:#0d1317;
    --ink:#e6edf2; --ink-2:#a3b2bd; --muted:#8a99a4;
    --line:#212b33; --line-2:#2b3843;
    --accent:#9aa8ee; --accent-2:#b3bef3; --accent-wash:#1e2545; --accent-ink:#11171c;
    --yes:#6fc0a5; --yes-wash:#12302a; --no:#e08b7c; --no-wash:#351a16; --contra:#ff6b5e; --contra-wash:#3a1512;
    --escrow:#d7b264; --escrow-wash:#2e2512; --void:#7a8994; --void-wash:#1a232b;
    --good:#6fc0a5;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.7);
    /* NEON, ON — and kept to the things that carry information: the traces on
       the chart, the stake bar, the state pills, the focused control. Nothing
       animates and nothing decorative glows, because a UI that pulses is a toy
       and this one is a record. Each is one shadow, no stacked blurs.
       0 0 Npx: a halo with no offset reads as emitted light rather than as a
       drop shadow, which is the whole difference between Tron and a bevel. */
    /* TURNED UP. The first pass was invisible: measured side by side against the
       previous build, the only perceptible difference was a faint halo on one
       dot. "Subtle" has to mean restrained-but-present, not absent — so the
       radius roughly doubles, the opacity goes up by half, and the traces get a
       second wider halo underneath the tight one. Two shadows is what makes it
       read as emitted light rather than a blurred edge. */
    --glow-a:0 0 8px rgba(154,168,238,.55), 0 0 22px rgba(154,168,238,.22);
    --glow-y:0 0 8px rgba(111,192,165,.60), 0 0 22px rgba(111,192,165,.26);
    --glow-n:0 0 8px rgba(224,139,124,.55), 0 0 22px rgba(224,139,124,.22);
    --glow-e:0 0 8px rgba(215,178,100,.50), 0 0 20px rgba(215,178,100,.20);
    /* CYAN, not indigo. Two hues doing two jobs: gold annotates, cyan is what
       the chain recorded. The accent is the interface's colour and it was also
       the data's, so the one line on the page that is a measurement looked like
       another piece of furniture. */
    --trace:drop-shadow(0 0 3px rgba(95,211,230,.85)) drop-shadow(0 0 11px rgba(95,211,230,.4));
    --edge:rgba(179,190,243,.9);
    /* A lit top edge on a panel, so a card reads as a slab with light on it. */
    --lip:inset 0 1px 0 rgba(179,190,243,.16);
    --mark:#d7b264; --data:#5fd3e6; --retic:#7fe3d0;
    --rule:rgba(154,168,238,.30); --rule-2:rgba(154,168,238,.16);
    /* 1px of black in every 3, multiplied. Imperceptible on near-black; the
       same value on near-white is a huge visible step, which is why the light
       theme has none. */
    --scan:rgba(0,0,0,.10); --ring:drop-shadow(0 0 4px rgba(215,178,100,.85));
  }
}
:root[data-theme=light]{
  --paper:#eaeef1; --surface:#f7f9fa; --surface-2:#e2e8ec; --inset:#e2e8ec;
  --ink:#16202a; --ink-2:#4a5b68; --muted:#56646f; --line:#dbe3e8; --line-2:#c8d2d9;
  --accent:#2e3a7d; --accent-2:#24306b; --accent-wash:#dfe3f2; --accent-ink:#fff;
  --yes:#1c6551; --yes-wash:#d8e7e1; --no:#93362b; --no-wash:#f0dcd8; --contra:#d92d20; --contra-wash:#fbe0dd;
  --escrow:#7d5c0f; --escrow-wash:#f0e6cd; --void:#74848f; --void-wash:#e2e8ec; --good:#1c6551;
  --shadow-sm:0 1px 2px rgba(27,27,33,.05); --shadow:0 1px 2px rgba(27,27,33,.05), 0 10px 30px -16px rgba(27,27,33,.22);
  --glow-a:none; --glow-y:none; --glow-n:none; --glow-e:none;
  --trace:none; --edge:transparent; --lip:none;
  --mark:#7d5c0f; --data:#0f6b7a; --retic:#0d6b5a;
  --rule:rgba(46,58,125,.34); --rule-2:rgba(46,58,125,.18);
  --scan:transparent; --ring:none;
}
:root[data-theme=dark]{
  --paper:#11171c; --surface:#171f26; --surface-2:#1d2731; --inset:#0d1317;
  --ink:#e6edf2; --ink-2:#a3b2bd; --muted:#8a99a4; --line:#212b33; --line-2:#2b3843;
  --accent:#9aa8ee; --accent-2:#b3bef3; --accent-wash:#1e2545; --accent-ink:#11171c;
  --yes:#6fc0a5; --yes-wash:#12302a; --no:#e08b7c; --no-wash:#351a16; --contra:#ff6b5e; --contra-wash:#3a1512;
  --escrow:#d7b264; --escrow-wash:#2e2512; --void:#7a8994; --void-wash:#1a232b; --good:#6fc0a5;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px -18px rgba(0,0,0,.7);
  --glow-a:0 0 8px rgba(154,168,238,.55), 0 0 22px rgba(154,168,238,.22);
  --glow-y:0 0 8px rgba(111,192,165,.60), 0 0 22px rgba(111,192,165,.26);
  --glow-n:0 0 8px rgba(224,139,124,.55), 0 0 22px rgba(224,139,124,.22);
  --glow-e:0 0 8px rgba(215,178,100,.50), 0 0 20px rgba(215,178,100,.20);
  --trace:drop-shadow(0 0 3px rgba(95,211,230,.85)) drop-shadow(0 0 11px rgba(95,211,230,.4));
  --edge:rgba(179,190,243,.9);
  --lip:inset 0 1px 0 rgba(179,190,243,.16);
  --mark:#d7b264; --data:#5fd3e6; --retic:#7fe3d0;
  --rule:rgba(154,168,238,.30); --rule-2:rgba(154,168,238,.16);
  --scan:rgba(0,0,0,.10); --ring:drop-shadow(0 0 4px rgba(215,178,100,.85));
}

body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  display:grid; grid-template-columns:clamp(230px,22vw,290px) 1fr;
  grid-template-rows:auto 1fr; min-height:100vh;
}
/* THE RULING. 1px of black in every 3, multiplied, fixed to the viewport so it
   belongs to the screen and not to the document. It is the one effect here that
   taxes EVERY contrast ratio on the page — a multiply layer scales text and
   background together, which pushes their ratio toward 1 — so it is deliberately
   the weakest thing in the file, and --scan is transparent in the light theme:
   a scanline is a CRT artifact, and the same value on near-white paper is a huge
   visible step that reads as a fax rather than as a screen.
   pointer-events:none, or it would eat every click on the page. */
body::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:60;
  background:repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply}
.tnum{font-variant-numeric:tabular-nums}
code,.mono{font-family:var(--mono)}

/* ---- left rail ---------------------------------------------------------- */
.rail{
  grid-row:1/-1; border-right:1px solid var(--rule); background:transparent;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:auto;
}
.brand{padding:22px 22px 16px; border-bottom:1px solid var(--line)}
.brand .mark{display:flex; align-items:center; gap:10px; text-decoration:none}
.brand .scale{font-size:26px; filter:grayscale(.2)}
.brand h1{font-family:var(--serif); font-size:22px; font-weight:600; letter-spacing:-.01em; line-height:1.05}
.brand .tag{color:var(--muted); font-size:12.5px; margin-top:6px; letter-spacing:.02em}
.nav{padding:14px 12px; display:flex; flex-direction:column; gap:2px}
.nav a{
  display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:var(--r-sm);
  text-decoration:none; color:var(--ink-2); font-size:14px; font-weight:500;
}
.nav a .g{width:18px; text-align:center; opacity:.8}
.nav a:hover{background:var(--surface-2); color:var(--ink)}
/* The lit edge. A filled block says "selected"; a bright rule down its leading
   edge says it, and looks like a circuit. inset so it costs no layout. */
/* THE LIT RULE ALONE. --glow-a came off with the fill and had to: an outer glow
   on a FILLED block reads as light coming off a slab, and on an unfilled one it
   reads as a glowing rectangle hanging in space around nothing. The inset rule
   still says "selected", and it is the only thing that needs to. */
.nav a.on{background:transparent; color:var(--accent-2); font-weight:600;
  box-shadow:inset 2px 0 0 var(--edge)}
.nav .sec{padding:14px 12px 5px; font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.rail .foot{margin-top:auto; padding:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px}

/* ---- node + theme controls --------------------------------------------- */
.node{font-size:12px}
.node .row{display:flex; align-items:center; gap:7px; margin-bottom:7px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--void); flex:none}
.dot.live{background:var(--good)} .dot.demo{background:var(--escrow)}
.node select,.node input{
  width:100%; font:inherit; font-size:12px; color:var(--ink); background:var(--inset);
  border:1px solid var(--line-2); border-radius:var(--r); padding:6px 8px;
}
.node input.mono{font-family:var(--mono); font-size:11px}
.node label{color:var(--muted); display:block; margin:6px 0 3px}
.themebtn{display:flex; align-items:center; gap:8px; color:var(--ink-2); font-size:12.5px; padding:2px}
.themebtn:hover{color:var(--ink)}

/* ---- main --------------------------------------------------------------- */
.main{grid-column:2; grid-row:2; min-width:0; padding:34px clamp(20px,4vw,56px) 90px; max-width:1080px}
/* THE BREADCRUMB AS A DOCKET REFERENCE. Note what is NOT here: `.crumbs a`
   sets its own colour, so the links stay link-grey and only the separators and
   the page you are ON go gold. Gold = where you are, grey = where you can go.
   That fell out of specificity rather than design, and it is better than what
   was designed, so it is kept deliberately. */
/* The author's statement, in the serif the titles use — it is the same voice.
   Bounded to a reading measure rather than the panel width: 90 characters of
   prose is a wall, and this sits directly under a headline. */
.claimbody{margin:-4px 0 16px; max-width:74ch}
.claimbody p{font-family:var(--serif); font-size:15.5px; line-height:1.6; color:var(--ink-2); margin:0 0 9px}
.claimbody p:last-child{margin-bottom:0}
.crumbs{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--mark); opacity:.85; margin-bottom:18px; display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.seal{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  border:1px solid var(--mark); color:var(--mark); border-radius:0; padding:3px 7px;
  white-space:nowrap; vertical-align:middle}
.crumbs a{text-decoration:none; color:var(--ink-2)} .crumbs a:hover{color:var(--accent-2)}
.crumbs .sep{opacity:.5}

/* These two are PROGRAMMATIC SCROLL TARGETS, not tab stops — the page moves
   focus to them so a screen reader lands in the right place, and they suppress
   the ring for that reason. The glow added to :focus-visible leaked straight
   onto them: a claim title wearing a neon box for no reason the reader can
   explain. Whatever :focus-visible grows, these must cancel all of it. */
.page-h:focus,.page-h:focus-visible{outline:none; box-shadow:none}
#resolution:focus,#resolution:focus-visible{outline:none; box-shadow:none}
.page-h{font-family:var(--serif); font-size:clamp(26px,3.4vw,36px); font-weight:600; letter-spacing:-.015em; line-height:1.08; text-wrap:balance; overflow-wrap:anywhere}
.page-sub{color:var(--ink-2); margin-top:8px; max-width:66ch}
.lead-row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap}

section{margin-top:34px}
/* The section rule starts lit at the left and fades to nothing, so a page of
   them reads as etched rather than ruled. border-image, so the border box and
   every existing measurement stay exactly as they were. */
.sec-h{font:600 11px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line-2); padding-bottom:6px; margin-bottom:10px; display:flex; align-items:baseline; gap:10px;
  border-image:linear-gradient(90deg, var(--edge), var(--line-2) 22%, transparent) 1}
.sec-h .count{font-family:var(--mono); font-size:11px; color:var(--ink-2); font-weight:500; letter-spacing:0; text-transform:none}

/* cards + grids */
.grid{display:grid; gap:14px}
.grid.courts{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
/* ONE RULED TABLE, not four cards. Four separate cells each with its own edge
   is four objects; a strip divided by rules is one instrument with four
   readings, which is what it is. */
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0; padding:0;
  background:transparent; border:1px solid var(--rule)}
.grid.stats>div{border-left:1px solid var(--rule); border-radius:0}
.grid.stats>div:first-child{border-left:0}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px; box-shadow:var(--shadow-sm); text-decoration:none; color:inherit; display:block;
}
a.card{transition:border-color .12s}
a.card:hover{border-color:var(--line-2)}
.card .ct-name{font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:-.01em}
.card .ct-meta{color:var(--muted); font-size:13px; margin-top:4px}
.card .ct-price{display:flex; gap:16px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
.kv .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.kv .v{font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px}
.kv .v small{font-weight:500; color:var(--ink-2); font-size:12px}

.stat{background:transparent; border:none; border-radius:0; padding:12px 14px; box-shadow:none}
.stat .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.stat .v{font-family:var(--mono); font-size:18px; font-weight:500; font-variant-numeric:tabular-nums; margin-top:6px}
.stat .v small,.stat .sub{font-size:12px; color:var(--ink-2); font-weight:500}
.stat .sub{margin-top:3px}

/* pills / status */
.pill{
  display:inline-flex; align-items:center; gap:6px; font:600 10.5px/1.4 var(--sans);
  letter-spacing:.08em; text-transform:uppercase;
  padding:4px 7px; border-radius:2px; background:transparent; color:var(--ink-2);
  border:1px solid var(--line-2); white-space:nowrap;
}
.pill .g{font-size:10px}
.pill.yes{background:var(--yes-wash); color:var(--yes); border-color:var(--yes)}
.pill.no{background:var(--no-wash); color:var(--no); border-color:var(--no)}
/* A pill is a state, so it emits in that state's colour. --glow-* is `none` in
   the light theme, which is why these need no theme guard. */
.pill.open,.pill.good{box-shadow:var(--glow-y)}
.pill.no,.pill.contra{box-shadow:var(--glow-n)}
.pill.escrow{box-shadow:var(--glow-e)}
.pill.escrow{background:var(--escrow-wash); color:var(--escrow); border-color:var(--escrow)}
.pill.void{background:transparent; color:var(--muted); border-color:var(--line-2)}
.pill.contra{background:var(--contra-wash); color:var(--contra); border-color:var(--contra)}
.pill.open{background:var(--escrow-wash); color:var(--escrow); border-color:var(--escrow)}
.pill.good{background:var(--yes-wash); color:var(--good); border-color:var(--good)}

/* docket list */
.docket{border:1px solid var(--rule); border-radius:0; overflow:hidden; background:transparent}
.docket a{display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; padding:14px 18px; text-decoration:none; border-top:1px solid var(--rule-2)}
.docket a:first-child{border-top:none}
.docket a:hover{background:var(--surface-2)}
.docket .t{font-weight:560; color:var(--ink); line-height:1.35}
.docket .m{font-size:12.5px; color:var(--muted); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap}
.docket .rt{display:flex; align-items:center; gap:10px}
.docket a.crow{grid-template-columns:52px minmax(0,1fr) 64px 124px; align-items:baseline; padding:11px 14px}
.docket a.crow .px{justify-self:end}
.docket a.crow .pill{justify-self:end}
.docket .t{overflow-wrap:anywhere}
.docket a.courtrow{grid-template-columns:minmax(52px,auto) minmax(0,1fr) auto 124px; align-items:center}
.docket a.courtrow .id{max-width:110px; overflow:hidden; text-overflow:ellipsis}
.docket a.crow .t{font-family:var(--serif); font-size:15.5px; font-weight:600}
.docket .id{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap; display:flex; align-items:center; gap:6px}
.icn{width:14px; height:12px; flex:none}
.courtrow .icn{color:var(--escrow)}
.cols{display:grid; grid-template-columns:minmax(0,1fr) 288px; gap:22px; margin-top:20px; align-items:start}
.panel h4{font:600 11px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 10px}
/* A FOLDER IS MARKED BY ITS TYPE, NOT BY A WASH. It carried --accent-wash to
   separate folders from claims, which was fine when every row sat on a filled
   docket; with the fills gone it became the loudest block on the court page —
   and it is marking structure, which is exactly what this register does with
   rules and marks rather than colour. The folder icon and the accent title
   below already say "folder", twice. */
.docket a.folderrow:hover{background:var(--surface-2)}
.docket a.folderrow .id .icn{color:var(--accent)}
.docket a.folderrow .t{color:var(--accent-2)}
.px{display:flex; flex-direction:column; align-items:flex-end; min-width:64px}
.px b{font-family:var(--mono); font-size:13px; font-weight:500; font-variant-numeric:tabular-nums}
.px small{font-size:10px; color:var(--muted); letter-spacing:.05em}
.spark{width:60px; height:16px; display:block; margin-bottom:2px}
.spark polyline{fill:none; stroke:var(--muted); stroke-width:1.5; stroke-linejoin:round}
.docket a.crow:hover .spark polyline{stroke:var(--accent)}
.spark .base{stroke:var(--line); stroke-width:1}
.lead-row{border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:16px}

/* buttons / txlinks */
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px}
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:var(--r-sm);
  background:var(--surface); border:1px solid var(--line-2); color:var(--ink); font-weight:560; font-size:14px;
  text-decoration:none; transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--accent); background:var(--accent-wash)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.yes{border-color:var(--yes); color:var(--yes)} .btn.yes:hover{background:var(--yes-wash)}
.btn.no{border-color:var(--no); color:var(--no)} .btn.no:hover{background:var(--no-wash)}
/* On hover only: a page of permanently glowing buttons is a slot machine. */
.btn.yes:hover{box-shadow:var(--glow-y)} .btn.no:hover{box-shadow:var(--glow-n)}
/* the side an embed's button asked for — a ring, not a pre-filled form */
.btn.picked{box-shadow:0 0 0 3px var(--accent-wash); outline:2px solid var(--accent-2)}
.btn .g{font-size:13px; opacity:.85}
.btn small{font-weight:500; color:var(--muted); font-size:11.5px}

/* the four-things primer */
.primer{background:linear-gradient(180deg,var(--surface),var(--surface)); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:var(--r); padding:16px 20px}
.primer h3{font-family:var(--serif); font-size:15px; margin-bottom:10px; color:var(--accent-2)}
.primer ol{margin:0; padding-left:20px; display:grid; gap:7px}
.primer li{font-size:13.5px; color:var(--ink-2)} .primer li b{color:var(--ink); font-weight:600}

/* stake panel + ratio series */
.stakewrap{display:grid; grid-template-columns:1.3fr 1fr; gap:16px}
/* ---- embed mode -------------------------------------------------------
   Polymarket serves embeds from a separate host (embed.polymarket.com/market
   ?market=<slug>&theme=&features=) at a default 400x400 in a <figure>. This
   page cannot do that: web/README.md promises one self-contained file that runs
   from file:// and makes no network calls in demo mode, so there is no second
   host to serve. The equivalent is a ROUTE — #/embed/<slug>/<id> — which the
   same file answers, so an embed needs no infrastructure at all and a reader
   who saves the file keeps working embeds.
   The chrome goes away: an iframe has no room for a sidebar, and a nav inside
   someone else's article is a trap rather than a courtesy. */
html.embed, html.embed body{margin:0; padding:0; background:var(--paper)}
html.embed body{display:block; min-height:0}
html.embed .rail, html.embed #nav{display:none !important}
/* The page banner is a paragraph; an embed is a fixed box. It would overflow,
   so the card carries the short form (.esrc) and this stays out of the way. */
html.embed #tcbanner{display:none !important}
/* The frame is the host's; the card is ours. `margin:auto` on the flex child
   centres it on both axes AND, unlike align-items:center, never clips the top of
   a card taller than the frame — a long title must push the iframe into a
   scrollbar, not lose its own first line. */
html.embed .main{grid-column:1; grid-row:1; max-width:none; padding:0;
  min-height:100vh; display:flex}
html.embed #tcbanner{grid-column:1; padding:0}
/* The card is a surface like any other: hairline frame, registration marks at
   the corners, and the head in the same gold as the docket reference it is. */
.emb{display:flex; flex-direction:column; gap:9px; padding:14px 15px;
  border:1px solid var(--rule); border-radius:0; background:transparent;
  box-sizing:border-box; position:relative;
  /* AN EMBED DOES NOT CHOOSE ITS OWN SIZE — the host page does, and the snippet
     only suggests 400x500. Left to the frame it stretched every row to whatever
     width the host gave it and, with the footer pinned to the bottom, opened a
     void of whatever height the host gave it between the actions and "Open on
     Kourt". So: one width up to a cap, a height that is just its content, and
     centred in whatever it is handed.

     min-width:0 because a flex item defaults to min-width:auto and so REFUSES to
     shrink below its own min-content width — measured, claim #2's card came out
     422px wide inside a 400px frame, overflowing the very thing it is sized to
     fit. margin:auto rather than align-items:center: auto margins centre on both
     axes and never clip, so a card taller than the frame pushes the iframe into a
     scrollbar instead of losing its own first line. */
  width:100%; min-width:0; max-width:520px; margin:auto}
.emb::before, .emb::after{content:""; position:absolute; width:10px; height:10px;
  pointer-events:none; border:1px solid var(--mark); opacity:.55}
.emb::before{top:0; left:0; border-right:0; border-bottom:0}
.emb::after{bottom:0; right:0; border-left:0; border-top:0}
/* NOWRAP, not wrap. A court name is whatever its creator typed; wrapping turned
   a one-line head into three and pushed the card 9px past the iframe it was
   sized for — a scrollbar in somebody else's article. One line, and the name is
   the part that gives way. */
.emb .ehead{display:flex; align-items:baseline; gap:8px; flex-wrap:nowrap; overflow:hidden;
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--mark); opacity:.9}
.emb .ehead .ename{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
/* Inherit, like Polymarket's: the card should read as a card, not as a page of
   blue links. The affordance arrives on hover, and the footer link stays the
   one explicit call to action. */
.emb .eacts{display:flex; gap:8px; margin-top:2px}
.emb .eact{flex:1 1 0; min-width:0; display:flex; align-items:baseline; justify-content:center; gap:7px;
  padding:8px 6px; border-radius:var(--r-sm); text-decoration:none; font-size:12.5px;
  border:1px solid transparent; white-space:nowrap; overflow:hidden}
.emb .eact b{font-weight:600}
.emb .eact .epc{font-variant-numeric:tabular-nums; opacity:.85}
.emb .eact.y{color:var(--yes); background:var(--yes-wash); border-color:var(--yes)}
.emb .eact.n{color:var(--no);  background:var(--no-wash);  border-color:var(--no)}
.emb .eact:hover{filter:brightness(1.06); text-decoration:underline; text-underline-offset:2px}
.emb .elink{color:inherit; text-decoration:none}
.emb .elink:hover{text-decoration:underline; text-underline-offset:2px}
.emb .etitle .elink:hover{color:var(--accent-2)}
.emb .ehead > :not(.ename){flex:0 0 auto}
/* Four lines, then the browser's own ellipsis. An embed is a FIXED box on
   someone else's page — it cannot grow to fit, so an unbounded title either
   overflows into a scrollbar or forces every card to be sized for the longest
   claim anyone might ever file. Clamping bounds the card, and the ellipsis is
   what keeps it honest: a cut sentence is MARKED as cut, and "Open on Kourt"
   is on the same card. The share clip does the same thing for the same reason. */
.emb .etitle{font-family:var(--serif,inherit); font-size:17px; line-height:1.3; color:var(--ink);
  font-weight:600; margin:0; display:-webkit-box; -webkit-line-clamp:4;
  -webkit-box-orient:vertical; overflow:hidden}
.emb .estat{font-size:12.5px; color:var(--ink-2)}
/* The claim's own events, dated. Wraps rather than truncating: a claim that has
   been answered AND disputed AND reopened has more history than one line, and
   the history is the point. */
.emb .enopath{font-size:11px; color:var(--muted); font-style:italic}
.emb .etrail{display:flex; flex-wrap:wrap; gap:2px 10px; font-size:11px; color:var(--ink-2)}
.emb .etrail span{white-space:nowrap}
.emb .etrail b{font-weight:600; color:var(--muted); font-weight:500}
.emb .etrail .fut{color:var(--muted)}
.emb .etrail .fut b{font-style:italic}
.emb .esparkwrap{display:flex; flex-direction:column; gap:3px}
/* The card's chart is a .bigchart and takes the claim page's marks, colours,
   dashes and glow from those rules. What it must NOT take is their sizes.
   Everything in an SVG is in user units, so a mark's apparent size is
   `declared x (renderWidth / viewBoxWidth)`. The claim page draws 640 units into
   about 459px, a factor of 0.717; this card draws 300 units into 368px, a factor
   of 1.227. Share the declarations and every stroke and glyph lands 1.71x too
   big — measured, the 10px scale labels rendered at 24px and ran off the edge.
   So the sizes below are the page's own, multiplied by 0.717/1.227 = 0.584. They
   are a conversion, not a taste: identity is shared, scale is local. */
.emb .espark{margin:0}
.emb .espark .grid, .emb .espark .axis, .emb .espark .mid,
.emb .espark .seam, .emb .espark .evt{stroke-width:.6}
.emb .espark .ln{stroke-width:1.3}
.emb .espark .ref{stroke-width:.9; stroke-dasharray:3 2.3}
.emb .espark .mid{stroke-dasharray:1.2 1.8}
.emb .espark .evt{stroke-dasharray:1.2 1.2}
.emb .espark .seam{stroke-dasharray:.6 1.8}
.emb .espark .tickL{font-size:6px}
.emb .espark .endL{font-size:7px}
.emb .espark .end{stroke-width:1px; r:3px}
.emb .espark .evtDot{r:1.2}
.emb .espan{display:flex; justify-content:space-between; gap:6px; font-family:var(--mono);
  font-size:9.5px; letter-spacing:.02em; color:var(--muted); white-space:nowrap; overflow:hidden}
.emb .espan .efrozelab{overflow:hidden; text-overflow:ellipsis; min-width:0}
/* margin-top:auto was pinning this to the bottom of a stretched card. With the
   card at content height there is nothing to push into, and a small gap reads
   better than none. */
.emb .efoot{margin-top:2px; display:flex; justify-content:space-between; align-items:baseline;
  gap:10px; font-size:11.5px}
.emb .efoot a{color:var(--accent-2); text-decoration:none; font-weight:600}
.emb .efoot a:hover{text-decoration:underline}
.emb .ewhen{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
/* --escrow is already this page's "provisional / not the real thing" colour —
   it is what paints the demo dot in the rail — so the note reads the same way
   in both themes without a new token. */
.emb .esrc{font-family:var(--mono); font-size:10px; letter-spacing:.04em; line-height:1.35;
  color:var(--escrow); background:var(--escrow-wash); border:1px solid var(--escrow);
  border-radius:var(--r-sm); padding:3px 6px; align-self:flex-start; max-width:100%}
/* The stake split — full chart width, so the proportion is read rather than computed. */
.sbar{display:flex; width:100%; height:14px; margin:12px 0 0; border-radius:var(--r);
  overflow:hidden; border:1px solid var(--line)}
.sbar>div{min-width:0}
/* Each side lights in its own colour, and inset:0 0 0 1px puts a bright hairline
   INSIDE the segment so the two meet at a lit seam rather than a butt joint.
   The glow is the side's own hue, so which side is ahead is legible from the
   light alone before any number is read. */
.sbar .sbY{background:var(--yes); box-shadow:var(--glow-y), inset 0 1px 0 rgba(255,255,255,.14)}
.sbar .sbN{background:var(--no);  box-shadow:var(--glow-n), inset 0 1px 0 rgba(255,255,255,.14)}
.sbar.empty{height:auto; padding:7px 10px; justify-content:center; background:var(--surface);
  color:var(--muted); font-size:12px}
.sbout{display:flex; justify-content:space-between; gap:14px; margin-top:6px; font-size:12.5px; flex-wrap:wrap}
.sbout .y{color:var(--yes)} .sbout .n{color:var(--no); text-align:right}
/* NO FILL, A HAIRLINE, AND REGISTRATION MARKS AT THE CORNERS. A court of record
   is rules and type; a filled card is a slab floating over a page. Taking the
   fill away is what makes the one glowing line on the page mean something.
   The marks are a REINFORCEMENT of the frame, not a replacement for it. That was
   tried the other way — ticks and no border, which is the more interesting idea
   — and it failed on this exact element: .panel and .ticket are equal-height
   grid items, so the chart's panel is stretched to the taller ticket and four
   10px marks ended up ~960px apart around a 500px void, reading as stray marks
   outlining nothing. Hence align-self below, and the hairline stays. */
.panel{background:transparent; border:1px solid var(--rule); border-radius:0; padding:18px;
  position:relative}
/* The chart's panel stops at its content instead of stretching to the ticket.
   Only visible once the fill is gone: an empty stretched surface reads as a
   surface, an empty stretched FRAME reads as a box around nothing. */
.stakewrap>.panel{align-self:start}
.panel::before, .ticket::before, .panel::after, .ticket::after{
  content:""; position:absolute; width:10px; height:10px; pointer-events:none;
  border:1px solid var(--mark); opacity:.55}
.panel::before, .ticket::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
.panel::after,  .ticket::after{bottom:-1px; right:-1px; border-left:0; border-top:0}
/* The reticle arrives on HOVER and in a third hue. An interface that is always
   reticulating is a toy; this one is a record. */
.panel:hover::before, .ticket:hover::before, .panel:hover::after, .ticket:hover::after{
  width:14px; height:14px; border-color:var(--retic); opacity:.85}
.panel:hover::before, .ticket:hover::before{top:-2px; left:-2px}
.panel:hover::after,  .ticket:hover::after{bottom:-2px; right:-2px}
/* ONE FRAME GETS THE MARKS. The court page nests a buy ticket inside its "join
   this court" panel, and both took marks — two gold corners 170px apart, which
   reads as clutter. A registration mark marks the sheet, not every box on it. */
.panel .panel::before, .panel .panel::after, .panel .ticket::before, .panel .ticket::after,
.ticket .ticket::before, .ticket .ticket::after, .ticket .panel::before, .ticket .panel::after{
  display:none}
.bigchart{margin:2px 0 6px}
.bigchart figcaption{display:flex; justify-content:space-between; gap:12px; font-size:12px; color:var(--muted); margin-bottom:6px; align-items:baseline}
.bigchart figcaption b{font-family:var(--mono); font-weight:500; color:var(--ink)}
.bigchart svg{display:block; width:100%; height:auto; overflow:visible}
.bigchart .grid{stroke:var(--line); stroke-width:1}
.bigchart .axis{stroke:var(--line-2); stroke-width:1}
.bigchart .mid{stroke:var(--line-2); stroke-width:1; stroke-dasharray:2 3}
/* The recorded path reads as a light trace rather than a drawn line. filter on
   the PATH only, not the <svg>: on the svg it would halo the axes, the labels
   and the gridlines too, and a glowing axis is decoration. */
.bigchart .ln{fill:none; stroke:var(--data); stroke-width:2.25; stroke-linejoin:round; stroke-linecap:round;
  filter:var(--trace)}
.bigchart .ar{fill:var(--data); opacity:.1}
.bigchart .seam{stroke:var(--line-2); stroke-width:1; stroke-dasharray:1 3}
.bigchart .ref{stroke:var(--accent); stroke-width:1.5; stroke-dasharray:5 4; opacity:.75}
.bigchart .band{stroke:var(--accent); stroke-width:4; opacity:.45; stroke-linecap:round}
.bigchart .wash{fill:var(--escrow-wash); opacity:.55}
.bigchart .washf{fill:var(--void-wash); opacity:.5}
.bigchart .tickL{font:10px var(--mono); fill:var(--mark); opacity:.7}
.bigchart .zone{font:9.5px var(--sans); fill:var(--muted); letter-spacing:.08em; text-transform:uppercase}
.bigchart .evt{stroke:var(--ink-2); stroke-width:1; stroke-dasharray:2 2}
.bigchart .evtDot{fill:var(--ink-2)}
.bigchart .evtL{font:10px var(--sans); fill:var(--ink-2)}
.bigchart .hit{fill:transparent}
.bigchart .hit:hover + .evtDot, .bigchart .hit:focus + .evtDot{r:5}
.bigchart .note{font:10.5px var(--sans); fill:var(--muted)}
/* The "now" dot is where the trace terminates — the one point a reader looks
   for, so it is the one that emits. */
/* A RING, not a disc. A hollow mark reads as a measurement taken; a filled one
   reads as a decoration. It also had a --surface stroke to punch it out of the
   panel's fill, which stops meaning anything once the panel has none. */
.bigchart .end{fill:none; stroke:var(--mark); stroke-width:1.75px; r:5px; filter:var(--ring)}
.bigchart .endL{font:600 12px var(--mono); fill:var(--accent)}
.bigchart .endS{font:9.5px var(--sans); fill:var(--muted)}
.srcnote{font-size:10.5px; color:var(--muted); margin:6px 0 0}
.chartchips{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 12px; font-family:var(--mono); font-size:11.5px; color:var(--ink-2)}
.chartchips span{border:1px solid var(--line-2); border-radius:2px; padding:3px 7px; background:var(--surface)}

/* stake ticket */
.ticket{background:transparent; border:1px solid var(--rule); border-radius:0; padding:18px;
  position:relative}
.ticket h3{font-family:var(--serif); font-size:17px; margin-bottom:4px}
.ticket .hint{font-size:12.5px; color:var(--muted); margin-bottom:14px}
/* A ticket row is a label and what it says. The label is the bold thing on the
   LEFT and the text reads left-to-right from its own aligned column: two real
   grid tracks with a gutter, because space-between put the emphasis on the
   right, ragged-left, and closed the gap entirely once a row's text filled it. */
.ticket .line{display:grid; grid-template-columns:minmax(0,20ch) minmax(0,1fr); column-gap:24px;
  align-items:baseline; padding:9px 0; border-top:1px dashed var(--line); font-size:14px}
.ticket .line:first-of-type{border-top:none}
.ticket .line>*:first-child{font-weight:600; color:var(--ink)}
.ticket .line .r{font-weight:400; color:var(--ink-2); text-align:left; font-variant-numeric:tabular-nums}
.ticket .line .r b{color:var(--ink)}
.ticket .line.spent>*:first-child{color:var(--muted); font-weight:400}
.ticket .line.spent .r{color:var(--muted)}
@media (max-width:640px){ .ticket .line{grid-template-columns:minmax(0,1fr); row-gap:2px} }
/* the clock ladder: what happened on the left, when on the right — the dates
   align in their own column because the grid lives on the container, not the
   row, and the column sits just past the labels rather than at the far edge */
.ticket .clockrows{display:grid; grid-template-columns:minmax(0,30ch) max-content;
  column-gap:28px; justify-content:start; align-items:baseline}
.ticket .clockrows>*{padding:9px 0; border-top:1px dashed var(--line); font-size:14px}
.ticket .clockrows>*:nth-child(-n+2){border-top:none}
.ticket .clockrows .ev{font-weight:600; color:var(--ink)}
.ticket .clockrows .dt{color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}
.ticket .clockrows .ev small,.ticket .clockrows .dt small{font-weight:400; color:var(--muted)}
.ticket .clockrows .ev small{display:block; margin-top:1px}
@media (max-width:640px){ .ticket .clockrows{grid-template-columns:minmax(0,1fr) max-content; column-gap:14px}
  .ticket .clockrows .dt{white-space:normal} }
/* Helper modals: the long "why" lives one click away, so a ballot reads as a
   ballot. Native <dialog> — Escape, the backdrop and focus come with it. */
dialog.helper{border:1px solid var(--line-2); border-radius:var(--r); padding:0;
  max-width:min(640px,92vw); background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
dialog.helper::backdrop{background:rgba(12,18,24,.5)}
dialog.helper .hd{display:flex; justify-content:space-between; align-items:baseline; gap:18px;
  padding:16px 18px; border-bottom:1px solid var(--line)}
dialog.helper .hd h3{font-family:var(--serif); font-size:17px; margin:0}
dialog.helper .bd{padding:16px 18px 18px; font-size:14px; line-height:1.6; color:var(--ink-2)}
dialog.helper .bd h4{color:var(--ink); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  margin:16px 0 6px; font-family:var(--mono)}
dialog.helper .bd h4:first-child{margin-top:0}
dialog.helper .bd p{margin:0 0 8px}
dialog.helper .bd ul{margin:4px 0 0; padding-left:18px}
dialog.helper .bd li{margin:5px 0}
dialog.helper .bd b{color:var(--ink)}
button.helplink{color:var(--accent-2); cursor:pointer; text-decoration:underline; background:none;
  border:0; padding:0; font:inherit; font-size:inherit}
button.helplink:hover{color:var(--accent)}
/* AN ASIDE IS MARKED BY A RULE IN THE MARGIN, not by a panel. This paragraph —
   the one that corrects what readers get wrong about conviction — was separated
   from the ticket's body copy by NOTHING but its fill, so taking fills away
   turned it into a fourth row of the payoff table above it. The notices came
   through the same change intact because they carry a 4px left border instead,
   which is where this borrows from. */
.ticket .never{margin-top:12px; border-left:2px solid var(--rule); padding:2px 0 2px 11px;
  font-size:12.5px; color:var(--ink-2)}
.ticket .never b{color:var(--ink)}
/* buy receipt — reuses the ticket's row token inside the join panel */
.buyrcpt{padding:12px 14px; margin:0 0 4px; background:var(--inset)}
.buyrcpt .line{font-size:13px; grid-template-columns:minmax(0,1fr); row-gap:3px; column-gap:0}
/* The receipt lives in the 288px join rail, where the ticket's 20ch label track
   leaves the value ~100px and "185.2 KOURT:OREM / 185,241,936 units" wraps into
   a ragged stack. Label above value instead — the rail is too narrow for two
   columns, and the token name got longer when CC became KOURT:SLUG. */
.buyrcpt .line>*:first-child{font-size:12px; color:var(--muted); font-weight:600;
  letter-spacing:.02em; text-transform:uppercase}
.buyrcpt .line .r{font-size:14px; color:var(--ink)}
.buyrcpt .line .r small{display:block; font-weight:400; color:var(--muted)}
.buyrcpt input{width:9ch; min-width:0; background:var(--surface); border:1px solid var(--line-2); border-radius:2px;
  color:var(--ink); font:inherit; font-weight:600; font-variant-numeric:tabular-nums; padding:3px 7px; text-align:right}
.buyrcpt input:focus{outline:2px solid var(--accent); outline-offset:1px}
.ack{display:flex; gap:8px; align-items:flex-start; margin:10px 0 0; cursor:pointer; color:var(--ink-2)}
.ack input{margin-top:2px; accent-color:var(--accent)}
/* court scope line + record panel (p.sub so the stat tiles' div.sub stay untouched) */
p.sub{font-size:13.5px; color:var(--ink-2); max-width:54ch; margin-top:6px}
.panel .kv+.kv{margin-top:8px}
/* argument rows: no sparkline slot — id · title · relation chip · status pill */
/* the relation chip needs its own column: a wrapped title must never end a
   few pixels from it and read as one sentence. Specificity matches
   `.docket a.crow`, which sets the docket's own four-track grid. */
.docket a.crow.argrow{grid-template-columns:52px minmax(0,1fr) 268px; gap:20px}
.docket a.crow.argrow>.rt,.docket a.crow.argrow>.pill{justify-self:end}
.docket a.crow.argrow .rt{justify-content:flex-end; gap:10px; flex-wrap:wrap}

/* ============================ the utility row ============================
   The line under a page title: what this thing IS, then what you can do about
   it. Four routes use it (claim, court, curate, map) and the claim page was the
   only one that also put facts and an action in it, which is what made it read
   as a jumble.

   THE SIZE LIVES ON THE ROW. It used to live on each child's `.small`, and
   `button.helplink` is `font:inherit` — so the share trigger inherited the 15px
   BODY size while the anchors beside it were 12.5px. That one mismatch is most
   of "inconsistent in font": it made the button 20% larger than its neighbours
   and pushed it onto a line of its own.

   TWO ROLES, NOT FOUR VOICES. A fact is --muted and never reacts to the cursor;
   a link is --accent and grows an underline when you point at it. The pill is
   the only boxed thing here, and that border is the whole "this is status"
   signal. Nothing else gets a box, a second family, or a second size. */
.tagrow{display:flex; flex-wrap:wrap; align-items:center; column-gap:16px; row-gap:8px;
  margin-top:12px; font-size:12.5px; line-height:1.45; min-width:0}
/* Facts and actions are two groups, so the row wraps at the SEAM between them
   rather than wherever a wide status pill happens to push it. That is what
   stranded "share ↗" alone on line two. */
.tagrow .tfacts,.tagrow .tacts{display:flex; flex-wrap:wrap; align-items:center;
  column-gap:16px; row-gap:6px; min-width:0}
.tagrow .tfacts{column-gap:10px}
.tagrow .tfact{color:var(--muted)}
/* the only mono in the row, and only on the machine string inside a fact —
   "opened by" is prose. SF Mono sets larger than the UI sans at matched px. */
.tagrow .tfact .mono{font-size:.94em}
.tagrow .tlink{
  /* inline-flex buys the 24px target height, and costs the whitespace BETWEEN
     its children — flex discards it, which ran "filed under" into the folder
     name. `gap` puts it back, so the markup needs no &nbsp;. */
  display:inline-flex; align-items:center; gap:.32em;
  min-height:24px;   /* SC 2.5.8, and free beside a 24.7px pill */
  color:var(--accent); font:inherit; background:none; border:0; padding:0; cursor:pointer;
  text-decoration:underline; text-decoration-color:transparent; text-decoration-thickness:1px;
  text-underline-offset:3px; border-radius:2px; min-width:0;
  transition:color .12s ease, text-decoration-color .12s ease}
/* --accent-2 is the HIGHER-contrast variant in both themes, so hover reads as
   "more". button.helplink had this backwards and dimmed on hover. */
.tagrow .tlink:hover,.tagrow .tlink:focus-visible{
  color:var(--accent-2); text-decoration-color:currentColor}
@media(prefers-reduced-motion:reduce){ .tagrow .tlink{transition:none} }
/* THE ONLY UNBOUNDED STRING IN THE ROW: a folder label from local curation,
   which is imported JSON. safeInline() escapes it but does not bound it, and a
   flex item defaults to min-width:auto — so a 40-character label made this
   anchor the widest element on the PAGE and gave the whole document a
   horizontal scrollbar at 390px (scrollWidth 454 vs 390; 140 chars gave 1542).
   WCAG 1.4.10. Bounded here, and the ellipsis keeps the truncation visible. */
.tagrow .tname{display:inline-block; max-width:26ch; overflow:hidden;

<!-- The court chat panel. OPTIONAL, and the only file index.html ever loads.
     web/README.md promises this page is self-contained and runs from file://
     with no dependencies, and that stays true: chat.js missing means no chat
     panel and nothing else changes, because every call into it is guarded on
     typeof. Chat is also off until CFG.chat names a service. See CHAT.md. -->
<script src="chat.js"></script>
<script>
"use strict";
/* ============================ configuration ============================== */
const PKG = "gno.land/r/kourt/kourtv2";
const CFG_DEFAULTS = {mode:"demo", rpc:"http://127.0.0.1:26657", gnoweb:"https://gno.land", chainid:"dev"};
/* Config touches hrefs, shell commands, and the wallet: anything that fails
   these shapes falls back to the default rather than flowing downstream. */
function cleanCfg(c){
  const url = v => { if(typeof v!=="string") return null; v=v.trim().replace(/\/+$/,"");
    return /^https?:\/\/[A-Za-z0-9.\-]+(:[0-9]+)?(\/[A-Za-z0-9._\-\/]*)?$/.test(v)? v : null; };
  const out = Object.assign({}, CFG_DEFAULTS);
  if(c && typeof c==="object"){
    if(c.mode==="live") out.mode="live";
    const r=url(c.rpc); if(r) out.rpc=r;
    const g=url(c.gnoweb); if(g) out.gnoweb=g;
    if(typeof c.chainid==="string" && /^[A-Za-z0-9._-]{1,32}$/.test(c.chainid)) out.chainid=c.chainid;
    if(typeof c.addr==="string" && /^g1[0-9a-z]{10,80}$/.test(c.addr)) out.addr=c.addr;
    if(c.theme==="light"||c.theme==="dark") out.theme=c.theme;
    // The optional chat service (see CHAT.md). THREE states, not two:
    //   a URL   — that service
    //   ""      — explicitly off; the reader cleared the field and it stays clear
    //   absent  — never configured, so chatBase() decides (see below)
    // The empty string has to survive cleanCfg or "off" would not persist and
    // the default would come back on every reload.
    const ch=url(c.chat); if(ch) out.chat=ch;
    else if(c.chat==="") out.chat="";
  }
  return out;
}
/* THE ONE ORIGIN THAT IS NOT A GUESS.
   The rule above stands and is why this is not simply a default: a page opened
   out of somebody's Downloads folder must never start posting to a host nobody
   named. But when the page is SERVED over http(s) the host WAS named — by
   whoever deployed it — and deploy/nginx.conf proxies /api/chat/ on that same
   origin. Requiring every visitor to paste a URL into a settings panel does not
   make that safer, it only makes chat dead for all of them, which is what the
   owner found on kourt.xyz.
   file:// has no origin and gets nothing, which is the case the rule was
   written for. An explicit "" still wins: clearing the field turns chat off and
   it stays off. */
function defaultChatBase(){
  return /^https?:$/.test(location.protocol) ? location.origin : "";
}
function chatBase(){
  return (CFG.chat === undefined) ? defaultChatBase() : CFG.chat;
}
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(_){} },
  del(k){ try{ localStorage.removeItem(k); }catch(_){} }
};
let stored = {};
try{ stored = JSON.parse(store.get("cc.cfg")||"{}"); }catch(_){}
const CFG = cleanCfg(stored);
const saveCfg = () => { Object.assign(CFG, cleanCfg(CFG)); store.set("cc.cfg", JSON.stringify(CFG)); };

const CC_DEC = 6;          // court coin decimals; economic figures are raw base units
const BLOCK_SECS = 5;      // gno.land block time — how block heights become wall-clock
const WEEK = 120960;       // one emission period, in blocks (trailing-ratio window)

/* ============================ gno RPC client ============================= */
/* abci_query(vm/qeval|vm/qrender) over JSON-RPC. data is amino base64; the reply
   carries the string result in response.Data (sometimes nested in ResponseBase). */
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function unb64(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(_){ return atob(s); } }

async function chainHeight(){
  if(!isLive()) return NOW;
  try{
    const r = await fetch(CFG.rpc.replace(/\/+$/,"")+"/status");
    const j = await r.json();
    const h = parseInt(j.result && j.result.sync_info && j.result.sync_info.latest_block_height, 10);
    return isFinite(h)? h : null;
  }catch(e){ return null; }
}
async function abci(path, data){
  const body = {jsonrpc:"2.0", id:"cc", method:"abci_query",
    params:{path, data:b64(data), height:"0", prove:false}};
  const res = await fetch(CFG.rpc, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!res.ok) throw new Error("node HTTP "+res.status);
  const j = await res.json();
  if(j.error) throw new Error(j.error.message||"rpc error");
  const r = (j.result&&j.result.response) || {};
  const err = r.Error || (r.ResponseBase&&r.ResponseBase.Error);
  if(err) throw new Error((r.Log||(r.ResponseBase&&r.ResponseBase.Log)||"query failed"));
  const d = r.Data!=null ? r.Data : (r.ResponseBase&&r.ResponseBase.Data);
  return d ? unb64(d) : "";
}
const qeval  = expr => abci("vm/qeval",  PKG+"."+expr);
const qrender = pth => abci("vm/qrender", PKG+":"+pth);

/* qeval returns typed lines like `(123 int64)` or `("orem" string)`, one per
   returned value. Parse tolerantly into JS values. A read that panics becomes a
   query error (caught by the caller), never a silent false — so gate panic-y
   reads (AnswerVerdict, Verdict) behind HasAnswer/Settled first. */
function parseTyped(out){
  const lines = out.trim().split("\n").filter(Boolean);
  return lines.map(line=>{
    const m = line.match(/^\((.*)\s+([A-Za-z0-9_./\[\]]+)\)$/s);
    const raw = m ? m[1] : line;
    if(/^".*"$/s.test(raw)){ try{ return JSON.parse(raw); }catch(_){ return raw.slice(1,-1); } }
    if(raw==="true") return true; if(raw==="false") return false;
    if(/^-?\d+$/.test(raw)) return parseInt(raw,10);
    return raw;
  });
}
const one = async expr => parseTyped(await qeval(expr))[0];
const tup = async expr => parseTyped(await qeval(expr));
const gstr = s => JSON.stringify(String(s));   // gno string literal

/* ============================ demo dataset ============================== */
/* A faithful sample so every screen and state renders offline, in the realm's

    .filter(([,d])=> d.phase==="open" && d.seeded===true)

   failed read renders as "read failed", never a guess. */
async function listClaimsPage(slug, page, total, parsed){
  const hi = total-(page-1)*PAGE_N, lo = Math.max(1, hi-PAGE_N+1);
  if(hi<1) return [];
  const have = new Map((parsed||[]).map(c=>[c.id,c]));
  const need=[]; const out=[];
  for(let i=hi;i>=lo;i--){ if(have.has(i)) out.push(have.get(i)); else need.push(i); }
  if(need.length){
    const s2=gstr(slug);
    const fetched = await inChunks(need, 6, async i=>{
      try{
        const hidden = await one(`HiddenFromListing(${s2},${i})`).catch(()=>true); // fail closed: an unreadable moderation state never lists
        if(hidden) return null;
        const [t,st] = await Promise.all([one(`ClaimTitle(${s2},${i})`).then(unesc), one(`ClaimStatus(${s2},${i})`)]);
        return {id:i, title:t, statusText:st};
      }catch(_){ return {id:i, title:"read failed — reload to retry", statusText:"", failed:true}; }
    });
    out.push(...fetched.filter(Boolean));
  }
  return out.sort((a,b)=>b.id-a.id);

    one(`ClaimTitle(${s},${i})`).then(unesc), one(`ClaimStatus(${s},${i})`), tup(`StakePools(${s},${i})`),
    tup(`PoolConviction(${s},${i})`), tup(`TrailingOI(${s},${i},${WEEK})`), tup(`TrailingYes(${s},${i},${WEEK})`),
    one(`HasAnswer(${s},${i})`), one(`DisputeOpen(${s},${i})`), one(`Settled(${s},${i})`),
    one(`ProvClose(${s},${i})`), one(`Provisional(${s},${i})`), one(`ClaimClosed(${s},${i})`).catch(()=>false),
    // A realm deployed before bodies existed has no ClaimBody, and a claim page
    // that fails whole because of a missing optional field would be the worse
    // bug. Empty is the same answer as "this claim has no body".
    one(`ClaimBody(${s},${i})`).then(unesc).catch(()=>"")]);
  const d = {id, title, body, statusText:status, yesStake:pools[0], noStake:pools[1],
    convYes:pconv[0], convNo:pconv[1], trailOImature:toi[1], trailOI:toi[0], trailYesMature:tyes[1], trailYesAvg:tyes[0],
    answered, disputeOpen, settled, provClose, provisional, closed};
  if(answered){
    const answerer = await one(`Answerer(${s},${i})`);
    const [ans,bond,rec,settleAt,tierT,flagState,flagBond] = await Promise.all([
      one(`AnswerVerdict(${s},${i})`), one(`AnswerBond(${s},${i})`), one(`AnswerRecord(${s},${gstr(answerer)})`).catch(()=>0),
      one(`SettleDeadline(${s},${i})`), tup(`QualityTier(${s},${i})`), one(`FlagState(${s},${i})`),
      one(`FlagBondNext(${s},${i})`).catch(()=>0)]);
    Object.assign(d,{answer:ans, answerer, answerBond:bond, record:rec, settleAt, tier:tierT[0], tierFinal:tierT[1], flagState, flagBondNext:flagBond});
    d.flagOpen = flagState==="voting";
    d.counterOpen = flagState==="counter-window";
  }
  if(answered && !settled){
    d.round = await one(`FailedRounds(${s},${i})`).catch(()=>0);
    d.disputeBondNext = await one(`DisputeBondNext(${s},${i})`).catch(()=>0);
    d.escrowUntil = await one(`EscrowUntil(${s},${i})`).catch(()=>0);
    // the running round's own bar was snapshotted at open and is unexposed;
    // this is the bar a NEW dispute faces today — labeled that way in the UI
    if(disputeOpen) d.quorumFloor = await one(`QuorumFloorOf(${s},${i})`).catch(()=>null);
  }
  if(settled && !provClose){ d.verdict = await one(`Verdict(${s},${i})`).catch(()=>-1); d.route = await one(`VerdictRoute(${s},${i})`).catch(()=>""); }
  if(await one(`Crystallized(${s},${i})`).catch(()=>false)){
    const ds = await tup(`DrawSlices(${s},${i})`); d.crystallized=true; d.draw={w:ds[0],a:ds[1],ans:ds[2],carrot:ds[3]};
  }

  d.phase = d.closed?"closed": d.provClose?"provClose": d.settled?"settled": d.disputeOpen?"disputed": (d.provisional>=0?"provisional": d.answered?"answered":"open");
  return d;
}

/* statusText mirrors the realm's claimStatus precedence for the demo; live mode
   reads ClaimStatus directly (one qeval, no md-scrape). */
function statusText(d){
  if(d.phase==="closed") return "closed — never answered; stakes were never frozen (unstake freely), the deposit refunded, the fee burned";
  if(d.phase==="provClose") return "closed without a decision — everyone withdraws 1×, deposit and fee refunded";
  if(d.phase==="settled") return "settled — every stake withdraws 1×";
  if(d.phase==="disputed") return "disputed — a sealed vote is deciding; principal is never withheld";
  if(d.phase==="provisional") return "provisional verdict — reopenable by a new dispute; the losing side may withdraw 1× now";
  if(d.phase==="answered") return "answered — staking frozen; disputable, then it settles undisputed";
  return "open — stake YES or NO; unstake freely until an answer posts";

/* ============================ formatting ================================ */
const sideName = o => o===0?"YES":o===1?"NO":"—";
function fmtN(n){ return (n==null?0:Math.round(n)).toLocaleString("en-US"); }
/* Amounts are denominated in a COURT's coin, and each court has its own —
   so the unit is KOURT:SLUG, not a generic "CC". Pass the slug wherever one
   is in scope; the bare fallback exists only for the few cross-court
   surfaces (the needs feed) where no single court owns the number. */
/* The curve's marginal price is minted/1e9 µGNOT per unit and the chain serves
   it as an INTEGER (curve.gno: `Price(s) = s / c.d`), so every court under
   1,000 CC minted reports 0 — which the page then printed as a headline "0
   µGNOT/unit", reading as free, while the buy panel beside it quoted a real
   fractional price computed from the same curve. A freshly seeded node is
   always in that range, so this is what an operator sees first.

   Below 1 we show the true sub-unit price rather than the floor. `minted` is
   already read for the buy quote; when it is absent we say "under 1" instead of
   inventing a number. */
function priceText(price, minted){
  if(price>0) return fmtN(price);
  if(minted===0) return "0";   // nothing minted yet: the marginal price really is zero
  if(minted!=null && minted>0){
    const p = minted/1e9;
    return p>=0.001? p.toFixed(4).replace(/0+$/,"").replace(/\.$/,"") : "<0.001";
  }
  return price===0? "under 1" : fmtN(price);
}
function ccSym(slug){ return slug? "KOURT:"+String(slug).toUpperCase() : "court coin"; }
function cc(n, slug){ const v=(n||0)/1e6;
  return (v>=1000? fmtN(v): v.toFixed(v<10?2:1))+" "+ccSym(slug); }
function ugnot(n){ return fmtN(n)+" µGNOT"; }
function shortAddr(a){ a=String(a||""); return esc(a.length>12? a.slice(0,7)+"…"+a.slice(-4): a); }
function wall(nowH, targetH){
  const secs=(targetH-nowH)*BLOCK_SECS, past=secs<0, s=Math.abs(secs);
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  let t = d? d+(d===1?" day":" days") : h? h+(h===1?" hour":" hours") : Math.max(1,m)+" min";
  return past? t+" ago" : "about "+t;
}
/* Moderation provenance on the claim page: one banner, precedence mirroring
   the chain's own switch (purged, then redacted, then plain hide) — a listing
   act stated in the administrative register, never a verdict. */
function modBanner(mPurged, mRedacted, mHidden, slug){
  if(mPurged===true) return `<div class="notice void"><span class="g">▤</span><div><b>Removed on legal grounds.</b>
    The claim's lifecycle is unaffected: stakes, verdict and refunds proceed. The category code stands in place of the title.
    <a class="small" href="#/raw/${esc(slug)}/mod" style="color:var(--accent-2)">the moderation log →</a></div></div>`;
  if(mRedacted===true) return `<div class="notice void"><span class="g">▤</span><div><b>Text withheld pending review.</b>
    IDs, state, deadlines and balances still render, so you can always act on a position.
    <a class="small" href="#/raw/${esc(slug)}/mod" style="color:var(--accent-2)">the moderation log →</a></div></div>`;
  if(mHidden===true) return `<div class="notice void"><span class="g">▤</span><div><b>De-listed by moderation.</b>
    Listed nowhere, reachable by direct link — you are on that link now; the lifecycle is unaffected.
    <a class="small" href="#/raw/${esc(slug)}/mod" style="color:var(--accent-2)">who and why — the moderation log →</a></div></div>`;
  return "";
}
/* The docket's impersonal clock: only frozen rows have one, and a disputed
   row NEVER does in either mode — the chain publishes no close height. */
function clockLine(nowH, phaseShort, settleAt, escrowUntil){
  if(phaseShort==="in dispute")
    return "a sealed vote is deciding — no close height is published";
  if(phaseShort==="answered" && settleAt)
    return nowH!=null? (settleAt>nowH? `settles undisputed at ≈block ${fmtN(settleAt)} — in ${wall(nowH,settleAt)} unless disputed`
                                     : "the settle window has passed — anyone may settle it now")
                     : `settles undisputed at ≈block ${fmtN(settleAt)}`;
  if(phaseShort==="settling" && escrowUntil)
    return nowH!=null? (escrowUntil>nowH? `reopenable until ≈block ${fmtN(escrowUntil)} — in ${wall(nowH,escrowUntil)}`
                                        : "the reopen window has closed — finalizable")
                     : `reopenable until ≈block ${fmtN(escrowUntil)}`;
  return "";
}
function pctYes(y,n){ const t=(y||0)+(n||0); return t>0? Math.round(1000*y/t)/10 : null; }
/* A per-claim sparkline from the three ratio series the realm actually keeps:
   lifetime conviction -> trailing week -> instantaneous. No invented history. */
function sparkSvg(pts){
  const W=60,H=16,P=2,n=pts.length;
  const xy=pts.map((p,i)=>(P+i*(W-2*P)/(n-1)).toFixed(1)+","+(H-P-(Math.max(0,Math.min(100,p))/100)*(H-2*P)).toFixed(1));
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line class="base" x1="${P}" y1="${H/2}" x2="${W-P}" y2="${H/2}"></line><polyline points="${xy.join(" ")}"></polyline></svg>`;
}
function claimSeries(d){
  const inst=pctYes(d.yesStake,d.noStake);
  const life=pctYes(d.convYes,d.convNo);
  const week=(d.trailYes!=null)? d.trailYes
    : (d.trailYesMature&&d.trailOImature&&d.trailOI>0? Math.round(1000*d.trailYesAvg/d.trailOI)/10 : null);
  return ([inst,life,week].every(Number.isFinite))? [life,week,inst] : null;
}
/* THE DOCKET'S SIGNAL CELL, and why it is not just sparkSvg().
   The three-point spark needs all THREE series — lifetime conviction, the
   trailing week, and the instant ratio — so claimSeries() returns null unless
   every one of them is finite. That is right: "LIVE never invents history", and
   a line drawn through a series the chain has not matured yet would be a
   fabrication.
   But the CELL then rendered empty. The trailing week is not mature until
   answerWindow blocks have passed, so on a real chain that is every young claim
   — a blank space beside rows carrying a number, with nothing to say whether the
   claim has no stake or the page simply could not draw it. Measured on a seeded
   node: the docket showed nothing at all.
   So: draw the line when there is a line, show the ratio when only the ratio is
   known, and say plainly when there is neither. */
function docketSignal(ser, inst){
  if(ser) return `${sparkSvg(ser)}<b>${ser[2].toFixed(1)}%</b><small>YES now</small>`;
  if(Number.isFinite(inst))
    return `<b>${inst.toFixed(1)}%</b><small>YES now · no trend yet</small>`;
  return `<small class="muted">not staked yet</small>`;
}
function esc(s){ return String(s).replace(/[&<>"'`]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c])); }
/* undo the realm's markdown inline-escaping (\[ \] \( …) when we lift a title
   out of a Render link back into our own escaped DOM text. */
function unesc(s){ return String(s).replace(/\\([\\`*_\[\]()~>\-+.!#<&])/g, "$1"); }

/* Untrusted text (claim titles, court names by strangers): HTML-escaped.
   The realm sanitizes for its markdown; the overlay must not re-introduce a hole. */
function safeInline(s){ return esc(s); }
/* THE CLAIM'S OWN STATEMENT OF WHAT IT MEANS — what would settle it, what is in
   view, what it is not asking. COURTS_STRUCTURE.md §4: fixed at creation, because
   a revisable body would let an author take a position, watch the market, then
   rewrite the framing until their side is the true one.

   Escaped, then split on blank lines into paragraphs. NOT markdown: the realm
   sanitises the body for ITS renderer's markdown, and re-interpreting the same
   text as markup here would be a second, differently-shaped attack surface on a
   field any stranger can fill. Paragraphs are all the structure a question of
   fact needs. Blank-line splitting matches the realm's own sanitize.Block, which
   is what normalised the breaks in the first place. */
function claimBody(d){
  const raw = d && typeof d.body === "string"? d.body.trim() : "";
  if(!raw) return "";
  const paras = raw.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  if(!paras.length) return "";
  return `<div class="claimbody">${paras.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
}

/* ============================ tx links ================================== */
/* Every action is a gnoweb $help link with arguments pre-filled — the overlay is
   optional: the transaction is the realm's, signed in the user's own wallet.
   The realm's funcs are crossing (func F(cur realm, …)); gnoweb injects `cur`, so
   the links carry only the ordinary arguments. */
function tx(func, args){
  const q = Object.entries(args||{}).map(([k,v])=>"&"+k+"="+encodeURIComponent(v)).join("");
  return CFG.gnoweb.replace(/\/$/,"")+"/r/kourt/kourtv2$help&func="+func+q;
}
function btn(label, func, args, cls, sub, send, gate){
  // In demo mode the data is a sample: an action that links a real network to
  // sample arguments is a trap, so the button is inert and says why.
  // `send` (Buy only): a concrete "<µGNOT>ugnot" from the receipt input — it
  // prefills the CLI --send and the Adena amount. `gate` marks the one-click
  // paths as needing the acknowledgement tick first (live only).
  const inner = `<span class="g">↗</span> ${esc(label)}${sub?` <small>${esc(sub)}</small>`:""}`;
  const action = CFG.mode==="demo"
    ? `<button class="btn ${cls||""} inert" data-inert="1">${inner}</button>`
    : (gate
      // no href while gated: a bare <a> can't be middle-clicked or "opened in
      // new tab" around the acknowledgement — ticking it re-renders with href
      ? `<a class="btn ${cls||""}" data-needack="1" aria-disabled="true" role="link"${send?` title="attach ${esc(send)} in the form's send field"`:""}>${inner}</a>`
      : `<a class="btn ${cls||""}"${send?` title="attach ${esc(send)} in the form's send field"`:""} target="_blank" rel="noopener" href="${esc(tx(func,args))}">${inner}</a>`);
  return `<span class="act">`
    + action
    + `<button class="clitog" data-cli="${esc(cliCmd(func,args,send))}" title="Show the command line for this action">CLI</button>`
    + (CFG.addr && CFG.mode==="live"? `<button class="signbtn"${gate?" disabled":""} data-func="${esc(func)}" data-args="${esc(JSON.stringify(args||{}))}"${send?` data-send="${esc(send)}"`:""} title="Sign and broadcast with Adena">✍ Sign</button>`:"")
    + `</span>`;
}

/* The same action as a gnokey command, for people at a terminal. One --args per
   argument; --send only where the function takes payment (Buy). The fee shape
   follows the documented floor: 10M gas at the genesis price costs exactly
   10000ugnot, and --gas-fee is taken in full, so nothing larger is suggested. */
function cliCmd(func, args, send){
  let c = (CFG.mode==="demo"? "# demo data — these entities exist on no chain; switch Source to a live node first\n" : "")
        + (func==="Buy"? "# one-way: the GNOT is burned; no sell-back\n" : "")
        + "gnokey maketx call \\\n  --pkgpath \"" + PKG + "\" --func \"" + func + "\"";
  for(const k of Object.keys(args||{})) c += " \\\n  --args \"" + String(args[k]) + "\"";
  if(func==="Buy") c += " \\\n  --send " + (send||"AMOUNTugnot");
  c += " \\\n  --gas-fee 10000ugnot --gas-wanted 10000000 --broadcast" +
       " \\\n  --chainid \"" + (CFG.chainid||"dev") + "\" --remote \"" + CFG.rpc + "\" YOURKEY";
  return c;
}

/* One delegated handler: any CLI toggle opens a copyable block after its action. */
document.addEventListener("click", (ev)=>{
  const t = ev.target.closest(".clitog"); if(!t) return;

  const pre = document.createElement("pre");
  pre.className = "cliblock mono";
  pre.textContent = t.dataset.cli;
  pre.title = "Click to copy";
  const selectPre = ()=>{ const r=document.createRange(); r.selectNodeContents(pre);
    const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); };
  const copy = ()=> navigator.clipboard? navigator.clipboard.writeText(t.dataset.cli)
    : Promise.reject(new Error("no-clipboard"));
  pre.onclick = ()=>{ copy().then(()=>{ pre.classList.add("copied"); setTimeout(()=>pre.classList.remove("copied"), 900); }).catch(selectPre); };
  const cb = document.createElement("button");
  cb.type = "button"; cb.className = "copybtn"; cb.textContent = "Copy";
  cb.setAttribute("aria-live","polite");
  cb.onclick = ()=>{ copy().then(()=>{ cb.textContent = "Copied ✓"; setTimeout(()=>{ cb.textContent = "Copy"; }, 1200); }).catch(()=>{ selectPre(); cb.textContent = "Selected — press Ctrl/⌘-C"; setTimeout(()=>{ cb.textContent = "Copy"; }, 2500); }); };
  t.parentElement.appendChild(pre);
  t.parentElement.appendChild(cb);
});

/* ============================ Adena wallet ============================= */
/* Optional. The page works fully without it: every action stays a gnoweb link
   and a CLI command. window.adena is injected asynchronously by the extension,
   so it is probed on click, never at load. Envelope: {code,status,data};
   code 0 = ok, 4000 = user rejected, 4001 = already connected (fine). */
function adenaAbsent(){
  const hint = document.getElementById("wallethint");
  hint.hidden = false;
  hint.textContent = location.protocol==="file:"
    ? "No wallet found. Extensions do not run on file:// pages — serve this folder (python3 -m http.server) and reload, or install Adena from adena.app."
    : "No wallet found. Install the Adena extension (adena.app), then click again.";
}
async function adenaConnect(){
  const a = window.adena;
  if(!a){ adenaAbsent(); return; }
  try{
    const est = await a.AddEstablish("Kourt");
    if(est.code!==0 && est.code!==4001){ throw new Error(est.message||("code "+est.code)); }
    const acct = await a.GetAccount();
    if(acct.code!==0 || !acct.data || !acct.data.address){ throw new Error(acct.message||"no account"); }
    CFG.addr = acct.data.address; saveCfg();
    reflectWallet();
    render();
  }catch(e){
    const hint = document.getElementById("wallethint");
    hint.hidden=false; hint.textContent = "Adena: "+(e.message||e);
  }
}
function adenaDisconnect(){ delete CFG.addr; saveCfg(); reflectWallet(); render(); }
async function adenaSign(func, args, el){
  const a = window.adena;
  if(!a){ adenaAbsent(); return; }
  const note = (m, ok) => {
    let n = el.parentElement.querySelector(".txnote");
    if(!n){ n = document.createElement("div"); n.className = "txnote"; n.setAttribute("role","status"); el.parentElement.appendChild(n); }
    n.textContent = m; n.classList.toggle("ok", !!ok);
  };
  if(el.disabled) return;
  el.disabled = true;
  try{
    const want = CFG.chainid || "dev";
    const net = await a.GetNetwork();
    if(net.code!==0){ note("Could not read Adena's network — unlock the wallet and retry."); return; }
    if(net.data && net.data.chainId && net.data.chainId!==want){
      const sw = await a.SwitchNetwork(want);
      if(sw.code!==0){ note("Adena is on "+net.data.chainId+"; switch it to "+want+" and try again."); return; }
    }
    // Every argument is confirmed before signing: several buttons carry
    // placeholder text (a claim title, a court name) that must never be
    // signed as-is.
    const keys = Object.keys(args||{});
    const vals = [];
    for(const k of keys){
      const v = window.prompt(func+" — "+k+":", String(args[k]));
      if(v===null){ note("Cancelled — nothing was signed."); return; }
      vals.push(v.trim());
    }
    let send = "";
    if(func==="Buy"){
      // The receipt input prefills the amount; the confirm prompt stays — a
      // spend is the one argument that must never go unconfirmed.
      const pre = (el.dataset.send||"").replace(/ugnot$/,"") || "1000000";
      const amt = window.prompt("GNOT to spend, in ugnot (this is burned — treat it as spent):", pre);
      if(amt===null){ note("Cancelled — nothing was signed."); return; }
      if(!/^[1-9][0-9]*$/.test(amt.trim())){ note("A whole, non-zero ugnot amount."); return; }
      send = amt.trim()+"ugnot";
    }
    note("Waiting for Adena…");
    const res = await a.DoContract({messages:[{type:"/vm.m_call", value:{
      caller: CFG.addr, send, pkg_path: PKG, func, args: vals
    }}]});
    if(res.code===0){ note("Sent. tx "+String(res.data&&res.data.hash||"").slice(0,12)+"…", true); setTimeout(render, 7000); }
    else if(res.code===4000){ note("Rejected in the wallet."); }
    else if(res.code===3001){ note("Adena's active account is not "+shortAddr(CFG.addr)+" — switch accounts in Adena or reconnect."); }
    else note("Adena: "+(res.message||("code "+res.code)));
  }catch(e){ note("Adena: "+(e.message||e)); }
  finally{ el.disabled = false; }
}
document.addEventListener("click",(ev)=>{
  const d = ev.target.closest("[data-inert]");
  if(d){ let n=d.parentElement.querySelector(".txnote");
    if(!n){ n=document.createElement("div"); n.className="txnote"; n.setAttribute("role","status"); d.parentElement.appendChild(n); }
    n.textContent="Demo data — actions work on a live node. Switch Source in the left rail."; return; }
