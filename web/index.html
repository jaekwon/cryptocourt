/* ===================== the account widget, top right ====================== */
/* WHAT IT SHOWS AND WHAT IT DOES NOT. The address, the GNOT that pays fees, and
   the coin of the court you are looking at. NOT every court's coin: that is
   meHoldings, which is a paginated per-court scan, and running it to fill a
   dropdown would put a dozen reads behind every render. The full picture is one
   click away and says so. */
/* A DECLARATION, not a const arrow. check-web-dupes protects this file from a
   silently-shadowed name by counting `function` declarations, and an arrow
   assigned to a const is invisible to it — so the one shape that guard cannot
   see is the one shape not to use here. */
function acctSlug(){ const m=/^#\/c\/([a-z0-9-]+)/.exec(location.hash||""); return m? m[1] : ""; }

/* µGNOT for one address, or null when the read FAILED — which is not zero.
   Three answers from bank/balances, measured against a gnodev chain:
     funded          "12345ugnot"   (the payload carries its own quotes)
     valid, empty    ""             a real zero
     bad address     query error    caught by the caller
   A failed read rendered as 0 would tell somebody their coin is gone. */
async function gnotOf(addr){
  const raw = await abci("bank/balances/"+String(addr||""), "");
  const m = /(\d+)\s*ugnot/.exec(String(raw||""));
  return m? Number(m[1]) : 0;
}

function reflectAccount(){
  const who=document.getElementById("acctwho"), car=document.getElementById("acctcar");
  if(!who) return;
  who.textContent = CFG.addr? String(CFG.addr).replace(/^(.{7}).*(.{4})$/, "$1…$2") : "Connect";
  if(car) car.hidden = !CFG.addr;
  if(!CFG.addr) acctToggle(false);
}

function acctToggle(open){
  const pop=document.getElementById("acctpop"), btn=document.getElementById("acctbtn");
  if(!pop||!btn) return;
  const show = open===undefined? pop.hidden : !!open;
  pop.hidden = !show;
  btn.setAttribute("aria-expanded", show? "true":"false");
  if(show) acctFill();
}

/* Rendered twice: once immediately with what is already known, and again when
   the balances land. Without the first pass the menu opens empty for as long as
   the node takes, which reads as broken rather than as loading. */
async function acctFill(){
  const pop=document.getElementById("acctpop");
  if(!pop) return;
  if(!CFG.addr){ pop.innerHTML = `<p class="afull">Not connected.</p>`; return; }
  const slug = acctSlug();
  const head = `<p class="afull" id="acctfull">${esc(CFG.addr)}</p>`;
  const acts = `<div class="aacts"><a href="#/me" data-acctclose>Your positions</a>`
    + `<button type="button" data-acctcopy>Copy address</button>`
    + `<button type="button" data-acctoff>Disconnect</button></div>`;
  const row = (l,r) => `<div class="arow"><span class="l">${l}</span><span class="r">${r}</span></div>`;
  pop.innerHTML = head + row("GNOT","<span class=\"muted\">reading…</span>")
    + (slug? row(ccSymHtml(slug),"<span class=\"muted\">reading…</span>") : "") + acts;
  if(!isLive()){
    pop.innerHTML = head + row("GNOT","<span class=\"muted\">demo — no chain</span>")
      + (slug? row(ccSymHtml(slug), cc(await balanceOf(slug,CFG.addr), slug)) : "") + acts;
    return;
  }
  /* SETTLED, NOT all-or-nothing: one unreadable balance must not blank the other,
     and neither may be reported as a number when its read failed. */
  const [g, c] = await Promise.allSettled([gnotOf(CFG.addr),
    slug? balanceOf(slug, CFG.addr) : Promise.resolve(null)]);
  const gtxt = g.status==="fulfilled"
    ? gnotAmt(g.value)
    : `<span class="muted">could not read</span>`;
  const ctxt = c.status==="fulfilled" && c.value!=null
    ? cc(Number(c.value), slug) : `<span class="muted">could not read</span>`;
  /* THE ZERO IS THE INTERESTING CASE, and it is the one the reader hits: with no
     GNOT a wallet cannot pay a fee, so Adena greys out its own approve button and
     nothing on this page can explain why. Named here, where the number is. */
  const warn = (g.status==="fulfilled" && g.value===0)
    ? `<p class="awarn">No GNOT — a wallet cannot pay a transaction fee, so signing will be refused before it reaches the court.</p>` : "";
  pop.innerHTML = head + row("GNOT", gtxt) + (slug? row(ccSymHtml(slug), ctxt) : "") + warn + acts;
}

/* ======================= the claim composer ============================= */
/* The browser glue the composer's core deliberately does not contain: a canvas,
   a network, and the page's own action machinery. media.js holds every rule and
   is exercised by two standalone harnesses; this is the part that can only run
   in a browser, which is exactly why it lives on this side of the line.

   Collapsed until asked for. Most people reading a court are not filing, and a
   drop zone open on every court page would be furniture. */
function mountCompose(host, slug){
  if(!host) return;
  /* THE REALM'S CURRENT ALLOWLIST, not the one this file shipped with. It is an
     admin parameter now, so a host can be dropped on chain — that is the kill
     switch §10.4 asked for — and a composer still offering it would let somebody
     sign a claim the realm then refuses. Read once, applied when it lands, and
     ignored on failure: a realm too old to answer leaves the defaults, which is
     what it validates against anyway. */
  if(isLive() && typeof mediaSetHosts === "function"){
    one(`MediaHosts()`).then(unesc).then(line => {
      const got = mediaParseHosts(line);
      if(got) mediaSetHosts(got.exact, got.suffixes);
    }).catch(()=>{});
  }
  const wrap = document.createElement("div");
  wrap.className = "composewrap";
  const open = document.createElement("button");
  open.type = "button"; open.className = "btn composeopen";
  open.textContent = "Open a claim with evidence";
  wrap.appendChild(open);
  host.appendChild(wrap);

  let panel = null, composer = null;
  open.addEventListener("click", () => {
    if(panel){ panel.remove(); panel = null; composer = null; open.textContent = "Open a claim with evidence"; return; }
    open.textContent = "Close";
    panel = document.createElement("div");
    panel.className = "composepanel";
    wrap.appendChild(panel);
    build(panel);
  });

  /* Resize and re-encode. THE PERSON IS TOLD NOTHING ABOUT THIS: a 12-megapixel
     photo becomes a small WebP and the cap it would have violated is never
     mentioned. createImageBitmap and canvas are both old enough to rely on, and
     a browser without them fails this one file rather than the page. */
  async function prepare(file){
    const bmp = await createImageBitmap(file);
    const fit = mediaFitWithin(bmp.width, bmp.height, MEDIA_MAX_EDGE);
    const canvas = document.createElement("canvas");
    canvas.width = fit.w; canvas.height = fit.h;
    canvas.getContext("2d").drawImage(bmp, 0, 0, fit.w, fit.h);
    // The policy lives in media.js so a harness can exercise it; only toBlob
    // itself is browser-only, which is the point of passing it in.
    const {blob} = await mediaEncodeUnder(
      q => new Promise(r => canvas.toBlob(r, "image/webp", q)), MEDIA_MAX_BYTES);
    return {mime:"image/webp", w:fit.w, h:fit.h,
            bytes:new Uint8Array(await blob.arrayBuffer())};
  }

  function archiveBase(){
    // Same origin as the page. The archive is served from /m by the same nginx
    // that serves this file, so there is nothing to configure and nothing to
    // get wrong in a second place.
    //
    // IT HAS TO BE ABSOLUTE, and returning "" made it relative. The archive
    // answers an upload with {"url": "/m/<sha256>"}, mediaUpload prefixes it
    // with this base, and the result becomes the exhibit's mirror — which then
    // has to pass mediaMirrorFault, which refuses anything that is not https.
    // So every uploaded image failed with "a link starts with https://" and the
    // claim could not be signed at all. The realm would have refused the same
    // line for the same reason.
    return siteHost() ? location.origin : "";
  }

  async function upload(bytes, mime, sha256){
    // `court` is what lets the archive keep these bytes if this tab closes
    // before the claim is broadcast — nothing would call /m/claimed then, and
    // the court is the only thread back to them.
    return mediaUpload(bytes, mime, {base: archiveBase(), sha256, court: slug});
  }

  function build(el){
    const title = document.createElement("input");
    title.type = "text"; title.className = "composetitle"; title.maxLength = 200;
    title.placeholder = "Your claim of fact";
    title.setAttribute("aria-label", "Claim title");

    const body = document.createElement("textarea");
    body.className = "composebody"; body.rows = 4; body.maxLength = 2000;
    body.placeholder = "What would settle it — the evidence in view, and what this is NOT asking";
    body.setAttribute("aria-label", "Claim body");

    const media = document.createElement("div");
    /* THE LAST LOOK BEFORE A SIGNATURE. mediaReview has existed since the
       composer was written, with its own tests, and nothing ever called it —
       so the one piece of friction the design asks for was the one piece
       missing. Its comment says why: a caption is claim text, fixed at
       creation, with no editor even in the polish window where a title can
       still be corrected. A typo is permanent and the only remedy is to close
       the claim and file it again. */
    const review = document.createElement("div");
    review.className = "composereview";
    const actions = document.createElement("div");
    actions.className = "actions"; actions.style.marginTop = "10px";
    const warn = document.createElement("p");
    warn.className = "medianote"; warn.setAttribute("role", "status");

    el.appendChild(title); el.appendChild(body); el.appendChild(media);
    el.appendChild(review); el.appendChild(warn); el.appendChild(actions);

    // A DRAFT SURVIVES A CLOSED TAB. The bytes are already safe — uploaded and
    // addressed by hash — so this only has to remember the addresses.
    const draft = mediaLoadDraft(window.localStorage, slug);
    if(draft){ title.value = draft.title; body.value = draft.body; }

    composer = mediaNewComposer({
      siteDomain: siteHost(),
      previewURL: f => URL.createObjectURL(f),
      prepare, upload,
      onChange: () => { mounted && mounted.draw(); refresh(); },
    });
    /* pasteScope is `el`, the whole panel, so ⌘V lands wherever the cursor is —
       which after typing a claim is the title, not the drop zone. See the paste
       handler in media.js for why that was not true until it was measured. */
    const mounted = mediaMount(media, composer, {doc: document, pasteScope: el});
    if(draft && draft.items.length) composer.seed(draft.items);
    // Named so the sign handler can clear it once a broadcast is confirmed, and
    // only then: a rejected signature must leave the work exactly where it was.
    COMPOSE_DRAFT_COURT = slug;

    title.addEventListener("input", refresh);
    body.addEventListener("input", refresh);
    refresh();

    function refresh(){
      mediaSaveDraft(window.localStorage, slug, title.value, body.value, composer.items);
      const arg = composer.argument();
      const fault = composer.fault();
      const args = {courtSlug: slug, title: title.value || "", body: body.value || "",
                    media: arg};
      actions.innerHTML = "";

      // THE THREE AFFORDANCES, kept whole. The gnoweb link is offered normally
      // and withdrawn only when the request would actually overflow — measured,
      // not guessed — and it says which paths still carry the whole claim.
      const canLink = mediaHelpLinkFits(arg);
      actions.innerHTML = btn(
        arg ? "File this claim with its evidence" : "File this claim",
        "OpenClaimPM", args, "", composer.count()
          ? `${composer.count()} exhibit${composer.count()===1?"":"s"}` : "no evidence attached");
      if(!canLink){
        const a = actions.querySelector("a.btn");
        if(a){ a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); }
      }

      /* Rebuilt each time rather than patched: it is a summary of the list, and
         the list changes under it. textContent throughout — every string here
         except the headings came from the person, and one of them is a caption
         the chain will store. */
      review.textContent = "";
      if(typeof mediaReview === "function"){
        const rv = mediaReview(composer.items);
        if(rv.lines.length){
          const h = document.createElement("p");
          h.className = "reviewhead"; h.textContent = rv.permanent;
          review.appendChild(h);
          const ul = document.createElement("ul");
          ul.className = "reviewlist";
          for(const l of rv.lines){
            const li = document.createElement("li");
            const marks = [];
            if(!l.copied) marks.push("no copy yet");
            if(!l.verified) marks.push("no fingerprint");
            li.textContent = `${l.n}. ${l.kind} — ${l.caption}`
                           + (marks.length? ` · ${marks.join(" · ")}` : "");
            ul.appendChild(li);
          }
          review.appendChild(ul);
          for(const w of rv.warnings){
            const p = document.createElement("p");
            p.className = "reviewwarn"; p.textContent = w;
            review.appendChild(p);
          }
        }
      }

      const bits = [];
      if(fault) bits.push(fault);
      if(!canLink) bits.push(MEDIA_HELP_LINK_TOO_LONG);
      if(composer.busy()) bits.push("Still copying an exhibit — you can file now, or wait for the copy.");
      /* SAID BEFORE THE SEVENTH PHOTO, not after. A mirror must be https — here
         and in the realm — so on a page served over http no copy this composer
         makes can ever be filed, and every exhibit added will break one after
         another with the same message. That is the whole point of this file
         saying no before the chain does; the deployment is just a condition it
         can check earlier than any exhibit. Local overlays are http, so this is
         a developer's first encounter with the feature. */
      if(composer.count() && siteHost() && location.protocol !== "https:")
        bits.push("This page is served over http, and the court only takes https links — "
                + "an image copied here cannot be filed. Paste each image's own https link instead.");
      if(!title.value.trim()) bits.push("A claim needs a title.");
      // One per line. Joined with spaces they read as a single sentence, and
      // "...imgur or GitHub work A claim needs a title." is two separate pieces
      // of advice welded together. textContent still, so nothing here is markup.
      warn.textContent = bits.join("\n");

      // The sign path reads data-args at click time, so keeping the attribute
      // current is the whole integration — no second code path to drift.
      const sign = actions.querySelector("[data-act]");
      if(sign){
        sign.dataset.args = JSON.stringify(args);
        sign.disabled = !!fault || !title.value.trim();
      }
    }
  }
}

/* ============================ router =================================== */
const main = document.getElementById("main");
/* Restart the enter animation even when the route did not change class — the
   class has to come OFF and a layout be read before it goes back on, or a repeat
   navigation (same route, new id) plays nothing and the click reads as ignored,
   which is the complaint this exists for. */
function viewEnter(){
  if(!main) return;
  /* A FULL-SCREEN VIEW IS NEVER ANIMATED, because animating it is what makes it
     stop being full screen. The map renders a .mapfull pinned to inset:0, and a
     position:fixed element resolves against the nearest TRANSFORMED ancestor
     rather than the viewport — so the moment #main takes a transform, a map that
     covered the screen collapses into #main's column. Reported as "the map used
     to be bigger when you click on map, now it's the small map again".
     Cheap to check and it reads as nothing missing: a view that already fills the
     screen has no edge to slide in from. */
  if(main.querySelector(".mapfull")) return;
  main.classList.remove("vin");
  void main.offsetWidth;
  main.classList.add("vin");
}
const routes = [];
function on(re, fn){ routes.push([re,fn]); }
let renderSeq = 0, paintedSeq = 0;
/* The live chat panel's stop function. render() is async AND re-entrant, so a
   poller can outlive the DOM it was writing to; mountChat guards that with its
   own generation counter, and this is the other half — the timer is released
   promptly rather than at its next tick.

   Deleting the CHATSTOP() call below passes every browser check, and that is a
   fact about reachability rather than a gap: the checks run in demo mode, where
   there is no poller and so no timer to release, and mountChat's generation
   counter already makes a stale tick inert. The property this line actually
   carries — that the pending timer is gone rather than merely harmless — is
   pinned in web/tests/chat_test.js, which counts outstanding timers directly. */
let CHATSTOP = null;
/* Query params ride the hash (#/c/orem?p=2) so pages, back/forward, and
   shared links all land on the same window. Routes match the path part. */
let QP = {};
/* The seeded-chain warning. A node whose test clock was ever armed carries
   fabricated dates FOREVER — sealing takes away the steering wheel, not the
   invented history — so this asks TestClockFabricated rather than
   TestClockActive, and a sealed demo chain still says so.

   It sits outside #main on purpose: every route replaces main.innerHTML, and a
   warning that blinks out on navigation is worse than none. Cached per RPC
   endpoint, so it costs one query per node and not one per page.
   Demo mode never shows it — nothing there claims to be a chain. */
/* WHERE AN EMBED'S NUMBERS COME FROM, in one short line.
   The full banner is a paragraph. It is the right size for a page and the wrong
   size for a 400x340 card pasted into somebody's article — measured, it ate the
   top third and pushed the card's only exit link below the fold. So an embed
   carries THIS instead of a banner of its own.
   It also covers a case the banner never did: DEMO mode. Demo is the default
   for any reader who has never opened this page, so an embed's default state is
   invented courts with invented stakes — and the one element that admitted it
   ("Demo data", in the rail) is display:none in an embed. A card that travels
   to other people's websites has to say what it is. Returns null only for the
   one honest case: a live node whose clock was never faked. */
async function sourceNote(){
  if(!isLive()) return "sample data — these courts exist on no chain";
  return null;
}
async function render(){
  const seq = ++renderSeq;
  const raw = location.hash.replace(/^#/,"") || "/";
  const qx = raw.indexOf("?");
  const hash = qx<0? raw : raw.slice(0,qx);
  QP = {};
  if(qx>=0) for(const kv of raw.slice(qx+1).split("&")){
    const eq=kv.indexOf("="); const k=eq<0?kv:kv.slice(0,eq);
    if(k){ try{ QP[k]=decodeURIComponent(eq<0?"":kv.slice(eq+1)); }catch(_){ QP[k]=""; } } }
  setNav(hash);
  embedMark(hash);
  for(const [re,fn] of routes){
    const m = hash.match(re);
    if(m){ try{ await fn(...m.slice(1)); }catch(e){ errorView(e); }
      if(seq===renderSeq){ paintedSeq=seq; viewEnter(); return; }
      // Stale. If the newer render is still in flight it will paint over us —
      // do nothing. Only if it already painted (we clobbered it) redraw once.
      if(paintedSeq>seq) return render();
      return; }
  }
  main.innerHTML = crumbs([{label:"Directory",href:"#/"},{label:"No such page"}]) + notFound("No such page.");
  paintedSeq = seq;
  viewEnter();
}
function setNav(hash){
  const k = hash==="/"||hash.startsWith("/c")||hash.startsWith("/raw")?"dir": hash.startsWith("/me")?"me":
            hash.startsWith("/needs")?"needs": hash.startsWith("/about")?"about":"";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.k===k));
}
const AT_OK = new Set(["timeline","join"]); // ?at= allowlist — QP is user text, never a selector
const atTarget = () => (QP.at && AT_OK.has(QP.at))? document.getElementById(QP.at) : null;
window.addEventListener("hashchange", async ()=>{
  await render();
  const t = atTarget();
  if(t){ t.focus({preventScroll:true}); t.scrollIntoView(); return; }
  // a route that already landed focus (e.g. the map's ?focus node) keeps it —
  // an innerHTML swap leaves focus on <body>, so ordinary navigation passes through
  if(document.activeElement && document.activeElement!==document.body && main.contains(document.activeElement)) return;
  const h = main.querySelector(".page-h");
  if(h){ h.setAttribute("tabindex","-1"); h.focus(); }
});
// helper modals: open on [data-help], close on the button or the backdrop
document.addEventListener("click", ev=>{
  const open = ev.target.closest("[data-help]");
  if(open){ const dlg=document.getElementById(open.getAttribute("data-help"));
    if(dlg && dlg.showModal){ dlg.showModal(); ev.preventDefault(); } return; }
  const close = ev.target.closest("dialog.helper [data-close]");
  if(close){ close.closest("dialog").close(); return; }
  if(ev.target.matches("dialog.helper")) ev.target.close(); // the backdrop is the dialog itself
});
/* ONE path from the route to the picture, used by the preview and by both
   buttons. Built separately they could drift, and the whole point of showing a
   preview is that it is the file you are about to send. */
async function buildClip(){
  const m = location.hash.match(/^#\/c\/([a-z0-9-]+)(?:\/(\d+))?/);
  if(!m) return null;
  const slug = m[1], id = m[2] ? parseInt(m[2], 10) : null;
  const [cs, d, note] = await Promise.all([courtStats(slug).catch(()=>null),
                                           id == null ? Promise.resolve(null) : claimDetail(slug, id),
                                           sourceNote()]);
  const [ser, tl] = (id == null) ? [null, null] : await Promise.all([
    claimStakeSeries(slug, id, d).catch(()=>null), claimTimeline(slug, id, d).catch(()=>null)]);
  const bg = getComputedStyle(document.body).backgroundColor.match(/^rgb\((\d+)/);
  const isDark = bg && parseInt(bg[1], 10) < 128;
  const url = shareIsPublic() ? shareURLBase() + "#/c/" + slug + (id == null ? "" : "/" + id) : null;
  return {cv: drawClip(slug, id, d, cs ? cs.name : slug, isDark ? "dark" : "light", note, url, ser, tl),
          name: "kourt-" + slug + (id == null ? "" : "-" + id) + ".png"};
}
async function paintClipPreview(){
  const img = document.getElementById("clip-prev");
  if(!img) return;
  try{ const b = await buildClip(); if(b) img.src = b.cv.toDataURL("image/png"); }
  catch(e){ /* the buttons report their own failures; a blank slot is enough here */ }
}

/* Share panel: theme switch, copy, and the clip. Delegated like every other
   handler here, because the dialog is re-rendered with each claim. */
/* Copy the way the CLI blocks above already do it. The Clipboard API needs a
   SECURE CONTEXT: served over plain http:// from anything but localhost —
   which "host index.html on any static host" invites — navigator.clipboard is
   undefined outright. The first version of this handler was `if(clipboard)
   … .catch(()=>{})`, so on such a host the block did nothing at all: no copy,
   no message, and a cursor:copy still promising otherwise. Selecting the text
   and saying so is the fallback the rest of this file uses. */
function copyBlock(pre, btn){
  const say = m => { if(btn){ const o = btn.dataset.label || btn.textContent; btn.dataset.label = o;
    btn.textContent = m; setTimeout(()=>{ btn.textContent = btn.dataset.label || "Copy"; }, 2200); } };
  const select = ()=>{
    const r = document.createRange(); r.selectNodeContents(pre);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    say("Selected — press Ctrl/⌘-C");
  };
  const done = ()=>{ pre.classList.add("copied"); setTimeout(()=>pre.classList.remove("copied"), 900);
    say("Copied ✓"); };
  if(!navigator.clipboard){ select(); return; }
  navigator.clipboard.writeText(pre.textContent).then(done).catch(select);
}

document.addEventListener("click", async ev=>{
  // The generic [data-help] handler opens the dialog; this fills the one thing
  // it cannot know how to draw. Not an early return: the other branches below
  // simply will not match this target.
  if(ev.target.closest('[data-help="share-dlg"]')) paintClipPreview();
  const th = ev.target.closest("[data-embtheme]");
  if(th){
    const m = location.hash.match(/^#\/c\/([a-z0-9-]+)(?:\/(\d+))?/);
    if(m){
      const snip = document.getElementById("emb-snip");
      if(snip) snip.textContent = embedSnippet(m[1], m[2] ? parseInt(m[2],10) : null,
                                               {theme: th.getAttribute("data-embtheme") || null});
    }
    // Which of the three built what is on screen. Three identical buttons and a
    // changed snippet left that to be inferred.
    for(const b of document.querySelectorAll("[data-embtheme]"))
      b.setAttribute("aria-pressed", String(b === th));
    return;
  }
  // The keyboard path. A <pre> takes no focus, so click-to-copy alone made the
  // link and the snippet mouse-only — the same defect this project already
  // caught once in the helper-modal triggers.
  const cbtn = ev.target.closest("[data-copyfor]");
  if(cbtn){
    const t = document.getElementById(cbtn.getAttribute("data-copyfor"));
    if(t) copyBlock(t, cbtn);
    return;
  }
  const pre = ev.target.closest("pre[data-copytext]");
  if(pre){
    copyBlock(pre, document.querySelector('[data-copyfor="' + pre.id + '"]'));
    return;
  }
  const clip = ev.target.closest("[data-clip]");
  if(!clip) return;
  const say = document.getElementById("clip-say");
  try{
    const built = await buildClip();
    if(!built){ if(say) say.textContent = "could not build the image"; return; }
    const {cv, name} = built;
    if(clip.getAttribute("data-clip") === "download"){
      const a = document.createElement("a");
      a.download = name; a.href = cv.toDataURL("image/png"); a.click();
      if(say) say.textContent = "saved " + name;
      return;
    }
    // Copying an image needs a Blob and a permission the browser may refuse;
    // say which happened rather than failing silently.
    if(!navigator.clipboard || !window.ClipboardItem){
      if(say) say.textContent = "this browser cannot copy images — use Download"; return;
    }
    cv.toBlob(async blob=>{
      try{
        await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
        if(say) say.textContent = "copied to clipboard";
      }catch(e){ if(say) say.textContent = "the browser refused the clipboard — use Download"; }
    }, "image/png");
  }catch(e){ if(say) say.textContent = "could not build the image"; }
});

document.addEventListener("click", ev=>{
  const b = ev.target.closest("[data-introdismiss]"); if(!b) return;
  store.set("cc.intro","1");
  document.querySelectorAll("#intro, .crumbs .orient").forEach(el=>el.remove());
});

/* HOW MUCH OF THE CHAIN IS LEFT TO READ.
 *
 * A court map asks the node well over a hundred questions, and until they land
 * the page said "Reading the chain…" and nothing else — so a slow read and a
 * hung one looked identical. This counts the ones that are actually in flight.
 *
 * NO PERCENTAGE OF A KNOWN TOTAL, because there is no known total: each answer
 * can produce more questions. The bar is answered-over-asked, which dips when a
 * new batch is queued. That is honest — it went UP because there is more to do —
 * and it is the only ratio here that is not invented. */
const RPCQ = {started:0, done:0};
function rpcProgress(){
  const el = document.getElementById("rpcbar");
  if(!el) return;
  const {started, done} = RPCQ;
  if(!started) return;
  const pct = Math.round(done / started * 100);
  el.style.width = pct + "%";
  const n = document.getElementById("rpcnum");
  if(n) n.textContent = `${done} of ${started} answers`;
}
function loading(){
  // THE CHAT IS PER-COURT, so leaving a court must close it rather than leave
  // the last court's room open in the rail on a page it has nothing to do with.
  // Every route calls loading() first, and the court route re-opens it after.
  if(CHATSTOP){ CHATSTOP(); CHATSTOP = null; }
  const rc0 = document.getElementById("railchat");
  if(rc0){ rc0.hidden = true; rc0.innerHTML = ""; }
  RPCQ.started = 0; RPCQ.done = 0;
  main.innerHTML = `<div class="empty"><div class="g">⚖︎</div><p>Reading the chain…</p>
    <div class="rpcwrap"><div id="rpcbar" class="rpcbar"></div></div>
    <p id="rpcnum" class="rpcnum">asking…</p></div>`;
  rpcProgress();
}

/* ---------------- pagination (one pattern site-wide) ----------------
   Newest-first windows of 25, window state in the hash (?p=2). Captions
   state counts plainly; a live list never pretends to rows beyond what was
   actually read, and a failed row says "read failed", never a guess. */
const PAGE_N = 25;
function pageOf(){ const p=parseInt(QP.p||"1",10); return (Number.isFinite(p)&&p>0)? p:1; }
function pagerHtml(base, page, shown, total, label, order, chips){
  if(!(total>0)) return "";                 // an empty ledger has no order to state
  const lab = total===1? String(label||"rows").replace(/s$/,"") : (label||"rows");
  const lo=(page-1)*PAGE_N+1, hi=lo+shown-1;
  // links carry sort and p only — q mutates live, at/focus never belong on a listing
  const link=p=>{ const ps=new URLSearchParams(); if(QP.sort) ps.set("sort",QP.sort); if(p>1) ps.set("p",String(p)); const t=ps.toString(); return "#"+base+(t?"?"+t:""); };
  const cap = shown>0
    ? (page===1 && hi>=total? `all ${fmtN(total)} ${esc(lab)} · ${esc(order||"newest first")}`
                            : `showing ${fmtN(lo)}–${fmtN(hi)} of ${fmtN(total)} ${esc(lab)} · ${esc(order||"newest first")}`)
    : `page ${fmtN(page)} is past the end — ${fmtN(total)} ${esc(lab)} in all`;
  const nav = (total>PAGE_N || page>1)
    ? `${page>1?`<a class="pill void pnav" href="${esc(link(page-1))}">‹ newer</a>`:`<span class="pill void off pnav">‹ newer</span>`}${hi<total?`<a class="pill void pnav" href="${esc(link(page+1))}">older ›</a>`:`<span class="pill void off pnav">older ›</span>`}`
    : "";
  return `<div class="pager"><span class="mono small">${cap}</span>
    <span class="chips">${chips||""}${nav}</span></div>`;
}
function pageSlice(list, page){ return list.slice((page-1)*PAGE_N, page*PAGE_N); }

/* ---- D4 sort chips: a display re-order of the loaded rows, never a re-read.
   Scoped to [data-sortable] only — folder pages, the specimen tour, association
   dockets and /needs keep their load-bearing order. Keys ride data-* attrs
   stamped at build (demo) or by the spark fill (live); keyless rows sink. ---- */
const SORT_TAILS = {
  dk: { old: "oldest first (this window)",
        yes: "YES-share of stakes, high to low (this window) — stakes, never ballots" },
  dir:{ claims: "most claims filed first — deeper pages exist only in burn order" } };
function applySort(keyRaw){
  const boxes = document.querySelectorAll("[data-sortable]");
  if(!boxes.length) return;
  const kind = boxes[0].getAttribute("data-sortkind");
  const ok = kind==="dk"? {new:1,old:1,yes:1} : {rank:1,claims:1};
  const key = ok[keyRaw]? keyRaw : (kind==="dk"? "new":"rank");
  const dflt = key==="new"||key==="rank";
  const num=(n,a)=>{ const v=n.getAttribute(a); return (v==null||v==="")? null : parseFloat(v); };
  const cmp=(a,b)=>{
    if(kind==="dir"){
      if(key==="claims"){ const x=num(a,"data-claims"), y=num(b,"data-claims");
        if(x!=null||y!=null){ if(x==null) return 1; if(y==null) return -1; if(y!==x) return y-x; } }
      return num(a,"data-rank")-num(b,"data-rank");
    }
    const ia=num(a,"data-id"), ib=num(b,"data-id");
    if(key==="old") return ia-ib;
    if(key==="yes"){ const x=num(a,"data-yes"), y=num(b,"data-yes");
      if(x!=null||y!=null){ if(x==null) return 1; if(y==null) return -1; if(y!==x) return y-x; } }
    return ib-ia;
  };
  // appendChild detaches-and-reinserts, which blurs a focused row — keep it
  const hadFocus = document.activeElement && [...boxes].some(dk=>dk.contains(document.activeElement))? document.activeElement : null;
  boxes.forEach(dk=>{ [...dk.querySelectorAll("a.crow")].sort(cmp).forEach(n=>dk.appendChild(n)); });
  if(hadFocus && document.activeElement!==hadFocus){ try{ hadFocus.focus({preventScroll:true}); }catch(_){} }
  document.querySelectorAll(".schips [data-sort]").forEach(b=>
    b.setAttribute("aria-pressed", String(b.getAttribute("data-sort")===key)));
  // captions were baked with the ledger's order — swap the order tail in place
  document.querySelectorAll(".pager > span.mono.small").forEach(sp=>{
    if(!sp.dataset.cap0) sp.dataset.cap0 = sp.textContent;
    sp.textContent = dflt? sp.dataset.cap0
      : sp.dataset.cap0.replace(/ · [^·]*$/, " · "+((SORT_TAILS[kind]||{})[key]||""));
  });
  // a client-side order has no deeper pages on the directory — hide its nav
  document.querySelectorAll(".pager").forEach(pg=>pg.classList.toggle("hidenav", kind==="dir" && !dflt));
  // pager hrefs were baked at render — keep them carrying the active sort
  document.querySelectorAll(".pager a.pnav").forEach(a=>{
    try{ const [h,qs]=(a.getAttribute("href")||"").split("?"); const ps=new URLSearchParams(qs||"");
      if(dflt) ps.delete("sort"); else ps.set("sort", key);
      const t=ps.toString(); a.setAttribute("href", h+(t?"?"+t:"")); }catch(_){}
  });
  if(QCTX){ if(QCTX.orderTail0===undefined) QCTX.orderTail0=QCTX.orderTail;
    QCTX.orderTail = dflt? QCTX.orderTail0
      : " · "+(kind==="dk"? (key==="old"? "oldest first":"%YES of stakes, high to low") : "most claims filed first"); }
}
document.addEventListener("click", ev=>{
  const b = ev.target.closest(".schips [data-sort]"); if(!b) return;
  const key = b.getAttribute("data-sort");
  const dflt = key==="new"||key==="rank";
  try{ const raw=location.hash.replace(/^#/,"")||"/"; const [path,qs]=raw.split("?");
    const ps=new URLSearchParams(qs||"");
    if(dflt) ps.delete("sort"); else ps.set("sort", key);
    const t=ps.toString().replace(/\+/g,"%20");
    history.replaceState(null,"","#"+path+(t?"?"+t:""));
  }catch(_){}
  if(dflt) delete QP.sort; else QP.sort=key;
  applySort(key);
});

/* ---------------- search + jump (D2) ----------------
   A records office searches the drawer you're standing at: one filter row
   per listing surface, over the rows THIS PAGE loaded — never a pretended
   index. Zero reads. The same box jumps to a claim id on Enter. */
function qPredicate(hay, q){
  q = String(q||"").trim().toLowerCase();
  if(!q) return true;
  return String(hay||"").toLowerCase().includes(q);
}
function parseJump(q, slugCtx){
  q = String(q||"").trim().toLowerCase();
  let m = q.match(/^#?(\d+)$/);
  if(m){ const id=parseInt(m[1],10); if(id>0 && String(id)===m[1]) return {slug:slugCtx||null, id, bare:true}; return null; }
  m = q.match(/^([a-z0-9-]+)[\/ ]+#?(\d+)$/);
  if(m){ const id=parseInt(m[2],10); if(id>0 && String(id)===m[2]) return {slug:m[1], id, bare:false}; }
  return null;
}
function qCaption(state){
  // state: {mode:"idle"|"active"|"zero", demo, kind:"claims"|"court names",
  //         loaded, total, matches, q, orderTail}
  const noun = state.kind||"claim titles";
  const unit = noun==="court names"? "name" : "title";
  if(state.mode==="active") return `${fmtN(state.matches)} of ${fmtN(state.loaded)} loaded ${unit}s match "${state.q}"${state.orderTail||" · newest first"}`;
  if(state.mode==="zero")
    return state.demo? (state.total>state.loaded
        ? `no loaded ${unit} matches "${state.q}" — ${fmtN(state.total-state.loaded)} hidden claim${state.total-state.loaded===1?"":"s"} omitted; their pages still answer by id`
        : `no ${unit} matches "${state.q}" — the sample is complete`)
      : noun==="court names"
      ? `no loaded name matches "${state.q}" — ${fmtN(Math.max(0,state.total-state.loaded))} more courts are not loaded; page older ›`
      : `no loaded title matches "${state.q}" — ${fmtN(Math.max(0,state.total-state.loaded))} older claims were never loaded; browse the docket pages`;
  return state.demo? (state.total>state.loaded
      ? `searches the ${fmtN(state.loaded)} loaded ${noun} of ${fmtN(state.total)} — hidden claims are omitted`
      : `searches all ${fmtN(state.loaded)} ${noun} — the sample is complete`)
    : state.kind==="court names"
    ? `searches the ${fmtN(state.loaded)} loaded court names — ${fmtN(Math.max(0,state.total-state.loaded))} more are not loaded; page older ›`
    : state.loaded < state.total
    ? `searches the ${fmtN(state.loaded)} loaded ${noun} of ${fmtN(state.total)} — older claims live on the docket pages`
    : `searches all ${fmtN(state.loaded)} ${noun}`;
}
function qBarHtml(placeholder, cap){
  return `<div class="addrbar qbar"><input id="q" type="search" class="mono" placeholder="${esc(placeholder)}" spellcheck="false" autocomplete="off" aria-label="filter loaded titles or jump to a claim id" aria-describedby="qcap">
    <span id="qcap" class="mono small muted" role="status">${esc(cap)}</span></div>`;
}
let QCTX = null; // {kind, demo, loaded, total, orderTail, slug, totalClaims}
function applyQ(qRaw){
  const box = document.getElementById("qscope"); if(!box || !QCTX) return;
  const q = String(qRaw||"").trim();
  const cap = document.getElementById("qcap");
  const active = q.length>0;
  box.classList.toggle("qactive", active);
  let matches = 0;
  box.querySelectorAll("[data-q]").forEach(row=>{
    const hit = !active || qPredicate(row.getAttribute("data-q"), q);
    row.classList.toggle("qhide", active && !hit);
    if(active && hit) matches++;
  });
  // sections with nothing visible collapse while a query is active
  box.querySelectorAll("section[data-qsec]").forEach(sec=>{
    const any = [...sec.querySelectorAll("[data-q]")].some(r=>!r.classList.contains("qhide") && (active || !r.classList.contains("offp")));
    sec.classList.toggle("qhide", active && !any);
  });
  const empty = document.getElementById("qempty");
  if(empty) empty.classList.toggle("qhide", !(active && matches===0));
  if(cap) cap.textContent = qCaption(active
    ? (matches? {mode:"active", matches, loaded:QCTX.loaded, q, kind:QCTX.kind, orderTail:QCTX.orderTail}
              : {mode:"zero", demo:QCTX.demo, q, kind:QCTX.kind, loaded:QCTX.loaded, total:QCTX.total})
    : {mode:"idle", demo:QCTX.demo, kind:QCTX.kind, loaded:QCTX.loaded, total:QCTX.total});
  // shareable: ?q rides the hash without re-rendering
  try{
    const raw = location.hash.replace(/^#/,"")||"/";
    const [path, qs] = raw.split("?");
    const params = new URLSearchParams(qs||"");
    if(active) params.set("q", q); else params.delete("q");
    const tail = params.toString()? "?"+params.toString().replace(/\+/g,"%20") : "";
    history.replaceState(null, "", "#"+path+tail);
  }catch(_){}
}
let QDEB = 0;
document.addEventListener("input", ev=>{
  if(ev.target && ev.target.id==="q"){
    clearTimeout(QDEB);
    QDEB = setTimeout(()=>applyQ(ev.target.value), 120);
  }
});
document.addEventListener("keydown", ev=>{
  const t = ev.target;
  if(t && t.id==="q"){
    if(ev.key==="Escape"){ t.value=""; applyQ(""); t.blur(); ev.preventDefault(); return; }
    if(ev.key==="Enter"){
      clearTimeout(QDEB); QDEB=0; // a queued debounce would erase the hint
      const j = parseJump(t.value, QCTX && QCTX.slug);
      const cap = document.getElementById("qcap");
      if(j){
        if(j.bare && !j.slug){ if(cap) cap.textContent = `name a court — orem/${j.id}`; return; }
        if(j.bare && QCTX && QCTX.totalClaims!=null && j.id>QCTX.totalClaims){
          if(cap) cap.textContent = `no claim #${j.id} — this court has ${fmtN(QCTX.totalClaims)}`; return;
        }
        location.hash = `#/c/${j.slug}/${j.id}`;
        return;
      }
      // no address: open the single visible match, if exactly one
      const vis = document.querySelectorAll("#qscope [data-q]:not(.qhide)");
      if(String(t.value).trim() && vis.length===1){ const a=vis[0].getAttribute("href"); if(a) location.hash=a; }
      ev.preventDefault();
    }
    return;
  }
  if(ev.key==="/" && !(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))){
    const el=document.getElementById("q"); if(el){ el.focus(); ev.preventDefault(); }
  }
});
function errorView(e){
  main.innerHTML = `<div class="crumbs"><a href="#/">Directory</a></div>
    <h2 class="page-h">Could not read the node</h2>
    <div class="notice refuse" style="margin-top:16px"><span class="g">⚠</span>
    <div><b>${esc(e.message||e)}</b><br><span class="small muted">The live source is set to <code>${esc(CFG.rpc)}</code>.
    Check the node is reachable and is running a Kourt court, or switch the Source back to Demo in the left rail.</span></div></div>`;
}
function notFound(msg){ return `<div class="empty"><div class="g">◌</div><p class="page-h" style="font-size:15px;font-weight:600;margin:0 0 6px">${esc(msg)}</p><p><a class="btn" href="#/">Back to the directory</a></p></div>`; }
const crumbs = parts => {
  // The HREF is escaped as well as the label, and that is not symmetry for its
  // own sake. It used to be raw, which was safe only because of two invariants
  // written down nowhere near here: every slug-bearing route restricts the slug
  // to [a-z0-9-]+ and ids to \d+ or [0-9.]+, and folder ids are numeric-dotted
  // on chain — and one of the five href expressions ("#/c/__SLUG__/f/"+a.fid)
  // comes from chain data, not from a route at all. Widen one route and this
  // attribute goes live in a function whose reviewer has no reason to look at
  // the router. Escaping costs nothing: no href here contains a character esc
  // touches, and & becoming &amp; is correct inside an attribute.
  // first-visit exit on every deep-linkable route: the directory carries the
  // full strip, the about page IS the destination — everywhere else, one line
  const path = (location.hash.replace(/^#/,"")||"/").split("?")[0].replace(/^#/,"");
  const orient = (path!=="/" && !path.startsWith("/about") && store.get("cc.intro")!=="1")
    ? `<span class="orient" style="margin-left:auto; display:inline-flex; gap:7px; align-items:center"><a class="small" href="#/about">first time here? how this office works →</a><button class="pill void" data-introdismiss aria-label="Dismiss this note" style="padding:1px 7px; cursor:pointer">×</button></span>` : "";
  return `<div class="crumbs">`+parts.map((p,i)=>
    (i?`<span class="sep">/</span>`:"")+(p.href?`<a href="${esc(p.href)}">${esc(p.label)}</a>`:`<span>${esc(p.label)}</span>`)).join("")+orient+`</div>`;
};

/* ============================ views ==================================== */

/* --- directory --- */
on(/^\/$/, async ()=>{
  loading();
  /* THREE ROUND TRIPS, IN A ROW, BEFORE ANYTHING IS DRAWN — and none of them
     needed the answer to the one before it. Measured on kourt.xyz: the root
     render came back at 622ms, ListByTier(1) at 772ms, ListByTier(0) at 860ms,
     and the rows painted at 981ms. The page had been interactive since 520ms and
     spent the rest waiting, one query at a time, on a node ~110ms away.
     They are independent — the render lists the courts, one tier count is the
     listed total, the other is the hidden count — so they go together. The two
     counts are asked with .catch here rather than awaited in a try, because
     Promise.all rejects as a whole and either count failing must cost only its
     own caption. */
  const [courts, tierRaw, hiddenRaw] = await Promise.all([
    listCourts(),
    isLive()? qeval(`ListByTier(1)`).catch(()=>null) : null,
    isLive()? qeval(`ListByTier(0)`).catch(()=>null) : null,
  ]);
  const featured = courts.filter(c=>c.tier===2);
  let listed = courts.filter(c=>c.tier!==2);
  const page = pageOf();
  // Every page keeps the render's own order — burn-ranked. Deep pages come
  // from ListedCourtsBy("burn", offset, limit), the same index the render
  // walks; it returns featured courts inside the window too (the render
  // skips them without backfilling — the stats fill hides them here the
  // same way). The listed TOTAL comes from ListByTier(1) — the burn window
  // emits no overflow footer, so page 1's parse alone cannot know it.
  let listedTotal = listed.length, dirTotFailed = false;
  if(isLive()){
    // already in flight before this route did any of its own work
    if(tierRaw==null) dirTotFailed = true; /* the caption hedges instead of asserting an unread total */
    else listedTotal = [...new Set((tierRaw.match(/"[a-z0-9-]+"/g)||[]).map(x=>x.slice(1,-1)))].length;
    if(page>1){
      try{
        const raw2 = await qeval(`ListedCourtsBy("burn", ${(page-1)*PAGE_N}, ${PAGE_N})`);
        const slugs = (raw2.match(/"[a-z0-9-]+"/g)||[]).map(x=>x.slice(1,-1));
        listed = slugs.map(sl=>{
          const known = courts.find(c=>c.slug===sl);
          return known || {slug:sl, name:sl, tier:1, claims:null};
        });
      }catch(_){ listed = []; }
    }
  } else {
    listed = pageSlice(listed, page);
  }
  const faceSlugs = ((page===1? featured:[]).concat(listed)).map(c=>c.slug);
  const dirChips = (page===1 && listed.length>=2)
    ? `<span class="schips" role="group" aria-label="sort order"><button class="pill void" data-sort="rank" aria-pressed="${QP.sort!=="claims"}">GNOT burned</button><button class="pill void" data-sort="claims" aria-pressed="${QP.sort==="claims"}">busiest</button></span>` : "";
  const dirPager = pagerHtml("/", page, listed.length, listedTotal, "courts",
    dirTotFailed? "ranked by GNOT burned — the full count did not read" : "ranked by GNOT burned", dirChips);
  // the office-door counts: everything a loaded page can honestly state, no balances
  const featTotal = featured.length + (courts.moreFeatured||0);
  const loadedWithClaims = ((page===1? featured:[]).concat(listed)).filter(c=>c.claims!=null);
  const claimsSum = loadedWithClaims.reduce((t,c)=>t+c.claims,0);
  // hidden courts: COUNT only — the slugs never enter the DOM, a caption, or a log
  let hiddenN = null;
  if(isLive()) hiddenN = hiddenRaw==null? null
    : [...new Set((hiddenRaw.match(/"[a-z0-9-]+"/g)||[]).map(x=>x.slice(1,-1)))].length;
  else hiddenN = Object.values(DEMO.courts).filter(c=>c.tier===0).length;
  const hiddenLine = hiddenN==null
    ? "the hidden-court count did not read — whether courts are hidden is unknown right now; reload to retry."
    : hiddenN>0? `${fmtN(hiddenN)} court${hiddenN===1?"":"s"} hidden by moderation — hidden from the listing, not from access: a direct link still opens the court.`
    : dirTotFailed? "no courts appear to be hidden, but the total count did not load — so this list may be incomplete."
    : "no courts are hidden by moderation — this register is complete.";
  const statsStrip = `<section><div class="grid stats">
      <div class="stat"><div class="k">courts listed</div><div class="v tnum">${dirTotFailed? "—" : fmtN(listedTotal)}</div><div class="sub">${dirTotFailed? "the count did not read — reload to retry" : "on the public register — ranked by GNOT burned"}</div></div>
      <div class="stat"><div class="k">featured</div><div class="v tnum">${fmtN(featTotal)}</div><div class="sub">a curation tier set by the global DAO — placement, not endorsement</div></div>
      <div class="stat"><div class="k">claims filed</div><div class="v tnum">${fmtN(claimsSum)}</div><div class="sub">across the ${loadedWithClaims.length} court${loadedWithClaims.length===1?"":"s"} on this page — filings, not judgments</div></div>
    </div><p class="small muted" style="margin:8px 0 0">${hiddenLine}</p></section>`;
  const card = (c,i) => `<a class="crow courtrow" data-rank="${i}"${c.claims!=null?` data-claims="${c.claims}"`:""} data-q="${esc("/"+c.slug+" "+c.name)}" href="#/c/${esc(c.slug)}">
      ${courtFaceHtml(c.slug, c.name)}
      <span class="id">${ICN_COURT}/${esc(c.slug)}</span>
      <span><span class="t" id="cn-${esc(c.slug)}">${safeInline(c.name)}</span><span class="m" style="display:block" id="cm-${esc(c.slug)}">${c.claims!=null? `${c.claims} claim${c.claims===1?"":"s"}`:"…"}</span></span>
      <span class="px" id="cp-${esc(c.slug)}"><small>reading…</small></span>
      <span class="pill ${c.tier===2?"open":"void"}">${c.tier===2?"★ featured":"listed"}</span></a>`;
  main.innerHTML = crumbs([{label:"Directory"}])
    + introStrip()
    + `<div class="lead-row"><div><h1 class="page-h">Courts of record</h1>
       <p class="page-sub">Each court runs its own coin and its own docket of claims of fact. Stake on YES or NO; your staked coin always returns 1×, and conviction — stake × time held — earns the reward when the verdict goes your way. Pick the court whose judgment you trust.</p></div>
       ${btn("Start a court","StartCourt",{slug:"my-court",name:"My Court"},"primary",null,null,false,true)}
       ${btn("Start a court with a polish window","StartCourtP",{slug:"my-court",name:"My Court",stakeOpenDelay:720},"","one hour before staking opens, so an author can fix the wording",null,false,true)}</div>`
    + statsStrip
    + `<div id="qscope">`
    + qBarHtml("court name or orem/7", qCaption({mode:"idle", demo:!isLive(), kind:"court names", loaded:(page===1?featured.length:0)+listed.length, total:listedTotal+(page===1?featured.length:0)}))
    + (page===1 && featured.length?`<section data-qsec><div class="sec-h">Featured <span class="count">${featured.length}</span></div><div class="docket">${featured.map(card).join("")}</div></section>`:"")
    + `<section data-qsec><div class="sec-h">Courts <span class="count">${fmtN(listedTotal)}</span></div>`
    + dirPager
    + (listed.length?`<div class="docket"${page===1?' data-sortable data-sortkind="dir"':""}>${listed.map(card).join("")}</div>`:`<div class="empty"><div class="g">◌</div><p>No courts yet. Be the first to start one.</p></div>`)
    + `</section>`
    + `<div id="qempty" class="empty qhide"><div class="g">◌</div><p>No loaded name matches.</p><p class="small muted">clear to browse, or go to a claim by id — orem/7</p></div>`
    + `</div>`;
  QCTX = {kind:"court names", demo:!isLive(), loaded:(page===1?featured.length:0)+listed.length,
    total:listedTotal+(page===1?featured.length:0), slug:null, totalClaims:null, orderTail:" · ranked by GNOT burned"};
  if(QP.sort) applySort(QP.sort); // before applyQ — the search caption reads QCTX.orderTail
  if(QP.q){ const qi=document.getElementById("q"); if(qi){ qi.value=QP.q; applyQ(QP.q); } }
  // stats fill for the visible rows only, chunked so a big directory cannot
  // burst hundreds of concurrent queries
  const visible = (page===1? featured:[]).concat(listed);
  // ONE read for every face on the page, not one per court: CourtImages skips
  // the courts with no picture, so this costs a query whether the directory has
  // twenty images or none, and the drawn covers stay where it sends nothing.
  fillCourtFaces(faceSlugs);
  inChunks(visible, 6, async c=>{
    try{
      const s = await courtStats(c.slug);
      const el = document.getElementById("cp-"+c.slug);
      if(el&&s) el.innerHTML = `<b>${priceText(s.price, s.minted)}</b><small>µGNOT/unit · ${cc(s.supply,c.slug)}</small>`;
      if(s && c.claims==null){

    if(d.phase==="closed") cen.unans++;
    else if(d.phase==="provClose") cen.nodec++;
    else if(d.phase==="settled"){
      if(d.route==="vote"){ cen.vote++; if(d.answer!=null && d.answer!==d.verdict) cen.ov++; }

function courtRecordPanel(slug, s){
  const live=isLive();
  const cen = live? null : demoCensus(slug);
  const total = live? (s.claims||0) : (DEMO.courts[slug]? DEMO.courts[slug].claims.length : 0);
  const scope = (live && total>RECORD_K)? `of the last ${RECORD_K} claims`
    : `of this court's ${total} claim${total===1?"":"s"}`;
  const v = x => live? `…` : String(x);
  const r=(k,val,sub,id)=>`<div class="kv"><div class="k">${k}</div><div class="v tnum"><span id="${id}">${val}</span>${sub!=null?` <small>${sub}</small>`:""}</div></div>`;
  const burn = live? `…` : fmtN((s.burned||0)/1e6)+" GNOT";
  return `<div class="panel"><h4>Court record</h4>
        <p class="small muted" style="margin:0 0 10px" id="cr-scope">${scope}</p>
        ${r("settled undisputed", v(cen&&cen.undis), null, "cr-undis")}
        ${r("settled by vote", v(cen&&cen.vote), `<span id="cr-ov">${(!live && cen.ov)? `${cen.ov} overturned the answer`:""}</span>`, "cr-vote")}
        ${r("closed without a decision", v(cen&&cen.nodec), null, "cr-nodec")}
        ${r("expired unanswered", v(cen&&cen.unans), null, "cr-unans")}
        ${r("live now", v(cen&&cen.live), null, "cr-live")}
        ${r("dispute rounds failed", v(cen&&cen.failed), `<span id="cr-dec">${(!live && cen.vote)? `· ${cen.vote} ended in a verdict`:""}</span>`, "cr-failed")}
        ${r("GNOT burned here", burn, "destroyed at a keyless address, not held; nothing redeems it", "cr-burn")}
        <p class="small muted" style="margin:10px 0 0">Published because they are the only reason to trust a verdict: a court that hides its record has nothing behind its decisions.</p>
       </div>`;
}
async function fillCourtRecord(slug, count, minted){
  const set=(id,txt)=>{ const el=document.getElementById(id); if(el) el.textContent=txt; };
  const s2=gstr(slug);
  one(`CourtBurnedGNOT(${s2})`).then(b=>set("cr-burn", fmtN(b/1e6)+" GNOT"))
    .catch(()=>{
      // the stored counter is the truth; the curve integral is a labeled floor
      if(minted!=null){ const m=BigInt(minted);
        set("cr-burn", "≥ "+fmtN(Number((m*m+1999999999n)/2000000000n)/1e6)+" GNOT — derived from curve position"); }
      else{ const el=document.getElementById("cr-burn"); if(el&&el.closest(".kv")) el.closest(".kv").style.display="none"; }
    });
  const lo=Math.max(1, count-RECORD_K+1), ids=[];
  for(let i=lo;i<=count;i++) ids.push(i);
  const cen={undis:0,vote:0,ov:0,nodec:0,unans:0,live:0,failed:0};
  let bad=0;
  await inChunks(ids, 6, async i=>{
    try{
      const [st,fr]=await Promise.all([one(`ClaimStatus(${s2},${i})`), one(`FailedRounds(${s2},${i})`).catch(()=>0)]);
      cen.failed += Number(fr)||0;
      const t=String(st).toLowerCase();
      if(t.includes("never answered")) cen.unans++;
      else if(t.startsWith("closed")) cen.nodec++;
      else if(t.startsWith("settled")){
        const route=await one(`VerdictRoute(${s2},${i})`).catch(()=>null);
        if(route==="vote"){ cen.vote++;
          const [vd,av]=await Promise.all([one(`Verdict(${s2},${i})`).catch(()=>null), one(`AnswerVerdict(${s2},${i})`).catch(()=>null)]);
          if(vd!=null && av!=null && String(vd)!==String(av)) cen.ov++;
        }else if(route==="undisputed") cen.undis++;
        else if(route==="closed") cen.nodec++;
        else bad++; // the route read failed — a bucket is never guessed
      }else cen.live++;
    }catch(_){ bad++; }
  });
  if(bad>=ids.length){ const p=document.getElementById("cr-scope");
    if(p && p.closest(".panel")) p.closest(".panel").style.display="none"; return; }
  set("cr-undis",cen.undis); set("cr-vote",cen.vote); set("cr-nodec",cen.nodec);
  set("cr-unans",cen.unans); set("cr-live",cen.live); set("cr-failed",cen.failed);
  set("cr-ov", cen.ov? `${cen.ov} overturned the answer`:"");
  set("cr-dec", cen.vote? `· ${cen.vote} ended in a verdict`:"");
  if(bad>0){ const p=document.getElementById("cr-scope");
    if(p) p.textContent += ` — ${bad} chain read${bad===1?"":"s"} failed; counts are incomplete`; }
}
/* ---------------- the ballot (a dispute in progress) ----------------
   Everything here is a real read or the realm's stated rule. The one number
   the chain does not expose — the running round's close height — is said to
   be unexposed rather than guessed, and the tally is never summed mid-vote. */
/* The ballot's fine print, in plain words. Same facts as the realm enforces —
   only the sentences changed. */
/* EVERYTHING THE BALLOT NO LONGER SAYS, in plain words.
   
   The ballot used to carry quorum, threshold, the locking rule and the token
   flows inline — five dense lines between the question and the buttons. They
   are rules of the court, not inputs to a decision, so they live here and the
   ballot links once. Short sentences on purpose: this is read by somebody who
   has just been asked to judge a stranger's claim, not by somebody studying
   the mechanism. */
function voteHelpModal(slug, d){
  const SYM = "KOURT:" + esc(slug).toUpperCase(); // canonical display (MODERATION.md §13.9)
  // The quorum figure is per-round and this round's own bar is not republished,
  // so the page says what a NEW dispute would face and says that is what it is.
  const quorum = d.quorumFloor
    ? `<p>Today a new dispute would need ${cc(d.quorumFloor,slug)} to be cast. This round's own figure was set when it opened, and the chain does not publish it again.</p>`
    : "";
  return `<dialog class="helper" id="help-vote" aria-labelledby="help-vote-h">
    <div class="hd"><h3 id="help-vote-h">How this vote works</h3><button type="button" class="pill void" data-close>Close</button></div>
    <div class="bd">
      <h4>What decides it</h4>
      <p>To overturn the answer, more than half the weight voted has to say overturn. A tie upholds. If everyone flags it as spam, nobody took a side, so the answer stands — unless the spam flags themselves carry it, below.</p>
      <p>Enough people also have to turn up. If too little weight is cast, the round decides nothing at all — however the votes leaned.</p>
      ${quorum}
      <h4>What casting costs you</h4>
      <p>Voting commits the weight you vote with, until this round resolves. The
        coin stays in your balance and keeps voting, and you can still stake it —
        but it cannot also back a bond, a deposit or a transfer.</p>
      <p>That is what stops somebody voting with coin and selling it before the
        round ends.<span id="votecommit"></span></p>
      <h4>Flagging a claim as spam</h4>
      <p>The third button is not a way to sit out. It says the claim was not worth
        asking, and it costs the person who filed it.</p>
      <p>It never counts towards either side of the verdict. What it does is
        <b>cut the reward the claim pays</b>, in proportion: a tenth of the weight
        flagging it takes a fifth off, a quarter takes half off, and at half the
        claim pays nothing at all.</p>
      <p>Past half, <b>the claim is deleted</b>. Everyone's stake comes back in
        full, on both sides. The person who answered it and the person who
        disputed it get their bonds back — neither of them wrote it. The author
        loses the fee they paid to file. If two thirds or more flag it, they lose
        their deposit as well.</p>
      <p>And flagging pays, when it wins: if the claim is deleted, the reward for
        voting goes to the people who flagged it, exactly as it would go to the
        winning side of an ordinary vote.</p>

      <h4>What voting costs you</h4>
      <p>The coin you vote with is locked until this round ends. You keep it, it stays in your balance, and you can still stake it.</p>
      <p>What you cannot do with locked coin is back a bond, put down a deposit, or send it to somebody else.</p>

      <h4>Why this page does not add them up</h4>
      <p>Every vote is a public transaction, so nothing is hidden. This page just will not total them while voting is still open. Anyone who wants the running count can read it off the chain.</p>
      <p>If you could watch the total, the best move would be to wait and copy whoever voted with the most weight — and the result would be one person's opinion, repeated. So the votes sit un-summed until the vote closes. <b>Sealed means un-summed, not secret.</b></p>

      <h4>Who can vote</h4>
      <p>Anyone holding ${SYM}, this court's token. Your weight is whatever you held at the last hourly snapshot before this round opened, so buying more now adds nothing.</p>
      <p>Three people cannot: whoever wrote the claim, whoever answered it, and anyone who staked on it. Holding a position on the outcome disqualifies you from judging it. The court refuses those votes when they are signed, whatever this page shows.</p>

      <h4>Where the coin goes</h4>
      <p><b>Nothing moves from one side to the other.</b> There is no pot to win, so there is nothing to steer. Coin that is forfeited is burned. Coin that is owed is newly made. The two never meet.</p>
      <ul>
        <li><b>Too few voted</b> — half the challenger's bond burns, half comes back. The answerer's bond is untouched. After a third failed round the claim closes undecided and every stake returns 1×.</li>
        <li><b>The answer is overturned</b> — the answerer's bond burns in full. The challenger gets their bond back, plus a payment that is newly made: never more than twice their bond, never more than 80% of what burned, and paid after any earlier awards.</li>
        <li><b>The answer is upheld</b> — the challenger's bond burns. The answerer's bond stays held until the claim is finished, and they get the same kind of payment on the same limits.</li>
      </ul>
      <p>Either way, staked ${SYM} is never touched. It comes back 1× to everyone who staked, on both sides.</p>
    </div></dialog>`;
}

/* WHICH ROUND, AND WHEN IT SHUTS — one line, under the question.

   This replaces four ladder rows above the ballot and a paragraph below it. A
   voter choosing how to vote needs the clock; everything else that was here —
   quorum, the vote lock, what each outcome does to whose bond — is one click
   away in "How this vote works", which is where a reader goes when they want
   the rules rather than the decision.

   THE BOND FIGURE IS GONE ON PURPOSE, not for brevity. The row it came from
   read "voting now at 0.71 KOURT:COVID", and that number is DisputeBondNext —
   dispute.gno:849 says it "quotes what the NEXT dispute round costs". Voting
   costs no bond at all; it locks coin you keep. Printing a challenger's price
   beside the word "voting" tells a voter they must pay to vote, which is
   false, so it is not carried forward in shorter form. */
/* THE CLOCK, AND NOTHING ELSE. The round moved to the timeline, where the
   claim's other events are. "One vote per address, and you cannot change it"
   moved to the click: it is a rule about a mistake, and it only means anything
   to somebody who has already made the vote it would undo — everybody else was
   reading a warning that did not apply to them. fillVoteEligibility says it,
   from a read that knows whether this address actually voted.

   Four close states, and the two with no date are the actionable ones: a chain
   that publishes no close height, and a window that has already passed — the
   second is the moment Resolve starts working. The timeline's dated "vote
   closes" row can carry neither. */
function ballotHint(slug, d, nowH){
  if(d.voteEndsAt && nowH!=null && d.voteEndsAt<=nowH)
    return "Voting has closed; Resolve works now.";
  // "About 7 days after this round opened" was here, and it was the WINDOW'S
  // LENGTH, not the time left in it — a claim three days into its round read
  // the same as one three minutes in. DisputeVoteCloses publishes the height
  // now, so the real countdown is the normal case and this is the read-failed
  // path: it says the number is missing rather than substituting a guess that
  // looks like an answer.
  return !d.voteEndsAt? "The closing time could not be read."
    : (nowH==null)? `Closes at block ${fmtN(d.voteEndsAt)}.`
    : `Closes in ${wall(nowH, d.voteEndsAt)}.`;
}

function disputeTicket(slug, id, d, nowH){
  /* THE TWO ACTIONS ARE NEVER BOTH LIVE, and the panel used to show them as if
     they were: three vote buttons and a "Resolve (after close)" underneath, on
     every disputed claim, whichever side of the close it was.

     THE CLOSE IS READABLE NOW (DisputeVoteCloses), so the panel can say which
     one it is. Before the close, Resolve is not offered — it would only be
     refused. After it, the vote buttons grey out and say why, and Resolve loses
     its parenthesis because the close is no longer in the future.

     GREYED, NOT REMOVED: the question and the two outcomes are still what the
     round was about, and a panel that deleted them would leave a reader
     wondering what they had missed. And greyed at RENDER, unlike the async
     eligibility marks — this state is known before the panel paints, so there
     is nothing to flicker.

     UNKNOWN IS ITS OWN CASE. If the close could not be read, neither statement
     is safe: Resolve is offered with its old hedge and the vote buttons stay
     live, because refusing a vote we cannot prove is closed would take away an
     action the reader may still have. */
  const closed = !!(d.voteEndsAt && nowH != null && d.voteEndsAt <= nowH);
  const unknownClose = !d.voteEndsAt || nowH == null;
  // THE MECHANISM IS NOT ON THE BALLOT. Quorum, threshold, what a vote locks,
  // what each outcome does to whose bond, and where the coin goes were seven
  // dense lines between the question and the buttons — a reader had to get
  // through the rules of the court to reach the decision. They are all in "How
  // this vote works" now, which is one click and was already the place for
  // them. What is left is the question, the clock, and the buttons.
  /* THE QUESTION NAMES THE ANSWER IT IS ABOUT. "Should this answer be
     overturned?" left a reader to work out which answer, on a page that argues
     both sides — and the two buttons under it say "overturn" and "uphold"
     without ever saying what. The answer on the record is one word and the
     ballot can afford to print it. Falls back to the old wording only when the
     answer did not read, because a question that names the wrong side is worse
     than one that names none. */
  const ansSide = (d.answer===0 || d.answer===1)? sideName(d.answer) : null;
  const ballotQ = ansSide
    ? `Overturn the <b>${ansSide}</b> answer?`     // one line at every width
    : "Should this answer be overturned?";
  return `<div class="ticket" style="margin-top:12px"><h3>${ballotQ}</h3>
      <div class="hint">${ballotHint(slug, d, nowH)} <button type="button" class="helplink" data-help="help-vote">How this vote works →</button></div>
      <div class="actions" id="voteactions" style="margin-top:10px"${
        closed? ` data-voteblocked="Voting has closed for this round. All that is left is to resolve it."` : ""}>
        ${btn("Vote to overturn","VoteDispute",{courtSlug:slug,claimID:id,choice:"yes"},"no")}
        ${btn("Vote to uphold","VoteDispute",{courtSlug:slug,claimID:id,choice:"no"},"yes")}
        ${btn("Spam","VoteDispute",{courtSlug:slug,claimID:id,choice:"spam"},"no mini","",null,null,null,null,ICN_BIN)}</div>

           check marks: somebody who staked on this claim may not judge it and may
           still close the round once the window has passed. -->
      ${closed || unknownClose ? `<div class="actions" style="margin-top:8px">
        ${btn(closed? "Resolve this round" : "Resolve (once the window has passed)","ResolveDispute",{courtSlug:slug,claimID:id})}</div>` : ""}
      ${voteHelpModal(slug, d)}`;

/* WHY YOU CANNOT VOTE, SAID WHEN YOU TRY TO — not as a standing paragraph on a
   ballot most readers can act on.
   
   It used to print two sentences under every ballot: one naming the three
   excluded roles, and one telling an eligible reader that nothing disqualifying
   was visible, which is a sentence about nothing. The reason only matters to
   the person it applies to, and only at the moment they reach for the button.
   
   MARKED, NOT DISABLED. The reads are async and arrive after the panel paints,
   so a disabled button would flicker; and a button that silently does nothing
   teaches less than one that says why. The click handler below turns the mark
   into a sentence. */
async function fillVoteEligibility(slug, id, d){
  if(!CFG.addr) return;
  const box = document.getElementById("voteactions");
  const btns = box? box.querySelectorAll(".btn") : [];
  if(!btns.length) return;
  try{
    const [author,p,com,w,whys] = await Promise.all([
      one(`ClaimAuthor(${gstr(slug)},${id})`).catch(()=>null),
      positionOf(slug,id,CFG.addr),
      one(`CommitmentsOf(${gstr(slug)},${gstr(CFG.addr)})`).catch(()=>null),
      // THE CAP THE COURT WILL APPLY, read before Adena is ever opened. Without
      // it the first thing a reader without coin learned was a raw panic
      // relayed through the wallet's gas simulation — "ERROR: kourtv2: ..." —
      // after pressing a button and waiting for an extension to wake.
      // ClaimVoteWeightOf returns the same min(snapshot, held) the realm
      // charges, and VoteWeightWhy says WHICH of the two is zero, which is the
      // difference between "buy some" and "you were too late to buy".
      tup(`ClaimVoteWeightOf(${gstr(slug)},${gstr(CFG.addr)},${id})`).catch(()=>null),
      tup(`VoteWeightWhy(${gstr(slug)},${gstr(CFG.addr)},${id})`).catch(()=>null)]);
    // ALREADY VOTED, read rather than remembered. A verdict-lane commitment on
    // this claim exists only while the round that made it is open —
    // voteLockOpen (votelock.gno:199) matches on `cs.disputeOpen &&
    // cs.proposalID == sub`, the SAME round, not merely any dispute — so a `d`
    // row keyed to this claim means this address voted in THIS round. No new
    // realm read, and no client-side memory of what was signed.
    const voted = ((parseCommitments(com)||{q:[]}).q||[])
      .some(r => r.kind==="d" && r.id===Number(id));
    // Checked first because it is the one a reader can act on being told: the
    // other three are permanent, this one ends when the round does.
    const why = voted? "have already voted in this round, and a vote cannot be changed"
      : author===CFG.addr? "wrote this claim"
      : d.answerer===CFG.addr? "answered it"
      : (p && (p.yes||p.no||p.cy||p.cn))? "staked on it" : null;
    if(why){
      // The court decides at signing, not here — so this says what it saw rather
      // than promising the transaction would fail.
      btns.forEach(el => el.setAttribute("data-voteblocked",
        (voted? "You " : "You cannot vote on this claim: you ") + why + "."));
      return;
    }
    // NO WEIGHT IS A DIFFERENT KIND OF REFUSAL. The four above are permanent
    // facts about this reader and this claim; this one is a thing they can fix,
    // and only sometimes. So it opens a dialog that says which case it is,
    // rather than printing one more sentence under the button.
    //
    // Read as a NUMBER, not inferred from a balance: weight is the lesser of the
    // snapshot and the holding, so a fat balance bought this morning is worth
    // nothing on a round frozen last week.
    if(w && Number(w[0]) <= 0){
      btns.forEach(el => el.setAttribute("data-nocoin", (whys && whys[0]) || ""));
    }
  }catch(_){}
}
/* ---------------- the vote lock's disclosure ----------------
   THE OBLIGATION THIS MEETS. The vote lock is a user commitment the realm
   enforces at signing and this overlay did not mention anywhere: no "committed
   until", no "cannot bond", no VoteLockedOf read, while shipping copy that
   invites holders to vote. Nobody loses coin — the realm's refusal is legible
   when they sign — but they lose an expectation, and the overlay is where
   people actually vote. VOTEFLOOR.md carries the finding and the exact reads.

   ONE LANE ON A PANEL, THE OTHER IN THE MODAL. There are two release rules and
   they are not interchangeable: a verdict vote is committed until its round
   resolves, a quality vote until its question can no longer decide anything —
   its own close, or the claim itself ending when the tally has frozen and later
   rounds keep voting the same running total. Only the QUALITY rule is rendered
   as a row: the dispute ballot was cut back to the question and the buttons, so
   the verdict rule is prose in "How this vote works" ("locked until this round
   ends") and the figure a holder has committed is on their me-page, in
   commitmentsTicket, which reads both lanes. If a verdict row is ever wanted
   again, the rule above is the one to write and the lane split in
   ClaimVoteWeightOf is why it cannot borrow the quality figure.

   Do NOT write "until the tally is superseded" — that was the first version of
   the rule and it is wrong, because a tally is superseded only by a new round
   and nothing makes a round open. That sentence went stale in three documents
   before check-epoch-coherence arm 11 started failing the build over it.

   AND STAKING IS NOT REFUSED. Committed coin stays in the balance, keeps
   voting, and can still be staked — mustStakable ignores the vote lock
   deliberately. Saying "your coin is locked" would be false in the direction
   that costs a holder a legitimate action, so the wording is the realm's own:
   it cannot also back a bond, a deposit or a transfer. */
/* THE VOTE LOCK IS MODAL COPY, not a row. It was qualityLockLine, printed by
   qualitySection — which was its only caller and is gone with the quality lane.
   Moving it onto the ballot was the obvious repair and the wrong one: the ballot
   was deliberately stripped to the question, the clock and the buttons, and
   dispute_test.js pins that ("no outcome rows: what overturning does to whose
   bond is modal copy", "no vote-lock row on the ballot either"). So the sentence
   lives in "How this vote works" beside the other rules, and #votecommit — the
   reader's own figures, filled after the paint — goes with it.
   The frozen-tally clause is dropped: it described a quality tally carrying into
   later rounds. A dispute round's ballot is applied when that round resolves. */

/* The figures, separately, because they arrive from the chain after the panel
   has rendered and every one of them may be unavailable. A missing read prints
   nothing rather than a zero: "commits 0" is a claim, and a wrong one. */
function voteLockFigures(slug, would, locked, free){
  const bits=[];
  if(would!=null && would>0) bits.push(`this vote would commit ${cc(would,slug)}`);
  if(locked!=null && locked>0) bits.push(`already committed by voting: ${cc(locked,slug)}`);
  if(free!=null) bits.push(`free to bond or deposit right now: ${cc(free,slug)}`);
  return bits.length? " " + bits.join("; ") + "." : "";
}
/* Fills whichever of the two lanes is on the page. DisposableOf is the binding
   limit and SpendableOf is NOT — that one is stake-only and over-promises by
   the whole of a vote commitment. */
async function fillVoteCommitment(slug, id){
  const qv=document.getElementById("votecommit");
  if(!qv || !CFG.addr || !isLive()) return;
  try{
    const [w, locked, free] = await Promise.all([
      tup(`ClaimVoteWeightOf(${gstr(slug)},${gstr(CFG.addr)},${id})`).catch(()=>null),
      one(`VoteLockedOf(${gstr(slug)},${gstr(CFG.addr)})`).catch(()=>null),
      one(`DisposableOf(${gstr(slug)},${gstr(CFG.addr)})`).catch(()=>null)]);
    // INDEX 1, and the index is the whole assertion. ClaimVoteWeightOf returns
    // (verdict, quality) and the two weigh at DIFFERENT epochs; w[0] here would
    // print a verdict-epoch figure under a quality question, which is the exact
    // defect VoteWeightWhy was split in two to fix. Only one lane renders a row
    // now, so nothing on the page would look wrong if this read the other one.
    qv.textContent = voteLockFigures(slug, w? w[1]: null, locked, free);
  }catch(_){}
}
/* ---------------- everything one holder is committed to ----------------
   ONE READ PER COURT, and the reason it can be one read is that the realm already
   keyed its vote locks address-first: c.voteLocks is addr|kind|id|sub, so a holder's
   commitments are a contiguous range and CommitmentsOf just walks it. No index was
   added, so no vote or stake pays storage for this page. What it replaces is fan-out
   — the positions probe below costs four reads per claim id.

   THE TOTAL IS NOT THE SUM OF THE ROWS. `vote` is the MAX across open commitments,
   because the locks overlap: one pile of coin honours several questions at once. Any
   consumer that adds the rows up produces a number the realm does not enforce, so the
   copy says which is which wherever more than one row shows. */
function parseCommitments(s){
  if(!s) return null;
  const out = {stake:0, vote:0, free:0, q:[]};
  for(const rec of String(s).split(";")){
    const f = rec.split(":");
    if(f[0]==="q"){ if(f.length>=5) out.q.push({kind:f[1], id:+f[2], sub:+f[3], amt:+f[4]}); }
    else if(f.length>=2 && Object.hasOwn(out, f[0])) out[f[0]] = +f[1];
  }
  return out;
}
/* StakedPage gives one holder's positions in one read: "c:<claimID>:<side>:<liveStake>".
   The client used to find these by probing EVERY claim — four reads per claim id over a
   window of the newest SCAN_DEPTH, which is why the page had to tell people "older
   positions are not found either". The realm keys an address-first index now
   (stakeindex.gno), so the cost is the holder's own positions and nothing is out of
   reach. Entries are append-only, so an offset stays valid between reads. */
function parseStaked(s){
  if(!s) return [];
  const out=[];
  for(const rec of String(s).split(";")){
    const f=rec.split(":");
    // FIVE fields now — the fifth is conviction — and FOUR is still accepted, because a
    // cached page can outlive a realm upgrade in either direction and a record this
    // parser drops is a position the holder is told they do not have.
    if(f[0]==="c" && f.length>=4) out.push({id:+f[1], side:+f[2], stake:+f[3], conv:+(f[4]||0)});
  }
  return out;
}
/* One entry per (claim, side); the table wants one row per claim carrying both. */
function stakedByClaim(list){
  const byId = new Map();
  for(const e of list){
    const r = byId.get(e.id) || {id:e.id, yes:0, no:0, cy:0, cn:0};
    if(e.side===0){ r.yes = e.stake; r.cy = e.conv; } else { r.no = e.stake; r.cn = e.conv; }

const COMMIT_LANE = {d:"a verdict round", e:"a moderator election", q:"a quality question"};
function commitmentsTicket(com, slug){

      `<div class="line"><span class="l">${esc(COMMIT_LANE[r.kind]||"a question")}`
      + `${r.kind==="e"? ` #${r.sub}` : ` on claim #${r.id}`}</span>`
      + `<span class="r tnum">${cc(r.amt,slug)}</span></div>`).join("");

    + `<div class="line"><span class="l">committed by voting</span><span class="r tnum">${cc(com.vote,slug)}`

    + `</span></div>`

    + `<div class="line"><span class="l">free to bond, deposit or transfer</span><span class="r tnum">${cc(com.free,slug)} <small>the figure the court enforces</small></span></div>`
