const rawRender = pth => isLive() ? qrender(pth) : demoRender(pth);

/* statusText mirrors the realm's claimStatus precedence for the demo; live mode
   reads ClaimStatus directly (one qeval, no md-scrape). */
function statusText(d){
  if(d.phase==="closed") return "closed — never answered; stakes were never frozen (unstake freely), the deposit refunded, the fee burned";
  if(d.phase==="provClose") return "closed without a decision — everyone withdraws 1×, deposit and fee refunded";
  // Names the side, as the realm's own claimStatus does. Without it the sample's
  // settled claims carry no verdict, and the map's dot — which now takes its
  // colour from the verdict — would have nothing to read. The dash sideName()
  // returns for an unknown side is never printed: "settled —" reads as a missing
  // word, and the phase pill beside it already refuses the same way.
  if(d.phase==="settled"){
    const sn = sideName(d.verdict!=null? d.verdict : d.answer);
    return "settled" + (sn==="—" ? "" : " "+sn) + " — every stake withdraws 1×";
  }
  if(d.phase==="disputed") return "disputed — a sealed vote is deciding; principal is never withheld";
  if(d.phase==="provisional") return "provisional verdict — reopenable by a new dispute; the losing side may withdraw 1× now";
  if(d.phase==="answered"){
    const sd = (d.answer===0||d.answer===1)? " "+sideName(d.answer) : "";
    return "answered"+sd+" — staking frozen; disputable, then it settles undisputed";
  }
  return "open — stake YES or NO; unstake freely until an answer posts";
}

/* ============================ formatting ================================ */
const sideName = o => o===0?"YES":o===1?"NO":"—";
function fmtN(n){ return (n==null?0:Math.round(n)).toLocaleString("en-US"); }
/* Amounts are denominated in a COURT's coin, and each court has its own —
   so the unit is KOURT:SLUG, not a generic "CC". Pass the slug wherever one
   is in scope; the bare fallback exists only for the few cross-court
   surfaces (the needs feed) where no single court owns the number. */
/* The curve's marginal price is minted/1e9 µGNOT per unit and the chain serves
   it as an INTEGER (curve.gno: `Price(s) = s / c.d`), so every court under
   1,000 CC minted reports 0 — which the page then printed as a headline "0
   µGNOT/unit", reading as free, while the buy panel beside it quoted a real
   fractional price computed from the same curve. A freshly seeded node is
   always in that range, so this is what an operator sees first.

   Below 1 we show the true sub-unit price rather than the floor. `minted` is
   already read for the buy quote; when it is absent we say "under 1" instead of
   inventing a number. */
function priceText(price, minted){
  if(price>0) return fmtN(price);
  if(minted===0) return "0";   // nothing minted yet: the marginal price really is zero
  if(minted!=null && minted>0){
    const p = minted/1e9;
    return p>=0.001? p.toFixed(4).replace(/0+$/,"").replace(/\.$/,"") : "<0.001";
  }
  return price===0? "under 1" : fmtN(price);
}
function ccSym(slug){ return slug? "KOURT:"+String(slug).toUpperCase() : "court coin"; }
/* Every economic figure the realm returns is in RAW BASE UNITS — court coins
   carry six decimals (coinDecimals in court.gno), so 1_000_000 is one CC. This
   `/1e6` is that conversion, and it is the only place the overlay makes it. A
   named CC_DEC constant used to sit up with the other globals and was never read
   by anything, here or elsewhere, from the courtv2 port onward; the knowledge is
   kept where the division happens instead of where it was declared. */
/* A FIGURE THAT ROUNDS TO NOTHING SAYS SO IN THE UNIT THE CHAIN USES. Two
   decimals is right for the amounts a reader stakes and wrong for the ones the
   emission curve produces: a claim's whole author slice on a young court is 101
   µCC, and "0.00 KOURT:COVID" on a button is a page telling somebody their
   reward is nothing. Under a hundredth it switches to the micro unit, which is
   what the realm counts in and what ugnot() already does for GNOT. */
/* THE COURT COIN IS ALWAYS THE SAME COLOUR, wherever its name appears, so a
   reader can spot which figures are denominated in THIS court's coin without
   reading the words. Hardcoded rather than themed: it has to be the same purple
   in light and dark, which is the whole point of a token colour.

   cc() EMITS MARKUP, so its output must not be esc()'d and must not be sliced.
   Nine call sites did one or the other; they use ccText, which is the same
   figure without the span. */
function ccSymHtml(slug){ return `<span class="ccsym">${esc(ccSym(slug))}</span>`; }
function ccFigure(n){ const u=n||0, v=u/1e6;
  if(u!==0 && Math.abs(v)<0.01) return {fig:fmtN(u), micro:true};
  return {fig:(v>=1000? fmtN(v): v.toFixed(v<10?2:1)), micro:false}; }
function cc(n, slug){ const {fig,micro}=ccFigure(n);
  return fig+" "+(micro?"µ":"")+ccSymHtml(slug); }
/* The same figure as plain text, for what cannot take markup: an aria-label, a
   textContent, or a caller that slices the symbol back off. */
function ccText(n, slug){ const {fig,micro}=ccFigure(n);
  return fig+" "+(micro?"µ":"")+ccSym(slug); }
function ugnot(n){ return fmtN(n)+" µGNOT"; }
/* GNOT IN THE SAME SHAPE AS cc(), and for the same reason. fmtN alone ROUNDS: a
   wallet holding 0.4 GNOT printed as "0 GNOT", which is indistinguishable from
   the empty wallet that makes Adena grey out its own approve button — and no
   warning would appear beside it, because that warning keys on the µ figure
   rather than on the rendered text. Small amounts fall back to µGNOT instead of
   rounding to a lie. */
function gnotAmt(micro){ const u=micro||0, v=u/1e6;
  if(u!==0 && Math.abs(v)<0.01) return fmtN(u)+" µGNOT";
  return (v>=1000? fmtN(v): v.toFixed(v<10?2:1))+" GNOT"; }
function shortAddr(a){ a=String(a||""); return esc(a.length>12? a.slice(0,7)+"…"+a.slice(-4): a); }
function wall(nowH, targetH){
  const secs=(targetH-nowH)*BLOCK_SECS, past=secs<0, s=Math.abs(secs);
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  let t = d? d+(d===1?" day":" days") : h? h+(h===1?" hour":" hours") : Math.max(1,m)+" min";
  return past? t+" ago" : "about "+t;
}
/* Moderation provenance on the claim page: one banner, precedence mirroring
   the chain's own switch (purged, then redacted, then plain hide) — a listing
   act stated in the administrative register, never a verdict. */
/* THE POLISH WINDOW, WHICH EXPIRES. EditClaimTitle is the author's one chance to
   fix a typo in the question: the realm freezes the title the moment a stake
   lands or the opening delay passes. It had no path anywhere in the product, so
   the window opened and shut with nothing able to reach it — worse than a
   missing feature, because a missing feature does not run out.

   Offered only while it could still succeed: live, open, nothing staked on
   either side, and not on a claim whose title is withheld, where inviting an
   edit to text the page will not show is nonsense. The time bound is the one
   condition NOT checked here — a client cannot know the opening delay has passed
   without another read, and guessing would either hide a live window or promise
   a dead one. WHO you are is likewise the realm's business: it refuses a
   non-author at signing, the posture the curate page already takes about
   moderators.

   A function rather than an expression inline in the route, because the source
   harnesses can only reach what they can slice — the same reason
   resolveFolderPath was pulled out when a folder route shipped broken. */
function polishLink(slug, id, d, mPurged, mRedacted, polishBlocks){
  if(!isLive() || !d || d.phase!=="open") return "";
  // NO WINDOW, NO OFFER, and this is the condition the first version missed.
  // StartCourt passes stakeOpenDelay 0 and only StartCourtP opts in, so on most
  // courts EditClaimTitle refuses every call — the title froze before the
  // opening transaction returned. Offering it there would be a link that always
  // fails. Null (a realm too old to answer) hides it for the same reason.
  if(!(Number(polishBlocks) > 0)) return "";
  if(d.yesStake || d.noStake) return "";
  if(mPurged===true || mRedacted===true) return "";
  return `<a class="tlink" target="_blank" rel="noopener" title="the author's polish window: before the first stake, and before the opening delay passes" href="${esc(tx("EditClaimTitle",{courtSlug:slug,claimID:id,newTitle:d.title}))}">fix the title<span aria-hidden="true">↗</span></a>`;
}
function modBanner(mPurged, mRedacted, mHidden, slug){
  if(mPurged===true) return `<div class="notice void"><span class="g">▤</span><div><b>Removed on legal grounds.</b>
    The claim's lifecycle is unaffected: stakes, verdict and refunds proceed. The category code stands in place of the title.
    <a class="small" href="#/raw/${esc(slug)}/mod" style="color:var(--accent-2)">the moderation log →</a></div></div>`;
  if(mRedacted===true) return `<div class="notice void"><span class="g">▤</span><div><b>Text withheld pending review.</b>
    IDs, state, deadlines and balances still render, so you can always act on a position.
    <a class="small" href="#/raw/${esc(slug)}/mod" style="color:var(--accent-2)">the moderation log →</a></div></div>`;
  if(mHidden===true) return `<div class="notice void"><span class="g">▤</span><div><b>De-listed by moderation.</b>
    Listed nowhere, reachable by direct link — you are on that link now; the lifecycle is unaffected.
    <a class="small" href="#/raw/${esc(slug)}/mod" style="color:var(--accent-2)">who and why — the moderation log →</a></div></div>`;
  return "";
}
/* The docket's impersonal clock: only frozen rows have one, and a disputed row
   still does not get one — but NOT because the chain has nothing to give. It
   publishes the close now (DisputeVoteCloses); reading it here would be one
   extra query PER ROW on a page that draws fifty, so the countdown stays on the
   claim page and the row says only what it knows. The line used to say "no
   close height is published", which stopped being true the moment that read
   shipped. */
function clockLine(nowH, phaseShort, settleAt, escrowUntil){
  if(phaseShort==="in dispute")
    return "a sealed vote is deciding — its countdown is on the claim page";
  if(phaseShort==="proposed" && settleAt)
    return nowH!=null? (settleAt>nowH? `settles undisputed at ≈block ${fmtN(settleAt)} — in ${wall(nowH,settleAt)} unless disputed`
                                     : "the settle window has passed — anyone may settle it now")
                     : `settles undisputed at ≈block ${fmtN(settleAt)}`;
  if(phaseShort==="provisional" && escrowUntil)
    return nowH!=null? (escrowUntil>nowH? `reopenable until ≈block ${fmtN(escrowUntil)} — in ${wall(nowH,escrowUntil)}`
                                        : "the reopen window has closed — finalizable")
                     : `reopenable until ≈block ${fmtN(escrowUntil)}`;
  return "";
}
function pctYes(y,n){ const t=(y||0)+(n||0); return t>0? Math.round(1000*y/t)/10 : null; }
/* A per-claim sparkline from the three ratio series the realm actually keeps:
   lifetime conviction -> trailing week -> instantaneous. No invented history. */
function sparkSvg(pts){
  const W=60,H=16,P=2,n=pts.length;
  const xy=pts.map((p,i)=>(P+i*(W-2*P)/(n-1)).toFixed(1)+","+(H-P-(Math.max(0,Math.min(100,p))/100)*(H-2*P)).toFixed(1));
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line class="base" x1="${P}" y1="${H/2}" x2="${W-P}" y2="${H/2}"></line><polyline points="${xy.join(" ")}"></polyline></svg>`;
}
/* The three ratios in the order the spark draws them, or null unless all three
   are finite. Derived from ratios() rather than recomputing: the two functions
   had the same three statements, character for character, including the
   trailing-week fallback — trailYesMature && trailOImature && trailOI > 0, else
   null — which is the part with a rule in it and the part a change would have to
   land in twice. They differ only in shape and gate, so that is all this keeps:
   ratios() answers {inst,life,week} for callers that can render a partial
   series, this orders them and refuses an incomplete one. */
function claimSeries(d){
  const r = ratios(d);
  return ([r.inst,r.life,r.week].every(Number.isFinite))? [r.life,r.week,r.inst] : null;
}
/* THE DOCKET'S SIGNAL CELL, and why it is not just sparkSvg().
   The three-point spark needs all THREE series — lifetime conviction, the
   trailing week, and the instant ratio — so claimSeries() returns null unless
   every one of them is finite. That is right: "LIVE never invents history", and
   a line drawn through a series the chain has not matured yet would be a
   fabrication.
   But the CELL then rendered empty. The trailing week is not mature until
   answerWindow blocks have passed, so on a real chain that is every young claim
   — a blank space beside rows carrying a number, with nothing to say whether the
   claim has no stake or the page simply could not draw it. Measured on a seeded
   node: the docket showed nothing at all.
   So: draw the line when there is a line, show the ratio when only the ratio is
   known, and say plainly when there is neither. */
function docketSignal(ser, inst){
  if(ser) return `${sparkSvg(ser)}<b>${ser[2].toFixed(1)}%</b><small>YES now</small>`;
  if(Number.isFinite(inst))
    return `<b>${inst.toFixed(1)}%</b><small>YES now · no trend yet</small>`;
  return `<small class="muted">not staked yet</small>`;
}
function esc(s){ return String(s).replace(/[&<>"'`]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c])); }
/* undo the realm's markdown inline-escaping (\[ \] \( …) when we lift a title
   out of a Render link back into our own escaped DOM text. */
function unesc(s){ return String(s).replace(/\\([\\`*_\[\]()~>\-+.!#<&])/g, "$1"); }

/* Untrusted text (claim titles, court names by strangers): HTML-escaped.
   The realm sanitizes for its markdown; the overlay must not re-introduce a hole. */
function safeInline(s){ return esc(s); }
/* THE CLAIM'S OWN STATEMENT OF WHAT IT MEANS — what would settle it, what is in
   view, what it is not asking. COURTS_STRUCTURE.md §4: fixed at creation, because
   a revisable body would let an author take a position, watch the market, then
   rewrite the framing until their side is the true one.

   Escaped, then split on blank lines into paragraphs. NOT markdown: the realm
   sanitises the body for ITS renderer's markdown, and re-interpreting the same
   text as markup here would be a second, differently-shaped attack surface on a
   field any stranger can fill. Paragraphs are all the structure a question of
   fact needs. Blank-line splitting matches the realm's own sanitize.Block, which
   is what normalised the breaks in the first place. */
function claimBody(d){
  const raw = d && typeof d.body === "string"? d.body.trim() : "";
  if(!raw) return "";
  const paras = raw.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  if(!paras.length) return "";
  return `<div class="claimbody">${paras.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;
}

/* THE EVIDENCE, ON THE CARD AND ON THE CLAIM. A strip rather than a grid: seven
   does not divide evenly, and the box is RESERVED from the stored dimensions
   because .mapsel is tuned closely enough that an image arriving after paint
   would resize the card mid-glide.

   Guarded on typeof like every other call into media.js, so a missing file costs
   the exhibits and not the card. */
/* The exhibits the last card drew, held for the click handler rather than
   re-derived from the DOM: the lightbox needs the ITEMS — hashes, byte counts,
   kinds — and an <img> src cannot be checked against anything. One variable is
   enough because one card is open at a time; the map's selection card and the
   claim page never coexist. */
var LAST_EXHIBITS = [];
/* The court whose composer is open, so a confirmed broadcast clears the right
   draft and only that one. */
var COMPOSE_DRAFT_COURT = "";
function claimExhibits(c){
  if(typeof mediaCardItems !== "function") return "";
  const items = mediaCardItems((c && c.media) || [], siteHost());
  if(!items.length) return "";
  /* Parked for the click handler rather than re-derived from the DOM: the
     lightbox needs the ITEMS (hashes, byte counts, kinds), and an <img> src is
     not enough to check anything against. */
  LAST_EXHIBITS = (c && c.media) || [];

  /* A BOUNDED GRID, not a column (owner ruling, CLAIM_MEDIA §10). Seven exhibits
     stacked full-width put the ballot about four screens below the title, so the
     evidence buried the thing a reader came to do. This costs the same height
     whether a claim carries one exhibit or seven.

     At most four tiles are drawn and the fourth says how many more there are.
     Nothing is hidden by that: the lightbox holds every exhibit, the caption list
     below names every exhibit, and clicking the fourth tile opens the gallery at
     that point so the rest are one arrow away.

     ONE EXHIBIT IS NOT CROPPED. A single tile keeps the image's own shape up to a
     height cap, because there is no grid to fill and cropping the only piece of
     evidence on a claim is the court hiding part of it. Two or more are cropped
     to fill their cell, which is what makes the block a fixed size — and there
     the tile is a way IN rather than the exhibit itself. */
  const shown = items.slice(0, 4);
  const hidden = items.length - shown.length;

  const tiles = shown.map((x, i) => {
    const last = hidden > 0 && i === shown.length - 1;
    const more = last ? `<span class="ex-more">+${hidden}</span>` : "";
    const num = `<span class="ex-n">${esc(String(x.n))}</span>`;
    /* A VIDEO PLAYS HERE AND NOWHERE ELSE. gnoweb's CSP has no media-src, so it
       shows a link; this page can play it. preload=none is load-bearing: nothing
       is fetched from the filer's host until somebody presses play, so the
       disclosure is the same as following a link and happens only when asked
       for. */
    if(x.video) return `<figure class="ex ex-vid" role="listitem">`
      + `<video class="ex-v" src="${esc(x.video)}" controls preload="none"`
      + ` referrerpolicy="no-referrer" playsinline></video>${num}${more}</figure>`;
    /* ex-gone WITHOUT ex, because `.ex` is what makes a tile look openable and
       this one carries no data-ex for the click handler to find. A slot that was
       never going to have an image should not claim otherwise. It KEEPS ITS
       PLACE: a gap that renumbered the rest would leave every later exhibit
       meaning something different than it did a moment ago. */
    if(!x.src) return `<figure class="ex-gone" role="listitem">`
      + `${num}<span class="ex-note">${esc(x.note)}</span>${more}</figure>`;
    /* Reserved only for a single tile — with two or more the grid cell fixes the
       box, so there is nothing to jump. See mediaBoxRatio for why the filer's
       declared ratio is not trusted past 8:1. */
    const box = (shown.length === 1 && typeof mediaBoxRatio === "function")
      ? mediaBoxRatio(x.w, x.h) : "";
    const ratio = box ? ` style="aspect-ratio:${esc(box)}"` : "";
    /* referrerpolicy: the host serving this must not learn which claim is being
       read. loading=lazy: a tile off screen costs nothing. */
    return `<figure class="ex" role="listitem" data-ex="${x.n - 1}" tabindex="0"`
      + ` aria-label="Open exhibit ${esc(x.label)} full size and check it against what was filed">`
      + `<img class="ex-img" src="${esc(x.src)}" alt="${safeInline(x.caption || ("exhibit " + x.label))}"`
      + ` loading="lazy" referrerpolicy="no-referrer"${ratio}>${num}${more}</figure>`;
  }).join("");

  /* THE CAPTIONS STAY ON THE PAGE. They are claim text — fixed at creation, no
     editor — and the number beside each is how a reader and a moderator refer to
     one. A grid has no room for them on the tiles, and putting them only in the
     lightbox would mean a label nobody sees without clicking. Seven lines of
     text is a cost worth paying; seven full images was not. */
  const capped = items.filter(x => x.caption || x.note);
  const caps = capped.length
    ? `<ol class="ex-caps">` + capped.map(x =>
        `<li dir="auto"><span class="ex-capn">${esc(String(x.n))}</span>`
        + `${x.caption ? safeInline(x.caption) : ""}`
        + `${x.note ? `<span class="ex-note">${esc(x.note)}</span>` : ""}</li>`).join("")
      + `</ol>`
    : "";

  return `<div class="exhibits" data-n="${shown.length}" role="list">${tiles}</div>${caps}`;
}

/* AN EXHIBIT YOU CAN LINK TO.
 *
 * The number is described throughout as "the number a reader and a moderator
 * both refer to it by" — it is why a purge tombstones a slot instead of
 * removing it, so that "the second exhibit" means the same picture tomorrow.
 * But there was no way to SEND anybody to one. Somebody arguing about exhibit 3
 * could link to the claim and then write "click the third picture".
 *
 * ?ex=N, one-based, so the address matches the number printed on the page. It
 * rides the hash through replaceState — the same trick ?q uses — so putting it
 * there does not re-run the router and close the very thing it describes. It
 * follows the reader through the gallery, so the bar always holds a link to what
 * is on screen rather than to whatever was opened first, and it is cleared on
 * close because a closed lightbox is not a thing to link to. */
function setExParam(n){
  try{
    const raw = location.hash.replace(/^#/,"") || "/";
    const [path, qs] = raw.split("?");
    const ps = new URLSearchParams(qs || "");
    if(n) ps.set("ex", String(n)); else ps.delete("ex");
    const tail = ps.toString()? "?"+ps.toString() : "";
    history.replaceState(null, "", "#"+path+tail);
  }catch(_){}
}

function openExhibit(i, from){
  if(typeof mediaLightbox !== "function" || !LAST_EXHIBITS.length) return false;
  if(!(i >= 0 && i < LAST_EXHIBITS.length)) return false;
  mediaLightbox(LAST_EXHIBITS, i, {siteDomain: siteHost(), activeElement: from,
    onShow: n => setExParam(n + 1), onClose: () => setExParam(null)});
  return true;
}

/* An ?ex= on the way in, once the exhibits are drawn. Out of range is ignored
   rather than clamped: a stale link to exhibit 5 of a claim that now shows three
   should leave the reader on the claim, not silently on a different picture. */
function openExhibitFromURL(){
  // THE WHOLE VALUE MUST BE THE NUMBER. parseInt takes a prefix and shrugs at
  // the rest, so ?ex=1e21 and ?ex=1.5 both came out as 1 and opened the first
  // exhibit — somebody handed a malformed address got a picture rather than the
  // claim. Out of range is already ignored; malformed should be too, for the
  // same reason. (Nothing was injectable either way: the value is a number long
  // before it reaches a selector, so ?ex=1"] , [data-ex="0 was only ever 1.)
  if(!/^[0-9]+$/.test(QP.ex || "")) return;
  const n = parseInt(QP.ex, 10);
  if(!(n >= 1)) return;
  const fig = document.querySelector(`.exhibits [data-ex="${n-1}"]`);
  openExhibit(n - 1, fig || undefined);
}

/* WHAT THIS PAGE CAN DO THAT GNOWEB CANNOT, said where the evidence is rather
   than nowhere at all.

   The realm's own claim page carries a sentence about this — "the court recorded
   a fingerprint of each image when the claim was filed, so a swap can be
   detected — but not on this page" — because gnoweb's CSP forbids the fetch that
   would check it. This page CAN check it, in the lightbox, and said nothing:
   the only hint that verification exists was an aria-label reading "full size".
   So the surface that cannot verify announced the promise and the surface that
   can kept quiet about it.

   Only when there is something checkable to open. A claim carrying one video has
   no fingerprint behind it, and offering to check would be the overstatement the
   realm's sentence is carefully written to avoid. */
function claimEvidenceNote(c){
  const items = (c && c.media) || [];
  if(!items.some(i => i && i.kind === "img" && i.sha256 && !i.purged)) return "";
  return `<p class="ex-lede">Each image was fingerprinted when the claim was filed — `
       + `open one to check it still matches.</p>`;
}

/* AN EXHIBIT THAT WILL NOT LOAD SAYS SO, AND NEVER GOES LOOKING ELSEWHERE.
   Now that the page knows where the archive is, mediaSrc points every image at
   it and stops — so this is the first time a failed fetch has a single visible
   outcome instead of a silent fall-through to the filer's host.

   FALLING BACK TO A MIRROR WOULD UNDO MODERATION. The archive refuses a blocked
   blob, which is exactly what a takedown looks like from here: 404. An <img>
   that answered that by trying the filer's imgur link would re-publish the one
   image an operator destroyed, from the claim's own page, automatically. So a
   failure is reported and nothing else is attempted — the same reason the map
   never uses a mirror at all.

   and these images are written into innerHTML in two places that re-render. No
   inline onerror: the CSP would allow one, but this stays out of the markup. */
/* HOVERING THE CHART READS OUT THE POINT UNDER THE POINTER. Delegated from the
   document so every chart on every route is covered by one listener and none of
   them needs a mount call — a chart written into innerHTML by a later render is
   live the moment it lands.
   The svg carries its own points (data-hov: x,y,unix,share) and whether they
   could be dated (data-hovdated). Nothing is computed about TIME here; the
   chart already did that with the same dater its axis uses, because a second
   opinion about when a point happened is precisely the bug this surface has
   had three times over.
   Nearest by X only. A share series is a step function — the pointer is asking
   "what was it around here", which is a question about the horizontal axis, and
   nearest-in-2D would jump to a far point that happens to share a y. */
function chartHoverAt(svg, clientX){
  const box = svg.getBoundingClientRect(); if(!box.width) return null;
  const vx = (clientX - box.left) / box.width * 640;   // the viewBox is 640 wide
  /* AN EVENT WINS WHEN YOU ARE ON IT. A marker is a thing a reader points AT —
     "when does this settle", "where is now" — so within a few units of one, that
     is the question being asked, even where the series also has points. Outside
     that the line answers. */
  let ev=null, ed=Infinity;
  for(const q of (svg.getAttribute("data-hovev")||"").split(";")){
    if(!q) continue;
    const i=q.indexOf(","), j=q.indexOf(",", i+1);
    const ex=+q.slice(0,i), d2=Math.abs(ex-vx);
    if(d2<ed){ ed=d2; ev={x:ex, y:124, t:+q.slice(i+1,j), label:q.slice(j+1)}; }
  }
  if(ev && ed<=10) return ev;
  let best=null, bd=Infinity;
  for(const q of (svg.getAttribute("data-hov")||"").split(";")){
    if(!q) continue;
    const p2=q.split(",");
    const d2=Math.abs(+p2[0]-vx);
    if(d2<bd){ bd=d2; best={x:+p2[0], y:+p2[1], t:+p2[2], share:+p2[3]}; }
  }
  /* NOTHING TO READ OUT PAST THE LINE. Most of the plot's right side is the
     future wash — scheduled deadlines, no recorded points — and nearest-by-X
     with no bound answered every one of them with the last real point, snapping
     the crosshair a third of the width away while the pointer sat over a date
     the series never reached. Beyond this the answer is "no reading here",
     which is the honest one — unless a marker is within reach, which is why the
     events are tried first and on a looser bound than this one. */
  if(best && bd <= 36) return best;
  return (ev && ed<=26)? ev : null;
}
function chartHoverShow(svg, hit){
  const xh = svg.querySelector(".xh"); if(!xh) return;
  if(!hit){ xh.classList.remove("on"); return; }
  const dated = svg.getAttribute("data-hovdated")==="1";
  // An event names itself and its date; a point on the line names its date and
  // what the share was. Both start from the same dater, so they cannot disagree.
  const when = dated && hit.t? stampDate(hit.t) : "";
  const label = hit.label!=null
    ? hit.label + (when? " · " + when : "")
    : (when? when + " · " : "") + hit.share.toFixed(1) + "% YES";
  xh.classList.add("on");
  xh.querySelector(".xhl").setAttribute("x1", hit.x);
  xh.querySelector(".xhl").setAttribute("x2", hit.x);
  const dot = xh.querySelector(".xhd");
  dot.setAttribute("cx", hit.x); dot.setAttribute("cy", hit.y);
  // A marker's dot rides the axis where the marker's own dot is, so the readout
  // points at the mark rather than hovering above it on the series' line.
  xh.classList.toggle("onev", hit.label!=null);
  const t = xh.querySelector(".xht");
  t.textContent = label;
  // Measured, then placed: the box has to hold whatever the label came out as,
  // and it flips to the left of the crosshair when it would run off the plot.
  const w = Math.ceil(t.getComputedTextLength()) + 12;
  const left = hit.x + 8 + w > 606;
  const bx = left? hit.x - 8 - w : hit.x + 8;
  const by = Math.max(14, Math.min(104, hit.y - 22));
  const rect = xh.querySelector(".xhbox rect");
  rect.setAttribute("x", bx); rect.setAttribute("y", by);
  rect.setAttribute("width", w);
  t.setAttribute("x", bx + 6); t.setAttribute("y", by + 12);
}
/* mousemove, NOT pointermove. Every pointing device synthesizes mouse events —
   pointer events are the richer API and the one a headless browser turns out
   not to synthesize from a driven cursor at all, so a readout built on them
   cannot be tested by driving a mouse across the plot, which is the only way to
   know it works. A hover readout is a pointing-device affordance either way;
   touch reaches the same facts through the event dots' own titles. */
document.addEventListener("mousemove", (e) => {
  const svg = e.target && e.target.closest && e.target.closest(".bigchart svg");
  if(!svg) return;
  chartHoverShow(svg, chartHoverAt(svg, e.clientX));
});
/* THE SVG ITSELF, NOT ANY DESCENDANT. mouseleave fires on every element the
   pointer leaves, and closest() answers yes for all of them — so crossing from
   one path to the next INSIDE the chart hid the readout that the mousemove
   directly before it had just filled in. The text was right and the layer was
   invisible, which is the hardest kind of wrong to see. Capture, because
   mouseleave does not bubble; identity, because only the svg's own leave means
   the pointer is off the chart. */
document.addEventListener("mouseleave", (e) => {
  const t = e.target;
  if(t && t.matches && t.matches(".bigchart svg")) chartHoverShow(t, null);
}, true);
/* A CORRECTED FIELD STOPS BEING WRONG. Without this the red survives the fix,
   which teaches a reader that the mark means nothing. */
document.addEventListener("input", (e) => {
  const t = e.target;
  if(t && t.id !== "stakeamt") return;
  if(!t) return;
  t.removeAttribute("aria-invalid");
  const w = document.getElementById("stakeamtwrap");
  if(w){ clearTimeout(w._flash); w.classList.remove("flash"); }
});
document.addEventListener("error", (e) => {
  const t = e.target;
  if (!t || !t.classList) return;
  // A broken glyph inside a map node is worse than no image: the node is 20px
  // and the alt text has nowhere to go.
  if (t.classList.contains("mthumb")) { t.remove(); return; }
  if (!t.classList.contains("ex-img")) return;
  const fig = t.closest(".ex");
  if (!fig || fig.dataset.gone) return;
  fig.dataset.gone = "1";
  fig.classList.add("ex-gone");
  // Nothing to zoom into, so the affordances go with the image: the lightbox
  // finds its exhibit by data-ex, and offering "open full size" for bytes that
  // are not there is a promise the page cannot keep.
  fig.classList.remove("ex");
  fig.removeAttribute("data-ex");
  fig.removeAttribute("tabindex");
  fig.removeAttribute("aria-label");
  t.remove();
  const note = document.createElement("span");
  note.className = "ex-note";
  // The same words mediaCardItems uses when there was no source at all, because
  // to a reader those are the same situation.
  note.textContent = "not currently available";
  fig.appendChild(note);
}, true);


/* ============================ tx links ================================== */
/* Every action is a gnoweb $help link with arguments pre-filled — the overlay is
   optional: the transaction is the realm's, signed in the user's own wallet.
   The realm's funcs are crossing (func F(cur realm, …)); gnoweb injects `cur`, so
   the links carry only the ordinary arguments. */
function tx(func, args){
  const q = Object.entries(args||{}).map(([k,v])=>"&"+k+"="+encodeURIComponent(v)).join("");
  return CFG.gnoweb.replace(/\/$/,"")+"/r/kourt/kourtv2$help&func="+func+q;
}
/* `edit` marks the buttons whose ARGUMENTS ARE PLACEHOLDERS — text the reader
   has to replace before it means anything. Two do: StartCourt and StartCourtP
   ship slug:"my-court", name:"My Court". Everything else on this page passes
   arguments the page derived itself, which is why they no longer stop to ask. */
function btn(label, func, args, cls, sub, send, gate, edit, blocked, glyph, amt){
  // In demo mode the data is a sample: an action that links a real network to
  // sample arguments is a trap, so the button is inert and says why.
  // `send` (Buy only): a concrete "<µGNOT>ugnot" from the receipt input — it
  // prefills the CLI --send and the Adena amount. `gate` marks the one-click
  // paths as needing the acknowledgement tick first (live only).
  // ONE CONTROL, and it is the one with the verb on it. This used to be three:
  // a gnoweb link carrying the label, a CLI toggle, and — only when a wallet was
  // already connected — a small "✍ Sign". So the primary action of the page was
  // a link OFF the page, the one-click path was a secondary button, and a reader
  // with no wallet saw no sign affordance at all: nothing on the ballot said
  // signing was possible, let alone how to start.
  //
  // DECIDED AT CLICK TIME, not at render time, which is why this is a <button>
  // with no href. Whether a wallet is connected can change while the panel is on
  // screen (the rail's Connect does not re-render every open panel), so a
  // control that committed to gnoweb at render would be wrong by the time it was
  // pressed. The handler asks window.adena and CFG.addr at the moment of the
  // click and either signs or opens the help dialog.
  //
  // data-cli RIDES THE BUTTON. The command line did not go away with the CLI
  // toggle — the dialog shows it, copyable, for anyone without a wallet — and
  // keeping it in the markup means buy_test's --send assertions still see it.
  // `glyph` overrides the pen for a button whose verb is not "sign a statement".
  /* U+FE0E after the pen: TEXT presentation, not emoji. Without it macOS and
     iOS draw U+270D as a full-colour yellow hand, which is the only saturated
     thing on a page of flat ink and reads as a sticker somebody left on the
     button. The variation selector costs three bytes and every platform that
     has no colour glyph ignores it. */
  const inner = `<span class="g">${glyph || (CFG.mode==="demo"?"↗":"✍\uFE0E")}</span> ${esc(label)}${sub?` <small>${esc(sub)}</small>`:""}`;
  /* The demo carries `blocked` too. It exists to show what the live page looks
     like, and a control the chain would refuse is part of that — the click
     still answers "demo data", because the inert branch is tested first, but
     the grey is on screen where a reader can see the state exists at all. */
  if(CFG.mode==="demo")
    return `<span class="act"><button class="btn ${cls||""} inert" data-inert="1"`
      + (blocked? ` data-blocked="${esc(blocked)}" aria-disabled="true"` : "")
      + (amt? ` data-amt="1"` : "")
      + `>${inner}</button></span>`;
  // NOT `disabled` while gated: a disabled button swallows the click, and the
  // click is what prints "tick the acknowledgement first". It stays pressable
  // and the handler refuses, so the refusal can explain itself.
  /* `blocked` — the realm WOULD refuse this right now, and we know why. Greyed
     and still pressable, for the reason the acknowledgement gate above is: a
     disabled button swallows the click, and the click is what prints the
     reason. Only ever passed a condition the page can actually evaluate; a
     guess here is worse than no guess, because it withholds a control from
     somebody who could have used it. */
  return `<span class="act"><button class="btn ${cls||""}" data-act="1"`
    + (edit? ` data-edit="1"` : "")
    + (blocked? ` data-blocked="${esc(blocked)}" aria-disabled="true"` : "")
    + (amt? ` data-amt="1"` : "")
    + (gate? ` data-needack="1" aria-disabled="true"` : "")
    + ` data-func="${esc(func)}" data-args="${esc(JSON.stringify(args||{}))}"`
    + ` data-cli="${esc(cliCmd(func,args,send))}" data-tx="${esc(tx(func,args))}"`
    + (send? ` data-send="${esc(send)}"` : "")
    + `>${inner}</button></span>`;
}

/* SHELL-QUOTED, and it has to be now that a comment body is one of these
   arguments. `--args "` + value + `"` was fine while every argument was a slug,
   an id or an amount; a comment is up to 2000 characters of anything a stranger
   typed, and one apostrophe or quote turned the pasted command into a different
   command. Single quotes with the '\'' idiom are exact — nothing inside them is
   interpreted, newlines included — so what a reader pastes is what the Sign
   button would have signed. */
const shq = s => "'" + String(s).replace(/'/g, `'\\''`) + "'";

/* The same action as a gnokey command, for people at a terminal. One --args per
   argument; --send only where the function takes payment (Buy). The gas pair is
   GAS_WANTED/GAS_FEE_UGNOT, the same two numbers the wallet signs with — printed
   from the constants rather than restated, because the last time they were
   restated the command carried a 10M ceiling that a Buy cannot fit inside. */
function cliCmd(func, args, send){
  let c = (CFG.mode==="demo"? "# demo data — these entities exist on no chain; switch Source to a live node first\n" : "")
        + (func==="Buy"? "# one-way: the GNOT is burned; no sell-back\n" : "")
        + "gnokey maketx call \\\n  --pkgpath \"" + PKG + "\" --func \"" + func + "\"";
  for(const k of Object.keys(args||{})) c += " \\\n  --args " + shq(args[k]);
  if(func==="Buy") c += " \\\n  --send " + (send||"AMOUNTugnot");
  c += " \\\n  --gas-fee " + GAS_FEE_UGNOT + "ugnot --gas-wanted " + GAS_WANTED + " --broadcast" +
       " \\\n  --chainid \"" + (CFG.chainid||"dev") + "\" --remote \"" + CFG.rpc + "\" YOURKEY";
  return c;
}

/* A copyable command block, with the clipboard fallback intact.

   This was a delegated handler behind a "CLI" toggle beside every action — 47
   buttons' worth of chrome for something most readers never press. The block
   itself was worth keeping: it is the whole answer for somebody without a
   wallet extension. So it became a function, and the sign-help dialog is the
   one place that calls it.

   THE FALLBACK IS THE POINT. navigator.clipboard is undefined on file:// and on
   any non-secure origin, which is exactly how this page is often opened. When
   the write fails the text is SELECTED instead, so Ctrl/⌘-C still works, and
   the button says so rather than silently doing nothing. */
function cliBlock(cmd){
  const wrap = document.createElement("div");
  const pre = document.createElement("pre");
  pre.className = "cliblock mono";
  pre.textContent = cmd;
  pre.title = "Click to copy";
  const selectPre = ()=>{ const r=document.createRange(); r.selectNodeContents(pre);
    const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); };
  const copy = ()=> navigator.clipboard? navigator.clipboard.writeText(cmd)
    : Promise.reject(new Error("no-clipboard"));
  pre.onclick = ()=>{ copy().then(()=>{ pre.classList.add("copied"); setTimeout(()=>pre.classList.remove("copied"), 900); }).catch(selectPre); };
  const cb = document.createElement("button");
  cb.type = "button"; cb.className = "copybtn"; cb.textContent = "Copy";
  cb.setAttribute("aria-live","polite");
  cb.onclick = ()=>{ copy().then(()=>{ cb.textContent = "Copied ✓"; setTimeout(()=>{ cb.textContent = "Copy"; }, 1200); }).catch(()=>{ selectPre(); cb.textContent = "Selected — press Ctrl/⌘-C"; setTimeout(()=>{ cb.textContent = "Copy"; }, 2500); }); };
  wrap.appendChild(pre); wrap.appendChild(cb);
  return wrap;
}

/* WHAT TO DO WHEN THE BUTTON CANNOT SIGN — the dialog that replaced a dead end.

   Before this, pressing an action with no wallet connected opened gnoweb in a
   new tab and said nothing about why, and a reader without the extension had no
   route at all except a CLI toggle they had to know to press. There are exactly
   three situations and each one gets the thing it needs:

     wallet present, not connected  -> Connect, and the action retries itself
     no wallet at all               -> where to get one, incl. the file:// trap
     neither is what they want      -> gnoweb, and the command line, both here

   THE RETRY IS THE FLOW. Connecting and then having to find the button again is
   the same dead end one step later, so the dialog re-fires the click it
   interrupted. */
/* NO VOTING WEIGHT — said here, before the wallet is ever opened.

   This case used to reach the reader as a raw realm panic relayed through
   Adena's gas-estimation simulate: "ERROR: kourtv2: ...". They pressed a button,
   waited for an extension to wake, and got the court's internal wording for an
   answer the page could have given instantly and in its own words.

   TWO CASES, AND ONLY ONE IS FIXABLE, which is the whole reason the realm's
   VoteWeightWhy is read rather than the balance. Weight is min(snapshot,
   holding):

     no holding NOW        -> buy some. The panel is one link away and the
                              purchase counts on later questions immediately.
     no holding THEN       -> nothing to do for this round. Coin bought today
                              weighs nothing on a round frozen last week, and
                              telling somebody to buy would be selling them
                              something that cannot work.

   The court's own sentence is shown rather than paraphrased: it is the same
   text the chain would have refused with, so a reader who does see the panic
   later recognises it. */
function noCoinHelp(why, el){
  let slug = "";
  try{ slug = String(JSON.parse(el.dataset.args||"{}").courtSlug || ""); }catch(_){}
  const sym = "KOURT:" + esc(slug).toUpperCase();
  // THE DISCRIMINATING CLAUSE IS THE REALM'S, from whyWeighed (voteweight.gno),
  // and check-web-constants pins it: reword it there and the build says so
  // rather than this quietly offering to sell coin to somebody it cannot help.
  const tooLate = /you had none when this vote started/.test(why || "");
  const dlg = document.createElement("dialog");
  dlg.className = "helper";
  dlg.innerHTML = `<div class="hd"><h3>You cannot vote on this round</h3>
      <button type="button" class="pill void" data-cancel>close</button></div>
    <div class="bd">
      <p>${tooLate
        ? `You had no ${sym} when this vote started, so you have no say in it. Buying now counts in the next vote, not this one.`
        : `You need ${sym} to vote here. It is this court's own coin — not an investment, just what gives you a say.`}</p>
      ${tooLate || !slug ? ""
        : `<div class="actions"><a class="btn primary" href="#/c/${esc(slug)}?at=join">Get ${sym}</a></div>`}
    </div>`;
  document.body.appendChild(dlg);
  const close = ()=>{ try{ dlg.close(); }catch(_){} dlg.remove(); };
  dlg.addEventListener("click", ev => { if(ev.target.closest("[data-cancel]") || ev.target.closest("a")) close(); });
  dlg.addEventListener("close", ()=> dlg.remove());
  dlg.showModal();
}

function signHelp(el){
  const func = el.dataset.func || "", cli = el.dataset.cli || "", txurl = el.dataset.tx || "";
  const hasWallet = !!window.adena;
  const fileTrap = location.protocol === "file:";
  const dlg = document.createElement("dialog");
  dlg.className = "helper";
  dlg.innerHTML = `<div class="hd"><h3>Sign ${esc(func)}</h3>
      <button type="button" class="pill void" data-cancel>close</button></div>
    <div class="bd">
      ${hasWallet
        ? `<p>Adena is installed but this page is not connected to it yet. Connect once and the action continues — you will still see the transaction before you approve it.</p>
           <div class="actions"><button type="button" class="btn" data-connect>Connect Adena</button></div>
           <p class="small" data-connect-why role="alert" hidden></p>`
        : `<p data-nowallet>${fileTrap
             ? "This page cannot see a wallet, and on a <span class=\"mono\">file://</span> page it never will — extensions do not run there. Serve this folder (<span class=\"mono\">python3 -m http.server</span>) and reload."
             : "This page cannot see a wallet. Either Adena is not installed in <em>this</em> browser profile, or it had not finished loading when you pressed the button — reloading fixes the second. If it is installed and unlocked here, it will appear in a moment."}</p>`}
      <h4>Or do it another way</h4>
      <p class="small muted">Both of these sign with your own key. Nothing on this page ever holds one.</p>
      <div class="actions"><a class="btn" target="_blank" rel="noopener" href="${esc(txurl)}">Open in gnoweb</a></div>
      <div data-cli-slot></div>
    </div>`;
  dlg.querySelector("[data-cli-slot]").appendChild(cliBlock(cli));
  document.body.appendChild(dlg);
  /* AND IT KEEPS LOOKING, because the sentence above promises it will. Adena
     injects window.adena asynchronously, so a reader who presses Buy early gets
     told there is no wallet a fraction of a second before there is one — and the
     dialog they are staring at never changes its mind. Polled rather than
     event-driven: the extension announces itself by assigning a global, and
     there is no event to listen for. Stops at the first sight of one, when the
     dialog closes, or after five seconds — by which point it really is absent. */
  if(!hasWallet && !fileTrap){
    const spot = dlg.querySelector("[data-nowallet]");
    const t0 = Date.now();
    const look = setInterval(()=>{
      if(!dlg.isConnected || Date.now()-t0 > 5000){ clearInterval(look); return; }
      if(!window.adena) return;
      clearInterval(look);
      if(!spot) return;
      spot.outerHTML = `<p>Adena appeared just now — it had not finished loading when you pressed the button. `
        + `Connect once and the action continues; you will still see the transaction before you approve it.</p>`
        + `<div class="actions"><button type="button" class="btn" data-connect>Connect Adena</button></div>`
        + `<p class="small" data-connect-why role="alert" hidden></p>`;
    }, 250);
    dlg.addEventListener("close", ()=> clearInterval(look));
  }
  const close = ()=>{ try{ dlg.close(); }catch(_){} dlg.remove(); };
  dlg.addEventListener("click", async ev => {
    if(ev.target.closest("[data-cancel]")) return close();
    const c = ev.target.closest("[data-connect]");
    if(c){
      // SAME COLD START, same silence. AddEstablish wakes the service worker
      // too, so the dialog stays open and busy rather than closing onto a page
      // where nothing appears to be happening. It closes once the wallet
      // answers, which is also when the retry can fire.
      if(c.disabled) return;
      c.disabled = true;
      c.classList.add("busy"); c.setAttribute("aria-busy","true");
      let why = null;
      try{ why = await adenaConnect(); }
      finally{ c.disabled = false; c.classList.remove("busy"); c.setAttribute("aria-busy","false"); }
      /* A FAILED CONNECT KEEPS THE DIALOG AND SAYS WHY, HERE. Closing on failure
         was indistinguishable from the button doing nothing at all — which is
         how it was reported. The reason was already being written to the rail
         hint, behind this modal. */
      if(!CFG.addr){
        const slot = dlg.querySelector("[data-connect-why]");
        const msg = why || "Adena did not connect, and gave no reason.";
        if(slot){ slot.textContent = msg; slot.hidden = false; }
        return;
      }
      close();
      /* THE CAPTURED NODE IS GONE BY NOW, and this is the bug that was reported
         as "I clicked connect and it disappeared". adenaConnect() re-renders on
         success and every route replaces main.innerHTML, so `el` is detached.
         el.click() on a detached node dispatches an event that never reaches the
         delegated listener on document -- so the dialog closed and the action
         the reader was part-way through simply evaporated.
         Re-find the equivalent control in the document that exists NOW, matched
         on the function and arguments rather than on identity. */
      const wantF = el.dataset.func || "", wantA = el.dataset.args || "";
      const live = [...document.querySelectorAll("[data-act][data-func]")]
        .find(n => (n.dataset.func||"") === wantF && (n.dataset.args||"") === wantA);
      if(live) live.click();
      else note("Connected as "+shortAddr(CFG.addr)+". Press the button again to continue.", true);
    }
  });
  dlg.addEventListener("close", ()=> dlg.remove());
  dlg.showModal();
}

/* ============================ Adena wallet ============================= */
/* Optional. The page works fully without it: every action stays a gnoweb link
   and a CLI command. window.adena is injected asynchronously by the extension,
   so it is probed on click, never at load. Envelope: {code,status,data};
   code 0 = ok, 4000 = user rejected, 4001 = already connected (fine). */
function adenaAbsent(){
  const hint = document.getElementById("wallethint");
  hint.hidden = false;
  /* WHAT IS KNOWN IS THAT THIS PAGE CANNOT SEE ONE. It used to say "No wallet
     found. Install the Adena extension" — told to somebody who had it installed,
     which reads as the page being broken and is the one sentence guaranteed not
     to help. window.adena is injected asynchronously and only into the profile
     the extension is in, so absence at this instant has three ordinary causes
     and "not installed" is only one of them. */
  hint.textContent = location.protocol==="file:"
    ? "This page cannot see a wallet, and on a file:// page it never will — extensions do not run there. Serve this folder (python3 -m http.server) and reload."
    : "This page cannot see a wallet — check it is installed in this browser profile and unlocked, or reload if the page opened before the extension did.";
}
/* RETURNS THE FAILURE, and that return value is the fix for a bug the owner hit
   on the live site: "clicking the popup connect button doesn't do anything".
   It did do something — it failed, and it wrote WHY into #wallethint, which sits
   at the foot of the LEFT RAIL. That is behind the modal doing the asking. So
   the dialog closed, CFG.addr was still unset, nothing re-fired, and the only
   account of what happened was parked in a corner of the page the reader had no
   reason to look at.
   The rail hint stays, because the rail's own button has no better place to put
   it. What is new is that callers WITH a better place can now get the string. */
async function adenaConnect(){
  const a = window.adena;
  if(!a){ adenaAbsent(); return "This page cannot see a wallet."; }
  try{
    const est = await a.AddEstablish("Kourt");
    if(est.code!==0 && est.code!==4001){ throw new Error(est.message||("code "+est.code)); }
    const acct = await a.GetAccount();
    if(acct.code!==0 || !acct.data || !acct.data.address){ throw new Error(acct.message||"no account"); }
    CFG.addr = acct.data.address; saveCfg();
    reflectWallet();
    /* AWAITED. render() is async, and a caller that wants to resume an
       interrupted action needs the new DOM to exist before it looks for it.
       Un-awaited, control came back while main still held the OLD markup (or
       loading()'s placeholder), and the resume searched the wrong document. */
    await render();
    return null;
  }catch(e){
    const why = "Adena: "+(e.message||e);
    const hint = document.getElementById("wallethint");
    if(hint){ hint.hidden=false; hint.textContent = why; }
    return why;
  }
}
function adenaDisconnect(){ delete CFG.addr; saveCfg(); reflectWallet(); render(); }
/* THE CONFIRMATION FOR AUTHORED TEXT — a native <dialog>, because prompt()
   cannot hold what this is confirming, and the point of confirming is that a
   person sees it.

   It shows every argument as it will be signed, the body in full, and its size
   in BYTES against the realm's cap — bytes because maxBoardTextLen is bytes and
   one emoji is four of them. A counter that measured characters would let
   somebody write 2000 of them and have the chain refuse the transaction for a
   reason the page never showed.

   Escape and the backdrop both fire `close`, and both mean no. */
/* ONE DIALOG FOR EVERY SIGNATURE, replacing a loop of window.prompt().

   THE INVARIANT IS UNCHANGED: no argument is signed without being shown. A few
   buttons carry placeholder text — a claim title, a court name — that must never
   go to the chain as-is, and that is why arguments are confirmed at all.

   WHAT WAS WRONG WAS THE INSTRUMENT. It asked one native prompt PER ARGUMENT, so
   voting popped three of them — "VoteDispute — courtSlug:", "— claimID:",
   "— choice:" — asking a reader to retype values the page had just derived
   itself. Escape on any one aborted the whole signature, and Chrome suppresses
   repeated prompt() calls outright: once suppressed it returns null with nothing
   drawn, which arrived as "Cancelled — nothing was signed" for a cancellation
   nobody made. A modal <dialog> cannot be suppressed and shows everything at
   once, which is also the only way to see the arguments as a SET.

   bodyKey is the composer's exception, unchanged: a 2000-character comment is
   shown whole and read-only, because it was authored rather than prefilled, and
   it is passed through UNTRIMMED — signing something other than what was
   displayed is the failure this path exists to prevent.

   send is Buy's: a spend folded in here rather than left as one last prompt
   after the dialog closed.

   Resolves null on cancel, or {vals, send}. */
function confirmArgs(func, args, bodyKey, sendPre){
  return new Promise(resolve => {
    const keys = Object.keys(args || {});
    const dlg = document.createElement("dialog");
    dlg.className = "helper";
    const rows = keys.map(k => {
      const v = String(args[k]);
      if(k === bodyKey){
        const n = commentChars(v);
        return `<h4>${esc(k)}</h4><pre class="cliblock mono">${esc(v)}</pre>`
          + `<p class="small" style="color:${n > MAX_COMMENT_CHARS ? "var(--contra)" : "var(--muted)"}">`
          + `${fmtN(n)} of ${fmtN(MAX_COMMENT_CHARS)} characters`
          + (n > MAX_COMMENT_CHARS ? " — the chain will refuse this." : "") + `</p>`;
      }
      return `<p class="small argrow"><b>${esc(k)}</b><br>`
        + `<input class="argin mono" data-k="${esc(k)}" value="${esc(v)}" spellcheck="false"></p>`;
    }).join("");
    const sendRow = sendPre==null ? "" :
      `<h4>GNOT to spend</h4>
       <p class="small argrow"><input class="sendin mono" value="${esc(String(sendPre))}" spellcheck="false"> ugnot</p>
       <p class="small" style="color:var(--contra)">This is burned. Treat it as spent.</p>`;
    dlg.innerHTML = `<div class="hd"><h3>Sign ${esc(func)}</h3>
        <button type="button" class="pill void" data-cancel>close</button></div>
      <div class="bd">${rows}${sendRow}
        <p class="small muted">This is what will be signed.${bodyKey? " A comment cannot be edited or deleted afterwards — you may withdraw it from the list, but it is never deleted." : ""}</p>
        <p class="small muted err" data-err hidden></p>
        <div class="actions"><button type="button" class="btn" data-go>Sign it</button>
          <button type="button" class="copybtn" data-cancel>Cancel</button></div></div>`;
    document.body.appendChild(dlg);
    let settled = false;
    const done = v => {
      if(settled) return;            // data-go closes the dialog, which fires
      settled = true;                // `close`, which would resolve null after
      try{ dlg.close(); }catch(_){}  // it had already resolved a value.
      dlg.remove(); resolve(v);
    };
    dlg.addEventListener("click", ev => {
      if(ev.target.closest("[data-cancel]")) return done(null);
      if(!ev.target.closest("[data-go]")) return;
      const vals = keys.map(k => {
        if(k === bodyKey) return String(args[k]);          // untrimmed, deliberately
        const inp = dlg.querySelector(`.argin[data-k="${CSS.escape(k)}"]`);
        return inp ? inp.value.trim() : String(args[k]);
      });
      let send = "";
      if(sendPre != null){
        const amt = (dlg.querySelector(".sendin").value || "").trim();
        // REFUSED IN PLACE, not by closing. A rejected amount used to end the
        // whole signature and make the reader start again from the button.
        if(!/^[1-9][0-9]*$/.test(amt)){
          const e = dlg.querySelector("[data-err]");
          e.hidden = false; e.textContent = "A whole, non-zero ugnot amount.";
          return;
        }
        send = amt + "ugnot";
      }
      done({vals, send});
    });
    dlg.addEventListener("close", () => done(null));
    dlg.showModal();
  });
}

async function adenaSign(func, args, el){
  const a = window.adena;
  if(!a){ adenaAbsent(); return; }
  // BEFORE THE FIRST AWAIT, because the whole delay is on the other side of it:
  // GetNetwork has to wake Adena's service worker. Setting this after the await
  // would light the spinner exactly when it was no longer needed.
  const busy = on => { el.classList.toggle("busy", on); el.setAttribute("aria-busy", on? "true":"false"); };
  const note = (m, ok, title) => {
    let n = el.parentElement.querySelector(".txnote");
    if(!n){ n = document.createElement("div"); n.className = "txnote"; n.setAttribute("role","status"); el.parentElement.appendChild(n); }
    n.textContent = m; n.classList.toggle("ok", !!ok);
    /* THE HASH LIVES IN THE TITLE. Twelve characters of it in the sentence could
       not be looked up and answered a question nobody asked; the whole of it, on
       hover, is there for the one reader who wants to check the chain. */
    if(title) n.title = title; else n.removeAttribute("title");
  };
  if(el.disabled) return;
  el.disabled = true;
  busy(true);
  /* LANDED IS NOT FINISHED. On success the page waits 7s for the chain to
     include the transaction and then repaints — and the button used to go idle
     the instant DoContract returned, so those 7 seconds looked like nothing
     happening at all, right after the one action a reader most wants confirmed.
     The spinner stays on until the repaint takes the button with it. */
  let landed = false;
  try{
    const want = CFG.chainid || "dev";
    /* A REFUSED GetNetwork IS NOT PROOF OF A LOCKED WALLET, and this used to say
       it was: "unlock the wallet and retry" named one cause out of several and
       sent anybody with a different one down a dead end.

       The likeliest cause is the one this file already warns about two screens
       up — CFG.addr is remembered in localStorage and outlives the connection
       that produced it. A wallet reinstalled, a permission revoked, or simply a
       different browser profile leaves a remembered address, a present
       window.adena, and an origin Adena will not answer for. Neither of the two
       conditions the click handler checks can tell that apart, because both are
       still true.

       So: try to establish once, which is the fix when that is the cause and a
       no-op when it is not, and then say what Adena SAID rather than what we
       guessed it meant. Its own code and message are the only evidence here. */
    let net = await a.GetNetwork();
    if(net.code!==0){
      const est = await a.AddEstablish("Kourt").catch(()=>null);
      net = est && (est.code===0 || est.code===4001) ? await a.GetNetwork() : net;
    }
    if(net.code!==0){
      note("Adena would not answer: " + (net.message || ("code " + net.code))
         + ". If it is locked, unlock it; otherwise reconnect with the wallet button in the left rail.");
      return;
    }
    if(net.data && net.data.chainId && net.data.chainId!==want){
      const sw = await a.SwitchNetwork(want);
      if(sw.code!==0){ note("Adena is on "+net.data.chainId+"; switch it to "+want+" and try again."); return; }
    }
    /* A MATCHING CHAIN ID IS NOT A MATCHING CHAIN. Two nodes can both call
       themselves "dev" — a local gnodev and whatever Adena has saved under that
       name — and the switch above is satisfied by the NAME. Then every read on
       this page comes from CFG.rpc and the signature lands on the wallet's node,
       and the realm answers about state the reader has never seen: "no such
       claim" for a claim plainly on screen, because it exists here and not
       there. Compared host-to-host, since a trailing slash or 127.0.0.1 against
       localhost is the same node and should not be an alarm. */
    const wrpc = net.data && (net.data.rpcUrl || net.data.rpc);
    if(wrpc && CFG.rpc){
      const host = u => { try{ const x=new URL(u); return (x.hostname==="localhost"?"127.0.0.1":x.hostname)+":"+(x.port||""); }catch(_){ return null; } };
      const hw = host(wrpc), hp = host(CFG.rpc);
      if(hw && hp && hw!==hp){
        /* WHAT TO DO, NOT WHAT IS WRONG. The first version explained chain
           identity — that two nodes can share a name, that reads and writes
           were going to different places — which is the diagnosis, not the fix,
           and a reader staring at a wallet prompt cannot act on it. Where it is
           pointed, where it should point, which screen changes it. */
        const short = u => { try{ const x=new URL(u); return x.host; }catch(_){ return u; } };
        note(`Adena is pointed at ${short(wrpc)} — this chain is ${short(CFG.rpc)}. `
           + `Change the RPC in Adena's network settings, then try again.`);
        return;
      }
    }
    // Every argument is confirmed before signing: several buttons carry
    // placeholder text (a claim title, a court name) that must never be
    // signed as-is.
    //
    // ONE EXCEPTION, ONE BUTTON WIDE. The invariant above defends against
    // PLACEHOLDER text — prefilled values a human has to actually look at. A
    // composer textarea has none: its contents are authored by construction, and
    // a 2000-byte multi-line comment cannot be typed into a single-line prompt at
    // all. So a control marked data-authored is confirmed as a whole, in a dialog
    // that can hold what it is confirming. Every other button keeps its prompt.
    /* CONFIRM WHAT NEEDS EDITING, AND NOTHING ELSE.

       Every button used to stop and ask, first as one native prompt per
       argument and then as a dialog listing them all. Neither was earning its
       place: pressing "Vote to overturn" on a claim page passes a slug, an id
       and a side that the page derived — there is nothing for a reader to check
       that clicking the button did not already say. And ADENA CONFIRMS ANYWAY.
       Its approval popup shows the call and the amount before anything is
       signed, so our dialog was a second confirmation of the same bytes.

       It survives for the case it was actually built for: an argument the
       reader must REPLACE before it means anything.

         data-edit    StartCourt / StartCourtP, which ship slug:"my-court",
                      name:"My Court" — sign those through and you have created
                      a court called My Court.
         data-authored  the composer, whose body is shown whole against the
                      chain's character cap and whose warning is about
                      permanence, not about content.
         Buy with no concrete amount  the no-quote fallback carries the literal
                      "AMOUNTugnot", which is a placeholder like any other. A
                      real amount comes from the receipt input, where the reader
                      typed it. */
    const sendRaw = el.dataset.send || "";
    const sendOk = /^[1-9][0-9]*ugnot$/.test(sendRaw);
    const needsSend = func === "Buy" && !sendOk;
    let vals, send = func === "Buy" && sendOk ? sendRaw : "";
    if(el.dataset.edit || el.dataset.authored || needsSend){
      const ok = await confirmArgs(func, args||{},
        el.dataset.authored ? (el.dataset.bodykey || "text") : null,
        needsSend ? "1000000" : null);
      if(!ok){ note("Cancelled — nothing was signed."); return; }
      vals = ok.vals;
      if(needsSend) send = ok.send;
    } else {
      vals = Object.keys(args||{}).map(k => String(args[k]));
    }
    /* THE AMOUNT COMES FROM THE FIELD, in coin, converted here. The realm counts
       in millionths and a reader should not have to: they type 1.222 and this
       sends 1222000. Read at CLICK time rather than at render, because the field
       is edited after the button was drawn — the same reason the wallet check
       above is not decided at render either.
       Refused rather than rounded when it is not a number or not positive: a
       silent fallback to 1 would sign an amount nobody asked for. */
    if(el.dataset.amt){
      const f = document.getElementById("stakeamt");
      const raw = f? String(f.value||"").trim() : "";
      const coins = Number(raw);
      /* THE FIELD SAYS IT, NOT A SENTENCE UNDER THE BUTTON. A note explaining
         that an amount must be a number above zero is a paragraph about the
         control the reader is already looking at; marking the control and
         putting the cursor in it says the same thing in the place they have to
         go anyway. aria-invalid as well as the colour, because a red border is
         nothing to a screen reader. Cleared on the next keystroke — see the
         input listener below. */
      const bad = () => {
        if(!f) return;
        f.setAttribute("aria-invalid","true");
        f.focus(); f.select();
        const n = el.parentElement && el.parentElement.querySelector(".txnote");
        if(n) n.remove();
        /* THE WORDS GO IN THE BOX, right-aligned behind the value. A note under
           the button is a sentence to read before you can act; this is in the
           one place the reader is already looking, and it leaves on its own so
           it never becomes furniture. aria-hidden: aria-invalid above already
           tells a screen reader, and a flash it cannot see the end of is worse
           than nothing. */
        const w = document.getElementById("stakeamtwrap");
        if(!w) return;
        /* WHAT IT SAYS DEPENDS ON WHY. "ya got none!" was printed for every
           refusal, including a reader holding two hundred coins who had simply
           not typed a number yet — and for the one it was true of, it named the
           problem and not the way out. Holding none is a different situation
           from having typed nothing, and only one of them has somewhere to go. */
        const fl = w.querySelector(".amtflash");
        const held = +(w.dataset.held || "-1");
        /* THE FLASH NAMES THE PROBLEM; THE LINK BESIDE THE FIELD IS THE WAY OUT,
           and it is already on screen before this click — so this no longer has to
           build one, and the flash goes back to being purely a warning. */
        if(fl) fl.textContent = held === 0? "you hold none" : "how much?";
        w.classList.add("flash");
        clearTimeout(w._flash);
        w._flash = setTimeout(()=>w.classList.remove("flash"), 1800);
      };
      if(!raw || !isFinite(coins) || coins<=0){ bad(); return; }
      const micro = Math.round(coins*1e6);
      if(micro<=0){ bad(); return; }   // under the smallest unit the court counts
      const keys = Object.keys(args||{});
      vals = keys.map(k => k==="amount"? String(micro) : String(args[k]));
    }
    note("Waiting for Adena…");
    const res = await a.DoContract({messages:[{type:"/vm.m_call", value:{
      caller: CFG.addr, send, pkg_path: PKG, func, args: vals
    }}], gasFee: GAS_FEE_UGNOT, gasWanted: GAS_WANTED});
    if(res.code===0){
      /* WHAT CHANGED, NOT WHAT IT WAS CALLED. This said "Sent. tx kI749HHATQkl…"
         — a hash truncated to twelve characters, which cannot be looked up, is
         not a link, and answers a question nobody had. What a reader wants after
         pressing Buy is whether they got the coin, and the panel answers that on
         the refresh below.
         NOT "Bought 447.2 KOURT:META" either, tempting as it is: the quote is a
         quote. buyRowsHtml says so directly — "if someone buys first you'll
         receive fewer units than shown, never more" — so naming the figure here
         would promise something the chain has not agreed to yet. It says the
         thing that IS certain, and points at where the truth will appear. */
      const hash = String(res.data && res.data.hash || "");
      const base = func === "Buy"
        ? "Sent. The coin is on its way — this panel will show what you hold."
        : "Sent. " + func + " is on its way.";
      note(base + " Updating in 7s…", true, hash? "tx "+hash : "");
      /* THE DRAFT CLEARS ONLY HERE. A rejected signature, a wallet on the wrong
         chain, a closed prompt — every one of those must leave the work exactly
         where it was, because the alternative is somebody losing what they had
         written to a mis-click. */
      if(func==="OpenClaimPM" && COMPOSE_DRAFT_COURT && typeof mediaClearDraft==="function"){
        mediaClearDraft(window.localStorage, COMPOSE_DRAFT_COURT);
        /* AND TELL THE ARCHIVE, which nothing did.
           mediaClaimed has existed since the archive was built and was never
           called from anywhere: the composer uploaded bytes and then let them
           sit. backfill.go opens by saying "the client cannot be the only
           witness", which reads as though there WAS a client witness; there was
           not, and every uploaded exhibit waited on a backfill pass instead.
           That is up to ten minutes during which the archive — which now serves
           claimed bytes only — answers 404 for a claim somebody has just filed.
           The claim id is the thing that made this awkward: DoContract returns a
           tx hash, not an id, and the id does not exist until the chain includes
           the transaction. So it is read afterwards, on the same seven-second
           beat this handler already waits for a render, and the NEWEST claim in
           that court is the one just filed.
           Being wrong about that is harmless by construction: /m/claimed asks the
           chain which hashes the claim references and promotes only those, so a
           guess that lands on somebody else's claim promotes nothing, and
           backfill still covers this the way it always did. */
        const court = COMPOSE_DRAFT_COURT;
        if(args && args.media && typeof mediaClaimed==="function" && siteHost()){
          setTimeout(async ()=>{
            try{
              const n = await one(`ClaimCount(${gstr(court)})`);
              if(n > 0) await mediaClaimed(court, Number(n), {base: location.origin});
            }catch(_){}
          }, 7000);
        }
      }
      landed = true;
      /* A COUNTDOWN, NOT A BARE SPINNER. Seven seconds of a spinning button says
         "working"; it does not say for how long, and an unbounded spinner is what
         a stalled page looks like. Counting down says the wait is expected and
         finite, which is the difference between waiting and wondering. */
      let left = 7;
      const tick = setInterval(()=>{
        left--;
        if(left > 0) note(base + " Updating in " + left + "s…", true, hash? "tx "+hash : "");
      }, 1000);
      /* EVERY CACHED ANSWER IS FROM BEFORE THIS TRANSACTION, and the re-render
         below is the reader watching for their own action to land — which is
         exactly the moment a five-second-old answer is a lie. Cleared now AND
         at the re-render: now, because fills already in flight would otherwise
         seed the cache from the old state; then, because the seven seconds are
         longer than the cache holds anything anyway and the cost of being sure
         is one Map.clear(). */
      chainCacheClear();
      setTimeout(()=>{ clearInterval(tick); chainCacheClear(); render(); }, 7000);
    }
    else if(res.code===4000){ note("Rejected in the wallet."); }
    else if(res.code===3001){ note("Adena's active account is not "+shortAddr(CFG.addr)+" — switch accounts in Adena or reconnect."); }
    else note("Adena: "+(res.message||("code "+res.code)));
  }catch(e){ note("Adena: "+(e.message||e)); }
  // Cleared in finally, so a thrown wallet error leaves a button that can be
  // pressed again rather than one that spins for ever.
  // Cleared unless the transaction LANDED: a thrown wallet error must leave a
  // button that can be pressed again, while a successful one must not invite a
  // second press of something already on its way.
  finally{ if(!landed){ el.disabled = false; busy(false); } }
}
document.addEventListener("click",(ev)=>{
  const d = ev.target.closest("[data-inert]");
  if(d){ let n=d.parentElement.querySelector(".txnote");
    if(!n){ n=document.createElement("div"); n.className="txnote"; n.setAttribute("role","status"); d.parentElement.appendChild(n); }
    n.textContent="Demo data — actions work on a live node. Switch Source in the left rail."; return; }
  const nc = ev.target.closest("[data-nocoin]");
  if(nc){ ev.preventDefault(); noCoinHelp(nc.getAttribute("data-nocoin"), nc); return; }
  const bl = ev.target.closest("[data-blocked]");
  if(bl){ ev.preventDefault();
    const box = bl.closest(".actions") || bl.parentElement;
    let n=box.querySelector(".txnote");
    if(!n){ n=document.createElement("div"); n.className="txnote"; n.setAttribute("role","status"); box.appendChild(n); }
    n.textContent=bl.getAttribute("data-blocked"); return; }
  const vb = ev.target.closest("[data-voteblocked]");
  if(vb){ ev.preventDefault(); let n=vb.closest(".actions").querySelector(".txnote");
    if(!n){ n=document.createElement("div"); n.className="txnote"; n.setAttribute("role","status"); vb.closest(".actions").appendChild(n); }
    n.textContent=vb.getAttribute("data-voteblocked"); return; }
  const na = ev.target.closest("[data-needack]");
  if(na){ ev.preventDefault(); let n=na.parentElement.querySelector(".txnote");
    if(!n){ n=document.createElement("div"); n.className="txnote"; n.setAttribute("role","status"); na.parentElement.appendChild(n); }
    n.textContent="Tick the acknowledgement first — buying is permanent."; return; }
  /* AN EXHIBIT OPENS FULL SIZE, and full size is the only place the overlay can
     say whether the bytes are the ones that were filed — gnoweb's CSP forbids
     the fetch, so it renders and stays silent. Delegated because the card is
     rebuilt on every selection. */
  const ex = ev.target.closest("[data-ex]");
  if(ex && typeof mediaLightbox === "function" && LAST_EXHIBITS.length){
    ev.preventDefault();
    openExhibit(parseInt(ex.dataset.ex, 10) || 0, ex);
    return;
  }
  /* THE ACTION. Ordered after the three refusals above, because each of them is
     a reason this click must not become a transaction — demo data, an unticked
     acknowledgement, an address the court will not accept a vote from. */
  const act = ev.target.closest("[data-act]"); if(!act) return;
  let args = {}; try{ args = JSON.parse(act.dataset.args||"{}"); }catch(_){}
  // BOTH conditions, not either. CFG.addr is remembered in storage and outlives
  // the extension that produced it, so an address alone does not mean a wallet
  // is there to sign with — and window.adena alone does not mean this page has
  // been granted an account.
  if(CFG.addr && window.adena) adenaSign(act.dataset.func, args, act);
  else signHelp(act);
});

/* The composer's two handlers. The counter is in BYTES so it agrees with the cap
   the chain enforces, and the button is disabled on exactly the two conditions
   the realm refuses on: nothing written, or more than maxBoardTextLen. */

  const ta = ev.target.closest(".composer-text"); if(!ta) return;
  const n = commentChars(ta.value.trim());
  const box = ta.closest(".composer");
  const lab = box && box.querySelector(".composer-count");
  const btn = box && box.querySelector(".composer-post");
  if(lab){

    lab.style.color = n > MAX_COMMENT_CHARS ? "var(--contra)" : "";
  }
  if(btn) btn.disabled = !(n > 0 && n <= MAX_COMMENT_CHARS);
